# Каталог акций. Правится без программиста: после сохранения отправь боту /reload.
# payout — сколько ты платишь человеку после того, как банк подтвердит его оформление (бонус «Приведи друга» пришёл тебе).
# link — твоя ссылка из программы банка «Приведи друга». Перед запуском проверь правила программы: можно ли её публиковать.
# Суммы и условия банков ниже — ПРИМЕРЫ, замени на актуальные из условий твоей ссылки.
offers:
  - id: alfa_credit
    bank: Альфа-Банк
    bank_key: alfa
    title: Кредитная карта
    payout: 500
    link: https://example.com/alfa-ref
    bank_bonus: бонус новичку от банка — по условиям акции
    condition: 5 покупок картой в день получения
    steps:
      - Оформи карту по ссылке — заявка онлайн за пару минут
      - Получи карту у курьера
      - В тот же день сделай 5 покупок картой на любую сумму
      - Нажми «Я оформил» и пришли скриншот карты из приложения
    deadline_days: 7

  - id: tbank_debit
    bank: Т-Банк
    bank_key: tbank
    title: Дебетовая карта
    payout: 300
    link: https://example.com/tbank-ref
    bank_bonus: бонус новичку от банка — по условиям акции
    condition: покупка от суммы, указанной в условиях
    steps:
      - Оформи карту по ссылке
      - Получи карту и активируй в приложении
      - Сделай покупку по условиям акции
      - Нажми «Я оформил» и пришли скриншот
    deadline_days: 30
