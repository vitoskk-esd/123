<div id="bg"></div><div id="root"></div>
<script>
const v = +(new URLSearchParams(location.search).get("v") || 1);
const nfc = `<svg style="position:absolute;left:106px;top:110px" width="34" height="34" viewBox="0 0 34 34">${[8, 14, 20].map(r => `<path d="M${6 + r * .35} ${17 - r * .55} A ${r} ${r} 0 0 1 ${6 + r * .35} ${17 + r * .55}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="3" stroke-linecap="round"/>`).join("")}</svg>`;
// упрощённые знаки банков (не копии логотипов), фирменные цвета
const C = {
  ya: { bg: "linear-gradient(135deg,#1c1c20,#0a0a0c 60%,#2a1010)", mark: `<svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="#fc3f1d"/><text x="22" y="31" text-anchor="middle" font-family="I" font-weight="700" font-size="26" fill="#fff">Я</text></svg>`, name: "Яндекс Банк", d: 180 },
  psb: { bg: "linear-gradient(135deg,#f26c1b,#e2541a 45%,#26357e)", mark: `<svg width="44" height="44" viewBox="0 0 44 44"><rect x="2" y="2" width="40" height="40" rx="10" fill="#fff"/><text x="22" y="30" text-anchor="middle" font-family="I" font-weight="700" font-size="17" fill="#26357e">ПСБ</text></svg>`, name: "ПСБ", d: 180 },
  sber: { bg: "linear-gradient(135deg,#2cc24c,#13a538 50%,#0b7a2a)", mark: `<svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#fff" stroke-width="4"/><path d="M13 22 L20 29 L33 15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`, name: "Сбер", d: 120 },
  ural: { bg: "linear-gradient(118deg,#f1ecff 0%,#d9cfff 18%,#c58df0 34%,#e2559e 50%,#7b3fd6 68%,#3a23a8 84%,#24187a 100%)", mark: `<svg width="36" height="36" viewBox="0 0 34 34"><path d="M17 4 C 11 10, 11 22, 17 30 M17 4 C 23 10, 23 22, 17 30 M9 9 C 5 15, 6 24, 11 29 M25 9 C 29 15, 28 24, 23 29" fill="none" stroke="#1d1a4a" stroke-width="2.6" stroke-linecap="round"/></svg>`, name: "Уралсиб", ink: "#1d1a4a", d: 120 },
  alfa: { bg: "linear-gradient(135deg,#ff3b30,#ef3124 50%,#c41d14)", mark: `<div style="position:relative;width:40px;height:50px"><div style="font:700 50px/1 I;color:#fff;position:absolute;left:3px;top:-4px">А</div><div style="position:absolute;left:4px;bottom:0;width:32px;height:6px;background:#fff"></div></div>`, name: "Альфа-Банк", d: 60 },
  t: { bg: "linear-gradient(135deg,#2b2c30,#141518 55%,#050506)", mark: `<svg width="44" height="50" viewBox="0 0 44 50"><path d="M2 2 H42 V26 C42 38 32 46 22 48 C12 46 2 38 2 26 Z" fill="#ffdd2d"/><path d="M12 12 H32 V18 H25 V36 H19 V18 H12 Z" fill="#111"/></svg>`, name: "Т-Банк", d: 55 },
};
const card = (k, x, y, r = 0, s = 1, days = true) => { const c = C[k];
  return `<div class="card" style="left:${x}px;top:${y}px;transform:rotate(${r}deg) scale(${s});background:${c.bg}">
    <div style="position:absolute;left:30px;top:22px;display:flex;align-items:center;gap:12px">${c.mark}<div style="font:700 26px I;color:${c.ink || "#fff"}">${c.name}</div></div>
    ${days ? `<div class="days" style="top:auto;bottom:62px;color:${c.ink && false ? c.ink : "#fff"}">${c.d}<small>ДНЕЙ БЕЗ %</small></div>` : ""}
    <div class="chip"></div>${nfc}<div class="n4">•••• 2026</div><div class="ps">МИР</div></div>`; };
const rows = (items, note, col = "rgba(0,0,0,.55)") => items.map(([ic, a, b, bc]) => `<div class="row"><i style="background:${ic}">${""}</i><span>${a}</span><b style="${bc ? "color:" + bc : ""}">${b}</b></div>`).join("") + (note ? `<div class="note" style="color:${col}">${note}</div>` : "");
const bg = document.getElementById("bg"), R = document.getElementById("root");
const shadow = (c) => `text-shadow: 0 4px 0 ${c}, 0 8px 0 ${c}, 0 12px 0 ${c}, 0 16px 0 ${c}, 0 30px 50px rgba(0,0,0,.35)`;
const G = "font-family:GM";
const P = (s) => R.insertAdjacentHTML("beforeend", s);
const mag = (c = "#666", s = 34) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="${c}" stroke-width="2.6"/><path d="M15 15 L21 21" stroke="${c}" stroke-width="2.8" stroke-linecap="round"/></svg>`;
const pill = (k) => `<div class="bp"><i style="background:${{ ya: "#fc3f1d", psb: "#f26c1b", sber: "#13a538", ural: "#7b3fd6", alfa: "#ef3124", t: "#ffdd2d" }[k]}"></i>${C[k].name}</div>`;

if (v === 1) {   // ИГРА «VS»: ПСБ против Яндекса, полоски здоровья, таймер 180
  bg.style.background = "#111";
  P(`<div style="position:absolute;inset:0;background:linear-gradient(135deg,#ff7a1a,#e2541a 40%,#26357e);clip-path:polygon(0 0,58% 0,42% 100%,0 100%)"></div>
     <div style="position:absolute;inset:0;background:linear-gradient(135deg,#2a0d0d,#140808 40%,#fc3f1d);clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%)"></div>
     <div style="position:absolute;inset:-200px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.09) 0 2deg,transparent 2deg 9deg)"></div>
     <div style="position:absolute;left:0;right:0;top:0;height:130px;background:linear-gradient(#000c,#0000)"></div>`);
  const bar = (x, flip, name) => `<div style="position:absolute;left:${x}px;top:28px;width:470px">
      <div style="height:40px;border:4px solid #fff;border-radius:6px;background:#300;transform:skewX(${flip ? 18 : -18}deg);overflow:hidden">
        <div style="height:100%;width:100%;background:linear-gradient(#ffe95c,#ffb800 60%,#e08600)"></div></div>
      <div style="margin-top:8px;font:700 34px/1 O;color:#fff;text-transform:uppercase;letter-spacing:.04em;text-align:${flip ? "right" : "left"};text-shadow:0 3px 0 #000">${name}</div></div>`;
  P(bar(40, false, "ПСБ") + bar(770, true, "Яндекс Банк") +
    `<div style="position:absolute;left:560px;top:16px;width:160px;height:96px;border-radius:14px;background:#111;border:4px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center">
       <div style="font:900 48px/1 Unb;color:#ffe95c;letter-spacing:-.04em">180</div><div style="font:700 15px I;color:#fff;letter-spacing:.08em;margin-top:4px">ДНЕЙ БЕЗ %</div></div>`);
  P(card("psb", 20, 210, -10, .98, false) + card("ya", 830, 210, 10, .98, false));
  P(`<div style="position:absolute;left:0;right:0;top:190px;text-align:center;font:900 300px/1 Unb;letter-spacing:-.06em;font-style:italic;color:#ffe95c;transform:skewX(-10deg);
       -webkit-text-stroke:10px #111;paint-order:stroke fill;text-shadow:0 14px 0 #111,0 0 80px rgba(255,200,0,.6)">VS</div>
     <div class="pl" style="left:50%;top:560px;transform:translateX(-50%);font-size:76px;background:#fff;color:#111">кто заберёт №1?</div>`);
}

if (v === 2) {   // ЭКРАН БЛОКИРОВКИ: «ДЕНЬ 121» + пуши от банка
  bg.style.background = "radial-gradient(700px 520px at 18% 80%, #ff3b4f 0%, transparent 70%), radial-gradient(800px 600px at 85% 10%, #5b2cff 0%, transparent 65%), radial-gradient(600px 500px at 60% 110%, #ff8a00 0%, transparent 70%), #0b0b1a";
  P(`<div style="position:absolute;left:60px;top:70px;font:600 40px/1 I;color:#fff9;letter-spacing:.02em">понедельник, 08:00</div>
     <div style="position:absolute;left:46px;top:120px;font:900 120px/1 Unb;color:#fff;letter-spacing:-.05em">ДЕНЬ</div>
     <div style="position:absolute;left:36px;top:230px;font:900 330px/1 Unb;color:#fff;letter-spacing:-.07em;text-shadow:0 0 60px rgba(255,80,100,.55)">121</div>
     <div style="position:absolute;left:60px;top:600px;font:600 22px I;color:#fff9">пример · после конца льготного периода</div>`);
  const n = (y, ago, title, body, big, col) => `<div style="position:absolute;left:690px;top:${y}px;width:560px;padding:20px 24px;border-radius:30px;background:rgba(255,255,255,.80);box-shadow:0 18px 40px rgba(0,0,0,.35);backdrop-filter:blur(10px)">
      <div style="display:flex;align-items:center;gap:12px;font:600 21px I;color:#555"><div style="width:40px;height:40px;border-radius:10px;background:#e5383b;color:#fff;display:flex;align-items:center;justify-content:center;font:900 24px Unb">₽</div>БАНК<span style="margin-left:auto">${ago}</span></div>
      <div style="font:700 30px/1.15 I;color:#111;margin-top:12px">${title}</div>
      <div style="font:600 25px/1.2 I;color:#333;margin-top:6px">${body}${big ? ` <b style="font:900 34px Unb;color:${col};letter-spacing:-.03em;white-space:nowrap">${big}</b>` : ""}</div></div>`;
  P(n(40, "сейчас", "Льготный период закончился", "Долг: 40 000 ₽") + n(250, "сейчас", "Начислены проценты", "", "−2 000 ₽", "#e5383b") + n(440, "1 мин", "Минимальный платёж внесён", "Но проценты всё равно идут", "", ""));
}

if (v === 3) {   // ПОИСК С ПОДСКАЗКАМИ: «кредитка без процентов…» → «где подвох»
  bg.style.background = "radial-gradient(900px 600px at 50% 0%, #ffffff, #eef1f6 70%, #dfe5ee)";
  P(card("ya", 860, 470, -8, .9, true) + card("psb", 1020, 400, 6, .8, true));
  P(`<div style="position:absolute;left:50px;top:44px;width:1180px;height:130px;border-radius:65px;background:#fff;box-shadow:0 20px 50px rgba(30,50,90,.22),0 0 0 3px #d7dce6;display:flex;align-items:center;padding:0 40px;gap:26px">
       ${mag("#7a8394", 56)}<div style="font:700 64px/1 I;color:#111;letter-spacing:-.02em;white-space:nowrap">кредитка без процентов</div><div style="width:6px;height:78px;background:#1a73e8;margin-left:-14px"></div></div>
     <div style="position:absolute;left:50px;top:192px;width:760px;border-radius:30px;background:#fff;box-shadow:0 20px 50px rgba(30,50,90,.2);padding:16px 0">
       ${[["где подвох", 1], ["с 18 лет", 0], ["какую выбрать", 0], ["это развод?", 0]].map(([s, h]) => `<div style="display:flex;align-items:center;gap:22px;padding:14px 36px;${h ? "background:#fff4a8" : ""}">${mag("#9aa2b1", 34)}<span style="font:600 40px/1 I;color:#555;white-space:nowrap">кредитка… <b style="font:700 46px I;color:#111">${s}</b></span></div>`).join("")}</div>
     <svg style="position:absolute;left:300px;top:196px" width="430" height="110" viewBox="0 0 430 110"><path d="M20 60 C 30 10, 380 0, 410 40 C 430 80, 200 110, 60 98 C 10 92, 5 70, 40 50" fill="none" stroke="#e5383b" stroke-width="8" stroke-linecap="round"/></svg>
     <div class="pl" style="left:50px;top:590px;font-size:64px;background:#e5383b">проверил 7 карт</div>`);
}

if (v === 4) {   // ПРОГРЕСС-БАР: «119 / 120», «ОСТАЛСЯ 1 ДЕНЬ»
  bg.style.background = "radial-gradient(900px 500px at 85% 40%, rgba(229,56,59,.55), transparent 70%), radial-gradient(700px 500px at 0% 100%, rgba(255,184,0,.25), transparent 70%), #0d0d10";
  P(`<div style="position:absolute;left:60px;top:46px;font:700 46px/1 O;color:#fffb;text-transform:uppercase;letter-spacing:.08em">Льготный период кредитки</div>
     <div style="position:absolute;left:60px;top:120px;width:1160px;height:150px;border-radius:75px;background:#222;box-shadow:inset 0 0 0 5px #fff3,0 20px 50px #0008;overflow:hidden">
       <div style="position:absolute;left:0;top:0;bottom:0;width:99%;border-radius:75px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.14) 0 26px,transparent 26px 52px),linear-gradient(90deg,#16c060,#ffd000 60%,#ff7a00 82%,#e5383b)"></div>
       <div style="position:absolute;left:56px;top:0;bottom:0;display:flex;align-items:center;font:900 76px/1 Unb;color:#fff;letter-spacing:-.04em;text-shadow:0 4px 0 #0005">119 / 120</div></div>
     <div style="position:absolute;left:52px;top:310px;font:900 150px/1 Unb;color:#fff;letter-spacing:-.06em;white-space:nowrap">ОСТАЛСЯ</div>
     <div style="position:absolute;left:52px;top:470px;font:900 150px/1 Unb;color:#fff;letter-spacing:-.06em;white-space:nowrap"><span style="color:#ff4747;text-shadow:0 0 50px #ff2a2a">1</span> ДЕНЬ</div>
     <div style="position:absolute;left:60px;top:650px;font:700 28px I;color:#fffa">а дальше — ≈ 60 % годовых</div>`);
  P(card("ya", 880, 430, -10, .8, false));
}

if (v === 5) {   // КОЛЛАЖ: буквы из бумаги «ТОП-7», вырезанные карты на скотче, маркер
  bg.style.background = "#efe6d6";
  const tile = (ch, x, y, r, b, c, f) => `<div style="position:absolute;left:${x}px;top:${y}px;transform:rotate(${r}deg);background:${b};color:${c};font:${f};padding:6px 22px 14px;box-shadow:4px 8px 0 rgba(0,0,0,.18)">${ch}</div>`;
  P(`<div style="position:absolute;left:-40px;top:430px;width:760px;height:340px;background:#ffd23f;transform:rotate(-4deg);clip-path:polygon(0 8%,12% 0,30% 6%,52% 1%,70% 7%,88% 0,100% 6%,100% 100%,0 100%)"></div>
     <div style="position:absolute;left:760px;top:-60px;width:600px;height:360px;background:#3a7bff;transform:rotate(7deg);clip-path:polygon(0 0,100% 0,100% 100%,84% 94%,66% 100%,44% 93%,22% 100%,0 92%)"></div>`);
  P(tile("Т", 40, 40, -6, "#111", "#fff", "900 190px/1 Unb") + tile("О", 210, 60, 5, "#e5383b", "#fff", "700 200px/1 O") + tile("П", 340, 30, -3, "#fff", "#111", "900 190px/1 Unb")
    + tile("-", 520, 70, 4, "#ffd23f", "#111", "700 180px/1 O") + tile("7", 600, 26, -8, "#13b85a", "#fff", "900 210px/1 Unb"));
  P(`<div style="position:absolute;left:60px;top:300px;font:600 italic 110px/1 PF;color:#111;transform:rotate(-3deg)">кредиток</div>
     <div style="position:absolute;left:66px;top:470px;font:700 64px/1.05 O;color:#111;text-transform:uppercase;transform:rotate(-4deg)">где дольше всего<br>без процентов</div>`);
  const cut = (k, x, y, r, s, d) => card(k, x, y, r, s, d).replace('class="card" style="', 'class="card" style="box-shadow:0 0 0 10px #fff,8px 16px 0 rgba(0,0,0,.2);');
  P(cut("psb", 760, 120, 9, .88, false) + cut("ya", 720, 360, -7, .95, false));
  const tape = (x, y, r) => `<div style="position:absolute;left:${x}px;top:${y}px;width:150px;height:44px;background:rgba(255,240,170,.75);transform:rotate(${r}deg);box-shadow:0 2px 4px rgba(0,0,0,.1)"></div>`;
  P(tape(800, 120, -30) + tape(1120, 160, 35) + tape(760, 370, 25));
  P(`<div style="position:absolute;left:1040px;top:470px;width:200px;height:200px;border-radius:50%;background:#e5383b;color:#fff;transform:rotate(12deg);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 8px #fff,6px 12px 0 rgba(0,0,0,.2)">
       <div style="font:900 74px/1 Unb;letter-spacing:-.05em">180</div><div style="font:700 26px/1 O;text-transform:uppercase">дней без %</div></div>
     `);
}

if (v === 6) {   // ДВА ЧЕКА: одна покупка — «0 ₽» и «2 000 ₽»
  bg.style.background = "radial-gradient(900px 600px at 30% 20%, #3ee08f, #12a35a 60%, #0a6d3b)";
  P(`<div style="position:absolute;right:0;top:0;bottom:0;width:50%;background:radial-gradient(800px 600px at 70% 20%, #ff6b6b, #d92b2b 60%, #8f1515)"></div>`);
  const zig = () => { let p = ["0 0", "100% 0"]; for (let i = 20; i >= 0; i--) p.push(`${i * 5}% ${i % 2 ? 97 : 100}%`); return `clip-path:polygon(${p.join(",")})`; };
  const receipt = (x, r, lines, total, tc, stamp, sc) => `<div style="position:absolute;left:${x}px;top:40px;width:470px;height:640px;transform:rotate(${r}deg);filter:drop-shadow(0 24px 30px rgba(0,0,0,.35))">
     <div style="position:absolute;inset:0;background:#fbfaf6;${zig()};padding:36px 36px;font:700 26px/1.5 GM;color:#222">
       <div style="text-align:center;font:700 30px GM;letter-spacing:.1em">*** ЧЕК ***</div><div style="text-align:center;font:600 20px GM;color:#777;margin-bottom:18px">кредитная карта · пример</div>
       ${lines.map(([a, b]) => `<div style="display:flex;justify-content:space-between;border-bottom:2px dashed #ccc;padding:6px 0"><span>${a}</span><span>${b}</span></div>`).join("")}
       <div style="margin-top:22px;font:700 28px GM;color:#555">ПЕРЕПЛАТА</div><div style="font:900 92px/1 Unb;letter-spacing:-.06em;color:${tc};white-space:nowrap">${total}</div></div>
     <div style="position:absolute;right:26px;top:470px;transform:rotate(-12deg);border:7px solid ${sc};color:${sc};border-radius:16px;padding:6px 18px;font:700 50px/1 O;text-transform:uppercase;opacity:.9;background:rgba(255,255,255,.4)">${stamp}</div></div>`;
  P(receipt(70, -5, [["Покупка", "40 000"], ["Вернул", "в срок"], ["Проценты", "0"]], "0 ₽", "#12a35a", "в срок", "#12a35a")
    + receipt(730, 5, [["Покупка", "40 000"], ["Вернул", "день 121"], ["Проценты", "2 000"]], "2 000 ₽", "#d92b2b", "опоздал", "#d92b2b"));
  P(`<div class="pl" style="left:50%;top:600px;transform:translateX(-50%) rotate(-2deg);font-size:72px">одна кредитка</div>`);
}

if (v === 7) {   // ШВЕЙЦАРСКИЙ ПОСТЕР: гигантское «180», карта в нуле
  bg.style.background = "#f1ede4";
  P(`<div style="position:absolute;left:-30px;top:150px;font:900 470px/.8 Unb;letter-spacing:-.09em;color:#111;white-space:nowrap">180</div>`);
  P(card("ya", 850, 330, -12, .82, false));
  P(`<div style="position:absolute;left:44px;top:40px;right:44px;height:4px;background:#111"></div>
     <div style="position:absolute;left:44px;top:58px;font:700 50px/1 O;text-transform:uppercase;color:#111;letter-spacing:.01em">Топ-7 кредиток 2026</div>
     <div style="position:absolute;right:44px;top:58px;display:flex;align-items:center;gap:14px;font:700 50px/1 O;color:#e5383b">№1 <span style="width:40px;height:40px;border-radius:50%;background:#e5383b"></span></div>
     <div style="position:absolute;left:44px;top:640px;font:700 26px I;color:#111">дней без процентов · кто первый — в ролике</div>
     <div style="position:absolute;right:44px;top:630px;padding:8px 22px;background:#e5383b;color:#fff;font:700 40px/1 O;text-transform:uppercase">и где подвох</div>`);
}

if (v === 8) {   // РЕТРО-ОКНА ОШИБОК: «Минимальный платёж внесён. Льготный период: потерян» [ОК] [Ну ок]
  bg.style.background = "#0a8f8f";
  P(`<div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 2px,transparent 2px);background-size:26px 26px"></div>`);
  const win = (x, y, w, title, body, btns, icon, z = 1, fs = 34) => `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;z-index:${z};background:#c3c3c3;border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:10px 14px 0 rgba(0,0,0,.35);${G}">
     <div style="background:linear-gradient(90deg,#0a1f8f,#2b6fd6);color:#fff;font:700 24px/1 GM;padding:10px 12px;display:flex;justify-content:space-between;align-items:center">${title}<span style="background:#c3c3c3;color:#111;border:3px solid;border-color:#fff #555 #555 #fff;padding:0 8px;font:700 22px GM">×</span></div>
     <div style="display:flex;gap:24px;padding:26px 28px 10px;align-items:center">${icon}<div style="font:700 ${fs}px/1.25 GM;color:#111">${body}</div></div>
     <div style="display:flex;gap:22px;justify-content:center;padding:10px 0 24px">${btns.map(b => `<div style="min-width:150px;text-align:center;padding:10px 18px;border:4px solid;border-color:#fff #333 #333 #fff;font:700 30px GM;color:#111;outline:2px dotted #111;outline-offset:-10px">${b}</div>`).join("")}</div></div>`;
  const x = `<svg width="90" height="90" viewBox="0 0 90 90" style="flex:none"><circle cx="45" cy="45" r="40" fill="#e01b1b" stroke="#7a0000" stroke-width="4"/><path d="M28 28 L62 62 M62 28 L28 62" stroke="#fff" stroke-width="11" stroke-linecap="round"/></svg>`;
  const w = `<svg width="60" height="56" viewBox="0 0 60 56" style="flex:none"><path d="M30 4 L57 52 H3 Z" fill="#ffd000" stroke="#111" stroke-width="4" stroke-linejoin="round"/><rect x="27" y="20" width="6" height="18" fill="#111"/><rect x="27" y="42" width="6" height="6" fill="#111"/></svg>`;
  P(win(790, 24, 460, "СМС.exe", "Платные СМС:<br>подключены", ["ОК"], w, 1, 26) + win(830, 150, 420, "Страховка.exe", "Страховка:<br>подключена", ["ОК"], w, 2, 26));
  P(win(120, 330, 860, "Кредитка.exe", "Минимальный платёж внесён.<br>Льготный период: <span style='color:#c00000'>потерян</span>", ["ОК", "Ну ок"], x, 3, 36));
  P(`<div style="position:absolute;left:40px;top:40px;z-index:4;font:900 128px/1 Unb;letter-spacing:-.06em;color:#fff;-webkit-text-stroke:8px #111;paint-order:stroke fill;text-shadow:0 12px 0 #111">ОШИБКА</div>
     <div style="position:absolute;left:44px;top:185px;z-index:4" class="pl">№1 с кредиткой</div>`);
}
document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body>
</html>
