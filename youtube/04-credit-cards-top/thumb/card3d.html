<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Превью ролика №4 — карта на подиуме 3D</title>
<!-- Настоящее 3D (three.js, PBR, отражения окружения, мягкие тени, bloom): металлическая кредитка стоит на тёмном подиуме под прожектором,
     кольцо света по краю подиума. Текст — HTML поверх (≤ 6 слов, без эмодзи). Снимок из youtube/:
     node kit/shot3d.js 04-credit-cards-top/thumb/card3d.html 04-credit-cards-top/thumb/card3d.png   (?v=b — вариант с золотой картой) -->
<style>
  @font-face { font-family: "Unb"; src: url("../../kit/fonts/Unbounded.ttf"); font-weight: 200 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #030304; }
  canvas { position: absolute; inset: 0; width: 1280px !important; height: 720px !important; }
  .t { position: absolute; left: 56px; top: 92px; z-index: 5; font: 900 112px/.95 "Unb"; text-transform: uppercase; letter-spacing: -.05em; }
  .silver { background: linear-gradient(180deg, #ffffff 0%, #dfe3ea 45%, #8d939e 70%, #f2f4f7 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 8px 0 rgba(0,0,0,.5)) drop-shadow(0 0 26px rgba(0,0,0,.8)); }
  .gold { background: linear-gradient(180deg, #fff6c8 0%, #ffd84a 38%, #e3a10e 62%, #fff0a0 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 8px 0 rgba(0,0,0,.45)) drop-shadow(0 0 30px rgba(255,200,40,.45)); }
  .plate { position: absolute; left: 60px; top: 470px; z-index: 5; padding: 12px 28px 16px; border-radius: 18px; transform: rotate(-2.5deg);
    background: linear-gradient(180deg, #ff6b6b, #d92b2b); color: #fff; font: 900 48px "Unb"; text-transform: uppercase; letter-spacing: -.02em;
    box-shadow: 0 14px 30px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.4); }
  .shade { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.4) 40%, transparent 58%); }
  .vig { position: absolute; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(ellipse at 66% 48%, transparent 48%, rgba(0,0,0,.75)); }
</style>
<script type="importmap">{ "imports": { "three": "../../kit/vendor/three/three.module.min.js", "three/addons/": "../../kit/vendor/three/addons/" } }</script>
</head>
<body>
<div class="shade"></div><div class="vig"></div>
<div class="t"><div class="silver">180 дней</div><div class="gold">без %?</div></div>
<div class="plate">где подвох</div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
const V = new URLSearchParams(location.search).get("v") || "a";
const W = 1280, H = 720;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(2); r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = .95;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; document.body.prepend(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x030304);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .45;
const cam = new THREE.PerspectiveCamera(30, W / H, .1, 100); cam.position.set(-.6, 1.9, 11.8); cam.lookAt(2.6, .45, 0);

// текстура лица карты: графит или золото, чип, «180 дней без %» тиснением
const tex = (relief) => { const c = document.createElement("canvas"); c.width = 1712; c.height = 1080; const g = c.getContext("2d");
  const gr = g.createLinearGradient(0, 0, 1712, 1080);
  if (V === "b") { gr.addColorStop(0, relief ? "#777" : "#f6d77a"); gr.addColorStop(.55, relief ? "#555" : "#b88a22"); gr.addColorStop(1, relief ? "#888" : "#ffe9a3"); }
  else { gr.addColorStop(0, relief ? "#666" : "#4a4d55"); gr.addColorStop(.55, relief ? "#444" : "#15161a"); gr.addColorStop(1, relief ? "#777" : "#5a5e68"); }
  g.fillStyle = gr; g.fillRect(0, 0, 1712, 1080);
  if (!relief) for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * .035})`; g.fillRect(0, Math.random() * 1080, 1712, 1); }   // шлифовка
  g.fillStyle = relief ? "#fff" : "#e9c46a"; g.beginPath(); g.roundRect(150, 360, 230, 175, 30); g.fill();
  if (!relief) { g.strokeStyle = "rgba(90,60,10,.5)"; g.lineWidth = 6; g.strokeRect(200, 400, 130, 95); }
  g.fillStyle = relief ? "#fff" : (V === "b" ? "#2a1d05" : "#e8ebf0"); g.font = "900 300px Unb"; g.textAlign = "right"; g.fillText("180", 1590, 930);
  g.font = "800 70px Unb"; g.fillText("ДНЕЙ БЕЗ %", 1590, 640); g.textAlign = "left"; g.font = "700 64px Unb"; g.fillText("•••• 2026", 150, 930);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; if (!relief) t.colorSpace = THREE.SRGBColorSpace; return t; };
const cw = 1.712, ch = 1.08, ct = .03, rr = .1, s = new THREE.Shape();
{ const x = -cw / 2, y = -ch / 2; s.moveTo(x + rr, y); s.lineTo(x + cw - rr, y); s.quadraticCurveTo(x + cw, y, x + cw, y + rr); s.lineTo(x + cw, y + ch - rr);
  s.quadraticCurveTo(x + cw, y + ch, x + cw - rr, y + ch); s.lineTo(x + rr, y + ch); s.quadraticCurveTo(x, y + ch, x, y + ch - rr); s.lineTo(x, y + rr); s.quadraticCurveTo(x, y, x + rr, y); }
const geo = new THREE.ExtrudeGeometry(s, { depth: ct, bevelEnabled: true, bevelThickness: .006, bevelSize: .006, bevelSegments: 3, curveSegments: 24 });
{ const p = geo.attributes.position, uv = geo.attributes.uv; for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + cw / 2) / cw, (p.getY(i) + ch / 2) / ch); }
const face = new THREE.MeshPhysicalMaterial({ map: tex(false), bumpMap: tex(true), bumpScale: 2.5, metalness: .9, roughness: .3, clearcoat: .5, clearcoatRoughness: .2 });
const edge = new THREE.MeshPhysicalMaterial({ color: V === "b" ? 0xd9a93a : 0x9aa0aa, metalness: 1, roughness: .25 });
const card = new THREE.Mesh(geo, [face, edge]); card.scale.setScalar(2.05); card.position.set(4.15, .86, 0); card.rotation.set(-.04, -.5, 0);
card.castShadow = true; scene.add(card);
// подиум: тёмный металл, светящееся кольцо по краю
const pod = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.2, .55, 96), new THREE.MeshPhysicalMaterial({ color: 0x15161a, metalness: .8, roughness: .35, clearcoat: .6 }));
pod.position.set(4.15, -.55, 0); pod.receiveShadow = true; scene.add(pod);
const ring = new THREE.Mesh(new THREE.TorusGeometry(2.12, .022, 16, 160), new THREE.MeshBasicMaterial({ color: V === "b" ? 0xffd36b : 0xdfe6ff }));
ring.rotation.x = Math.PI / 2; ring.position.set(4.15, -.27, 0); scene.add(ring);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshPhysicalMaterial({ color: 0x050506, metalness: .3, roughness: .62 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -.83; floor.receiveShadow = true; scene.add(floor);
// свет: прожектор сверху, контровой слева, тёплый снизу-справа
const spot = new THREE.SpotLight(0xffffff, 260, 30, .42, .6, 1.4); spot.position.set(4.6, 8.5, 3.6); spot.target.position.set(4.15, .6, 0);
spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); scene.add(spot, spot.target);
const rim = new THREE.PointLight(0x9fb4ff, 40, 12, 1.6); rim.position.set(2.2, 2.6, -2.4); scene.add(rim);
const warm = new THREE.PointLight(V === "b" ? 0xffc46b : 0xffe0b0, 18, 8, 1.5); warm.position.set(6.4, 2.2, 1.6); scene.add(warm);
const comp = new EffectComposer(r); comp.setPixelRatio(2); comp.setSize(W, H);
comp.addPass(new RenderPass(scene, cam)); comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), .55, .5, .82)); comp.addPass(new OutputPass());
document.fonts.load("900 100px Unb").then(() => { face.map = tex(false); face.bumpMap = tex(true); face.needsUpdate = true; comp.render();
  requestAnimationFrame(() => { comp.render(); window.__ready = true; }); });
</script>
</body></html>
