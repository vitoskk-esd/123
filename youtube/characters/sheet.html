<script>

const st = (w = 7) => `stroke="${OL}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;

// глаза и рот: эмоции talk | happy | shock
const eyes = (cx, cy, gap, r, mood, look = 0) => {
  const one = (x) => mood === "happy"
    ? `<path d="M${x - r} ${cy + 4} Q ${x} ${cy - r - 4} ${x + r} ${cy + 4}" fill="none" ${st(7)}/>`
    : `<ellipse cx="${x}" cy="${cy}" rx="${r}" ry="${r * (mood === "shock" ? 1.25 : 1.12)}" fill="#fff" ${st(6)}/>
       <circle cx="${x + look}" cy="${cy + 2}" r="${r * (mood === "shock" ? .38 : .52)}" fill="${OL}"/><circle cx="${x + look + r * .2}" cy="${cy - r * .2}" r="${r * .16}" fill="#fff"/>`;
  return one(cx - gap) + one(cx + gap);
};
const brows = (cx, cy, gap, mood) => mood === "shock"
  ? `<path d="M${cx - gap - 22} ${cy - 10} Q ${cx - gap} ${cy - 30} ${cx - gap + 22} ${cy - 14}" fill="none" ${st(7)}/><path d="M${cx + gap - 22} ${cy - 14} Q ${cx + gap} ${cy - 30} ${cx + gap + 22} ${cy - 10}" fill="none" ${st(7)}/>`

const mouth = (cx, cy, w, mood) => mood === "happy"

  : mood === "shock" ? `<ellipse cx="${cx}" cy="${cy + w * .3}" rx="${w * .45}" ry="${w * .6}" fill="#7a1f2b" ${st(6)}/>`
  : `<path d="M${cx - w * .8} ${cy} Q ${cx} ${cy + w * .9} ${cx + w * .8} ${cy} Q ${cx} ${cy + w * .25} ${cx - w * .8} ${cy} Z" fill="#7a1f2b" ${st(6)}/><path d="M${cx - w * .35} ${cy + w * .45} Q ${cx} ${cy + w * .3} ${cx + w * .35} ${cy + w * .45}" fill="none" stroke="#ff8a9a" stroke-width="8" stroke-linecap="round"/>`;

const bubble = (x, y, w, t, tail = "left") => `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;padding:26px 34px;background:#fff;border:6px solid ${OL};border-radius:46px;font:800 40px/1.2 I;color:${OL};box-shadow:10px 10px 0 ${OL}">${t}</div>`;

</svg>`;

  ${arm === "point" ? `<path d="M205 440 Q 165 520 190 590" fill="none" stroke="#1d1b2c" stroke-width="52" stroke-linecap="round"/><path d="M205 440 Q 165 520 190 590" fill="none" stroke="#2fa84f" stroke-width="40" stroke-linecap="round"/><circle cx="192" cy="604" r="22" fill="#f2c7a5" stroke="#1d1b2c" stroke-width="6"/><path d="M420 420 Q 500 360 520 290" fill="none" stroke="#1d1b2c" stroke-width="54" stroke-linecap="round"/><path d="M420 420 Q 500 360 520 290" fill="none" stroke="#2fa84f" stroke-width="42" stroke-linecap="round"/><circle cx="522" cy="275" r="26" fill="#f2c7a5" ${st(6)}/>`
    : arm === "phone" ? `<path d="M205 440 Q 165 520 190 590" fill="none" stroke="#1d1b2c" stroke-width="52" stroke-linecap="round"/><path d="M205 440 Q 165 520 190 590" fill="none" stroke="#2fa84f" stroke-width="40" stroke-linecap="round"/><circle cx="192" cy="604" r="22" fill="#f2c7a5" stroke="#1d1b2c" stroke-width="6"/><path d="M420 420 Q 480 470 470 380" fill="none" stroke="#1d1b2c" stroke-width="54" stroke-linecap="round"/><path d="M420 420 Q 480 470 470 380" fill="none" stroke="#2fa84f" stroke-width="42" stroke-linecap="round"/>${phone(470, 340, 10)}`
    : `<path d="M180 420 Q 100 360 110 270" fill="none" stroke="#1d1b2c" stroke-width="54" stroke-linecap="round"/><path d="M180 420 Q 100 360 110 270" fill="none" stroke="#2fa84f" stroke-width="42" stroke-linecap="round"/><path d="M420 420 Q 500 360 490 270" fill="none" stroke="#1d1b2c" stroke-width="54" stroke-linecap="round"/><path d="M420 420 Q 500 360 490 270" fill="none" stroke="#2fa84f" stroke-width="42" stroke-linecap="round"/><circle cx="110" cy="258" r="26" fill="#f2c7a5" ${st(6)}/><circle cx="490" cy="258" r="26" fill="#f2c7a5" ${st(6)}/>`}
</svg>`;

/* ---------- 3. ЛИС ФИНИК ---------- */
const fox = (mood = "talk", arm = "point") => `<svg viewBox="-40 -20 680 780" width="680" height="780">

  <path d="M430 560 Q 560 520 540 400 Q 520 330 470 360 Q 500 450 420 500" fill="#ff8a2a" ${st(7)}/><path d="M540 400 Q 520 330 470 360 Q 490 390 500 420 Q 520 410 540 400 Z" fill="#fff"/>
  <path d="M250 570 L245 700" ${st(18)}/><path d="M350 570 L355 700" ${st(18)}/>

  ${arm === "point" ? `<path d="M210 450 Q 170 525 195 590" fill="none" stroke="#1d1b2c" stroke-width="50" stroke-linecap="round"/><path d="M210 450 Q 170 525 195 590" fill="none" stroke="#3d5bd9" stroke-width="38" stroke-linecap="round"/><circle cx="197" cy="603" r="20" fill="#ff8a2a" stroke="#1d1b2c" stroke-width="6"/><path d="M410 430 Q 490 370 510 300" fill="none" stroke="#1d1b2c" stroke-width="50" stroke-linecap="round"/><path d="M410 430 Q 490 370 510 300" fill="none" stroke="#3d5bd9" stroke-width="38" stroke-linecap="round"/><circle cx="512" cy="286" r="24" fill="#ff8a2a" ${st(6)}/>`
    : arm === "phone" ? `<path d="M210 450 Q 170 525 195 590" fill="none" stroke="#1d1b2c" stroke-width="50" stroke-linecap="round"/><path d="M210 450 Q 170 525 195 590" fill="none" stroke="#3d5bd9" stroke-width="38" stroke-linecap="round"/><circle cx="197" cy="603" r="20" fill="#ff8a2a" stroke="#1d1b2c" stroke-width="6"/><path d="M410 430 Q 470 480 470 390" fill="none" stroke="#1d1b2c" stroke-width="50" stroke-linecap="round"/><path d="M410 430 Q 470 480 470 390" fill="none" stroke="#3d5bd9" stroke-width="38" stroke-linecap="round"/>${phone(470, 350, 10)}`
    : `<path d="M190 430 Q 110 370 120 280" fill="none" stroke="#1d1b2c" stroke-width="50" stroke-linecap="round"/><path d="M190 430 Q 110 370 120 280" fill="none" stroke="#3d5bd9" stroke-width="38" stroke-linecap="round"/><path d="M410 430 Q 490 370 480 280" fill="none" stroke="#1d1b2c" stroke-width="50" stroke-linecap="round"/><path d="M410 430 Q 490 370 480 280" fill="none" stroke="#3d5bd9" stroke-width="38" stroke-linecap="round"/><circle cx="120" cy="268" r="24" fill="#ff8a2a" ${st(6)}/><circle cx="480" cy="268" r="24" fill="#ff8a2a" ${st(6)}/>`}
</svg>`;

/* ---------- 4. КАРТОЧКА КЭШ ---------- */
const cardy = (mood = "talk", arm = "point") => `<svg viewBox="-40 -20 680 780" width="680" height="780">
  <ellipse cx="300" cy="735" rx="170" ry="20" fill="rgba(0,0,0,.15)"/>
  <path d="M250 600 L240 700" ${st(16)}/><path d="M350 600 L360 700" ${st(16)}/>
  <path d="M190 712 Q 195 680 238 684 L 268 690 Q 276 712 256 722 L 196 722 Z" fill="#ffd34d" ${st(6)}/><path d="M410 712 Q 405 680 362 684 L 332 690 Q 324 712 344 722 L 404 722 Z" fill="#ffd34d" ${st(6)}/>
  <rect x="110" y="170" width="380" height="440" rx="44" fill="#7b3fd6" ${st(8)}/>

  ${arm === "point" ? `<path d="M110 420 Q 50 480 80 560" fill="none" ${st(16)}/><path d="M490 400 Q 560 330 580 270" fill="none" ${st(16)}/><circle cx="582" cy="262" r="18" fill="#fff" ${st(6)}/>`

const CH = {

  2: [vlad, "Влад", "Нарисованный «ты» из 18–25: худи с арбузом на груди, телефон в руке. Зрителю легко узнать себя — герой сам попадает в ловушки банков.", "#dfe9ff", "Я Влад. Проверяю<br>схемы на своих деньгах"],

const [draw, name, desc, bg, line] = CH[C];
P(`<div class="a" style="inset:0;background:${bg}"></div><div class="a" style="inset:0;background-image:radial-gradient(rgba(0,0,0,.06) 2px,transparent 2px);background-size:26px 26px"></div>`);
P(`<div class="a" style="left:40px;top:150px">${draw("talk", "point")}</div>`);

P(`<div class="a" style="left:1230px;top:90px;width:300px;transform:scale(.48);transform-origin:0 0">${draw("happy", "up")}</div><div class="a" style="left:1560px;top:90px;width:300px;transform:scale(.48);transform-origin:0 0">${draw("shock", "phone")}</div>
