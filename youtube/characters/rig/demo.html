<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Арбузов говорит — проба рига</title>
<!-- Проба рига 14.10 (ночь): Арбузов говорит голосом №7 — рот по буквам слов (words.json), моргание, дыхание, кивки,
     смены жестов с отскоком. Стиль канала ещё не выбран — фон нейтральный. Звук: заставка «хрум» 0–1 с, голос с 1,0 с.
     Рендер: node ../../kit/yt/render.js demo.html --out out/demo_silent.mp4 → ffmpeg + voice/voice.wav. -->
<style>
  @font-face { font-family: "I"; src: url("../../kit/fonts/inter-cyrillic-700.woff2"); font-weight: 700; unicode-range: U+0400-045F; }
  @font-face { font-family: "I"; src: url("../../kit/fonts/inter-latin-700.woff2"); font-weight: 700; }
  @font-face { font-family: "Unb"; src: url("../../kit/fonts/Unbounded.ttf"); font-weight: 200 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff4dc; font-family: "I"; }
  .a { position: absolute; }
  #bg { inset: 0; background: radial-gradient(900px 700px at 30% 60%, #ffe6b0, transparent 70%), #fff4dc; }
  #hero { left: 120px; top: 150px; width: 700px; height: 803px; transform-origin: 50% 92%; }
  .card { right: 140px; width: 760px; padding: 34px 40px; background: #fff; border: 6px solid #1d1b2c; border-radius: 34px;
          box-shadow: 12px 12px 0 #1d1b2c; transform-origin: 0 50%; opacity: 0; }
  .card .k { font: 700 26px I; color: #8a8496; letter-spacing: .04em; text-transform: uppercase; }
  .card .v { font: 900 64px/1.05 Unb; letter-spacing: -.03em; color: #1d1b2c; margin-top: 10px; }
  .card .v b { color: #ff3b4f; }
</style>
</head>
<body>
<div class="a" id="bg"></div>
<div class="a" id="hero"></div>
<div class="a card" id="c1" style="top:170px"><div class="k">Банки любят</div><div class="v">мелкий <b>шрифт</b></div></div>
<div class="a card" id="c2" style="top:420px"><div class="k">Сегодня проверим</div><div class="v">заработок<br>на <b>кредитке</b></div></div>
<div class="a card" id="c3" style="top:740px;background:#ff3b4f"><div class="k" style="color:#ffd6dc">Спойлер</div><div class="v" style="color:#fff">есть ловушка</div></div>
<script src="../arbuzov.js"></script>
<script src="rig.js"></script>
<script>
const OFF = 1.0;                                   // голос начинается после заставки
const ACTS = [{ t: 0, mood: "happy", arm: "down" }, { t: 1.0, mood: "happy", arm: "up" }, { t: 2.6, mood: "smirk", arm: "point" },
              { t: 5.6, mood: "talk", arm: "phone" }, { t: 8.6, mood: "wink", arm: "point" }, { t: 10.15, mood: "shock", arm: "up" }];
const CARDS = [["c1", 3.1], ["c2", 7.2], ["c3", 10.15]];
let WORDS = [];
const hero = document.getElementById("hero");
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const back = (x) => { x = Math.min(1, Math.max(0, x)); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
window.renderAt = (t) => {
  const s = ArbuzovRig.state(t, { words: WORDS, acts: ACTS, offset: OFF });
  hero.innerHTML = Arbuzov.svg({ ...s.opts, w: 700, h: 803 });
  const intro = back((t - .15) / .45);                      // появление: вырастает из пола
  hero.style.transform = `${s.transform} scale(${Math.max(0, intro)})`;
  for (const [id, t0] of CARDS) {
    const el = document.getElementById(id), k = (t - t0) / .4;
    el.style.opacity = k <= 0 ? 0 : 1;
    el.style.transform = `translateX(${(1 - ease(k)) * 120}px) rotate(${(1 - back(k)) * -6}deg) scale(${.85 + .15 * back(k)})`;
  }
};
window.TL = { duration: 12.3, fps: 30, size: [1920, 1080] };
fetch("voice/words.json").then(r => r.json()).then(w => { WORDS = w; return document.fonts.ready; }).then(() => { renderAt(0); window.__ready = true; });
</script>
</body>
</html>
