<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Шапка канала «Арбузов» — банки гонятся за Арбузовым</title>
<!-- Идея владельца 14.10: «стоят 3–4 банка (Т-Банк, Альфа, ОТП, ВТБ), у них в руках биты, кастеты, а рядом Арбузов с мешком денег,
     как будто убегает от них». Банки — персонажи-карты в фирменных цветах, БЕЗ логотипов и названий (товарные знаки и деловая
     репутация); мешок подписан «БОНУСЫ» (законно забрал положенное). Формат YouTube: 2560×1440, безопасная зона 1546×423 по центру
     (x 507–2053, y 508–931) — всё главное внутри неё. -->
<style>
  @font-face { font-family: "Unb"; src: url("../../kit/fonts/Unbounded.ttf"); font-weight: 200 900; }
  @font-face { font-family: "I"; src: url("../../kit/fonts/inter-cyrillic-700.woff2"); font-weight: 700; unicode-range: U+0400-045F; }
  @font-face { font-family: "I"; src: url("../../kit/fonts/inter-latin-700.woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<div id="R"></div>
<script>
const OL = "#1b1414";
const st = (w = 7) => `stroke="${OL}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const limb = (d, c, w) => `<path d="${d}" fill="none" stroke="${OL}" stroke-width="${w + 14}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const shoe = (x, y, flip = 1, c = "#f4f4f4") => `<path d="M${x - 46 * flip} ${y + 20} Q ${x - 48 * flip} ${y - 14} ${x - 6 * flip} ${y - 16} Q ${x + 40 * flip} ${y - 16} ${x + 50 * flip} ${y + 20} Z" fill="${c}" ${st(6)}/><path d="M${x - 44 * flip} ${y + 10} H ${x + 48 * flip}" stroke="${OL}" stroke-width="4" opacity=".4"/>`;

/* ---------- банк-«бандит»: карта с лицом, руки, ноги, оружие ---------- */
function bankGuy(o) {
  const { x, y, s = 1, col, col2, ink = "#fff", acc = "", weapon, face = "angry", tilt = 0, id } = o;
  const eyes = face === "shades"
    ? `<path d="M-78 -30 H 78 L 70 6 Q 40 18 12 4 L 0 -8 L -12 4 Q -40 18 -70 6 Z" fill="#111" ${st(5)}/><path d="M-60 -20 L -30 -20 M 24 -20 L 54 -20" stroke="#fff" stroke-width="6" opacity=".5" stroke-linecap="round"/>`
    : `<ellipse cx="-38" cy="-12" rx="24" ry="20" fill="#fff" ${st(5)}/><ellipse cx="38" cy="-12" rx="24" ry="20" fill="#fff" ${st(5)}/>
       <circle cx="-26" cy="-8" r="9" fill="${OL}"/><circle cx="50" cy="-8" r="9" fill="${OL}"/>
       <path d="M-70 -46 L -14 -26 M 70 -46 L 14 -26" ${st(10)}/>`;
  const mouth = face === "grin"
    ? `<path d="M-46 36 Q 0 70 46 36 Z" fill="#fff" ${st(6)}/><path d="M-30 40 V 56 M -10 43 V 62 M 10 43 V 62 M 30 40 V 56" stroke="${OL}" stroke-width="4"/>`
    : `<rect x="-44" y="34" width="88" height="30" rx="8" fill="#fff" ${st(6)}/><path d="M-22 34 V 64 M 0 34 V 64 M 22 34 V 64 M -44 49 H 44" stroke="${OL}" stroke-width="4"/>`;
  const W = {
    bat: `<g transform="translate(150 -230) rotate(20)"><path d="M-12 160 L -16 20 Q -24 -120 0 -150 Q 24 -120 16 20 L 12 160 Z" fill="url(#wood)" ${st(6)}/><rect x="-14" y="128" width="28" height="34" rx="6" fill="#222" ${st(4)}/></g>`,
    chain: `<path d="M150 -170 Q 260 -260 300 -150 Q 330 -60 250 -40" fill="none" stroke="${OL}" stroke-width="24" stroke-linecap="round"/><path d="M150 -170 Q 260 -260 300 -150 Q 330 -60 250 -40" fill="none" stroke="#dfe3ea" stroke-width="13" stroke-dasharray="18 10" stroke-linecap="round"/>`,
    knux: `<g transform="translate(150 -150)"><rect x="-44" y="-30" width="88" height="40" rx="16" fill="url(#steel)" ${st(6)}/>${[-30, -10, 10, 30].map(cx => `<circle cx="${cx}" cy="-30" r="12" fill="none" stroke="${OL}" stroke-width="12"/><circle cx="${cx}" cy="-30" r="12" fill="none" stroke="#dfe3ea" stroke-width="5"/>`).join("")}</g>`,
    pipe: `<g transform="translate(160 -250) rotate(18)"><rect x="-14" y="-150" width="28" height="300" rx="10" fill="url(#steel)" ${st(6)}/><rect x="-22" y="-150" width="44" height="30" rx="6" fill="#9aa1ad" ${st(5)}/></g>`,
  }[weapon];
  return `<g transform="translate(${x} ${y}) scale(${s}) rotate(${tilt})">
    <ellipse cx="0" cy="330" rx="170" ry="26" fill="#000" opacity=".35"/>
    ${limb("M-60 170 L -80 300", "#2b2b33", 34)}${limb("M60 170 L 82 300", "#2b2b33", 34)}${shoe(-84, 312, -1)}${shoe(88, 312, 1)}
    ${limb("M-110 0 Q -190 60 -170 150", col2, 34)}<circle cx="-170" cy="160" r="30" fill="${col2}" ${st(6)}/>
    <rect x="-130" y="-190" width="260" height="380" rx="34" fill="url(#${id})" ${st(9)}/>
    <rect x="-130" y="-190" width="260" height="380" rx="34" fill="url(#gloss)"/>
    <rect x="-96" y="96" width="62" height="46" rx="10" fill="url(#gold)" ${st(5)}/><path d="M-96 119 H -34 M -65 96 V 142" stroke="${OL}" stroke-width="3" opacity=".5"/>
    <text x="96" y="160" text-anchor="end" font-family="I" font-weight="700" font-size="22" fill="${ink}" opacity=".85">•••• 0000</text>
    ${acc}
    <g transform="translate(0 -70)">${eyes}${mouth}</g>
    ${W}
    ${limb("M110 -20 Q 190 -60 150 -170", col2, 34)}<circle cx="150" cy="-170" r="32" fill="${col2}" ${st(6)}/>
  </g>`;
}

/* ---------- Арбузов бежит с мешком «БОНУСЫ» ---------- */
function arbuzRun(x, y, s) {
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="330" rx="200" ry="26" fill="#000" opacity=".35"/>
    <path d="M-50 170 Q -140 230 -210 170" fill="none" ${st(18)}/>${shoe(-230, 168, -1, "#fff")}
    <path d="M50 180 Q 90 260 70 316" fill="none" ${st(18)}/>${shoe(84, 322, 1, "#fff")}
    <!-- мешок за спиной -->
    <g transform="translate(-290 -60) rotate(-18) scale(1.08)">
      <path d="M-120 40 Q -150 220 0 240 Q 150 220 120 40 Q 60 -10 0 -6 Q -60 -10 -120 40 Z" fill="url(#sack)" ${st(9)}/>
      <path d="M-40 -6 Q 0 -40 40 -6" fill="none" ${st(16)}/><path d="M-50 4 Q 0 24 50 4" fill="none" stroke="#7a5a2a" stroke-width="12"/>
      <text x="0" y="150" text-anchor="middle" font-family="Unb" font-weight="900" font-size="58" fill="#2b5a1a" transform="rotate(-4)">БОНУСЫ</text>
      <text x="0" y="96" text-anchor="middle" font-family="Unb" font-weight="900" font-size="70" fill="#2b5a1a">₽</text>
    </g>
    <path d="M-100 -40 Q -170 -110 -200 -150" fill="none" ${st(18)}/><circle cx="-196" cy="-150" r="24" fill="#fff" ${st(6)}/>
    <!-- тело -->
    <g transform="rotate(-10)">
      <ellipse cx="0" cy="0" rx="200" ry="200" fill="url(#rind)" ${st(9)}/>
      <clipPath id="bc"><ellipse cx="0" cy="0" rx="200" ry="200"/></clipPath>
      <g clip-path="url(#bc)">${[-140, -80, -25, 30, 85, 140].map(dx => `<path d="M${dx * .25} -200 C ${dx * 1.3} -80 ${dx * 1.35} 80 ${dx * .25} 200" fill="none" stroke="#0f5226" stroke-width="${28 - Math.abs(dx) * .06}" stroke-linecap="round" opacity=".92"/>`).join("")}
        <ellipse cx="-90" cy="-110" rx="70" ry="38" fill="#fff" opacity=".22" transform="rotate(-30 -90 -110)"/><ellipse cx="0" cy="190" rx="220" ry="90" fill="#062a12" opacity=".35"/></g>
      <path d="M-150 -120 Q -130 -250 0 -256 Q 130 -250 150 -120 Q 0 -150 -150 -120 Z" fill="url(#cap)" ${st(8)}/>
      <path d="M-120 -150 Q -230 -170 -270 -120 Q -230 -100 -160 -112" fill="#a31424" ${st(8)}/>
      <circle cx="0" cy="-252" r="12" fill="#a31424" ${st(5)}/>
      <ellipse cx="20" cy="10" rx="138" ry="112" fill="url(#face)" ${st(8)}/>
      ${[[-70, -40], [-20, -76], [50, -66], [100, -20], [-96, 30], [96, 46]].map(([a, b]) => `<ellipse cx="${20 + a}" cy="${10 + b}" rx="6" ry="10" fill="#3a1414" opacity=".55"/>`).join("")}
      <ellipse cx="-20" cy="-10" rx="34" ry="40" fill="#fff" ${st(6)}/><ellipse cx="70" cy="-10" rx="34" ry="40" fill="#fff" ${st(6)}/>
      <circle cx="-34" cy="-6" r="13" fill="${OL}"/><circle cx="56" cy="-6" r="13" fill="${OL}"/><circle cx="-29" cy="-12" r="5" fill="#fff"/><circle cx="61" cy="-12" r="5" fill="#fff"/>
      <path d="M-60 -64 Q -24 -84 6 -64 M 40 -68 Q 74 -86 104 -62" fill="none" ${st(8)}/>
      <path d="M-30 50 Q 30 110 96 44 Z" fill="#5c1420" ${st(6)}/><path d="M-12 56 L 80 50" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
      <path d="M160 -60 q 16 22 0 36 q -16 -14 0 -36" fill="#9be7ff" ${st(4)}/><path d="M178 -10 q 12 16 0 26 q -12 -10 0 -26" fill="#9be7ff" ${st(4)}/>
    </g>
    <path d="M150 20 Q 230 60 270 10" fill="none" ${st(18)}/><circle cx="276" cy="6" r="24" fill="#fff" ${st(6)}/>
  </g>`;
}

const grads = `
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1b4a"/><stop offset=".55" stop-color="#c2465a"/><stop offset="1" stop-color="#ffb36b"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3340"/><stop offset="1" stop-color="#1c1820"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5a2b"/><stop offset=".5" stop-color="#d9a066"/><stop offset="1" stop-color="#7a4a20"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f4f8"/><stop offset=".5" stop-color="#9aa1ad"/><stop offset="1" stop-color="#e3e6ec"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".5" stop-color="#e8b93a"/><stop offset="1" stop-color="#fff0a8"/></linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
  <linearGradient id="bY" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe866"/><stop offset="1" stop-color="#f2c400"/></linearGradient>
  <linearGradient id="bR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a4a"/><stop offset="1" stop-color="#d11a10"/></linearGradient>
  <linearGradient id="bG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b6ef4a"/><stop offset="1" stop-color="#5aa81e"/></linearGradient>
  <linearGradient id="bB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a63e8"/><stop offset="1" stop-color="#0a2896"/></linearGradient>
  <radialGradient id="rind" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#5fd77a"/><stop offset=".45" stop-color="#2a9a46"/><stop offset="1" stop-color="#0f4a22"/></radialGradient>
  <radialGradient id="face" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#ff9aa3"/><stop offset=".6" stop-color="#f2606f"/><stop offset="1" stop-color="#c8394b"/></radialGradient>
  <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a63"/><stop offset="1" stop-color="#b8182a"/></linearGradient>
  <radialGradient id="sack" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#f2dca0"/><stop offset="1" stop-color="#b98d4a"/></radialGradient>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>`;

// городские силуэты и окна
let city = "", seed = 5; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 16; i++) {
  const w = 120 + R() * 140, h = 260 + R() * 420, x = i * 170 - 40, y = 960 - h;
  city += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#251733" opacity=".92"/>`;
  for (let r = y + 24; r < 930; r += 40) for (let c = x + 16; c < x + w - 20; c += 30) if (R() < .3) city += `<rect x="${c}" y="${r}" width="14" height="18" fill="#ffc96b" opacity=".85"/>`;
}
const coins = [[1790, 600, 20], [1760, 650, -15], [1820, 560, 35], [1745, 580, 5]].map(([cx, cy, r]) => `<g transform="translate(${cx} ${cy}) rotate(${r})"><ellipse rx="26" ry="26" fill="url(#gold)" ${st(5)}/><text y="10" text-anchor="middle" font-family="Unb" font-weight="900" font-size="28" fill="#8a5a00">₽</text></g>`).join("");
const speed = [620, 680, 740, 800].map((yy, k) => `<path d="M${2080 + k * 20} ${yy} H ${2300 - k * 30}" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".55"/>`).join("");

document.getElementById("R").innerHTML = `<svg viewBox="0 0 2560 1440" width="2560" height="1440"><defs>${grads}</defs>
  <rect width="2560" height="1440" fill="url(#sky)"/>
  <circle cx="1280" cy="760" r="300" fill="#ffd58a" opacity=".35"/>
  ${city}
  <rect y="950" width="2560" height="490" fill="url(#road)"/>
  <path d="M0 1120 H 2560" stroke="#f4d35e" stroke-width="12" stroke-dasharray="90 70" opacity=".8"/>
  <!-- название — слева в безопасной зоне -->
  <text x="530" y="690" font-family="Unb" font-weight="900" font-size="104" letter-spacing="-5" fill="#fff" stroke="${OL}" stroke-width="10" paint-order="stroke">АРБУЗОВ</text>
  <text x="536" y="756" font-family="I" font-weight="700" font-size="31" fill="#fff" stroke="${OL}" stroke-width="6" paint-order="stroke">забираю бонусы банков — законно</text>
  <!-- банки-«бандиты» (фирменные цвета, без логотипов) -->
  ${bankGuy({ x: 1250, y: 712, s: .46, col2: "#f2c400", ink: "#1b1414", weapon: "bat", face: "shades", tilt: -4, id: "bY", acc: `<path d="M-60 186 Q 0 230 60 186" fill="none" stroke="url(#gold)" stroke-width="12"/>` })}
  ${bankGuy({ x: 1385, y: 722, s: .44, col2: "#d11a10", weapon: "knux", face: "angry", tilt: 3, id: "bR" })}
  ${bankGuy({ x: 1520, y: 716, s: .44, col2: "#5aa81e", ink: "#1b1414", weapon: "chain", face: "grin", tilt: -3, id: "bG" })}
  ${bankGuy({ x: 1655, y: 712, s: .46, col2: "#0a2896", weapon: "pipe", face: "angry", tilt: 4, id: "bB", acc: `<rect x="-70" y="-206" width="140" height="34" rx="10" fill="#111" ${st(5)}/>` })}
  ${coins}${speed}
  ${arbuzRun(1955, 700, .5)}
  <path d="M2000 880 q 30 -24 70 -8 q 24 -30 60 -8" fill="#d9cfc0" opacity=".7"/>
  <rect width="2560" height="1440" fill="url(#vig)"/>
  ${new URLSearchParams(location.search).get("guide") ? `<rect x="507" y="508" width="1546" height="423" fill="none" stroke="#0ff" stroke-width="6" stroke-dasharray="20 14"/>` : ""}
</svg>`;
document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => { window.__ready = true; }, 400))));
</script>
</body>
</html>
