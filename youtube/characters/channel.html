const fit = () => document.querySelectorAll(".box").forEach(b => b.querySelectorAll(".nw").forEach(el => {
  if (el.offsetParent !== b) return;
  const cs = getComputedStyle(el), centered = !!el.style.right;
  const room = centered ? el.clientWidth : b.clientWidth - el.offsetLeft - 16;
  let fs = parseFloat(cs.fontSize), n = 0;
  while (el.scrollWidth > room + 1 && fs > 12 && n++ < 60) { fs *= .96; el.style.fontSize = fs + "px"; }
}));
