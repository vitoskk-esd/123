<script>
const v = +(new URLSearchParams(location.search).get("v") || 1);
const nfc = `<svg style="position:absolute;left:106px;top:110px" width="34" height="34" viewBox="0 0 34 34">${[8, 14, 20].map(r => `<path d="M${6 + r * .35} ${17 - r * .55} A ${r} ${r} 0 0 1 ${6 + r * .35} ${17 + r * .55}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="3" stroke-linecap="round"/>`).join("")}</svg>`;
// упрощённые знаки банков (не копии логотипов), фирменные цвета
const C = {
  ya: { bg: "linear-gradient(135deg,#1c1c20,#0a0a0c 60%,#2a1010)", mark: `<svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="#fc3f1d"/><text x="22" y="31" text-anchor="middle" font-family="I" font-weight="700" font-size="26" fill="#fff">Я</text></svg>`, name: "Яндекс Банк", d: 180 },

const bg = document.getElementById("bg"), R = document.getElementById("root");
const shadow = (c) => `text-shadow: 0 4px 0 ${c}, 0 8px 0 ${c}, 0 12px 0 ${c}, 0 16px 0 ${c}, 0 30px 50px rgba(0,0,0,.35)`;
const G = "font-family:GM";
const P = (s) => R.insertAdjacentHTML("beforeend", s);
const mag = (c = "#666", s = 34) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="${c}" stroke-width="2.6"/><path d="M15 15 L21 21" stroke="${c}" stroke-width="2.8" stroke-linecap="round"/></svg>`;

// ===== Ролик №5 «Заработок на кредитке: проверил схему на цифрах (2026)» — только 2D. Снимок из youtube/:
// node kit/shot3d.js 05-credit-card-earn/thumb/thumbs.html 05-credit-card-earn/thumb/k1.png 1280 720 v=1
const zig = () => { let p = ["0 0", "100% 0"]; for (let i = 20; i >= 0; i--) p.push(`${i * 5}% ${i % 2 ? 97 : 100}%`); return `clip-path:polygon(${p.join(",")})`; };
const stamp = (txt, c, x, y, r, fs = 54) => `<div style="position:absolute;left:${x}px;top:${y}px;transform:rotate(${r}deg);border:8px solid ${c};color:${c};border-radius:16px;padding:6px 20px;font:700 ${fs}px/1 O;text-transform:uppercase;background:rgba(255,255,255,.55);white-space:nowrap">${txt}</div>`;

if (v === 1) {   // ДВА ЧЕКА: «обещают +15 000» НЕ ВЕРЮ vs «посчитал ???» ПРОВЕРЕНО
  bg.style.background = "radial-gradient(900px 700px at 25% 20%, #ff6b6b, #d92b2b 60%, #8f1515)";
  P(`<div style="position:absolute;right:0;top:0;bottom:0;width:50%;background:radial-gradient(800px 600px at 70% 20%, #3ee08f, #12a35a 60%, #0a6d3b)"></div>`);

     <div style="position:absolute;inset:0;background:#fbfaf6;${zig()};padding:34px 34px;font:700 26px/1.5 GM;color:#222">
       <div style="text-align:center;font:700 32px GM;letter-spacing:.06em">${head}</div><div style="text-align:center;font:600 20px GM;color:#777;margin-bottom:16px">кредитка + накопительный · пример</div>
       ${lines.map(([a, b]) => `<div style="display:flex;justify-content:space-between;border-bottom:2px dashed #ccc;padding:6px 0"><span>${a}</span><span>${b}</span></div>`).join("")}
       <div style="margin-top:20px;font:700 28px GM;color:#555">ДОХОД В МЕСЯЦ</div><div style="font:900 96px/1 Unb;letter-spacing:-.06em;color:${tc};white-space:nowrap;${blur ? "filter:blur(14px)" : ""}">${total}</div></div></div>`;
  P(rc(60, -5, "ОБЕЩАЮТ", [["Лимит", "1 000 000"], ["Схема", "«пассивно»"], ["Риски", "—"]], "+15 000", "#d92b2b", false)

}

  const key = (t, c = "#2a2b30", f = "#fff") => `<div style="height:84px;border-radius:18px;background:${c};color:${f};font:700 40px/84px I;text-align:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.35)">${t}</div>`;
  P(`<div style="position:absolute;left:70px;top:40px;width:560px;height:640px;border-radius:44px;background:linear-gradient(160deg,#3a3b42,#16171b);box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.15);transform:rotate(-4deg);padding:34px">
       <div style="height:170px;border-radius:22px;background:#c9e7c4;box-shadow:inset 0 6px 14px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:0 26px;position:relative">
         <div style="font:700 26px GM;color:#4c6a49">доход в месяц?</div><div style="font:700 96px/1 GM;color:#17321a;letter-spacing:-.04em">15 000</div>

  P(`<div class="pl" style="left:690px;top:60px;font-size:84px;transform:rotate(-2deg)">а реально?</div>`);
}

if (v === 3) {   // ПОИСК: «как заработать на кредитке» → «сколько реально» обведено

  P(card("t", 900, 440, -10, .85, false) + card("psb", 1010, 380, 8, .78, false));
  P(`<div style="position:absolute;left:50px;top:44px;width:1180px;height:130px;border-radius:65px;background:#fff;box-shadow:0 20px 50px rgba(30,50,90,.22),0 0 0 3px #d7dce6;display:flex;align-items:center;padding:0 40px;gap:26px">

  P(`<div style="position:absolute;left:50px;top:60px;font:700 92px/1 O;color:#fff;text-transform:uppercase;text-shadow:0 6px 0 #000">Блогеры</div>

     <div style="position:absolute;left:0;right:0;top:230px;text-align:center;font:900 220px/1 Unb;letter-spacing:-.06em;font-style:italic;color:#ffe95c;transform:skewX(-10deg);-webkit-text-stroke:10px #111;paint-order:stroke fill;text-shadow:0 12px 0 #111">VS</div>`);

  bg.style.background = "#0a8f8f";
  P(`<div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 2px,transparent 2px);background-size:26px 26px"></div>`);
  const win = (x, y, w, title, body, btns, icon, fs = 34) => `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;background:#c3c3c3;border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:10px 14px 0 rgba(0,0,0,.35)">
     <div style="background:linear-gradient(90deg,#0a1f8f,#2b6fd6);color:#fff;font:700 24px/1 GM;padding:10px 12px;display:flex;justify-content:space-between;align-items:center">${title}<span style="background:#c3c3c3;color:#111;border:3px solid;border-color:#fff #555 #555 #fff;padding:0 8px;font:700 22px GM">×</span></div>
     <div style="display:flex;gap:24px;padding:26px 28px 10px;align-items:center">${icon}<div style="font:700 ${fs}px/1.25 GM;color:#111">${body}</div></div>
     <div style="display:flex;gap:22px;justify-content:center;padding:10px 0 24px">${btns.map(b => `<div style="min-width:150px;text-align:center;padding:10px 18px;border:4px solid;border-color:#fff #333 #333 #fff;font:700 30px GM;color:#111">${b}</div>`).join("")}</div></div>`;
  const ix = `<svg width="90" height="90" viewBox="0 0 90 90" style="flex:none"><circle cx="45" cy="45" r="40" fill="#e01b1b" stroke="#7a0000" stroke-width="4"/><path d="M28 28 L62 62 M62 28 L28 62" stroke="#fff" stroke-width="11" stroke-linecap="round"/></svg>`;
  P(card("ya", 860, 70, 10, .8, false));
  P(win(90, 300, 900, "Кредитка.exe", "Доход «15 000 ₽ в месяц»<br>не найден.", ["ОК", "Пересчитать"], ix, 42));
  P(`<div style="position:absolute;left:44px;top:50px;font:900 120px/1 Unb;letter-spacing:-.06em;color:#fff;-webkit-text-stroke:8px #111;paint-order:stroke fill;text-shadow:0 12px 0 #111">15 000 ₽?</div>
     <div class="pl" style="left:50px;top:190px">в месяц на кредитке</div>`);
}

if (v === 6) {   // КОЛЛАЖ (формат-победитель №4): буквы «15 000?», карта на скотче, стикер «посчитал»
  bg.style.background = "#efe6d6";
  const tile = (ch, x, y, r, b, c, f) => `<div style="position:absolute;left:${x}px;top:${y}px;transform:rotate(${r}deg);background:${b};color:${c};font:${f};padding:6px 20px 14px;box-shadow:4px 8px 0 rgba(0,0,0,.18)">${ch}</div>`;
  P(`<div style="position:absolute;left:-40px;top:430px;width:760px;height:340px;background:#3ee08f;transform:rotate(-4deg);clip-path:polygon(0 8%,12% 0,30% 6%,52% 1%,70% 7%,88% 0,100% 6%,100% 100%,0 100%)"></div>
     <div style="position:absolute;left:760px;top:-60px;width:600px;height:360px;background:#ff5a5a;transform:rotate(7deg);clip-path:polygon(0 0,100% 0,100% 100%,84% 94%,66% 100%,44% 93%,22% 100%,0 92%)"></div>`);
  P(tile("1", 40, 40, -6, "#111", "#fff", "900 180px/1 Unb") + tile("5", 175, 60, 5, "#e5383b", "#fff", "700 190px/1 O") + tile("000", 300, 30, -3, "#fff", "#111", "900 170px/1 Unb") + tile("?", 640, 30, 8, "#ffd23f", "#111", "900 190px/1 Unb"));
  P(`<div style="position:absolute;left:60px;top:290px;font:600 italic 84px/1 PF;color:#111;transform:rotate(-3deg)">в месяц на кредитке</div>
     <div style="position:absolute;left:66px;top:480px;font:700 64px/1.05 O;color:#111;text-transform:uppercase;transform:rotate(-4deg)">честный<br>расчёт</div>`);
  const cut = (k, x, y, r, s) => card(k, x, y, r, s, false).replace('class="card" style="', 'class="card" style="box-shadow:0 0 0 10px #fff,8px 16px 0 rgba(0,0,0,.2);');
  P(cut("alfa", 830, 170, 9, .8) + cut("t", 800, 400, -7, .86));
  const tape = (x, y, r) => `<div style="position:absolute;left:${x}px;top:${y}px;width:150px;height:44px;background:rgba(255,240,170,.75);transform:rotate(${r}deg)"></div>`;
  P(tape(830, 150, -30) + tape(1150, 190, 35) + tape(780, 390, 25));
  P(`<div style="position:absolute;left:1030px;top:470px;width:210px;height:210px;border-radius:50%;background:#13a35a;color:#fff;transform:rotate(12deg);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 8px #fff,6px 12px 0 rgba(0,0,0,.2);text-align:center">
       <div style="font:700 34px/1 O;text-transform:uppercase">реально</div><div style="font:900 64px/1 Unb;letter-spacing:-.05em">???</div></div>`);
}
document.fonts.ready.then(() => { window.__ready = true; });
</script>
