<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Превью №5 — премиум</title>
<!-- Владелец 13.10: «сделай превью в новом варианте, представь что ты дизайнер, твоя работа стоит 1000 долларов за превью».
     Одна идея на кадр, один главный объект, свет и глубина, ≤ 5 слов, чтение в 168×94. Только 2D (CSS/SVG).
     v=1 «Разбитое обещание»: золотое «15 000 ₽» трескается и разлетается осколками; карта с бликом; «в месяц на кредитке?»
     v=2 «Деньги из карты»: из кредитки вырываются купюры; «+775 ₽ в месяц» (пример из сценария)
     v=3 «Стекло»: матовая стеклянная карта на цветном свете, «15,5 %» и «+6 800 ₽ в год» (пример)
     Снимок из youtube/: node kit/shot3d.js 05-credit-card-earn/thumb/premium.html 05-credit-card-earn/thumb/p1.png 1280 720 v=1 -->
<style>
  @font-face { font-family: "O"; src: url("../../kit/fonts/oswald-cyrillic-700.woff2"); font-weight: 700; unicode-range: U+0400-045F, U+2116; }
  @font-face { font-family: "O"; src: url("../../kit/fonts/oswald-latin-700.woff2"); font-weight: 700; }
  @font-face { font-family: "I"; src: url("../../kit/fonts/inter-cyrillic-700.woff2"); font-weight: 700; unicode-range: U+0400-045F, U+2116; }
  @font-face { font-family: "I"; src: url("../../kit/fonts/inter-latin-700.woff2"); font-weight: 700; }
  @font-face { font-family: "I"; src: url("../../kit/fonts/inter-cyrillic-600.woff2"); font-weight: 600; unicode-range: U+0400-045F, U+2116; }
  @font-face { font-family: "I"; src: url("../../kit/fonts/inter-latin-600.woff2"); font-weight: 600; }
  @font-face { font-family: "Unb"; src: url("../../kit/fonts/Unbounded.ttf"); font-weight: 200 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; font-family: "I"; -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .14; mix-blend-mode: overlay; z-index: 50;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .vig { position: absolute; inset: 0; pointer-events: none; z-index: 49; background: radial-gradient(130% 110% at 50% 45%, transparent 55%, rgba(0,0,0,.75) 100%); }

  /* карта: глубина, блик, тиснение */
  .card { position: absolute; width: 520px; height: 328px; border-radius: 28px; overflow: hidden; }
  .card .base { position: absolute; inset: 0; }
  .card .tex { position: absolute; inset: 0; opacity: .22; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .card .sheen { position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.34) 46%, rgba(255,255,255,.06) 52%, transparent 60%); }
  .card .edge { position: absolute; inset: 0; border-radius: 28px; box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.12); }
  .chip { position: absolute; left: 44px; top: 128px; width: 76px; height: 58px; border-radius: 11px;
    background: linear-gradient(135deg, #fff4c4 0%, #d9b45a 30%, #8c6a1f 52%, #f1d98a 70%, #b38a2e 100%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), 0 2px 3px rgba(0,0,0,.35); }
  .chip::before { content: ""; position: absolute; inset: 10px 8px; border-radius: 6px;
    background: repeating-linear-gradient(90deg, transparent 0 15px, rgba(70,50,10,.45) 15px 17px), repeating-linear-gradient(0deg, transparent 0 12px, rgba(70,50,10,.45) 12px 14px); }
  .num { position: absolute; left: 44px; top: 214px; font: 600 30px "I"; letter-spacing: .16em; color: #f6f6f6;
    text-shadow: 0 1px 0 rgba(255,255,255,.55), 0 -1px 0 rgba(0,0,0,.45), 0 2px 3px rgba(0,0,0,.35); }
  .mir { position: absolute; right: 38px; bottom: 30px; font: 700 34px "I"; letter-spacing: .02em; color: #fff; text-shadow: 0 2px 3px rgba(0,0,0,.3); }
  .nfc { position: absolute; left: 140px; top: 136px; }

  .gold { background: linear-gradient(180deg, #fffbe9 0%, #ffe9a3 22%, #f5c242 44%, #a8740f 52%, #ffd65c 66%, #fff3c4 84%, #c99328 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div id="R"></div><div class="vig"></div><div class="grain"></div>
<script>
const v = +(new URLSearchParams(location.search).get("v") || 1);
const R = document.getElementById("R");
const P = (h) => R.insertAdjacentHTML("beforeend", h);
const nfc = `<svg class="nfc" width="40" height="44" viewBox="0 0 40 44">${[9, 16, 23].map(r => `<path d="M${6 + r * .3} ${22 - r * .62} A ${r} ${r} 0 0 1 ${6 + r * .3} ${22 + r * .62}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="3.4" stroke-linecap="round"/>`).join("")}</svg>`;
const LOGO = { alfa: "../../assets/logos/alfa.svg", t: "../../assets/logos/tbank.svg" };
// карта: фон, логотип (белым), положение, поворот, масштаб, свет (цвет контурной подсветки)
const card = ({ bg, logo, x, y, r = 0, s = 1, rim = "rgba(255,255,255,.0)", shadow = "0 50px 80px rgba(0,0,0,.6), 0 18px 30px rgba(0,0,0,.45)", z = 5 }) => `
  <div class="card" style="left:${x}px;top:${y}px;transform:rotate(${r}deg) scale(${s});box-shadow:${shadow}, 0 0 0 1.5px ${rim}, 0 0 60px ${rim};z-index:${z}">
    <div class="base" style="background:${bg}"></div><div class="tex"></div><div class="sheen"></div>
    <img src="${LOGO[logo]}" style="position:absolute;left:44px;top:40px;height:${logo === "alfa" ? 40 : 46}px;filter:brightness(0) invert(1) drop-shadow(0 2px 2px rgba(0,0,0,.3))">
    <div class="chip"></div>${nfc}<div class="num">2200 •••• •••• 2026</div><div class="mir">МИР</div><div class="edge"></div></div>`;
const ALFA = "radial-gradient(120% 140% at 15% 0%, #ff6a5c 0%, #ef3124 38%, #b8160d 75%, #7d0b05 100%)";
const TB = "radial-gradient(120% 140% at 15% 0%, #3a3b40 0%, #1c1d21 45%, #0b0b0d 100%)";
const MINT = "radial-gradient(120% 140% at 15% 0%, #9cf7c9 0%, #2fd389 35%, #0e9b58 75%, #06603a 100%)";

if (v === 1) {   // «РАЗБИТОЕ ОБЕЩАНИЕ»
  P(`<div class="abs" style="inset:0;background:radial-gradient(1000px 640px at 55% 22%, #26384f 0%, #111a26 45%, #05070b 100%)"></div>
     <div class="abs" style="left:300px;top:-260px;width:1000px;height:900px;background:conic-gradient(from 180deg at 50% 0%, transparent 0deg, rgba(255,214,120,.12) 14deg, transparent 34deg);filter:blur(14px)"></div>
     <div class="abs" style="left:-160px;top:380px;width:760px;height:460px;border-radius:50%;background:radial-gradient(circle, rgba(239,49,36,.38), transparent 65%);filter:blur(24px)"></div>`);
  // «15 000 ₽» во всю ширину: целое «15 00», трескается последний «0» и «₽»
  const W = 1180, H = 230, X = 40, Y = 34;
  const T = (clip, dx, dy, rot, op = 1, blur = 0, main = false) => `<div class="abs" style="left:${X}px;top:${Y}px;width:${W}px;height:${H}px;clip-path:polygon(${clip});transform:translate(${dx}px,${dy}px) rotate(${rot}deg);transform-origin:78% 50%;opacity:${op};${main ? "filter:drop-shadow(0 4px 0 #6b4a06) drop-shadow(0 22px 26px rgba(0,0,0,.65));" : ""}z-index:8">
      <div class="gold" style="font:900 188px/${H}px Unb;letter-spacing:-.075em;white-space:nowrap">15 000 ₽</div></div>`;
  P(`<div class="abs" style="left:${X}px;top:${Y + 22}px;font:900 188px/${H}px Unb;letter-spacing:-.075em;white-space:nowrap;color:rgba(0,0,0,.55);filter:blur(16px);z-index:7">15 000 ₽</div>`);
  P(T("0 0, 66% 0, 65% 40%, 67% 62%, 65.5% 100%, 0 100%", 0, 0, 0, 1, 0, true)
    + T("66% 0, 74% 0, 72% 30%, 67% 62%, 65% 40%", 8, -6, 3)
    + T("67% 62%, 72% 30%, 77% 50%, 73% 100%, 65.5% 100%", 12, 8, -3)
    + T("74% 0, 82% 0, 80% 40%, 77% 50%, 72% 30%", 26, -18, 7)
    + T("77% 50%, 80% 40%, 87% 58%, 84% 100%, 73% 100%", 34, 14, -8)
    + T("82% 0, 90% 0, 90% 34%, 87% 58%, 80% 40%", 58, -30, 12, .97)
    + T("87% 58%, 90% 34%, 96% 60%, 93% 100%, 84% 100%", 70, 22, -13, .95));
  const shard = (x, y, w, h, r, o, bl = 0) => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${r}deg);opacity:${o};z-index:9;background:linear-gradient(135deg,#fff6d0,#e6b245 55%,#7a5208);clip-path:polygon(0 30%,60% 0,100% 70%,35% 100%);filter:blur(${bl}px) drop-shadow(0 6px 8px rgba(0,0,0,.5))"></div>`;
  P(shard(1195, 40, 30, 22, 20, .95) + shard(1235, 120, 20, 16, -30, .85) + shard(1160, 250, 26, 18, 50, .9) + shard(1245, 220, 14, 11, 10, .7, 1) + shard(1120, 12, 16, 12, -15, .75, 1) + shard(1215, 300, 11, 9, 40, .6, 1.5));
  // карта
  P(card({ bg: ALFA, logo: "alfa", x: 40, y: 330, r: -10, s: .98, rim: "rgba(255,190,120,.35)", z: 5 }));
  // подпись справа от карты
  P(`<div class="abs" style="left:640px;top:318px;z-index:10;font:700 80px/1 O;letter-spacing:.005em;color:#fff;text-transform:uppercase;text-shadow:0 6px 18px rgba(0,0,0,.7)">в месяц<br>на кредитке<span style="color:#ffcf4a">?</span></div>
     <div class="abs" style="left:644px;top:500px;width:430px;height:6px;border-radius:3px;background:linear-gradient(90deg,#ffcf4a,rgba(255,207,74,0));z-index:10"></div>`);
}

if (v === 2) {   // «ДЕНЬГИ ИЗ КАРТЫ»
  P(`<div class="abs" style="inset:0;background:radial-gradient(900px 700px at 30% 55%, #0f5a37 0%, #082a1c 45%, #030806 100%)"></div>
     <div class="abs" style="left:60px;top:120px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle, rgba(80,255,170,.35), transparent 62%);filter:blur(30px)"></div>`);
  const note = (x, y, r, o = 1, bl = 0, s = 1) => `<div class="abs" style="left:${x}px;top:${y}px;width:330px;height:150px;transform:rotate(${r}deg) scale(${s});opacity:${o};filter:blur(${bl}px) drop-shadow(0 20px 26px rgba(0,0,0,.55));border-radius:8px;overflow:hidden;
      background:linear-gradient(120deg,#f8c39c 0%,#ef9563 35%,#d96c37 70%,#f3b086 100%)">
      <div class="abs" style="inset:10px;border:2px solid rgba(110,40,10,.35);border-radius:4px"></div>
      <div class="abs" style="left:20px;top:16px;font:900 42px/1 Unb;letter-spacing:-.04em;color:#6e2a0a">5000</div>
      <div class="abs" style="right:22px;bottom:12px;font:900 58px/1 Unb;color:rgba(110,40,10,.45)">₽</div>
      <div class="abs" style="left:150px;top:24px;width:120px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.45),transparent 68%)"></div>
      <div class="abs" style="inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%)"></div></div>`;
  // шлейф купюр из верхнего края карты
  P(note(250, 70, -34, .35, 4, .8) + note(300, 40, -22, .55, 2, .85) + note(170, 150, -48, .5, 3, .8) + note(330, 110, -12, .9, 0, .92) + note(220, 200, -30, 1, 0, .95) + note(380, 190, 4, 1, 0, .95));
  P(card({ bg: ALFA, logo: "alfa", x: 110, y: 330, r: -8, s: 1.02, rim: "rgba(120,255,190,.35)", z: 6 }));
  const coin = (x, y, d, bl = 0) => `<div class="abs" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;border-radius:50%;filter:blur(${bl}px) drop-shadow(0 10px 14px rgba(0,0,0,.5));
      background:radial-gradient(circle at 34% 28%,#fffbe0 0%,#ffe27a 28%,#e2a514 62%,#8f6006 100%);box-shadow:inset 0 0 0 ${d * .07}px rgba(255,240,180,.45)">
      <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font:900 ${d * .5}px Unb;color:#8a5a05;text-shadow:0 1px 0 #ffeaa0">₽</div></div>`;
  P(coin(620, 120, 70) + coin(600, 610, 50, 1.5) + coin(40, 250, 46, 2) + coin(680, 400, 40, 3));
  P(`<div class="abs" style="left:700px;top:150px;font:900 210px/1 Unb;letter-spacing:-.08em;color:#fff;background:linear-gradient(180deg,#ffffff 0%,#d9ffe9 45%,#57f0a2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(87,240,162,.45)) drop-shadow(0 16px 20px rgba(0,0,0,.6))">+775</div>
     <div class="abs" style="left:712px;top:375px;font:700 64px/1 O;color:#fff;text-transform:uppercase;text-shadow:0 6px 16px rgba(0,0,0,.6)">₽ каждый месяц</div>
     <div class="abs" style="left:714px;top:465px;padding:10px 20px 12px;border-radius:12px;background:#ffd34d;font:700 34px/1 O;color:#111;text-transform:uppercase">на деньгах банка</div>
     <div class="abs" style="left:716px;top:540px;font:600 18px I;color:rgba(255,255,255,.55)">пример · условия на 13.10.2026</div>`);
}

if (v === 3) {   // «СТЕКЛО»
  P(`<div class="abs" style="inset:0;background:#0b0618"></div>
     <div class="abs" style="left:-100px;top:-120px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,#7b3fff,transparent 65%);filter:blur(30px)"></div>
     <div class="abs" style="left:520px;top:180px;width:820px;height:700px;border-radius:50%;background:radial-gradient(circle,#ff3d7f,transparent 62%);filter:blur(36px)"></div>
     <div class="abs" style="left:880px;top:-160px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,#ffb03a,transparent 62%);filter:blur(36px)"></div>
     <div class="abs" style="left:300px;top:380px;width:520px;height:420px;border-radius:50%;background:radial-gradient(circle,#2fd389,transparent 62%);filter:blur(40px);opacity:.8"></div>`);
  // стеклянная карта
  P(`<div class="abs" style="left:610px;top:120px;width:600px;height:378px;border-radius:34px;transform:rotate(-8deg);overflow:hidden;
       background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.08));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
       box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 0 0 1.5px rgba(255,255,255,.35),0 40px 80px rgba(0,0,0,.5)">
       <div class="abs" style="inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 48%,transparent 56%)"></div>
       <div class="chip" style="left:48px;top:58px"></div>
       <div class="abs" style="left:46px;top:150px;font:900 118px/1 Unb;letter-spacing:-.07em;color:#fff;text-shadow:0 4px 20px rgba(80,0,60,.35)">15,5%</div>
       <div class="abs" style="left:50px;top:300px;font:600 24px I;letter-spacing:.14em;color:rgba(255,255,255,.85)">НАКОПИТЕЛЬНЫЙ СЧЁТ</div></div>`);
  P(card({ bg: TB, logo: "t", x: 690, y: 430, r: 6, s: .62, rim: "rgba(255,255,255,.2)", z: 6 }));
  P(`<div class="abs" style="left:56px;top:110px;font:900 112px/1 Unb;letter-spacing:-.07em;color:#fff;text-shadow:0 10px 30px rgba(0,0,0,.45)">+6 800 ₽</div>
     <div class="abs" style="left:62px;top:262px;font:700 68px/1 O;color:#fff;text-transform:uppercase;text-shadow:0 6px 18px rgba(0,0,0,.45)">в год за кредитку</div>
     <div class="abs" style="left:64px;top:360px;padding:10px 20px 12px;border-radius:14px;background:rgba(255,255,255,.92);font:700 34px/1 O;color:#111;text-transform:uppercase">а не 15 000 в месяц</div>
     <div class="abs" style="left:66px;top:640px;font:600 18px I;color:rgba(255,255,255,.6)">пример · траты 30 000 ₽/мес · условия на 13.10.2026</div>`);
}
Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))]).then(() => { window.__ready = true; });
</script>
</body>
</html>
