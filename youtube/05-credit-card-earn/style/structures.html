     Не палитра, а грамматика кадра. Один и тот же фрагмент голоса («тратишь 30 000 → платишь кредиткой, деньги на счёте → под 15,5 % →
     ≈ 388 ₽ в месяц») в 5 структурах, по 4 кадра-раскадровки с подписью движения:
       s=1 «Предметная съёмка» — каждая фраза = один предмет крупным планом, почти без текста
       s=2 «Бесконечный холст» — схема-карта, камера летает по стрелкам между узлами
       s=3 «Кинетическая типографика» — голос превращается в огромные слова и цифры на весь кадр
       s=4 «Жизнь в экране» — всё происходит в приложениях телефона: пуши, переводы, счета
       s=5 «Сплит-экран» — два мира рядом: «без схемы» и «со схемой», меняются синхронно

<script>
const q = new URLSearchParams(location.search), S = +(q.get("s") || 1), F = +(q.get("f") || 1);
const R = document.getElementById("R"), P = (h) => R.insertAdjacentHTML("beforeend", h);
const VO = ["«Допустим, ты тратишь тридцать тысяч в месяц…»", "«…платишь кредиткой, а свои деньги лежат на счёте…»", "«…под пятнадцать с половиной процентов…»", "«…это примерно триста девяносто рублей в месяц»"];
const sb = (n, t) => P(`<div class="vo">голос: ${VO[F - 1]}</div><div class="sb"><b>${n} · кадр ${F}/4</b><span>${t}</span></div>`);
const ALFA = "radial-gradient(120% 140% at 15% 0%, #ff6a5c 0%, #ef3124 38%, #b8160d 75%, #7d0b05 100%)";
const card = (x, y, r = 0, s = 1, extra = "") => `<div class="card" style="left:${x}px;top:${y}px;transform:rotate(${r}deg) scale(${s});${extra}"><div class="a" style="inset:0;background:${ALFA}"></div><div class="sheen"></div>
   <img src="../../assets/logos/alfa.svg" style="position:absolute;left:56px;top:50px;height:50px;filter:brightness(0) invert(1)"><div class="chip" style="left:56px;top:158px"></div>
   <div class="a" style="left:56px;top:266px;font:600 36px I;letter-spacing:.16em">2200 •••• •••• 2026</div><div class="a" style="right:46px;bottom:36px;font:700 42px I">МИР</div></div>`;
const coin = (x, y, d, bl = 0, r = 0) => `<div class="a" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;border-radius:50%;transform:rotate(${r}deg);filter:blur(${bl}px) drop-shadow(0 14px 18px rgba(0,0,0,.5));background:radial-gradient(circle at 34% 28%,#fffbe0 0%,#ffe27a 28%,#e2a514 62%,#8f6006 100%);display:flex;align-items:center;justify-content:center;font:900 ${d * .5}px Unb;color:#8a5a05;box-shadow:inset 0 0 0 ${d * .07}px rgba(255,240,180,.45)">₽</div>`;
const note = (x, y, r, s = 1, bl = 0) => `<div class="a" style="left:${x}px;top:${y}px;width:520px;height:236px;transform:rotate(${r}deg) scale(${s});filter:blur(${bl}px) drop-shadow(0 26px 30px rgba(0,0,0,.55));border-radius:10px;overflow:hidden;background:linear-gradient(120deg,#f8c39c 0%,#ef9563 35%,#d96c37 70%,#f3b086 100%)">
   <div class="a" style="inset:14px;border:3px solid rgba(110,40,10,.35);border-radius:6px"></div><div class="a" style="left:30px;top:22px;font:900 64px/1 Unb;color:#6e2a0a;letter-spacing:-.04em">5000</div>
   <div class="a" style="right:30px;bottom:16px;font:900 90px/1 Unb;color:rgba(110,40,10,.4)">₽</div><div class="a" style="left:230px;top:40px;width:190px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.45),transparent 68%)"></div></div>`;

/* ===== 1. ПРЕДМЕТНАЯ СЪЁМКА ===== */

  const N = "Предметная съёмка";

    P(note(260, 280, -14, 1.4, 3) + note(520, 330, -4, 1.5) + note(800, 380, 8, 1.6, 0) + note(1260, 200, 16, 1.3, 6));
    P(`<div class="a" style="left:120px;top:820px;font:900 120px/1 Unb;letter-spacing:-.06em">30 000 ₽</div><div class="a" style="left:128px;top:950px;font:600 30px I;color:#fff9">в месяц</div>`);
    sb(N, "Макро: веер купюр, камера медленно проезжает вдоль, глубина резкости. Одна подпись внизу — никаких списков."); }
  if (F === 2) { stage("#2a0c0a", "#0b0303");

  if (F === 3) { stage("#0e3324", "#03100a");
    P(`<div class="a" style="left:640px;top:120px;width:640px;height:740px;border-radius:60px 60px 90px 90px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.04) 30%,rgba(255,255,255,.02) 70%,rgba(255,255,255,.14));box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),0 50px 100px rgba(0,0,0,.6)"></div>`);
    for (let i = 0; i < 26; i++) P(coin(690 + (i % 5) * 108 + (Math.floor(i / 5) % 2) * 50, 760 - Math.floor(i / 5) * 70 - (i % 3) * 8, 120, 0, i * 13));
    P(coin(900, 40, 120, 0, 20) + coin(1060, -20, 90, 3));
    P(`<div class="a" style="left:700px;top:330px;width:520px;text-align:center;font:900 130px/1 Unb;letter-spacing:-.06em;color:#eafff3;text-shadow:0 0 40px rgba(87,240,162,.5)">15,5%</div>
       <div class="a" style="left:120px;top:880px;font:600 34px I;color:#fffa">накопительный счёт</div>`);
    sb(N, "Банка-копилка наполняется монетами под стук монет в звуке; на стекле — гравировка ставки. Монеты падают сверху в такт словам."); }
  if (F === 4) { stage("#1f3a2a", "#040a06");
    P(coin(760, 240, 420, 0, -12) + coin(300, 160, 120, 8) + coin(1520, 640, 160, 6) + coin(1400, 140, 80, 10));
    P(`<div class="a" style="left:0;right:0;top:720px;text-align:center;font:900 160px/1 Unb;letter-spacing:-.07em;background:linear-gradient(180deg,#fff,#d9ffe9 45%,#57f0a2);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(87,240,162,.45))">+388 ₽</div>`);
    sb(N, "Одна большая монета крутится в свете, камера наезжает; цифра «+388 ₽» поднимается снизу. Следующая склейка — «за год 3 400 ₽» на стопке монет."); }
}

/* ===== 2. БЕСКОНЕЧНЫЙ ХОЛСТ ===== */
if (S === 2) {
  const N = "Бесконечный холст";
  const cam = { 1: [1.6, 520, 330], 2: [1.0, 0, 0], 3: [1.7, -560, -150], 4: [.72, 0, 40] }[F];
  P(`<div class="a" style="inset:0;background:#0b0d14;background-image:radial-gradient(rgba(255,255,255,.12) 2px,transparent 2px);background-size:44px 44px"></div>`);
  const node = (x, y, w, h, t, v, c, sub = "") => `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:30px;background:#151a26;box-shadow:0 0 0 2px ${c}66,0 30px 60px rgba(0,0,0,.5),0 0 60px ${c}33;padding:30px 34px">
     <div style="font:600 26px I;color:#8a96b4">${t}</div><div style="font:800 52px/1.1 Unb;letter-spacing:-.04em;color:${c};margin-top:10px;white-space:nowrap">${v}</div><div style="font:600 24px I;color:#8a96b4;margin-top:10px">${sub}</div></div>`;
  const arrow = (d, c = "#ffffff55", lbl = "", lx = 0, ly = 0) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="14 12" marker-end="url(#ah)"/>${lbl ? `<text x="${lx}" y="${ly}" fill="#c9d2ea" font-family="I" font-weight="600" font-size="26">${lbl}</text>` : ""}`;
  P(`<div class="a" id="world" style="left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px;transform:translate(${cam[1]}px,${cam[2]}px) scale(${cam[0]})">
     <svg class="a" style="left:0;top:0" width="1920" height="1080"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#ffffffaa"/></marker></defs>
       ${arrow("M560 330 C 700 330, 760 250, 880 230", "#57f0a2aa", "свои деньги", 610, 280)}${arrow("M560 380 C 700 400, 760 560, 880 600", "#ff7a7aaa", "покупки", 620, 520)}
       ${arrow("M1260 300 C 1360 330, 1400 420, 1460 450", "#ffd34daa", "проценты", 1300, 360)}${arrow("M1160 640 C 1240 560, 1220 380, 1180 330", "#ffffff55", "гасишь в конце срока", 1210, 520)}</svg>
     ${node(170, 250, 390, 190, "Стипендия", "30 000 ₽", "#ffffff", "в месяц")}${node(880, 150, 380, 190, "Накопительный", "15,5 %", "#57f0a2", "лежит и растёт")}
     ${node(880, 520, 380, 190, "Кредитка", "−30 000", "#ff7a7a", "все покупки")}${node(1460, 380, 340, 190, "Тебе остаётся", "+388 ₽", "#ffd34d", "в месяц")}</div>`);
  const tx = { 1: "Старт крупно на узле «Стипендия 30 000 ₽»; узел собирается из линий.", 2: "Камера отъезжает: от узла рисуются две стрелки — «свои деньги» к счёту и «покупки» к кредитке.",
    3: "Перелёт по стрелке к узлу «Накопительный 15,5 %», внутри узла крутится счётчик.", 4: "Финальный отъезд: вся схема целиком, узел «+388 ₽» вспыхивает. Каждая следующая глава дорисовывает схему." }[F];
  sb(N, tx);
}

/* ===== 3. КИНЕТИЧЕСКАЯ ТИПОГРАФИКА ===== */
if (S === 3) {
  const N = "Кинетическая типографика";
  if (F === 1) { P(`<div class="a" style="inset:0;background:#0b0b0d"></div>
      <div class="a" style="left:60px;top:190px;font:600 60px I;color:#8d929c">допустим, ты тратишь</div>
      <div class="a" style="left:40px;top:260px;font:900 380px/1 Unb;letter-spacing:-.08em;color:#fff">30 000</div>
      <div class="a" style="left:1700px;top:300px;font:900 160px/1 Unb;color:#ffd34d">₽</div><div class="a" style="left:66px;top:700px;font:700 64px I;color:#fff">в месяц</div>`);
    sb(N, "Слова голоса появляются крупно по одному; «30 000» въезжает слева и заполняет кадр, ₽ «щёлкает» на ударении."); }
  if (F === 2) { P(`<div class="a" style="inset:0;background:#0b0b0d"></div>
      <div class="a" style="left:60px;top:120px;font:900 210px/1 Unb;letter-spacing:-.07em;color:#ff5a6e">КРЕДИТКОЙ</div>
      <div class="a" style="left:80px;top:360px;font:600 56px I;color:#8d929c">платишь — а свои деньги</div>
      <div class="a" style="left:60px;top:450px;font:900 210px/1 Unb;letter-spacing:-.07em;color:transparent;-webkit-text-stroke:5px #57f0a2">НА СЧЁТЕ</div>
      <div class="a" style="left:1300px;top:760px;font:600 40px I;color:#57f0a2">лежат и растут ↗</div>`);
    sb(N, "Две строки: «КРЕДИТКОЙ» сплошным красным, «НА СЧЁТЕ» контуром, который заливается зелёным, пока звучит фраза."); }
  if (F === 3) { P(`<div class="a" style="inset:0;background:#57f0a2"></div>
      <div class="a" style="left:0;right:0;top:120px;text-align:center;font:900 560px/1 Unb;letter-spacing:-.09em;color:#0b0b0d">15,5</div>
      <div class="a" style="left:0;right:0;top:700px;text-align:center;font:700 64px I;color:#0b0b0d">процентов годовых</div>`);
    sb(N, "Резкая смена фона на зелёный (вспышка), огромные «15,5» сжимаются из-за кадра. Каждая цифра — отдельный кадр-удар."); }
  if (F === 4) { P(`<div class="a" style="inset:0;background:#0b0b0d"></div>
      <div class="a" style="left:60px;top:150px;font:600 54px I;color:#8d929c">это примерно</div>
      <div class="a" style="left:40px;top:220px;font:900 420px/1 Unb;letter-spacing:-.08em;color:#57f0a2">388</div>
      <div class="a" style="left:1120px;top:440px;font:900 110px/1 Unb;color:#fff">₽ / мес</div>
      <div class="a" style="left:66px;top:720px;font:700 54px I;color:#ffd34d">за год ≈ 3 400 ₽</div>`);
    sb(N, "Счётчик «388» набегает, ₽/мес прилетает справа, под ним появляется годовая сумма. Без карточек и панелей — только текст и ритм."); }
}

/* ===== 4. ЖИЗНЬ В ЭКРАНЕ ===== */
if (S === 4) {
  const N = "Жизнь в экране";
  P(`<div class="a" style="inset:0;background:radial-gradient(1400px 900px at 50% 40%, #1d1f2a, #08090d 70%)"></div>`);
  const phone = (x, y, r, inner, s = 1) => `<div class="a" style="left:${x}px;top:${y}px;width:500px;height:1000px;border-radius:76px;transform:rotate(${r}deg) scale(${s});background:#0d0d11;box-shadow:0 0 0 12px #1c1c22,0 0 0 14px #3a3a44,0 70px 120px rgba(0,0,0,.7);overflow:hidden">
     <div class="a" style="left:180px;top:22px;width:140px;height:40px;border-radius:20px;background:#000;z-index:3"></div>${inner}</div>`;
  if (F === 1) { P(phone(710, 40, 0, `<div class="a" style="inset:0;background:linear-gradient(180deg,#2b1e5a,#0d0d11 70%)"></div>
      <div class="a" style="left:40px;top:120px;font:600 26px I;color:#fff9">Обычная карта</div><div class="a" style="left:36px;top:160px;font:800 80px I;letter-spacing:-.04em">30 000 ₽</div>
      <div class="a" style="left:24px;top:300px;right:24px;padding:24px;border-radius:28px;background:rgba(255,255,255,.92);color:#111"><div style="font:600 20px I;color:#666">БАНК · сейчас</div><div style="font:700 28px I;margin-top:6px">Зачисление стипендии +30 000 ₽</div></div>`));
    P(`<div class="a" style="left:1300px;top:420px;font:700 44px I;color:#fffa">тап по пушу →</div>`);
    sb(N, "Экран телефона на весь кадр: приходит пуш о стипендии, палец-курсор тапает — переход внутрь приложения."); }
  if (F === 2) { P(phone(360, 40, -4, `<div class="a" style="inset:0;background:#0d0d11"></div><div class="a" style="left:40px;top:110px;font:700 40px I">Перевод себе</div>
      <div class="a" style="left:40px;top:200px;right:40px;padding:26px;border-radius:26px;background:#1b1b22"><div style="font:600 22px I;color:#8a8a94">Куда</div><div style="font:700 32px I;margin-top:6px">Накопительный счёт</div></div>
      <div class="a" style="left:40px;top:360px;font:800 96px I;letter-spacing:-.04em">30 000 ₽</div>
      <div class="a" style="left:40px;bottom:80px;right:40px;height:110px;border-radius:30px;background:#57f0a2;color:#06341c;display:flex;align-items:center;justify-content:center;font:700 38px I">Перевести</div>`, .95)
      + phone(1060, 60, 5, `<div class="a" style="inset:0;background:linear-gradient(180deg,#3a0f16,#0d0d11 60%)"></div><div class="a" style="left:40px;top:110px;font:600 26px I;color:#fff9">Кредитка</div>
      <div class="a" style="left:36px;top:150px;font:800 80px I;letter-spacing:-.04em">−2 340 ₽</div><div class="a" style="left:40px;top:260px;font:600 26px I;color:#fff9">Продукты · кофе · проезд</div>`, .95));
    sb(N, "Свайп: слева перевод «на накопительный», справа появляется второй экран — кредитка и первые покупки. Два телефона «разговаривают»."); }
