<style>

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const W = 1280, H = 720, PR = 2;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(PR); r.setSize(W, H);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = .9;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(r.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050506);
const pm = new THREE.PMREMGenerator(r);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.38;

const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
cam.position.set(-0.4, 1.55, 13.2); cam.lookAt(1.55, -0.3, 0);

// ---------- процедурные текстуры: шлифовка металла (радиальная и линейная), шум бетона ----------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function canvasTex(w, h, draw, repeat = 1) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = 8; return t;
}
const brushedRadial = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = "#8a8a8a"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { const rr = rnd() * w * .5, v = 110 + rnd() * 70; g.strokeStyle = `rgba(${v},${v},${v},.35)`; g.lineWidth = .6 + rnd();
    g.beginPath(); g.arc(w / 2, h / 2, rr, rnd() * 6.28, rnd() * 6.28 + .5 + rnd() * 2); g.stroke(); }
});
const brushedLin = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#909090"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1800; i++) { const y = rnd() * h, v = 100 + rnd() * 90; g.fillStyle = `rgba(${v},${v},${v},.35)`; g.fillRect(0, y, w, .5 + rnd() * 1.2); }
}, 2);
const concrete = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#7a7a7a"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26000; i++) { const v = 90 + rnd() * 90; g.fillStyle = `rgba(${v},${v},${v},.25)`; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2); }
}, 3);

// ---------- материалы ----------
const steel = new THREE.MeshPhysicalMaterial({ color: 0x8f98a2, metalness: 1, roughness: .36, roughnessMap: brushedRadial, clearcoat: .3, clearcoatRoughness: .25 });
const steelLin = new THREE.MeshPhysicalMaterial({ color: 0x7e8792, metalness: 1, roughness: .42, roughnessMap: brushedLin });
const chrome = new THREE.MeshPhysicalMaterial({ color: 0xc8d0d8, metalness: 1, roughness: .16, clearcoat: 1, clearcoatRoughness: .05 });
const darkSteel = new THREE.MeshStandardMaterial({ color: 0x2a2f36, metalness: .85, roughness: .45, roughnessMap: brushedLin });
const wallMat = new THREE.MeshStandardMaterial({ color: 0x1c2026, metalness: .55, roughness: .7, roughnessMap: concrete, bumpMap: concrete, bumpScale: .6 });
const floorMat = new THREE.MeshStandardMaterial({ color: 0x15171a, metalness: .35, roughness: .38, roughnessMap: concrete });
const gold = new THREE.MeshPhysicalMaterial({ color: 0xffc23a, metalness: 1, roughness: .2, clearcoat: .4, clearcoatRoughness: .2 });
const goldDim = new THREE.MeshPhysicalMaterial({ color: 0xe0a020, metalness: 1, roughness: .3 });
const tunnelMat = new THREE.MeshStandardMaterial({ color: 0x8a7a55, metalness: .9, roughness: .35, roughnessMap: brushedLin, side: THREE.BackSide });

const C = new THREE.Vector3(2.3, 0.15, 0);   // центр проёма
const R0 = 1.85, DEPTH = 2.6, FLOOR = -2.55;

// ---------- стена с круглым проёмом (Shape с отверстием → выдавливание) ----------
const wallShape = new THREE.Shape(); wallShape.moveTo(-12, FLOOR); wallShape.lineTo(14, FLOOR); wallShape.lineTo(14, 8); wallShape.lineTo(-12, 8); wallShape.lineTo(-12, FLOOR);
const hole = new THREE.Path(); hole.absarc(C.x, C.y, R0 + .35, 0, Math.PI * 2, true); wallShape.holes.push(hole);
const wall = new THREE.Mesh(new THREE.ExtrudeGeometry(wallShape, { depth: .6, bevelEnabled: false, curveSegments: 96 }), wallMat);
wall.position.z = -.6; wall.receiveShadow = true; scene.add(wall);
// швы панелей на стене
for (const x of [-6, -2.6, 7.2, 10.5]) { const s = new THREE.Mesh(new THREE.BoxGeometry(.04, 12, .02), darkSteel); s.position.set(x, 2, .01); scene.add(s); }
for (const y of [4.6]) { const s = new THREE.Mesh(new THREE.BoxGeometry(30, .04, .02), darkSteel); s.position.set(0, y, .01); scene.add(s); }

// ---------- массивная рама проёма (профиль вращения) ----------
const prof = [[R0 + .35, -.6], [R0 + .35, .05], [R0 + .55, .05], [R0 + .62, .16], [R0 + .55, .28], [R0 + .12, .28], [R0 + .02, .18], [R0, .05], [R0, -.6]].map(([x, y]) => new THREE.Vector2(x, y));
const frame = new THREE.Mesh(new THREE.LatheGeometry(prof, 160), steelLin);
frame.rotation.x = Math.PI / 2; frame.position.copy(C); frame.castShadow = frame.receiveShadow = true; scene.add(frame);
// заклёпки по раме
for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2, m = new THREE.Mesh(new THREE.SphereGeometry(.055, 16, 12), chrome);
  m.position.set(C.x + Math.cos(a) * (R0 + .44), C.y + Math.sin(a) * (R0 + .44), .29); m.scale.z = .5; scene.add(m); }

// ---------- тоннель хранилища и задняя стенка ----------
const tunnel = new THREE.Mesh(new THREE.CylinderGeometry(R0, R0, DEPTH, 96, 1, true), tunnelMat);
tunnel.rotation.x = Math.PI / 2; tunnel.position.set(C.x, C.y, -.6 - DEPTH / 2); tunnel.receiveShadow = true; scene.add(tunnel);
const back = new THREE.Mesh(new THREE.CircleGeometry(R0, 96), new THREE.MeshStandardMaterial({ color: 0x5a4a28, metalness: .8, roughness: .5 }));
back.position.set(C.x, C.y, -.6 - DEPTH + .01); scene.add(back);
// полка внутри (пол хранилища)
const shelf = new THREE.Mesh(new THREE.BoxGeometry(R0 * 1.8, .08, DEPTH), darkSteel);
shelf.position.set(C.x, C.y - R0 * .42, -.6 - DEPTH / 2); shelf.receiveShadow = true; scene.add(shelf);
const shelfY = C.y - R0 * .42 + .04;

// ---------- золото внутри: пирамида слитков, столбики монет, карта «+1 000 ₽» ----------
const barGeo = new RoundedBoxGeometry(.8, .26, .38, 3, .05);
const bars = [];
const rows = [[-.66, 0, .66, -.33, .33], [-.33, .33, 0], [0]];
rows[0] = [-.99, -.33, .33, .99]; rows[1] = [-.66, 0, .66]; rows[2] = [-.33, .33]; rows.push([0]);
rows.forEach((xs, lvl) => xs.forEach(x => { for (const zz of [-2.25, -1.9]) {
  const b = new THREE.Mesh(barGeo, gold); b.position.set(C.x + .25 + x * 1.25, shelfY + .13 + lvl * .26, zz + .3 + (lvl % 2) * .04); b.rotation.y = (rnd() - .5) * .06;
  b.castShadow = b.receiveShadow = true; scene.add(b); bars.push(b); } }));
// ---------- монеты: рифлёное ребро, выпуклый кант и «₽» (bump), золото ----------
const faceCanvas = (relief) => canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = relief ? "#808080" : "#d9a42a"; g.fillRect(0, 0, w, h);
  const ring = (r, lw, c) => { g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); g.arc(w / 2, h / 2, r, 0, 6.283); g.stroke(); };
  ring(238, 26, relief ? "#ffffff" : "#ffe08a");                 // кант
  for (let i = 0; i < 72; i++) { const a = i / 72 * 6.283; g.fillStyle = relief ? "#e0e0e0" : "#f5c95a"; g.beginPath(); g.arc(w / 2 + Math.cos(a) * 205, h / 2 + Math.sin(a) * 205, 4, 0, 6.283); g.fill(); }
  ring(190, 4, relief ? "#c8c8c8" : "#c88f1c");
  g.fillStyle = relief ? "#ffffff" : "#ffd25a"; g.font = "900 230px Unb"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("₽", w / 2 + 6, h / 2 + 10);
});
const sideCanvas = (relief) => canvasTex(1024, 32, (g, w, h) => { g.fillStyle = relief ? "#606060" : "#c99325"; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 8) { g.fillStyle = relief ? "#ffffff" : "#ffd870"; g.fillRect(x, 0, 4, h); } });
await document.fonts.load("900 230px Unb");
const coinFaceMat = new THREE.MeshPhysicalMaterial({ color: 0xffd36a, map: faceCanvas(false), bumpMap: faceCanvas(true), bumpScale: 2.2, metalness: 1, roughness: .24, clearcoat: .3 });
coinFaceMat.map.colorSpace = THREE.SRGBColorSpace; coinFaceMat.map.repeat.set(1, 1); coinFaceMat.bumpMap.repeat.set(1, 1);
const coinSideMat = new THREE.MeshPhysicalMaterial({ color: 0xffcf60, map: sideCanvas(false), bumpMap: sideCanvas(true), bumpScale: 1.5, metalness: 1, roughness: .3 });
coinSideMat.map.colorSpace = THREE.SRGBColorSpace; coinSideMat.map.repeat.set(1, 1); coinSideMat.bumpMap.repeat.set(1, 1);
const CR = .2, CT = .045;
const coinGeo = new THREE.CylinderGeometry(CR, CR, CT, 72);
const coinMats = [coinSideMat, coinFaceMat, coinFaceMat];
function coin(x, y, z, rx = 0, ry = 0, rz = 0) { const c = new THREE.Mesh(coinGeo, coinMats); c.position.set(x, y, z); c.rotation.set(rx, ry, rz); c.castShadow = c.receiveShadow = true; scene.add(c); return c; }
function stack(x, z, n, y0 = shelfY) { for (let i = 0; i < n; i++) coin(x + (rnd() - .5) * .025, y0 + CT / 2 + i * CT * 1.02, z + (rnd() - .5) * .025, 0, rnd() * 6); }
stack(C.x - 1.25, -1.35, 9); stack(C.x - .98, -1.1, 6); stack(C.x + 1.25, -1.3, 12); stack(C.x + 1.0, -1.05, 5); stack(C.x + .62, -.62, 4);

// ---------- карта: настоящая банковская — пропорции 85,6×54, скругление, чип с контактами, бесконтакт, выпуклые цифры ----------
const CW = 2048, CH = 1292;
const drawCard = (relief) => (g, w, h) => {
  if (!relief) { const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, "#f7e3a0"); gr.addColorStop(.3, "#e9c35a"); gr.addColorStop(.62, "#c99327"); gr.addColorStop(1, "#9a6a10");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    // тонкий узор-гильош
    g.strokeStyle = "rgba(255,245,210,.10)"; g.lineWidth = 2; for (let i = 0; i < 40; i++) { g.beginPath(); g.ellipse(w * .78, h * .2, 200 + i * 26, 120 + i * 18, -.4, 0, 6.283); g.stroke(); }
  } else { g.fillStyle = "#808080"; g.fillRect(0, 0, w, h); }
  // чип: золото, контактные площадки
  if (!relief) { const cg = g.createLinearGradient(170, 330, 450, 540); cg.addColorStop(0, "#fbeab0"); cg.addColorStop(.5, "#c9a24a"); cg.addColorStop(1, "#f0d48a");
    g.fillStyle = cg; g.beginPath(); g.roundRect(170, 330, 280, 215, 34); g.fill();
    g.strokeStyle = "rgba(110,75,10,.75)"; g.lineWidth = 6;
    g.beginPath(); g.moveTo(170, 400); g.lineTo(265, 400); g.moveTo(170, 475); g.lineTo(265, 475); g.moveTo(355, 400); g.lineTo(450, 400); g.moveTo(355, 475); g.lineTo(450, 475);
    g.moveTo(265, 330); g.lineTo(265, 545); g.moveTo(355, 330); g.lineTo(355, 545); g.rect(265, 400, 90, 75); g.stroke(); }
  // бесконтактная оплата
  g.strokeStyle = relief ? "#c0c0c0" : "rgba(70,45,5,.75)"; g.lineWidth = 14; g.lineCap = "round";
  for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(520, 437, 34 + i * 30, -.75, .75); g.stroke(); }
  // надписи
  g.textBaseline = "alphabetic";
  g.fillStyle = relief ? "#909090" : "rgba(60,35,0,.8)"; g.font = "800 64px Mont"; g.fillText("БОНУС НОВОМУ КЛИЕНТУ", 170, 220);
  g.fillStyle = relief ? "#ffffff" : "#3a2400"; g.font = "900 250px Unb"; g.fillText("+1 000 ₽", 150, 860);
  g.font = "800 92px Mono"; g.fillStyle = relief ? "#f0f0f0" : "#fff3c8"; g.fillText("2200  0000  1000  2026", 170, 1060);
  g.font = "700 54px Mono"; g.fillText("10/29", 170, 1180);
  // абстрактный знак (не логотип реальной платёжной системы)
  if (!relief) { g.fillStyle = "rgba(255,248,220,.85)"; g.beginPath(); g.moveTo(1700, 1180); g.lineTo(1800, 1020); g.lineTo(1900, 1180); g.closePath(); g.fill();
    g.fillStyle = "rgba(90,60,10,.6)"; g.beginPath(); g.moveTo(1760, 1180); g.lineTo(1860, 1020); g.lineTo(1960, 1180); g.closePath(); g.fill(); }
};
await document.fonts.load("800 92px Mono"); await document.fonts.load("900 250px Unb"); await document.fonts.load("800 64px Mont");
const cardMap = canvasTex(CW, CH, drawCard(false)), cardBump = canvasTex(CW, CH, drawCard(true));
for (const t of [cardMap, cardBump]) t.repeat.set(1, 1); cardMap.colorSpace = THREE.SRGBColorSpace;
const cardW = 1.712, cardH = 1.08, cardT = .03, rad = .1;
const cs = new THREE.Shape(); { const x = -cardW / 2, y = -cardH / 2; cs.moveTo(x + rad, y); cs.lineTo(x + cardW - rad, y); cs.quadraticCurveTo(x + cardW, y, x + cardW, y + rad);
  cs.lineTo(x + cardW, y + cardH - rad); cs.quadraticCurveTo(x + cardW, y + cardH, x + cardW - rad, y + cardH); cs.lineTo(x + rad, y + cardH); cs.quadraticCurveTo(x, y + cardH, x, y + cardH - rad);
  cs.lineTo(x, y + rad); cs.quadraticCurveTo(x, y, x + rad, y); }
const cardGeo = new THREE.ExtrudeGeometry(cs, { depth: cardT, bevelEnabled: true, bevelThickness: .006, bevelSize: .006, bevelSegments: 3, curveSegments: 24 });
// UV лицевой стороны: из координат вершин в [0,1]
{ const pos = cardGeo.attributes.position, uv = cardGeo.attributes.uv; for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + cardW / 2) / cardW, (pos.getY(i) + cardH / 2) / cardH); }
const cardFaceMat = new THREE.MeshPhysicalMaterial({ map: cardMap, bumpMap: cardBump, bumpScale: 3, metalness: .85, roughness: .36, roughnessMap: brushedLin, clearcoat: .35, clearcoatRoughness: .3 });
const cardEdgeMat = new THREE.MeshPhysicalMaterial({ color: 0xb98a2a, metalness: 1, roughness: .3 });
const card = new THREE.Mesh(cardGeo, [cardFaceMat, cardEdgeMat]); card.geometry.translate(0, 0, -cardT / 2);
// лежит внутри сейфа: нижним краем на полке, верхним — на слитках, лицом к зрителю
card.scale.setScalar(1.32); card.position.set(C.x - .32, shelfY + .6, -.98); card.rotation.set(-.6, .1, .03);
card.castShadow = card.receiveShadow = true; scene.add(card);
const cardFill = new THREE.PointLight(0xfff0d0, 7, 6, 1.2); cardFill.position.set(C.x - 1.6, shelfY + .6, 2.2); scene.add(cardFill);   // подсветка карты, чтобы читалась

// ---------- дверь: толстый диск, ригели по кромке, механизм на внутренней стороне ----------
const DR = R0 + .3, DT = .7;
const hinge = new THREE.Group(); hinge.position.set(C.x + R0 + .5, C.y, .35); scene.add(hinge);
const door = new THREE.Group(); door.position.set(-(R0 + .5), 0, 0); hinge.add(door);
const disk = new THREE.Mesh(new THREE.CylinderGeometry(DR, DR, DT, 128), [steelLin, steel, steel]);
disk.rotation.x = Math.PI / 2; disk.castShadow = disk.receiveShadow = true; door.add(disk);
// ступенчатая внутренняя сторона (обращена к хранилищу, z < 0)
const plug = new THREE.Mesh(new THREE.CylinderGeometry(R0 - .05, R0 - .05, .35, 128), [steelLin, steel, steel]);
plug.rotation.x = Math.PI / 2; plug.position.z = -DT / 2 - .17; plug.castShadow = true; door.add(plug);
// ригели — хромированные цилиндры, торчат из кромки «пробки»
for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, bolt = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, .5, 32), chrome);
  bolt.position.set(Math.cos(a) * (R0 + .1), Math.sin(a) * (R0 + .1), -DT / 2 - .17); bolt.rotation.z = a - Math.PI / 2; bolt.castShadow = true; door.add(bolt); }
// механизм под стеклом: кольца и тяги
const glassRing = new THREE.Mesh(new THREE.TorusGeometry(1.05, .05, 24, 96), chrome); glassRing.position.z = -DT / 2 - .36; door.add(glassRing);
for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2, rod = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, 1.5, 20), chrome);
  rod.position.set(Math.cos(a) * .9, Math.sin(a) * .9, -DT / 2 - .37); rod.rotation.z = a + Math.PI / 2; door.add(rod); }
const hub = new THREE.Mesh(new THREE.CylinderGeometry(.32, .32, .14, 48), chrome); hub.rotation.x = Math.PI / 2; hub.position.z = -DT / 2 - .38; door.add(hub);
// наружная сторона: штурвал (видно кромкой)
const wheel = new THREE.Mesh(new THREE.TorusGeometry(.75, .07, 24, 96), chrome); wheel.position.z = DT / 2 + .45; door.add(wheel);
for (let i = 0; i < 4; i++) { const sp = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, 1.5, 16), chrome); sp.rotation.z = i * Math.PI / 4; sp.position.z = DT / 2 + .45; door.add(sp); }
const axle = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, .45, 24), chrome); axle.rotation.x = Math.PI / 2; axle.position.z = DT / 2 + .22; door.add(axle);
hinge.rotation.y = 1.85;   // дверь распахнута к зрителю
// петли
for (const y of [-1.1, 1.1]) { const h = new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, .7, 32), steelLin); h.position.set(C.x + R0 + .5, C.y + y, .35); h.castShadow = true; scene.add(h); }

// ---------- пол и монеты, высыпавшиеся наружу ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 30), floorMat); floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR; floor.receiveShadow = true; scene.add(floor);
// россыпь у порога: плотно у проёма, реже к зрителю; монеты ложатся друг на друга, пара — на ребре, один упавший столбик
const placed = [];
for (let i = 0; i < 46; i++) {
  const t = Math.pow(rnd(), 1.6), x = C.x - .2 + (rnd() - .5) * (1.2 + t * 3.2), z = .55 + t * 3.0;
  let y = FLOOR + CT / 2; for (const p of placed) if (Math.hypot(p.x - x, p.z - z) < CR * 1.7) y = Math.max(y, p.y + CT * .95);
  const tilt = y > FLOOR + CT ? .12 : .03;
  coin(x, y, z, (rnd() - .5) * tilt, rnd() * 6, (rnd() - .5) * tilt); placed.push({ x, y, z });
}
for (let i = 0; i < 7; i++) coin(C.x + .9 + i * .05, FLOOR + CR * .62 + i * .012, 1.5 + i * .02, 0, .5, -1.0);   // упавший столбик «веером»
coin(C.x - .95, FLOOR + CR, 2.1, Math.PI / 2 - .15, 0, .8);                                                        // монета на ребре
coin(C.x + .35, FLOOR + CR, 2.9, Math.PI / 2 - .2, 0, -.5);
// монеты на пороге: лежат на изогнутом дне проёма (высота и наклон — по окружности R0), не проваливаются в металл
for (const [dx, z] of [[-.3, -.16], [-.14, -.34], [.12, -.08], [.4, -.26], [-.02, -.46]]) {
  const yb = C.y - Math.sqrt(R0 * R0 - dx * dx), ang = Math.atan2(dx, Math.sqrt(R0 * R0 - dx * dx));
  coin(C.x + dx + Math.sin(ang) * CT / 2 * -1, yb + Math.cos(ang) * (CT / 2 + .004), z, 0, rnd() * 6, ang);
}

// ---------- свет ----------
scene.add(new THREE.HemisphereLight(0x3a4250, 0x0a0806, .35));
const key = new THREE.DirectionalLight(0xdfe8ff, 1.6); key.position.set(-6, 7, 8); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); key.shadow.bias = -.0004; scene.add(key);
const inside = new THREE.PointLight(0xffb84a, 20, 9, 1.6); inside.position.set(C.x + .3, C.y + 1.25, -2.4); inside.castShadow = true; scene.add(inside);
const inside2 = new THREE.PointLight(0xffd070, 6, 6, 1.8); inside2.position.set(C.x + 1.25, C.y + .4, -.7); scene.add(inside2);
const spill = new THREE.SpotLight(0xffb040, 55, 16, .62, .7, 1.4); spill.position.set(C.x, C.y + .3, -2.2); spill.target.position.set(C.x - .6, FLOOR, 4.5);
spill.castShadow = true; spill.shadow.mapSize.set(2048, 2048); scene.add(spill, spill.target);
const rim = new THREE.PointLight(0x7fb0ff, 9, 14, 1.5); rim.position.set(7.5, 3.5, 4); scene.add(rim);

// ---------- лучи света из проёма (аддитивный конус) ----------
const beam = new THREE.Mesh(new THREE.ConeGeometry(R0 * 1.15, 7, 64, 1, true),
  new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { c: { value: new THREE.Color(0xffb54a) } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }",
    fragmentShader: "uniform vec3 c; varying vec2 vUv; void main(){ float a = pow(vUv.y, 2.2) * .07 * (.6 + .4 * sin(vUv.x * 60.)); gl_FragColor = vec4(c * a, a); }" }));
beam.position.set(C.x - .35, C.y - .55, 3.3); beam.rotation.x = -Math.PI / 2 - .32; beam.rotation.z = .12; scene.add(beam);

// ---------- рендер с bloom ----------
const comp = new EffectComposer(r);
comp.addPass(new RenderPass(scene, cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W * PR, H * PR), .32, .5, .92));
comp.addPass(new OutputPass());
comp.render();
requestAnimationFrame(() => { comp.render(); window.__ready = true; });
</script>
