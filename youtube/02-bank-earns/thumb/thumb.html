<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Превью ролика №2</title>
<!-- thumb.html?v=1..3 → 1280×720. Стиль «Студия» (как v13 ролика №1): свет, объём, ≤ 4 слов, одна цифра крупно. -->
<style>
  @font-face { font-family: "Mont"; src: url("../../kit/fonts/Montserrat.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Unb"; src: url("../../kit/fonts/Unbounded.ttf"); font-weight: 200 900; }
  @font-face { font-family: "Mono"; src: url("../../kit/fonts/GeistMono-Bold.ttf"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #050608; color: #eef2f6; font-family: "Mont"; }
  .v { display: none; position: absolute; inset: 0; } .v.on { display: block; }
  .orb { position: absolute; border-radius: 50%; filter: blur(30px); }
  .grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.75)); pointer-events: none; }
  .plate { display: inline-block; padding: 10px 26px 14px; border-radius: 16px; background: #f2f5f8; color: #050608; font: 900 46px "Unb"; text-transform: uppercase; letter-spacing: -.02em; }
  .card { position: absolute; width: 470px; height: 296px; border-radius: 26px; padding: 34px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.35); }
  .card .chip { width: 72px; height: 54px; border-radius: 11px; background: linear-gradient(135deg, #f4e3a1, #b99442); }
  .card .sheen { position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.45) 45%, transparent 58%); mix-blend-mode: overlay; }
  .big { font: 900 170px/1 "Unb"; letter-spacing: -.045em; white-space: nowrap; }
  .g { color: #3ddc84; text-shadow: 0 0 60px rgba(61,220,132,.55), 0 8px 0 rgba(0,0,0,.45); }
  .r { color: #ff4d5e; text-shadow: 0 0 60px rgba(255,77,94,.5), 0 8px 0 rgba(0,0,0,.45); }
  .t { font: 900 70px/1 "Unb"; text-transform: uppercase; letter-spacing: -.03em; }

  /* v1: «4 трлн ₽» — прибыль банков, плашка «часть — твоя» */
  .v1 .k { position: absolute; left: 70px; top: 90px; font: 800 38px "Mont"; color: #9aa5b4; letter-spacing: 4px; text-transform: uppercase; }
  .v1 .big { position: absolute; left: 60px; top: 150px; font-size: 230px; }
  .v1 .big small { font-size: .38em; color: #eef2f6; margin-left: 14px; text-shadow: none; }
  .v1 .plate { position: absolute; left: 70px; top: 470px; transform: rotate(-2deg); font-size: 58px; background: #3ddc84; }
  .v1 .card { left: 760px; top: 190px; width: 520px; height: 328px; transform: perspective(1200px) rotateY(-26deg) rotateZ(10deg); background: linear-gradient(135deg, #ff8a95, #ff4d5e 40%, #6b0f19); }

  /* v2: две стрелки: банк на тебе ↓ / ты на банке ↑ */
  .v2 .col { position: absolute; top: 90px; width: 560px; height: 540px; border-radius: 40px; padding: 40px; }
  .v2 .l { left: 50px; background: rgba(255,77,94,.08); box-shadow: inset 0 0 0 3px rgba(255,77,94,.5), 0 0 80px rgba(255,77,94,.15); }
  .v2 .rr { left: 670px; background: rgba(61,220,132,.08); box-shadow: inset 0 0 0 3px rgba(61,220,132,.55), 0 0 90px rgba(61,220,132,.2); }
  .v2 .col .t { font-size: 58px; }
  .v2 .col .ar { font: 900 200px/1 "Unb"; margin-top: 20px; }
  .v2 .col .big { font-size: 96px; position: absolute; left: 40px; bottom: 40px; }

  /* v3: выписка со списаниями (зачёркнуты) → зелёный бонус */
  .v3 .ph { position: absolute; left: 790px; top: 40px; width: 400px; height: 780px; border-radius: 56px; background: linear-gradient(160deg, #121822, #06080b);
    box-shadow: 0 0 0 3px #303a48, 0 0 0 9px #0a0d12, 30px 50px 100px rgba(0,0,0,.7), 0 0 140px rgba(255,77,94,.25);
    transform: perspective(1400px) rotateY(-22deg) rotateX(6deg) rotateZ(4deg); padding: 80px 22px 0; }
  .v3 .row { display: flex; justify-content: space-between; align-items: center; padding: 20px 18px; margin-bottom: 14px; border-radius: 20px; background: rgba(255,255,255,.06); font: 700 24px "Mont"; }
  .v3 .row b { font: 800 30px "Mono"; color: #ff4d5e; } .v3 .row.x { opacity: .5; text-decoration: line-through; text-decoration-thickness: 4px; text-decoration-color: #ff4d5e; }
  .v3 .row.ok { background: rgba(61,220,132,.16); box-shadow: inset 0 0 0 2px rgba(61,220,132,.6); } .v3 .row.ok b { color: #3ddc84; font-size: 34px; }
  .v3 .left { position: absolute; left: 70px; top: 120px; }
  .v3 .left .t { font-size: 84px; line-height: .98; }
  .v3 .left .plate { margin-top: 40px; font-size: 52px; }
</style>
</head>
<body>
<div class="v v1"><div class="orb" style="left:-100px;top:-100px;width:1000px;height:900px;background:radial-gradient(closest-side,rgba(61,220,132,.32),transparent)"></div>
  <div class="orb" style="left:800px;top:250px;width:700px;height:700px;background:radial-gradient(closest-side,rgba(255,77,94,.25),transparent)"></div>
  <div class="k">банки заработают</div>
  <div class="big g">4<small>трлн ₽</small></div>
  <div class="plate">часть — твоя</div>
  <div class="card"><div class="chip"></div><div class="sheen"></div></div>
</div>

<div class="v v2"><div class="orb" style="left:-200px;top:100px;width:800px;height:800px;background:radial-gradient(closest-side,rgba(255,77,94,.22),transparent)"></div>
  <div class="orb" style="left:700px;top:-100px;width:900px;height:900px;background:radial-gradient(closest-side,rgba(61,220,132,.3),transparent)"></div>
  <div class="col l"><div class="t">Банк<br>на тебе</div><div class="ar r">↓</div><div class="big r">−1 900 ₽</div></div>
  <div class="col rr"><div class="t">Ты<br>на банке</div><div class="ar g">↑</div><div class="big g">+5 500 ₽</div></div>
</div>

<div class="v v3"><div class="orb" style="left:-200px;top:-100px;width:900px;height:900px;background:radial-gradient(closest-side,rgba(61,220,132,.28),transparent)"></div>
  <div class="orb" style="left:750px;top:100px;width:800px;height:800px;background:radial-gradient(closest-side,rgba(255,77,94,.25),transparent)"></div>
  <div class="left"><div class="t">Банк<br>берёт <span class="r">это</span></div><div class="plate">забери своё</div></div>
  <div class="ph">
    <div class="row x"><span>Обслуживание</span><b>−99 ₽</b></div>
    <div class="row x"><span>СМС</span><b>−59 ₽</b></div>
    <div class="row x"><span>Проценты</span><b>−1 840 ₽</b></div>
    <div class="row x"><span>Баллы сгорели</span><b>−12</b></div>
    <div class="row ok"><span>Бонус</span><b>+1 000 ₽</b></div>
  </div>
</div>
<div class="grain"></div><div class="vig"></div>
<script>const v = new URLSearchParams(location.search).get("v") || "1"; document.querySelector(".v" + v).classList.add("on");</script>
</body>
</html>
