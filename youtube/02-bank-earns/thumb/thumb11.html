  .card .sheen { position: absolute; inset: 0; background: linear-gradient(112deg, transparent 28%, rgba(255,255,255,.65) 42%, transparent 54%); mix-blend-mode: overlay; }

  body.studio .studio-only, body.water .water-only { display: block; }

  .card { -webkit-mask: radial-gradient(circle at 250px 46px, transparent 21px, #000 22.5px); mask: radial-gradient(circle at 250px 46px, transparent 21px, #000 22.5px); }
  .card .rim { position: absolute; left: 225px; top: 21px; width: 50px; height: 50px; border-radius: 50%; box-shadow: inset 0 3px 3px rgba(0,0,0,.55), inset 0 -2px 2px rgba(255,240,170,.8), 0 0 0 2px rgba(120,80,0,.5); }
  svg.hk { position: absolute; left: 150px; top: -332px; overflow: visible; }
