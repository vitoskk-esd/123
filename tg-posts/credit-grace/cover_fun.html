<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Обложки «Кредитка без процентов» v2</title>
<!-- Обложки v2 (владелец 12.10: «давай изменим монтаж, нужно что-то более динамичное и прикольное… я про монтаж и рисовку фото к посту в тг»).
     ?v=1 — «Мышеловка»: кредитка 0 % как сыр в мышеловке; ?v=2 — «Бомба»: карта с горящим фитилём и таймером «55 дней»;
     ?v=3 — «Скрапбук»: бумага, скотч, наклейки, стрелки от руки. Снимок: node tg-posts/credit-grace/shot_fun.js -->
<style>
  @font-face { font-family: "Display"; src: url("fonts/LiberationSans-Bold.ttf"); }
  @font-face { font-family: "Tek"; src: url("fonts/Tektur-Medium.ttf"); }
  @font-face { font-family: "Unb"; src: url("../../youtube/kit/fonts/Unbounded.ttf"); font-weight: 200 900; }
  @font-face { font-family: "Mont"; src: url("../../youtube/kit/fonts/Montserrat.ttf"); font-weight: 100 900; }
  html, body { margin: 0; width: 1280px; height: 1280px; overflow: hidden; background: #05060b; }
  svg { display: block; }
</style></head><body>
<svg id="c" width="1280" height="1280" viewBox="0 0 1280 1280"></svg>
<script>
const V = new URLSearchParams(location.search).get("v") || "1";
const LIME = "#c8ff3d", CYAN = "#3df5ff", RED = "#ff3b5c", VIO = "#8b5cff", INK = "#eef3ff";
const rnd = (s) => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const T = (x, y, s, size, fill = INK, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || "start"}" font-family="${o.f || "Unb"}" font-weight="${o.w || 900}" font-size="${size}" fill="${fill}" letter-spacing="${o.ls ?? "-.03em"}" ${o.glow ? `filter="url(#${o.glow})"` : ""} ${o.tr ? `transform="${o.tr}"` : ""}>${s}</text>`;
const defs = `<defs>
  <filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000" flood-opacity=".6"/></filter>
  <filter id="shL" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="6" dy="12" stdDeviation="8" flood-color="#3a2a10" flood-opacity=".35"/></filter>
  <filter id="b40"><feGaussianBlur stdDeviation="40"/></filter><filter id="b8"><feGaussianBlur stdDeviation="8"/></filter>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3140"/><stop offset=".6" stop-color="#151922"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a560"/><stop offset="1" stop-color="#a8702f"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8c96a8"/><stop offset=".5" stop-color="#e8edf6"/><stop offset="1" stop-color="#7a8496"/></linearGradient>
  <pattern id="half" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.4" fill="#1b1b1b" opacity=".18"/></pattern>
  <radialGradient id="vig" cx="50%" cy="48%" r="72%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient></defs>`;
const stars = (n, seed) => { let s = ""; for (let i = 0; i < n; i++) { const z = .3 + rnd(i + seed) * .7, h = rnd(i + seed + 77); s += `<circle cx="${rnd(i + seed + 1) * 1280}" cy="${rnd(i + seed + 500) * 1280}" r="${1 + z * 2.4}" fill="${h > .8 ? LIME : h > .55 ? VIO : CYAN}" opacity="${.2 + z * .6}"/>`; } return s; };
const speed = (n, seed, c, ang) => { let s = `<g transform="rotate(${ang} 640 640)">`; for (let i = 0; i < n; i++) { const y = rnd(i + seed) * 1280, x = rnd(i + seed + 3) * 1280, L = 120 + rnd(i + seed + 9) * 380;
  s += `<rect x="${x}" y="${y}" width="${L}" height="${2 + rnd(i + seed + 4) * 5}" rx="3" fill="${c}" opacity="${.08 + rnd(i + seed + 6) * .25}"/>`; } return s + `</g>`; };
const card = (x, y, w, rot, o = {}) => { const h = w * .63; return `<g transform="translate(${x} ${y}) rotate(${rot})" filter="url(#sh)">
  <rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${w * .06}" fill="url(#card)" stroke="${o.edge || LIME}" stroke-opacity=".8" stroke-width="4"/>
  <rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${w * .06}" fill="none" stroke="${o.edge || LIME}" stroke-width="10" opacity=".25" filter="url(#glS)"/>
  <rect x="${-w * .38}" y="${-h * .18}" width="${w * .15}" height="${w * .11}" rx="${w * .02}" fill="#d8c27a"/><path d="M${-w * .38} ${-h * .18 + w * .055} h${w * .15} M${-w * .305} ${-h * .18} v${w * .11}" stroke="#a8914a" stroke-width="3"/>
  <text x="${w * .4}" y="${h * .32}" text-anchor="end" font-family="Tek" font-size="${w * .2}" fill="${o.edge || LIME}" filter="url(#glS)">${o.label || "0%"}</text>
  <text x="${-w * .38}" y="${h * .36}" font-family="Tek" font-size="${w * .055}" fill="#8f9bb8" letter-spacing="4">•••• 0055</text></g>`; };
const tag = (x, y, txt, c = LIME, rot = 0, size = 34) => { const w = txt.length * size * .7 + 70; return `<g transform="translate(${x} ${y}) rotate(${rot})"><rect x="0" y="-${size * 1.05}" width="${w}" height="${size * 1.75}" rx="${size * .9}" fill="none" stroke="${c}" stroke-width="4" filter="url(#glS)"/>
  <text x="${w / 2}" y="${size * .32}" text-anchor="middle" font-family="Tek" font-size="${size}" fill="${c}" letter-spacing="5">${txt}</text></g>`; };

const VARS = {
  // 1 — мышеловка: кредитка 0 % как приманка
  "1": () => `<rect width="1280" height="1280" fill="#05060b"/><circle cx="760" cy="860" r="520" fill="${LIME}" opacity=".12" filter="url(#b40)"/><circle cx="260" cy="250" r="380" fill="${VIO}" opacity=".18" filter="url(#b40)"/>${stars(150, 1)}${speed(26, 3, CYAN, -14)}
    ${tag(70, 110, "5 ЛОВУШЕК", LIME, 0)}
    ${T(70, 270, "КРЕДИТКА", 150, INK)}${T(70, 410, "БЕЗ ПРОЦЕНТОВ", 112, LIME, { glow: "glS" })}
    ${T(74, 490, "…или мышеловка?", 58, "#c9d3ee", { f: "Mont", w: 800, ls: 0 })}
    <g transform="translate(660 900) rotate(-12)">
      <rect x="-420" y="40" width="840" height="150" rx="22" fill="url(#wood)" filter="url(#sh)"/><rect x="-420" y="40" width="840" height="34" rx="16" fill="#e8b876"/>
      <path d="M-330 50 v-14 h560 v14" stroke="url(#metal)" stroke-width="16" fill="none"/>
      <path d="M-300 44 C-300 -260 260 -260 260 44" stroke="url(#metal)" stroke-width="18" fill="none" transform="rotate(-38 -300 44)"/>
      <circle cx="-300" cy="44" r="30" fill="url(#metal)"/><circle cx="-300" cy="44" r="12" fill="#5a6476"/>
      ${card(140, -20, 380, 8)}
      <path d="M-120 -260 l-40 -60 M-40 -300 l0 -70 M60 -270 l40 -60" stroke="${LIME}" stroke-width="10" stroke-linecap="round" filter="url(#glS)"/></g>
    <g transform="translate(870 560) rotate(9)"><rect x="-190" y="-58" width="380" height="116" rx="20" fill="${RED}" filter="url(#sh)"/>${T(0, 18, "ОСТОРОЖНО", 44, "#fff", { a: "middle", ls: "-.01em" })}</g>
    <rect width="1280" height="1280" fill="url(#vig)"/>${T(70, 1225, "условия у каждого банка свои · не реклама", 30, "#8f9bb8", { f: "Mont", w: 700, ls: 0 })}`,
  // 2 — бомба: карта с фитилём и таймер «до 55 дней»
  "2": () => { let sparks = ""; for (let i = 0; i < 46; i++) { const a = rnd(i + 40) * Math.PI * 2, r = 20 + rnd(i + 41) * 100; sparks += `<path d="M${1090 + Math.cos(a) * r * .3} ${560 + Math.sin(a) * r * .3} L${1090 + Math.cos(a) * r} ${560 + Math.sin(a) * r}" stroke="${rnd(i + 42) > .5 ? "#ffd166" : "#ff7b3d"}" stroke-width="${3 + rnd(i) * 4}" stroke-linecap="round"/>`; }
    return `<rect width="1280" height="1280" fill="#05060b"/><circle cx="1090" cy="560" r="240" fill="#ff7b3d" opacity=".25" filter="url(#b40)"/><circle cx="420" cy="880" r="520" fill="${CYAN}" opacity=".1" filter="url(#b40)"/>${stars(140, 9)}${speed(22, 11, LIME, 18)}
    ${T(70, 200, "КРЕДИТКА", 140, INK)}${T(70, 330, "БЕЗ ПРОЦЕНТОВ", 104, CYAN, { glow: "glS" })}
    ${T(74, 410, "работает, пока не кончился таймер", 46, "#c9d3ee", { f: "Mont", w: 800, ls: 0 })}
    <path d="M760 560 C820 520 900 640 980 600 C1030 575 1060 560 1090 560" stroke="#c9b48a" stroke-width="14" fill="none" stroke-linecap="round"/>${sparks}<circle cx="1090" cy="560" r="20" fill="#fff" filter="url(#glS)"/>
    ${card(520, 760, 600, -10, { edge: CYAN, label: "0%" })}
    <g transform="translate(640 1090) rotate(-3)"><rect x="-420" y="-110" width="840" height="190" rx="30" fill="#0d1018" stroke="${RED}" stroke-width="5" filter="url(#sh)"/>
      ${T(-370, 30, "ДО", 64, "#8f9bb8", { f: "Tek", w: 400, ls: "2px" })}${T(-230, 50, "55 ДНЕЙ", 120, RED, { f: "Tek", w: 400, ls: "4px", glow: "glS" })}</g>
    <rect width="1280" height="1280" fill="url(#vig)"/>${tag(830, 1230, "5 ЛОВУШЕК", LIME, 0, 30)}`; },
  // 3 — скрапбук: бумага, скотч, наклейки, стрелки
  "3": () => `<rect width="1280" height="1280" fill="#efe6d3"/><rect width="1280" height="1280" fill="url(#half)"/>
    <rect x="40" y="80" width="940" height="200" fill="#16181f" transform="rotate(-3 420 220)" filter="url(#shL)"/>${T(80, 225, "КРЕДИТКА", 132, "#fff", { tr: "rotate(-3 420 220)" })}
    <rect x="250" y="300" width="960" height="170" fill="${LIME}" transform="rotate(2 730 385)" filter="url(#shL)"/>${T(275, 420, "БЕЗ ПРОЦЕНТОВ", 86, "#11140a", { tr: "rotate(2 730 385)" })}
    <rect x="360" y="40" width="180" height="56" fill="#f5e9a8" opacity=".85" transform="rotate(-12 450 68)"/><rect x="1060" y="290" width="170" height="54" fill="#f5e9a8" opacity=".85" transform="rotate(18 1145 317)"/>
    <g transform="translate(420 800)">${card(0, 0, 640, -8, { edge: VIO, label: "0%" })}</g>
    <rect x="160" y="560" width="200" height="60" fill="#f5e9a8" opacity=".85" transform="rotate(-30 260 590)"/><rect x="560" y="1000" width="200" height="60" fill="#f5e9a8" opacity=".85" transform="rotate(20 660 1030)"/>
    <g transform="translate(1010 760) rotate(10)" filter="url(#shL)"><circle r="170" fill="${RED}"/><circle r="150" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="14 10"/>${T(0, -10, "5", 130, "#fff", { a: "middle" })}${T(0, 66, "ЛОВУШЕК", 34, "#fff", { a: "middle", ls: "-.01em" })}</g>
    <path d="M940 1100 C1030 1110 1080 1040 1060 950" stroke="#16181f" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M1035 965 l25 -20 l18 30" stroke="#16181f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    ${T(470, 1175, "мини-платёж ≠ без %", 54, "#16181f", { f: "Mont", w: 800, ls: 0, tr: "rotate(-4 610 1170)" })}
    ${T(70, 1235, "условия у каждого банка свои · не реклама", 28, "#6b6250", { f: "Mont", w: 700, ls: 0 })}`,
};
document.getElementById("c").innerHTML = defs + VARS[V]();
document.fonts.ready.then(() => requestAnimationFrame(() => { window.__ready = true; }));
</script>
</body></html>
