<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body { background: radial-gradient(90% 60% at 50% 70%, #3a0a10 0%, #190409 60%); }
.hero { position: absolute; left: 160px; bottom: 0; width: 760px; }
.pill { position: absolute; left: 50%; transform: translateX(-50%); top: 56px; padding: 12px 26px; border-radius: 99px; background: rgba(239,49,36,.2);
  border: 1px solid rgba(239,49,36,.7); font-weight: 800; font-size: 24px; letter-spacing: .14em; color: #ffb3ad; white-space: nowrap; }
h1 { position: absolute; width: 100%; text-align: center; top: 118px; font-size: 168px; line-height: 1; text-shadow: 0 10px 60px rgba(239,49,36,.75); }
.sub { position: absolute; width: 100%; text-align: center; top: 300px; font-size: 44px; font-weight: 800; }
.sub em { font-style: normal; color: #ff5a4a; }
.timer { position: absolute; right: 50px; top: 430px; width: 190px; height: 190px; border-radius: 50%; background: var(--mint); color: #062a20;
  display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(8deg); box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.timer .unb { font-size: 52px; line-height: 1; } .timer span { font-size: 22px; font-weight: 800; margin-top: 6px; }
.steps { position: absolute; left: 40px; right: 40px; bottom: 120px; display: flex; gap: 16px; }
.st { flex: 1; padding: 22px 22px 24px; border-radius: 26px; background: rgba(20, 6, 10, .78); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 20px 40px rgba(0,0,0,.4); }
.st .n { font-family: "Unb"; font-weight: 900; font-size: 26px; color: #ff5a4a; } .st b { display: block; font-size: 27px; font-weight: 800; margin-top: 6px; line-height: 1.15; }
.st span { display: block; font-size: 20px; opacity: .7; margin-top: 4px; }
.foot { text-align: center; bottom: 40px; }
</style></head><body>
<img class="hero" src="../hf/h1.png">
<div class="pill">НОВЫМ КЛИЕНТАМ</div>
<h1 class="unb">+1 000 ₽</h1>
<div class="sub">за пару часов — <em>с кредиткой</em></div>
<div class="timer"><span class="unb">≈2 ч</span><span>и бонус твой</span></div>
<div class="steps">
  <div class="st"><div class="n">01</div><b>Оформи онлайн</b><span>по ссылке</span></div>
  <div class="st"><div class="n">02</div><b>Курьер привезёт</b><span>домой или на работу</span></div>
  <div class="st"><div class="n">03</div><b>5 покупок картой</b><span>в тот же день</span></div>
</div>
<div class="foot">Реклама. АО «Альфа-Банк». Условия акции, кредитования и ПСК — по ссылке в посте.</div>
</body></html>
