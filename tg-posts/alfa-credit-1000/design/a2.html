<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body { background: #fed4bf; color: var(--ink); }
.hero { position: absolute; right: -10px; bottom: 0; width: 720px; }
h1 { position: absolute; left: 60px; top: 60px; font-size: 96px; line-height: 1; }
h1 em { font-style: normal; color: var(--red); }
.sub { position: absolute; left: 64px; top: 278px; font-size: 34px; font-weight: 800; color: #6a4a40; }
.receipt { position: absolute; left: 50px; top: 400px; width: 400px; padding: 30px 30px 40px; background: #fff; border-radius: 22px 22px 0 0;
  box-shadow: 0 30px 60px rgba(150, 50, 20, .22); transform: rotate(-4deg); }
.receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -18px; height: 20px;
  background: linear-gradient(-45deg, transparent 13px, #fff 0) 0 0 / 26px 20px repeat-x, linear-gradient(45deg, transparent 13px, #fff 0) 0 0 / 26px 20px repeat-x; }
.receipt .t { font-family: "Unb"; font-weight: 800; font-size: 20px; letter-spacing: .12em; color: #a89894; margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 14px; font-size: 27px; font-weight: 800; padding: 12px 0; border-bottom: 2px dashed #f0e4df; }
.ok { width: 34px; height: 34px; border-radius: 50%; background: var(--mint); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; }
.bonus { margin-top: 20px; padding: 18px 20px; border-radius: 18px; background: var(--red); color: #fff; display: flex; justify-content: space-between; align-items: center; }
.bonus b { font-size: 24px; } .bonus .unb { font-size: 36px; white-space: nowrap; }
.tag { position: absolute; left: 60px; top: 1100px; padding: 18px 26px; border-radius: 20px; background: var(--ink); color: #fff; font-size: 26px; font-weight: 800; transform: rotate(-3deg); }
.tag .unb { color: var(--mint); }
.foot { color: var(--ink); bottom: 34px; right: auto; width: 520px; }
</style></head><body>
<img class="hero" src="../hf/h2.png">
<h1 class="unb">5 ПОКУПОК<br><em>= +1 000 ₽</em></h1>
<div class="sub">кредиткой · в день получения · сумма любая</div>
<div class="receipt"><div class="t">ЧЕК АРБУЗОВА</div>
  <div class="row"><span class="ok">✓</span>Кофе</div><div class="row"><span class="ok">✓</span>Булочка</div><div class="row"><span class="ok">✓</span>Вода</div>
  <div class="row"><span class="ok">✓</span>Жвачка</div><div class="row"><span class="ok">✓</span>Проезд</div>
  <div class="bonus"><b>Бонус</b><span class="unb">+1 000 ₽</span></div></div>
<div class="tag"><span class="unb">0 ₽</span> вложений · <span class="unb">1</span> день</div>
<div class="foot">Реклама. АО «Альфа-Банк». Условия акции, кредитования и ПСК — по ссылке в посте.</div>
</body></html>
