<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Oswald;font-weight:700;src:url(fonts/oswald-cyr-700.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Oswald;font-weight:700;src:url(fonts/oswald-lat-700.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:800;src:url(fonts/manrope-cyr-800.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-weight:800;src:url(fonts/manrope-lat-800.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:700;src:url(fonts/manrope-cyr-700.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-weight:700;src:url(fonts/manrope-lat-700.woff2) format("woff2")}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#141c1f}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Manrope;color:#f4f4f2;
 background:radial-gradient(ellipse 80% 55% at 50% 42%,#2a3b41 0%,#1c272b 55%,#11181b 100%)}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:72px 72px;
 -webkit-mask-image:radial-gradient(ellipse 75% 60% at 50% 45%,#000 30%,transparent 100%)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%);z-index:50;pointer-events:none}
.el{position:absolute;transform:translate(-50%,-50%);display:none;will-change:transform,opacity;z-index:5}
.el.full{left:0;top:0;transform:none;width:1080px;height:1920px;z-index:3}
.el svg{display:block}
.big{font-family:Oswald;font-weight:700;color:#f4f4f2;white-space:nowrap;line-height:1;text-shadow:0 6px 24px rgba(0,0,0,.35)}
.g{color:#8be37a}.o{color:#f5a524}.y{color:#f7c948}.r{color:#ef5b4c}.mut{color:#9aa6ad}
.lbl{font-family:Manrope;font-weight:800;white-space:nowrap;text-align:center}
.chip{font-family:Manrope;font-weight:800;white-space:nowrap;padding:18px 32px;border-radius:999px;background:#f4f4f2;color:#1d2a2f;display:flex;align-items:center;gap:14px}
.box{background:rgba(255,255,255,.06);border:3px solid rgba(255,255,255,.12);border-radius:28px;padding:26px 34px}
#sub{position:absolute;left:0;right:0;top:1560px;text-align:center;z-index:60;transition:none}
#sub span{display:inline-block;max-width:900px;font-family:Manrope;font-weight:800;font-size:50px;line-height:1.25;padding:12px 26px;border-radius:18px;background:rgba(14,19,21,.72)}
#sub b{color:#f5a524;font-weight:800}
#badge{position:absolute;right:56px;top:150px;z-index:40}
</style></head><body>
<div id="stage"><div id="grid"></div><div id="badge"></div><div id="sub"></div><div id="vig"></div></div>
<script src="engine.js"></script>
</body></html>
