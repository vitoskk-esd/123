<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Рилс с Арбузовым</title>
<!-- Рилс 9:16 по утверждённой раскадровке (story.js) и таймингу (timeline.js, build_arb.py). ?r=<папка рилса>.
     Владелец 14.10: «не было застоев в кадрах» → камера всё время в движении; «вяло и не очень чётко» → яркие чистые фоны, жёсткие тени;
     «слишком часто переходы… используй этот скил» → движение по скиллу hyperframes-animation (см. комментарий в скрипте). -->
<style>
  @font-face { font-family: "Unb"; src: url("../../youtube/kit/fonts/Unbounded.ttf"); font-weight: 200 900; }
  @font-face { font-family: "O"; src: url("../../youtube/kit/fonts/oswald-cyrillic-700.woff2"); font-weight: 700; unicode-range: U+0400-045F; }
  @font-face { font-family: "O"; src: url("../../youtube/kit/fonts/oswald-latin-700.woff2"); font-weight: 700; }
  @font-face { font-family: "I"; src: url("../../youtube/kit/fonts/inter-cyrillic-700.woff2"); font-weight: 700; unicode-range: U+0400-045F; }
  @font-face { font-family: "I"; src: url("../../youtube/kit/fonts/inter-latin-700.woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111; }
  .a { position: absolute; } .nw { white-space: nowrap; }
  svg { display: block; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: none; transform-origin: 0 0; }
  .it { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 960px; }
</style>
</head>
<body>
<div id="stage" class="a" style="inset:0;overflow:hidden"><div id="layers"></div><div id="cap" class="a" style="inset:0;z-index:6"></div><div id="fx" class="a" style="inset:0;pointer-events:none;z-index:7"></div></div>
<script src="../../youtube/characters/hd/arbuzhd.js"></script>
<script src="../../youtube/characters/rig/rig.js"></script>
<script src="arb9.js"></script>
<script>
/* Про-версия v3 по скиллу hyperframes-animation (владелец 14.10: «слишком часто переходы… используй этот скил для рилсов»):
   • фраза = сцена; между сценами ОДИН основной переход push slide 0,35 с (уходящая и входящая сцены едут одновременно),
     акцент zoom-through на старте и перед финалом (transitions/overview.md: «pick ONE primary + 1–2 accents»);
   • внутри сцены — multi-phase camera: станции общий → предмет → лицо Арбузова → другой предмет, переезд 0,55 с power2.inOut,
     медленный наезд и синусный дрейф, чтобы камера не стояла (rules/multi-phase-camera.md);
   • предметы — spring-pop entrance со стаггером 60 мс, штампы бьют с тряской; цифры — kinetic beat slam поверх сцены. */
const REEL = new URLSearchParams(location.search).get("r");
const load = (src) => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
const cl = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - cl(x), 3), io2 = (x) => { x = cl(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }, io3 = (x) => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out4 = (x) => 1 - Math.pow(1 - cl(x), 4);
const back = (x) => { x = cl(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const OL = A9.OL, hashf = (k) => { const x = Math.sin(k * 127.1) * 43758.5453; return x - Math.floor(x); };
const PAL = [["#ffb74d", "#ff7043"], ["#81c784", "#2e7d32"], ["#64b5f6", "#1e63d6"], ["#ff8a80", "#d32f2f"], ["#b39dff", "#5e35b1"], ["#ffe082", "#ff8f00"]];

Promise.all([load(`../${REEL}/story.js`), load(`../${REEL}/timeline.js`)]).then(() => {
  const L = document.getElementById("layers"), FR = [];
  STORY.frames.forEach((fr, i) => {
    A9.reseed(i + 1);
    const heroes = [];
    window.HERO9 = (x, y, w, o) => { heroes.push({ x, y, w, o }); return `<div class="a heroSlot" data-h="${heroes.length - 1}" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 820 / 860}px;transform-origin:50% 92%;filter:drop-shadow(0 14px 0 rgba(0,0,0,.2))"></div>`; };
    const el = document.createElement("div"); el.className = "layer"; el.style.transformOrigin = "540px 960px"; L.appendChild(el);
    const cam = document.createElement("div"); cam.className = "a"; cam.style.cssText = "left:0;top:0;width:1080px;height:1920px;transform-origin:0 0"; el.appendChild(cam);
    const tmp = document.createElement("div"); tmp.innerHTML = fr.build(A9);
    const items = [...tmp.children].map((c, k) => { const d = document.createElement("div"); d.className = "it"; d.appendChild(c); cam.appendChild(d);
      return { d, bg: k === 0, hero: c.classList.contains("heroSlot"), stamp: /mix-blend-mode:multiply/.test(c.getAttribute("style") || "") }; });
    window.HERO9 = null;
    FR.push({ el, cam, items, heroes, slots: [...cam.querySelectorAll(".heroSlot")] });
  });
  // слой «цифра поверх сцены»
  const SL = document.createElement("div"); SL.className = "a"; SL.style.cssText = "inset:0;display:none;z-index:5"; document.getElementById("stage").insertBefore(SL, document.getElementById("cap"));
  SL.innerHTML = `<div class="a sback" style="inset:0;background:rgba(20,14,30,.7)"></div>` + Array.from({ length: 10 }, (_, k) => `<div class="a scoin" data-k="${k}" style="left:485px;top:765px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c0,#f0b72f 55%,#a86d00);border:6px solid ${OL};display:flex;align-items:center;justify-content:center;font:700 60px O;color:#7a4a00">₽</div>`).join("") + `<div class="a stext" style="left:0;width:1080px;text-align:center"></div>`;
  document.getElementById("fx").innerHTML = `<div class="a" style="inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(0,0,0,.2))"></div>`;
  // станции камеры: рамки предметов и лица (считаем один раз — правило скилла: не мерить DOM во время анимации)
  FR.forEach((f) => {
    f.el.style.display = "block";
    const boxes = f.items.filter(x => !x.bg && !x.hero).map(x => { const r = x.d.firstElementChild.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, a: r.width * r.height }; })
      .filter(b => b.w > 80 && b.h > 80 && b.w < 1060 && b.h < 1880).sort((a, b) => b.a - a.a);
    const h = f.heroes[0];
    const fit = (b, zmax) => { const z = Math.max(1.12, Math.min(zmax, 760 / b.w, 1100 / b.h)); return { z, x: b.x + b.w / 2, y: b.y + b.h / 2 + 140 / z }; };
    f.st = { wide: { z: 1, x: 540, y: 960 } };
    f.st.detail = boxes[0] ? fit(boxes[0], 1.7) : null;
    f.st.detail2 = boxes[1] ? fit(boxes[1], 1.5) : null;
    f.st.face = h ? { z: Math.min(1.9, 760 / (h.w * .62)), x: h.x + h.w * .5, y: h.y + h.w * .42 + 300 / Math.min(1.9, 760 / (h.w * .62)) } : null;
    f.el.style.display = "none";
  });
  const station = (f, kind) => f.st[kind] || f.st.detail || f.st.face || f.st.wide;
  const spin = (lay, t) => lay.querySelectorAll("g.spin").forEach(g => g.setAttribute("transform", `rotate(${t * 6} ${g.dataset.cx} ${g.dataset.cy})`));
  const heroSvg = (o, st, w, h) => ArbuzHD.svg({ mood: o.mood || "smirk", look: o.look || 0, rim: o.rim || "#ffd27a", limbs: true, tube: true, arm: o.arm || "down", w, h,
    mouth: st.opts.mouth === "M" ? null : st.opts.mouth, blink: st.opts.blink });
  const wordPulse = (t) => { for (const w of TL.words) { if (t < w.s) return 0; if (t < w.s + .18) return Math.sin((t - w.s) / .18 * Math.PI); } return 0; };
  const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

  // одна сцена в момент t: камера по станциям, появление предметов, Арбузов
  function drawScene(i, t, st, pulse) {
    const f = FR[i], sc = TL.scenes[i], ft = t - sc.t0, sh = TL.shots.filter(s => s.frame === i);
    spin(f.el, t);
    let k = sh.findIndex(s => t >= s.t0 && t < s.t1); if (k < 0) k = t < sh[0].t0 ? 0 : sh.length - 1;
    const curS = station(f, sh[k].kind), prevS = k ? station(f, sh[k - 1].kind) : null, m = prevS ? io2((t - sh[k].t0) / .55) : 1;
    const base = prevS ? { z: prevS.z + (curS.z - prevS.z) * m, x: prevS.x + (curS.x - prevS.x) * m, y: prevS.y + (curS.y - prevS.y) * m } : curS;
    const push = 1 + .045 * cl((t - sh[k].t0) / (sh[k].t1 - sh[k].t0));
    const z = base.z * push, dx = Math.sin(t * 2 * Math.PI * .23) * 10 / z, dy = Math.sin(t * 2 * Math.PI * .3 + 1) * 8 / z;
    let shake = 0, n = 0;
    f.items.forEach((it, j) => {
      if (it.bg || it.hero) return;
      const delay = .1 + n * .06; n++;
      const kk = i === 0 ? 1 : (ft - delay) / (it.stamp ? .2 : .45), sway = Math.sin(t * 1.6 + j * 1.3) * 4;
      if (it.stamp) {
        it.d.style.opacity = cl(kk * 4); it.d.style.transform = `scale(${kk < 1 ? 2.4 - 1.4 * out4(kk) : 1})`;
        const since = ft - delay - .2; if (since > 0 && since < .28) shake = Math.max(shake, (1 - since / .28) * 18);
      } else {
        it.d.style.opacity = cl(kk * 3);
        it.d.style.transform = `translateY(${(1 - ease(kk)) * 80 + sway}px) scale(${kk >= 1 ? 1 : .6 + .4 * back(kk)})`;
      }
    });
    f.slots.forEach((slot) => {
      const h = f.heroes[+slot.dataset.h];
      slot.innerHTML = heroSvg({ ...h.o, look: (h.o.look || 0) + Math.sin(t * 1.1) * 8 }, st, h.w, h.w * 820 / 860);
      const pop = i === 0 ? 1 : back((ft - .05) / .45);
      slot.style.transform = `${st.transform} scale(${(.7 + .3 * pop) * (1 + pulse * .025)},${(.7 + .3 * pop) * (1 - pulse * .035)})`;
    });
    const x = Math.min(Math.max(base.x + dx, 540 / z), 1080 - 540 / z), y = Math.min(Math.max(base.y + dy, 960 / z), 1920 - 960 / z);
    const fr60 = Math.floor(t * 60), sx = shake ? (hashf(fr60) - .5) * shake : 0, sy = shake ? (hashf(fr60 + 7) - .5) * shake : 0;
    f.cam.style.transform = `translate(${540 - x * z + sx}px,${960 - y * z + sy}px) scale(${z})`;
  }

  window.renderAt = (t) => {
    let si = TL.scenes.findIndex(s => t >= s.t0 && t < s.t1); if (si < 0) si = TL.scenes.length - 1;
    const sc = TL.scenes[si], lt = t - sc.t0, st = ArbuzovRig.state(t, { words: TL.words, acts: TL.acts }), pulse = wordPulse(t);
    const TD = sc.tr === "zoom" ? .4 : .35, inTr = si > 0 && sc.tr !== "none" && lt < TD, e = io3(lt / TD);
    FR.forEach((f, i) => { f.el.style.display = (i === si || (inTr && i === si - 1)) ? "block" : "none"; });
    drawScene(si, t, st, pulse);
    const inc = FR[si].el; inc.style.opacity = 1; inc.style.transform = ""; inc.style.zIndex = 2;
    if (inTr) {
      drawScene(si - 1, t, st, 0);
      const outEl = FR[si - 1].el; outEl.style.zIndex = 1;
      if (sc.tr === "push") { outEl.style.transform = `translateX(${-1080 * e}px)`; outEl.style.opacity = 1; inc.style.transform = `translateX(${1080 * (1 - e)}px)`; }
      else { outEl.style.transform = `scale(${1 + .5 * e})`; outEl.style.opacity = 1 - e; inc.style.transform = `scale(${.85 + .15 * e})`; inc.style.opacity = e; }
    }
    // цифра поверх сцены (kinetic beat slam)
    const sl = TL.slams.find(q => t >= q.t0 && t < q.t1);
    if (sl) {
      SL.style.display = "block"; const lt2 = t - sl.t0, D = sl.t1 - sl.t0, outK = cl((lt2 - (D - .16)) / .16);
      SL.querySelector(".sback").style.opacity = cl(lt2 / .12) * (1 - outK);
      const txt = sl.text, mm = /[–-]/.test(txt) ? null : txt.match(/\d[\d  ]*\d|\d/), num = mm ? +mm[0].replace(/\D/g, "") : null;
      const shown = num ? txt.replace(mm[0], fmt(Math.round(num * io3(lt2 / .5)))) : txt;
      const lines = shown.length > 9 && shown.includes(" ") ? [shown.slice(0, shown.lastIndexOf(" ", Math.ceil(shown.length / 2) + 2)), shown.slice(shown.lastIndexOf(" ", Math.ceil(shown.length / 2) + 2) + 1)] : [shown];
      const size = Math.min(170, 960 / (Math.max(...lines.map(l => l.length)) * .98));
      const tEl = SL.querySelector(".stext"); tEl.style.top = `${800 - lines.length * size * .55}px`;
      tEl.innerHTML = `<div style="display:inline-block;transform:scale(${(1.8 - .8 * out4(lt2 / .18)) * (1 - .1 * outK)}) rotate(-3deg);opacity:${cl(lt2 / .06) * (1 - outK)};font:900 ${size}px/1.08 Unb;letter-spacing:-.04em;color:#ffe066;-webkit-text-stroke:10px ${OL};paint-order:stroke fill;text-shadow:0 16px 0 ${OL}">${lines.map(l => `<div class="nw">${l}</div>`).join("")}</div>`;
      const money = /₽/.test(txt);
      SL.querySelectorAll(".scoin").forEach(cn => { const j = +cn.dataset.k, a = -Math.PI * (.15 + .7 * j / 9), sp = 1300 + hashf(j + si) * 500, tt = Math.max(0, Math.min(lt2 - .15, 1.2));
        cn.style.opacity = money && lt2 > .15 ? 1 - outK : 0;   // монетки вылетают снизу веером и падают — за текстом, не поверх
        cn.style.transform = `translate(${Math.cos(a) * sp * tt}px,${450 + Math.sin(a) * sp * tt + 1800 * tt * tt}px) rotate(${tt * 480 * (j % 2 ? 1 : -1)}deg)`; });
      if (lt2 > .18 && lt2 < .4) { const sh = (1 - (lt2 - .18) / .22) * 12, fr60 = Math.floor(t * 60); FR[si].el.style.transform = `translate(${(hashf(fr60) - .5) * sh}px,${(hashf(fr60 + 3) - .5) * sh}px)`; }
    } else SL.style.display = "none";
    // субтитры по слову; во время цифры — скрыты
    const ch = sl ? null : TL.chunks.find(q => t >= q.t0 && t < q.t1), capEl = document.getElementById("cap");
    if (!ch) { capEl.innerHTML = ""; return; }
    const wsT = TL.words.filter(w => w.s >= ch.t0 - .1 && w.s < ch.t1);
    capEl.innerHTML = `<div class="a" style="left:40px;right:40px;top:1240px;text-align:center;font:900 68px/1.3 Unb">` + ch.w.map((w, j) => {
      const ws = wsT[j] ? wsT[j].s : ch.t0 + j * .25, on = t >= ws - .03, nowW = on && (j === ch.w.length - 1 || !wsT[j + 1] || t < wsT[j + 1].s), k = back((t - ws + .03) / .16);
      const col = w.c === "k" ? "#ffe066" : w.c === "r" ? "#ff5a5a" : "#fff";
      return `<span style="display:inline-block;margin:6px 8px;opacity:${on ? 1 : 0};transform:scale(${on ? .7 + .3 * k : .7});${nowW ? `background:${w.c === "r" ? "#ff3b3b" : "#ffe066"};border-radius:18px;padding:0 16px;box-shadow:0 8px 0 ${OL};border:5px solid ${OL};` : ""}letter-spacing:-.02em;color:${nowW ? OL : col};${nowW ? "" : `-webkit-text-stroke:4px ${OL};paint-order:stroke fill;text-shadow:0 7px 0 ${OL};`}font-size:${w.c ? 78 : 68}px">${w.t.replace(/[,.:]$/, "")}</span>`;
    }).join("") + `</div>`;
  };
  Promise.all(["700 20px O", "700 20px I", "900 20px Unb", "200 20px Unb"].map(f => document.fonts.load(f, "АБВГДЁЖ abc 0123 ₽"))).then(() => document.fonts.ready)
    .then(() => { renderAt(0); window.__ready = true; });
});
</script>
</body>
</html>
