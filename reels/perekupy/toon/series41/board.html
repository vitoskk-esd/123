<script>
// «ЖИЗНЬ ОДНОЙ ЭВО» (ep50, отдельная серия, киношный формат). Формат «Жизнь одной…»: 17 лет одной Mitsubishi Lancer Evolution IX —

// → 2020–2023 гараж Семёныча, «три зимы по вечерам» → сегодня сын Семёныча Кирилл выставил «один хозяин, не битая, 1 600 000»; бот прислал Диме

const WRENCH = `<svg viewBox="0 0 100 100"><path d="M50 10 v70" stroke="#8a929b" stroke-width="12" stroke-linecap="round"/><path d="M36 10 q14 -14 28 0 v10 h-8 v-6 h-12 v6 h-8 z" fill="#8a929b" stroke="#151515" stroke-width="4"/></svg>`;
const S = [

   vo: "Гоша: «Эво — это не машина. Это характер!» Лис: «Гоша гонял её каждые выходные».", who: "Гоша + Лис",
   mv: "<b>Новый фон — трек-дэй</b> (пит-лейн, трибуна, шины-барьер, клетчатый флаг, красно-белый бордюр). Новый герой — <b>гонщик Гоша</b> (новый голос). <b>Приём 3 — скорость:</b> B — Эво сбоку проносится по треку, фон размыт, полосы скорости." },

       lights: GAR_L }), shot: { x: 540, y: 1200, s: 1.08 },

   B: { def: () => ({ bg: "bokssemen", grade: "warm", hud: HUD50(), over: ODO("140 000") + YEAR("2023", "#ff9a3c"),
       mid: car(EVO, 300, 1640, 780, { z: 5, sheen: .55 }) + P("sm2", { ...SEMEN, look: "grin" }, 200, 1740, 760, { armR: -150 }, { rim: "#ffb36a", side: 1, z: 7 }) + C.motes(300, 1100, 700, 400, 20, 4),

   mv: "<b>Новый фон — гараж Семёныча</b> (кирпич, буржуйка, плакат «Водитель, береги машину!», календарь с зачёркнутыми днями, верстак, лампа на проводе). Новый герой — <b>Семёныч</b>, мастер-реставратор (новый голос). Год-штамп листается 2020 → 2021 → 2023, B — Эво снова блестит, пылинки в луче лампы." },
 { h: "СЕГОДНЯ · ОБЪЯВЛЕНИЕ", tc: "6/8 · 0:39–0:50",

   B: { def: () => ({ bg: "osendvor", grade: "day", hud: HUD50(), over: YEAR("СЕГОДНЯ", "#4cd964"),

   mv: "<b>Бот — развязка:</b> Дима держит телефон, в боте «Lancer Evolution IX 2007 · 1 600 000 · «один хозяин, не битая» · 1 с после публикации» — и приезжает первым. <b>Новый фон — осенний двор</b> (пятиэтажка, жёлтые деревья, листья на асфальте). Новые герои — <b>Кирилл</b>, сын Семёныча, и покупатель <b>Дима</b> (новые голоса)." },
 { h: "ОТЧЁТ ПО VIN", tc: "7/8 · 0:50–1:01",

       return { bg: "osendvor", grade: "day", hud: HUD50(), farBlur: 9, mid: H.mid, lights: H.lights }; }, shot: { x: 540, y: 960, s: 1 },
     bubbles: [{ p: "dv", html: "Не битая, говорите?<br><em>По отчёту — ДТП, 2019.</em>", fs: 42 }], talk: ["dv"] },

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const put = (id, f) => { const def = f.def(); def.bubbles = f.bubbles || []; const el = document.getElementById(id); el.innerHTML = C.frame(def, f.shot);
  (f.talk || []).forEach(p => C.mouth(el, p, "talk")); return el; };
const a = put("A", sc.A), b = put("B", sc.B);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
document.fonts.ready.then(() => { C.layout(a); C.layout(b); window.READY = true; });
</script></body></html>
