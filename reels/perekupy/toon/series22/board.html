<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#0b0c10;z-index:5}
.hd b{font-family:Unbounded;font-weight:900;font-size:30px;color:#151515;background:#ffd23f;border:5px solid #151515;border-radius:12px;padding:4px 14px}
.hd span{font-family:Unbounded;font-weight:800;font-size:26px;color:#fff}.hd i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#8b93a3}
.view{position:absolute;left:0;top:96px;width:1080px;height:820px;overflow:hidden;border-bottom:6px solid #ffd23f}
.stage{position:absolute;left:0;width:1080px;height:1920px}
.el{position:absolute}.el svg{width:100%;height:100%;overflow:visible}
.lab{position:absolute;font-family:Unbounded;font-weight:900;border:6px solid #151515;border-radius:18px;padding:6px 18px;box-shadow:0 8px 0 #151515;white-space:nowrap}
.bub{position:absolute;background:#0d0e12;border:5px solid #fff;border-radius:30px;padding:16px 24px;font-family:Unbounded;font-weight:800;font-size:36px;line-height:1.12;color:#fff;box-shadow:0 0 0 6px #0d0e12}
.bub em{font-style:normal;color:#ff3b30}
.txt{position:absolute;left:40px;right:40px;top:940px;color:#fff}
.txt .vo{font-family:Unbounded;font-weight:800;font-size:38px;line-height:1.22}
.txt .vo small{display:block;font-family:"JetBrains Mono";font-size:22px;color:#ffd23f;font-weight:800;margin-bottom:10px;letter-spacing:1px}
.txt .mv{margin-top:20px;font-family:Onest;font-size:25px;line-height:1.35;color:#b9bfca}
.txt .mv b{color:#fff}
.clk{white-space:nowrap;font-family:"JetBrains Mono";font-weight:800;font-size:34px;color:#ff3b30;border:4px solid #ff3b30;border-radius:10px;padding:0 10px;box-shadow:0 0 14px #ff3b3088}
.botcard{position:absolute;left:440px;top:660px;width:600px;z-index:9;background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:24px;box-shadow:0 0 80px rgba(120,180,255,.4)}
.botcard .bh{font-family:Onest;font-weight:700;font-size:26px;color:#8b93a3;margin-bottom:12px}
.botcard .bb{background:#1c1f26;border-radius:24px;padding:20px 24px;font-family:Onest;color:#fff;font-size:34px;line-height:1.45}
.cnt{position:absolute;left:40px;top:150px;z-index:20;font-family:"JetBrains Mono";font-weight:800;font-size:40px;color:#fff;background:#151515;border:5px solid #4cd964;border-radius:16px;padding:2px 16px;white-space:nowrap}
.receipt{position:absolute;left:150px;width:780px;background:#fbfaf6;border:6px solid #151515;box-shadow:0 18px 0 rgba(0,0,0,.35);padding:30px 40px;font-family:"JetBrains Mono";font-weight:800;font-size:32px;color:#222;line-height:1.6;transform:rotate(2deg);z-index:6}
.receipt h4{margin:0 0 10px;text-align:center;font-family:Unbounded;font-weight:900;font-size:38px}.receipt .row,.receipt .tot{display:flex;justify-content:space-between}.receipt .tot{border-top:5px dashed #222;margin-top:10px;padding-top:8px;font-size:42px;color:#e53935}
.title{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;line-height:1}
</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="view"><div class="stage" id="stage"></div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="../chars4.js"></script><script src="../chars5.js"></script><script src="bgs.js"></script>
<script>
// ep31 «СХЕМЫ · ПРОДАЮ САМ»: перекуп под видом собственника. Структура «на переходы» (как ep30): бот с первой секунды, бот в сюжете,
// призыв в середине, в финале — «ссылка в шапке» (без призывов в комментарии). Машина — Hyundai из библиотеки (kit/img/hyundai).
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4, o) => el(CHARS[kind](p, o), l, t, 420 * s, 800 * s, z);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 9) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z}">${html}</div>`;
let CLK = "", CNTV = ""; const clock = (t) => (CLK = t, "");
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
const CAR = (l, t, w, z = 3, extra = "") => `<img class="el" src="../../kit/img/hyundai/hyundai.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${extra}">`;
const BOT = (time, car, price, delta, ago, l, t, sc = 1, head = "ПЕРЕХВАТ · бот") => `<div class="botcard" style="left:${l}px;top:${t}px;transform:scale(${sc});transform-origin:0 0"><div class="bh">${head} · ${time}</div><div class="bb"><b style="color:#ff7a1a">${delta}</b><br><b>${car} · ${price}</b><br>📍 твой город<br>⏱ ${ago}</div></div>`;
const AD = (l, t) => `<div class="el" style="left:${l}px;top:${t}px;width:620px;z-index:9;background:#fff;border:8px solid #151515;border-radius:30px;padding:22px 26px;font-family:Onest;color:#151515;box-shadow:0 12px 0 #151515">
  <div style="font-family:Unbounded;font-weight:900;font-size:34px">Hyundai Elantra 2017</div><div style="font-family:Unbounded;font-weight:900;font-size:56px;margin:6px 0">820 000 ₽</div>
  <div style="font-size:30px;font-weight:800;color:#2f7a3a">✅ Продаю сам · один владелец</div><div style="font-size:26px;color:#6b7280;margin-top:6px">не бита, не крашена, срочно</div></div>`;
const CTA = (top, big, small) => `<div class="el" style="left:60px;right:60px;top:${top}px;z-index:12;background:#ffd23f;border:8px solid #151515;border-radius:34px;padding:26px 30px;box-shadow:0 14px 0 #151515;font-family:Unbounded;font-weight:900;color:#151515;text-align:center">
  <div style="font-size:44px;line-height:1.15">${big}</div><div style="margin-top:14px;font-size:28px;font-family:Onest;font-weight:800">${small}</div></div>`;
const DOC = (l, t, rot, title, rows) => `<div class="el" style="left:${l}px;top:${t}px;width:440px;z-index:6;background:#fbfaf6;border:6px solid #151515;box-shadow:0 14px 0 rgba(0,0,0,.35);padding:22px 24px;font-family:'JetBrains Mono';font-weight:800;font-size:24px;line-height:1.55;color:#222;transform:rotate(${rot}deg)">
  <div style="font-family:Unbounded;font-weight:900;font-size:30px;margin-bottom:8px">${title}</div>${rows}</div>`;
// Толян «под собственника»: кепка-восьмиклинка, накладные усы, без цепи
const FAKE = { jacket: "#1d1d1f", pants: "#232c47", cap: "#6b5a3a", mustache: true, hair: "#3a2d22", shades: true };
const S = [
 { h: "07:00 · СЕРЁГА СПИТ", tc: "1/8 · 0:00–0:07", bg: "room", y: 640, els: () => clock("07:00")
     + BOT("07:00", "Hyundai Elantra 2017", "690 000 ₽", "🔥 −14% к рынку · хозяйка", "1 с после публикации", 440, 1000) + ch("seryoga", "s", 0, 880, .9, 6)
     + bub("Потом посмотрю…", 60, 760),
   vo: "Серёга (сонно): «Потом посмотрю…» Лис: «Потом — это когда её уже купили».", who: "Серёга + Лис",
   mv: "<b>Бот — с первой секунды:</b> 07:00, Серёге приходит карточка «Перехвата»: Elantra от хозяйки, −14% к рынку, 1 с после публикации. Он переворачивается на другой бок." },
 { h: "07:25 · ДАЧА ГАЛИ", tc: "2/8 · 0:07–0:17", bg: "dacha", y: 700, els: () => clock("07:25")
     + CAR(330, 1210, 700) + ch("tolyan", "t", -20, 880, .82, 6) + ch("galya", "g", 800, 900, .74, 6)
     + bub("Сынок, так быстро?<br><em>Я ж только выложила!</em>", 500, 760) + lab("690 000 ₽ · НАЛИЧКОЙ", 60, 1430, "#4cd964", "#151515", 38, -3),
   vo: "Толян (в трубку, в машине): «Мать, беру! Уже еду!» Галя: «Сынок, так быстро? Я ж только выложила!» Лис: «Двадцать минут — и машина у Толяна. Хозяйка была настоящая. Последний раз в этой истории».", who: "Толян + Галя + Лис",
   mv: "Дача бабы Гали. Толян уже тут с пачкой денег, Галя удивлена. Оба в кадре. Таймер в углу: 07:25." },
 { h: "12:00 · «ПРОДАЮ САМ»", tc: "3/8 · 0:17–0:26", bg: "street", y: 700, els: () => clock("12:00")
     + CAR(300, 1220, 700) + ch("perekup", "t2", 0, 880, .82, 6, FAKE) + AD(400, 760) + lab("+130 000 ₽", 60, 1440, "#ff3b30", "#fff", 50, -3),
   vo: "Лис: «В обед — та же машина. Плюс сто тридцать тысяч. И „продаю сам, один владелец“».", who: "Лис",
   mv: "Толян клеит накладные усы и надевает кепку «как у хозяина», фоткает машину — новое объявление «Продаю сам · один владелец · 820 000»." },
 { h: "ПРИЗЫВ В СЕРЕДИНЕ", tc: "4/8 · 0:26–0:32", bg: "street", y: 700, els: () => CTA(800, "Хозяйка выложила в 07:00.<br>В 07:20 — <span style=\"color:#c0392b\">уже перекуп.</span>", "🔔 Свежие объявления — через секунду после публикации · бот «Перехват»")
     + BOT("07:00", "Hyundai Elantra 2017", "690 000 ₽", "🔥 −14% к рынку · хозяйка", "1 с после публикации", 220, 1140),
   vo: "Лис: «Хозяйка выложила в семь ноль-ноль. В семь двадцать — уже перекуп. Кто первый увидел, тот и купил у хозяина».", who: "Лис",
   mv: "<b>Вставка-призыв</b> на ~40% ролика: жёлтая плашка + та самая карточка бота из первой сцены." },
 { h: "У МЕТРО · ПОКАЗ", tc: "5/8 · 0:32–0:46", bg: "metro", y: 700, els: () => CAR(280, 1180, 660) + ch("perekup", "t2", -20, 880, .82, 6, FAKE) + ch("seryoga", "s", 800, 900, .74, 6)
     + bub("Вы собственник?", 560, 740) + lab("УСЫ НАКЛАДНЫЕ 🥸", 60, 1440, "#ffd23f", "#151515", 36, -3),
   vo: "Серёга: «Вы собственник?» Толян: «Конечно, брат! Сам езжу, сам продаю!» Серёга: «А в ПТС почему Петрова Галина?» Толян: «Это… жена. Мамина. Жена мамы».", who: "Серёга + Толян",
   mv: "<b>Новая локация — у метро:</b> павильон с «М», ларёк «Цветы», остановка. Толян в усах и кепке, Серёга. Пузыри у голов говорящих." },
 { h: "ДОКУМЕНТЫ", tc: "6/8 · 0:46–0:56", bg: "desk", y: 600, els: () => DOC(60, 680, -3, "ПТС", "Собственник:<br><b style=\"color:#c0392b\">ПЕТРОВА Г. П.</b><br>с 2017 г.")
     + DOC(560, 720, 3, "ДОГОВОР", "Продавец: Петрова Г. П.<br>подпись: <b style=\"color:#1d4fb8\">✍ Петрова</b><br>Покупатель:<br><b style=\"color:#c0392b\">__________</b>")
     + lab("ПУСТОЙ ДОГОВОР — ВПИШУТ ТЕБЯ", 80, 1320, "#ff3b30", "#fff", 36, -2),
   vo: "Лис: «Перекуп не ставит машину на себя. В ПТС — прошлая хозяйка, а договор у него уже подписан ею. Пустой. Вписать тебя — и всё».", who: "Лис",
   mv: "Документы крупно: ПТС на Петрову, договор уже подписан ею, строка покупателя пустая. Строки подсвечиваются маркером по словам." },
 { h: "НАЗАВТРА · 07:00", tc: "7/8 · 0:56–1:10", bg: "dacha", y: 700, els: () => clock("07:00")
     + CAR(330, 1210, 700) + ch("seryoga", "s", -10, 900, .76, 6) + ch("galya", "g", 560, 900, .74, 6) + ch("tolyan", "t", 820, 900, .7, 5)
     + bub("Сынок, опять ты первый?<br><em>Паспорт, ПТС — всё на меня.</em>", 400, 770) + BOT("07:00", "Lada Granta 2019", "520 000 ₽", "✅ хозяйка · по рынку", "1 с", 20, 700, .6),
   vo: "Лис: «Серёга не купил. Включил уведомления погромче. Утром — семь ноль-ноль, дзынь». Галя: «Сынок, опять ты первый? Паспорт, ПТС — всё на меня». Толян (подбегает): «Брат… опять ты?»", who: "Лис + Галя + Толян",
   mv: "<b>Развязка через бота:</b> назавтра в 07:00 Серёга по уведомлению первым приезжает к Гале — она продаёт вторую, дедову. Толян опоздал." },
 { h: "ФИНАЛ · ОДИН ПРИЗЫВ", tc: "8/8 · 1:10–1:22", bg: "metro", y: 600,
   els: () => `<div class="el" style="left:60px;top:640px;right:60px;z-index:9;background:#0d0e12;border:6px solid #fff;border-radius:30px;padding:22px 28px;color:#fff;font-family:Unbounded;font-weight:900;font-size:28px;line-height:1.4">ПРОДАЁТ ЛИ ХОЗЯИН:<br><span style="color:#ffd23f">🪪 имя в ПТС = паспорт продавца<br>👫 «продаю за жену» — встреча с женой или доверенность<br>✍ договор уже подписан прошлым владельцем — перекуп</span></div>`
     + CTA(1030, "Бот <span style=\"color:#c0392b\">«Перехват»</span><br>— ссылка в шапке профиля", "объявления по твоему городу через секунду после публикации — успей к хозяину первым") + FOX(820, 1330, 180),
   vo: "Лис: «Проверь, что продаёт хозяин: имя в ПТС совпадает с паспортом продавца. „Продаю за жену“ — встречайся с женой или смотри доверенность. Договор, уже подписанный прошлым владельцем, — почти всегда перекуп. А чтобы успеть к хозяину первым — Перехват присылает объявления через секунду после публикации. Сохрани — пока собственником не оказалась жена мамы».", who: "Лис",
   mv: "<b>Финал:</b> чек-лист + один призыв «Бот «Перехват» — ссылка в шапке профиля». Без «пиши в комментариях»." },
];

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els(); if (CNTV) document.querySelector(".view").insertAdjacentHTML("beforeend", `<div class="cnt" style="top:auto;bottom:20px;left:auto;right:20px">💸 ${CNTV} ₽</div>`); if (CLK) document.getElementById("h").insertAdjacentHTML("beforebegin", `<span class="clk">${CLK}</span>`);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
const sh = document.getElementById("t-shades"); if (sh) sh.style.display = "";
["t", "t2", "s", "s2", "g", "g2"].forEach(p => document.getElementById(p) && mouth(p, "talk"));
window.READY = true;
</script></body></html>
