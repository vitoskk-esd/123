<script>
// РОЛИК-ОБЪЯСНЕНИЕ «Как работает Перехват» (владелец 10.11): под готовую озвучку (голос Achird, 1:27) — рассказчик Даня (сын Вики),
// иллюстрируют Толян, Жора; два видео владельца с ботом — в рамке телефона (заглушки до получения). Фон-студия новый: studio.
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4, o, extra = "") => el(CHARS[kind](p, o), l, t, 420 * s, 800 * s, z, extra);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 9) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z}">${html}</div>`;
let CLK = "", CNTV = ""; const clock = (t) => (CLK = t, ""); const CAP = v => (CNTV = v, "");
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
const CAR = (img, l, t, w, z = 3, flip = false) => `<img class="el" src="../../kit/img/${img}" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${flip ? "transform:scaleX(-1)" : ""}">`;
const PHONE = (l, t, inner, w = 520) => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:22px;box-shadow:0 0 70px rgba(120,180,255,.4)">${inner}</div>`;
const BOT = (body) => `<div style="font-family:Onest;font-weight:700;font-size:24px;color:#8b93a3">ПЕРЕХВАТ · бот</div><div style="background:#1c1f26;border-radius:22px;padding:16px 20px;margin-top:10px;font-family:Onest;color:#fff;font-size:30px;line-height:1.45">${body}</div>`;
const SCORE = (a, b) => `<div class="el" style="left:40px;top:${700 + 24}px;z-index:20;font-family:'JetBrains Mono';font-weight:800;font-size:38px;color:#fff;background:#151515;border:5px solid #ff2da6;border-radius:16px;padding:2px 16px;white-space:nowrap">ЖОРА ${a} : ${b} ТОЛЯН</div>`;
const CASH = (l, t, n = 5) => Array.from({ length: n }, (_, i) => `<div class="el" style="left:${l + i * 26}px;top:${t - i * 10}px;width:150px;height:76px;z-index:8;background:#8fd17a;border:5px solid #151515;border-radius:8px;transform:rotate(${-10 + i * 5}deg)"></div>`).join("");
const ALBUM = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">${[0, 1, 2, 3].map(k => `<div style="height:90px;border-radius:10px;background:${["#7fb2a0", "#9fc3b8", "#6f9f8f", "#8fbfae"][k]};position:relative">${k === 2 ? '<div style="position:absolute;left:30%;top:20%;width:46px;height:46px;border:6px solid #ff3b30;border-radius:50%"></div>' : ""}</div>`).join("")}</div>`;
const MARKS = (l, t) => [[0, 0], [150, 6]].map(([dx, dy]) => `<div class="el" style="left:${l + dx}px;top:${t + dy}px;width:110px;height:60px;z-index:4;border:5px dashed #ff7a1a;background:rgba(255,255,255,.7);border-radius:6px"></div>`).join("");
const SON = { jacket: "#ff7a1a", pants: "#2b2f37", hair: "#5b4636", look: "o" };
const ZHORA = { jacket: "#1d1d1f", pants: "#2b2f37", cap: "#c0392b", mustache: true, chain: true, hair: "#1d1d1f", item: "phone", look: "grin" };
const BADGE = (l = 850, t = 1270) => `<div class="el" style="left:${l}px;top:${t}px;width:200px;height:230px;z-index:18;border-radius:30px;border:6px solid #ff7a1a;background:#1b2442;overflow:hidden;box-shadow:0 8px 0 #151515"><div class="el" style="left:-20px;top:-30px;width:420px;height:800px;transform-origin:0 0;transform:scale(.58)">${CHARS.perekup("dnb", SON)}</div><div class="el" style="left:0;right:0;bottom:0;background:#ff7a1a;color:#fff;font-family:Unbounded;font-weight:900;font-size:20px;text-align:center;padding:4px 0">🎙 ДАНЯ</div></div>`;
const VID = (l, t, w, label) => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${w * 1.9}px;z-index:14;background:#0d0e12;border:10px solid #2a2d34;border-radius:46px;box-shadow:0 0 60px rgba(255,122,26,.45);display:flex;align-items:center;justify-content:center;text-align:center;font-family:Unbounded;font-weight:900;font-size:30px;color:#ffd23f;line-height:1.3">▶<br>${label}</div>`;
const CHIP = (text, l, t, bg = "#ffd23f", fg = "#151515", fs = 30) => `<div class="el" style="left:${l}px;top:${t}px;z-index:16;background:${bg};color:${fg};border:5px solid #151515;border-radius:16px;padding:6px 16px;font-family:Unbounded;font-weight:900;font-size:${fs}px;box-shadow:0 6px 0 #151515;white-space:nowrap">${text}</div>`;
const TITLE = (text, t = 760, fs = 64) => `<div class="el" style="left:40px;right:40px;top:${t}px;z-index:16;text-align:center;font-family:Unbounded;font-weight:900;font-size:${fs}px;line-height:1.1;color:#fff;-webkit-text-stroke:10px #151515;paint-order:stroke fill">${text}</div>`;
const POST = (l, t, w, txt, ok) => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;z-index:14;background:#1c1f26;border:5px solid ${ok ? "#4cd964" : "#5b6068"};border-radius:18px;padding:12px 16px;font-family:Onest;font-weight:700;font-size:24px;color:${ok ? "#fff" : "#8b93a3"};opacity:${ok ? 1 : .7}">${txt}<div style="font-size:40px;margin-top:4px">${ok ? "✅" : "✕"}</div></div>`;
const S = [
 { h: "КАК РАБОТАЕТ «ПЕРЕХВАТ»", tc: "1/8 · 0:00–0:07", bg: "studio", y: 700, els: () => ch("perekup", "dn", 560, 860, .82, 6, { ...SON, look: "grin" }) + FOX(90, 900, 260)
     + bub("Привет! Коротко расскажу,<br><em>как работает «Перехват».</em>", 300, 720) + lab("КАК РАБОТАЕТ БОТ", 40, 1330, "#ff7a1a", "#fff", 44, -3),
   vo: "Даня: «Привет! Коротко расскажу, как работает «Перехват» — и почему после оплаты машины приходят не сразу».", who: "Даня (голос Achird)",
   mv: "<b>Новый фон — студия-объяснялка</b> (тёмно-синяя сетка, оранжевый радар, стол с ноутбуком). <b>Рассказчик — Даня</b> (сын Вики из «60 секунд на осмотр»), машет в камеру; рядом лис-маскот. Губы — по голосу." },
 { h: "БОТ ЧИТАЕТ СОТНИ КАНАЛОВ", tc: "2/8 · 0:07–0:21", bg: "studio", y: 700, els: () => ch("perekup", "dn", 700, 880, .72, 6, SON)
     + ["Авто Москва", "Перекупы РФ", "ВК · Авторынок", "Тачки 77", "ВК · Барахолка", "Авто за 300к"].map((t, i) => CHIP((i % 3 === 2 ? "🟦 " : "✈️ ") + t, 30 + (i % 2) * 300, 740 + Math.floor(i / 2) * 90, "#1c1f26", "#fff", 24)).join("")
     + CHIP("⚡ 1 СЕКУНДА → ТЕБЕ", 60, 1330, "#4cd964", "#151515", 36),
   vo: "Даня: «Бот сам читает сотни телеграм-каналов и групп ВКонтакте, где продают машины. Как только там появляется новое объявление, бот за секунду сверяет его с твоим фильтром — и если машина подходит, сразу присылает её тебе».", who: "Даня",
   mv: "Плашки каналов (Telegram и ВК) летят в радар, из радара — уведомление в телефон Дани. Плашка «⚡ 1 секунда → тебе»." },
 { h: "ТОЛЬКО НОВЫЕ ОБЪЯВЛЕНИЯ", tc: "3/8 · 0:21–0:30", bg: "studio", y: 700, els: () => TITLE("ТОЛЬКО <span style='color:#ffd23f'>НОВЫЕ</span>", 740, 72)
     + POST(40, 880, 300, "Вчера · Camry", false) + POST(40, 1090, 300, "3 дня назад · Solaris", false)
     + `<div class="el" style="left:400px;top:870px;width:12px;height:420px;z-index:14;background:#ff7a1a;border-radius:6px"></div>` + CHIP("ТЫ НАСТРОИЛ ФИЛЬТР", 300, 1300, "#ff7a1a", "#fff", 26)
     + POST(470, 880, 300, "Через 2 мин · Camry", true) + POST(470, 1090, 300, "Через 3 часа · Corolla", true) + BADGE(850, 1270),
   vo: "Даня: «Важный момент: бот присылает только новые объявления — те, что выложили после того, как ты настроил фильтр. Старые посты он не пересылает».", who: "Даня",
   mv: "Шкала времени: оранжевая черта «ты настроил фильтр». Слева старые посты — серые, ✕. Справа новые — зелёные, ✅." },
 { h: "В ЧАТЕ ТИХО — ЭТО НОРМАЛЬНО", tc: "4/8 · 0:30–0:40", bg: "gostinaya", y: 520, els: () => clock("14:05") + ch("tolyan", "t", 560, 880, .78, 6, { look: "o" })
     + PHONE(40, 760, `<div style="font-family:Onest;font-weight:700;font-size:24px;color:#8b93a3">ПЕРЕХВАТ · бот</div><div style="font-family:Onest;color:#8b93a3;font-size:30px;text-align:center;padding:40px 0">🤫<br>пока тихо…</div>`, 440)
     + lab("ПАРА МИНУТ… ИЛИ ПАРА ЧАСОВ", 40, 1180, "#ffd23f", "#151515", 32, -2) + BADGE(850, 640),
   vo: "Даня: «Поэтому сразу после оплаты в чате может быть тихо: бот ждёт, когда кто-то выставит подходящую машину. Иногда это пара минут, а иногда — несколько часов».", who: "Даня (бейдж в углу)",
   mv: "Толян на диване ждёт уведомление (часы в углу крутятся 14:05 → 16:40), телефон: «пока тихо…». Даня — маленьким бейджем-аватаркой с губами в углу кадра (правило: говорящий в кадре)." },
 { h: "СДЕЛАЙ ФИЛЬТР ПОШИРЕ", tc: "5/8 · 0:40–0:58", bg: "studio", y: 700, els: () => ch("perekup", "dn", 700, 880, .72, 6, SON)
     + POST(30, 760, 600, "🔎 Камри 2012 · до 900 000 ₽<br><span style='color:#ff3b30'>≈ 1 машина в неделю</span>", false)
     + POST(30, 980, 600, "🔎 Камри от 2012 · до 1 000 000 ₽<br><span style='color:#4cd964'>≈ 6 машин в неделю</span>", true)
     + VID(500, 1180, 160, "ВИДЕО 1") + CHIP("⏸ ПАУЗА ФИЛЬТРА", 40, 1360, "#1c1f26", "#fff", 28),
   vo: "Даня: «Чтобы машины приходили чаще, сделай фильтр пошире. Например, не „Камри двенадцатого года до девятисот тысяч“, а „Камри от двенадцатого года до миллиона“. Чем уже фильтр, тем реже уведомления. Фильтров можно сделать несколько, а любой — поставить на паузу».", who: "Даня",
   mv: "Два фильтра: узкий (серый, «≈ 1 в неделю») и широкий (зелёный, «≈ 6 в неделю»). <b>Здесь — ваше ВИДЕО 1</b> в рамке телефона (если на нём создание фильтра). Кнопка «⏸ Пауза фильтра». Цифры «в неделю» — пример, можно убрать." },
 { h: "ЧТО В КАРТОЧКЕ", tc: "6/8 · 0:58–1:15", bg: "studio", y: 700, els: () => VID(330, 740, 420, "ВАШЕ ВИДЕО 2<br><span style='font-size:22px;color:#fff'>карточка в боте</span>")
     + CHIP("💰 цена", 40, 780) + CHIP("🛣 пробег", 40, 880) + CHIP("📍 город", 40, 980) + CHIP("📞 контакты", 40, 1080)
     + CHIP("🔥 −% к рынку · ПРО", 770, 800, "#ff7a1a", "#fff", 20) + CHIP("1 машина = 1 раз", 790, 900, "#4cd964", "#151515", 20) + BADGE(850, 1270),
   vo: "Даня: «В каждой карточке — цена, пробег, город и контакты продавца, если они есть в объявлении. А в тарифе ПРО — ещё и на сколько машина дешевле рынка. Одну и ту же машину из разных каналов бот присылает только один раз».", who: "Даня",
   mv: "<b>Ваше ВИДЕО 2</b> — по центру в рамке телефона (запись экрана бота: пришла карточка). Вокруг по словам выскакивают плашки: цена, пробег, город, контакты, «−% к рынку · ПРО», «1 машина = 1 раз». Даня — бейджем в углу." },
 { h: "ПРОСТОЙ vs ПРО", tc: "7/8 · 1:15–1:20", bg: "studio", y: 700, els: () => ch("perekup", "zh", 40, 880, .72, 6, ZHORA) + ch("tolyan", "t", 620, 900, .72, 6)
     + CHIP("ПРОСТОЙ · ⏱ +1 МИН", 20, 760, "#1c1f26", "#fff", 30) + CHIP("ПРО · ⚡ МГНОВЕННО", 560, 760, "#ff7a1a", "#fff", 30) + BADGE(440, 1280),
   vo: "Даня: «На тарифе „Простой“ машины приходят с задержкой в минуту, в ПРО — мгновенно».", who: "Даня (бейдж)",
   mv: "Сплит: слева Жора с плашкой «Простой · +1 мин» (уведомление приходит позже), справа Толян «ПРО · мгновенно» — уведомление сразу. Отсылка к сериалу." },
 { h: "ПОДДЕРЖКА + ФИНАЛ", tc: "8/8 · 1:20–1:27", bg: "studio", y: 700, els: () => ch("perekup", "dn", 560, 860, .82, 6, { ...SON, look: "grin" })
     + CHIP("✉️ Написать в поддержку", 40, 1120, "#fff", "#151515", 32) + bub("Удачных<br><em>перехватов!</em>", 560, 720)
     + `<div class="el" style="left:60px;right:60px;top:1250px;z-index:12;background:#ffd23f;border:8px solid #151515;border-radius:34px;padding:22px 30px;box-shadow:0 14px 0 #151515;font-family:Unbounded;font-weight:900;color:#151515;text-align:center"><div style="font-size:40px;line-height:1.15">Бот <span style="color:#c0392b">«Перехват»</span> — ссылка в шапке</div></div>` + FOX(90, 1060, 170),
   vo: "Даня: «Если что-то непонятно — жми „Написать в поддержку“ в меню бота. Удачных перехватов!»", who: "Даня",
   mv: "Кнопка меню «✉️ Написать в поддержку» нажимается курсором-пальцем. Даня машет, финальная карточка с лисом." },
];

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els(); if (CNTV) document.querySelector(".view").insertAdjacentHTML("beforeend", `<div class="cnt" style="top:auto;bottom:20px;left:auto;right:20px">💸 ${CNTV} ₽</div>`); if (CLK) document.getElementById("h").insertAdjacentHTML("beforebegin", `<span class="clk">${CLK}</span>`);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
const sh = document.getElementById("t-shades"); if (sh) sh.style.display = "";
["dn", "t", "zh"].forEach(p => document.getElementById(p) && mouth(p, "talk"));
window.READY = true;
</script></body></html>
