<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#0b0c10;z-index:5}
.hd b{font-family:Unbounded;font-weight:900;font-size:30px;color:#151515;background:#ffd23f;border:5px solid #151515;border-radius:12px;padding:4px 14px}
.hd span{font-family:Unbounded;font-weight:800;font-size:26px;color:#fff}.hd i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#8b93a3}
.view{position:absolute;left:0;top:96px;width:1080px;height:820px;overflow:hidden;border-bottom:6px solid #ffd23f}
.stage{position:absolute;left:0;width:1080px;height:1920px}
.el{position:absolute}.el svg{width:100%;height:100%;overflow:visible}
.lab{position:absolute;font-family:Unbounded;font-weight:900;border:6px solid #151515;border-radius:18px;padding:6px 18px;box-shadow:0 8px 0 #151515;white-space:nowrap}
.bub{position:absolute;background:#0d0e12;border:5px solid #fff;border-radius:30px;padding:16px 24px;font-family:Unbounded;font-weight:800;font-size:36px;line-height:1.12;color:#fff;box-shadow:0 0 0 6px #0d0e12}
.bub em{font-style:normal;color:#ff3b30}
.txt{position:absolute;left:40px;right:40px;top:940px;color:#fff}
.txt .vo{font-family:Unbounded;font-weight:800;font-size:38px;line-height:1.22}
.txt .vo small{display:block;font-family:"JetBrains Mono";font-size:22px;color:#ffd23f;font-weight:800;margin-bottom:10px;letter-spacing:1px}
.txt .mv{margin-top:20px;font-family:Onest;font-size:25px;line-height:1.35;color:#b9bfca}
.txt .mv b{color:#fff}
.clk{white-space:nowrap;font-family:"JetBrains Mono";font-weight:800;font-size:34px;color:#ff3b30;border:4px solid #ff3b30;border-radius:10px;padding:0 10px;box-shadow:0 0 14px #ff3b3088}
.title{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;line-height:1}
</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="view"><div class="stage" id="stage"></div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="bgs.js"></script>
<script>
// Приора сбоку — по рисунку владельца (kit/img/priora/priora_*.png): black — пацанская с наклейкой, white, yellow — такси, patch
const IMG = (v, l, t, w = 900, z = 3, extra = "") => `<img class="el" src="../../kit/img/priora/priora_${v}.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${extra}">`;
const P = (k, o) => "";
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4) => el(CHARS[kind](p), l, t, 420 * s, 800 * s, z);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 9) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z}">${html}</div>`;
// ВАЗ-2114 владельца (kit/img/vaz2114/vaz2114_white.png, вырезан из его картинки)
const CAR = (l, t, w = 820, z = 3, extra = "") => `<img class="el" src="../../kit/img/vaz2114/vaz2114_white.png" style="left:${l}px;top:${t + w * .04}px;width:${w}px;z-index:${z};${extra}">`;
let CLK = ""; const clock = (t) => (CLK = t, "");
const odo = (v, l, t, c = "#ffd23f") => `<div class="el" style="left:${l}px;top:${t}px;z-index:9;font-family:'JetBrains Mono';font-weight:800;font-size:54px;color:${c};background:#111;border:6px solid #151515;outline:4px solid #555;border-radius:12px;padding:6px 20px">ОДО ${v}</div>`;
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
// мотор крупно (наклейка «40 000» поверх «340 000»), машины сериала на разборке, ценники
const ENGINE = (l, t, w = 700, peel = false) => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${w * .7}px;z-index:5"><svg viewBox="0 0 700 490">
  <rect x="80" y="170" width="520" height="260" rx="30" fill="#8b929c" stroke="#000" stroke-width="10"/>
  <rect x="110" y="70" width="460" height="120" rx="40" fill="#1c1c20" stroke="#000" stroke-width="10"/>
  ${[0,1,2,3,4,5].map(i => `<path d="M${150 + i * 72} 90 v80" stroke="#3a3a40" stroke-width="10"/>`).join("")}
  <text x="340" y="150" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="44" fill="#c0392b">1JZ</text>
  <circle cx="60" cy="300" r="60" fill="#5c626b" stroke="#000" stroke-width="8"/><circle cx="60" cy="300" r="22" fill="#2b2b2e"/>
  <path d="M600 230 q60 0 60 60 v80" stroke="#7a4f2a" stroke-width="22" fill="none"/>
  ${[0,1,2,3].map(i => `<ellipse cx="${200 + i * 100}" cy="360" rx="30" ry="14" fill="#8a4a1c" opacity=".7"/>`).join("")}
  <g transform="rotate(-6 300 260)"><rect x="200" y="215" width="240" height="90" fill="#fff" stroke="#000" stroke-width="5"/>
    <text x="320" y="252" text-anchor="middle" font-family="JetBrains Mono" font-weight="800" font-size="26" fill="#555">ПРОБЕГ</text>
    <text x="320" y="290" text-anchor="middle" font-family="JetBrains Mono" font-weight="800" font-size="34" fill="#c0392b">340 000</text></g>
  <g transform="rotate(4 330 250) ${peel ? "translate(170 -70) rotate(-22 440 220)" : ""}"><rect x="210" y="200" width="250" height="100" fill="#ffd23f" stroke="#000" stroke-width="6"/>
    <text x="335" y="240" text-anchor="middle" font-family="JetBrains Mono" font-weight="800" font-size="26" fill="#151515">ПРОБЕГ</text>
    <text x="335" y="282" text-anchor="middle" font-family="JetBrains Mono" font-weight="800" font-size="38" fill="#151515">40 000 км</text></g>
</svg></div>`;
const WRECK = (src, l, t, w, rot, extra = "") => `<img class="el" src="../../kit/img/${src}" style="left:${l}px;top:${t}px;width:${w}px;z-index:4;transform:rotate(${rot}deg);filter:grayscale(.55) sepia(.35) brightness(.85);${extra}">`;
const TAG = (text, l, t, rot = -4) => `<div class="lab" style="left:${l}px;top:${t}px;background:#fff;color:#151515;font-size:34px;transform:rotate(${rot}deg);z-index:9">${text}</div>`;
const S = [
 { h: "ШРОТ", tc: "1/8 · 0:00–0:08", bg: "shrot", y: 700,
   els: () => ch("tolyan", "t", 330, 900, .95, 6)
     + `<div class="title" style="top:760px;z-index:9"><span class="lab" style="position:static;display:inline-block;background:#ffd23f;color:#151515;font-size:110px;transform:rotate(-3deg)">ШРОТ</span></div>`,
   vo: "Машины не умирают. Их разбирают — и продают по частям. Дороже, чем целиком.", who: "Лис",
   mv: "<b>Новая локация — авторазборка:</b> горы смятых кузовов, кран с магнитом поднимает машину и роняет её с грохотом. Толян стоит посреди шрота: Марк из 18-й серии без мотора, нужен «контрактный»." },
 { h: "КОНТЕЙНЕР", tc: "2/8 · 0:08–0:22", bg: "container", y: 700,
   els: () => ch("tolyan", "t", -30, 900, .9, 6) + bub("Брат, мне мотор на Марк.<br><em>Чтобы как новый.</em>", 40, 720)
     + bub("Контрактный, из Японии!<br>Пробег — <em>сорок тысяч!</em>", 440, 1000) + `<div class="el" style="left:760px;top:1240px;font-size:90px;z-index:9">🤝</div>`,
   vo: "Толян: «Брат, мне мотор на Марк. Чтобы как новый». Продавец: «Контрактный, из Японии! Пробег — сорок тысяч! Гарантия — пока не уехал». Лис: «Контрактные моторы бывают двух видов: из Японии — и „из Японии“».", who: "Толян + продавец + Лис",
   mv: "<b>Новая локация — контейнер-контора разборки:</b> гофра, полки с фарами и коробками, лампочка на проводе. Продавца не видно — рука над кассой и голос. На «гарантия — пока не уехал» касса звякает." },
 { h: "МОТОР КРУПНО", tc: "3/8 · 0:22–0:30", bg: "container", y: 700,
   els: () => ENGINE(190, 860, 700) + lab("120 000 ₽", 120, 760, "#151515", "#fff", 56, -4),
   vo: "Сто двадцать тысяч. Пробег — как у школьника. Наклейка — как новая.", who: "Лис",
   mv: "<b>Макро-план:</b> мотор на поддоне, камера медленно наезжает на жёлтую наклейку «ПРОБЕГ 40 000 км». Ржавые потёки на блоке, а наклейка блестит. Деталь — один уголок наклейки чуть отклеен." },
 { h: "АЛЛЕЯ СЕРИАЛА", tc: "4/8 · 0:30–0:42", bg: "shrot", y: 700,
   els: () => WRECK("vaz2109/vaz2109.png", 20, 1130, 480, 8) + WRECK("priora/priora_black.png", 520, 1180, 520, -10, "clip-path:inset(0 45% 0 0)")
     + WRECK("vaz2114/vaz2114_white.png", 600, 980, 420, 4, "clip-path:inset(0 0 0 50%)")
     + TAG("ДЕВЯТКА ИЗ КЮВЕТА · 16", 40, 1050, -5) + TAG("ПРИОРА — ЧАСТЯМИ · 14", 440, 1400, 4) + TAG("ЧЕТЫРКА ДЕДА · 17", 600, 900, -3),
   vo: "Толян шёл по разборке, как по сериалу. Девятка из кювета. Половина четырки деда. Приора — частями, как обычно.", who: "Лис",
   mv: "<b>Пасхалка для зрителей:</b> камера плывёт вдоль рядов — на ржавых остатках узнаются машины из прошлых серий, у каждой бирка с номером серии. Девятка без колёс, полчетырки, кусок пацанской Приоры с наклейкой." },
 { h: "ИЗ-ПОД КАПОТА", tc: "5/8 · 0:42–0:56", bg: "hood", y: 700,
   els: () => ch("mihalych", "m", -80, 760, 1.15, 6) + bub("Мотор японский. И пробег<br>японский — <em>триста сорок тысяч.</em><br>А наклейка — наша.", 40, 740)
     + ENGINE(470, 1080, 580, true),
   vo: "Михалыч: «Сынок, мотор японский. И пробег японский — триста сорок тысяч. А наклейка — наша, российская».", who: "Михалыч",
   mv: "<b>Новый ракурс — из моторного отсека вверх:</b> над нами открытый капот, лампа гаража, лицо Михалыча. Он поддевает ногтем наклейку — под ней «340 000». Звук отрывающегося скотча." },
 { h: "МАРК ПО ЧАСТЯМ", tc: "6/8 · 0:56–1:06", bg: "shrot", y: 700,
   els: () => `<img class="el" src="../../kit/img/markii/markii.png" style="left:150px;top:1050px;width:780px;z-index:4">`
     + TAG("ФАРЫ · 25 000", 80, 980, -6) + TAG("ДВЕРИ · 4 × 15 000", 600, 960, 5) + TAG("ДИСКИ · 60 000", 120, 1380, 3) + TAG("МОТОР «КОНТРАКТНЫЙ» · 120 000", 200, 1440, -3)
     + lab("ИТОГО ДОРОЖЕ, ЧЕМ КУПИЛ", 140, 760, "#4cd964", "#151515", 44, -3),
   vo: "Через месяц Марк стоял на той же разборке. По частям — дороже, чем Толян его купил.", who: "Лис",
   mv: "<b>Та же разборка — смена времени:</b> белый Mark II на месте, вокруг него вырастают ценники на каждую деталь, сумма в углу щёлкает вверх. Кран с магнитом зависает над крышей." },
 { h: "НОВАЯ РАБОТА", tc: "7/8 · 1:06–1:18", bg: "container", y: 700,
   els: () => ch("tolyan", "t", 600, 900, .9, 6) + ch("seryoga", "s", -30, 900, .9, 6)
     + bub("Контрактный, из Японии!<br>Пробег — <em>сорок тысяч!</em>", 440, 720) + bub("А почему наклейка<br>новая, <em>а мотор ржавый?</em>", 40, 1000),
   vo: "Лис: «А Толян нашёл новую работу». Толян: «Контрактный, из Японии! Пробег — сорок тысяч!» Серёга: «А почему наклейка новая, а мотор ржавый?» Лис: «Серёга учится».", who: "Лис + Толян + Серёга",
   mv: "<b>Петля:</b> тот же контейнер, но за кассой теперь Толян — и слово в слово повторяет фразу продавца. Покупатель — Серёга (с толщиномером из 15-й), щурится на наклейку." },
 { h: "МОРАЛЬ", tc: "8/8 · 1:18–1:30", bg: "container", y: 700,
   els: () => `<div class="el" style="left:60px;top:740px;right:60px;z-index:9;background:#0d0e12;border:6px solid #fff;border-radius:30px;padding:26px 30px;color:#fff;font-family:Unbounded;font-weight:900;font-size:35px;line-height:1.4">КОНТРАКТНЫЙ МОТОР:<br><span style="color:#ffd23f">🔦 компрессия и эндоскоп — до покупки<br>📄 номер мотора и гарантия — в договоре<br>🏷️ наклейка с пробегом — не пробег</span></div>`
     + FOX(400, 1200, 280),
   vo: "Контрактный мотор проверяй до покупки: компрессия, эндоскоп. Номер мотора и гарантию — в договор. Наклейка с пробегом — не пробег. А целые машины ниже рынка — в боте Перехват. Сохрани — пока тебе не продали наклейку с мотором.", who: "Лис",
   mv: "<b>Финал:</b> чек-лист на столе контейнера, затем лиса с биноклем (аватарка бота) и подпись про бота. ~1:30, 8 сцен, <b>3 новые локации и новый ракурс</b> (из-под капота), пасхалки — машины прошлых серий." },
];

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els(); if (CLK) document.getElementById("h").insertAdjacentHTML("beforebegin", `<span class="clk">${CLK}</span>`);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>«${sc.vo}»`;
document.getElementById("mv").innerHTML = sc.mv;
["a","b","c","d","e","f","g","h","i"].forEach(p => { const e = document.getElementById(p); });
const sh = document.getElementById("t-shades"); if (sh) sh.style.display = ""; const sh2 = document.getElementById("t2-shades"); if (sh2) sh2.style.display = "";
mouth && document.getElementById("t") && mouth("t", "grin"); document.getElementById("g") && mouth("g", "talk"); document.getElementById("e") && mouth("e", "grin"); document.getElementById("v") && mouth("v", "talk");
window.READY = true;
</script></body></html>
