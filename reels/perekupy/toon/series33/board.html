<script>
// ОТДЕЛЬНАЯ СЕРИЯ (не про Толяна, владелец 10.11): «СЕМЕЙНЫЙ ЧАТ». Гена три месяца выбирает первую машину — точнее, выбирает семейный чат.
// Приёмы (новые): 1) кружочки Telegram — родня спорит видеосообщениями, говорящий в кадре внутри кружка; 2) «документалка» — Гена говорит
// в камеру, рамка REC и подпись-титр; 3) опрос в чате как развязка. Поворот: бот приносит Мерседес… дяди Бори (дороже рынка).
// Бот — разоблачитель (рынок по похожим) и развязка (салатовая Нива владельца через 1 с после публикации, успел первым).
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4, o, extra = "") => el(CHARS[kind](p, o), l, t, 420 * s, 800 * s, z, extra);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 15, fs) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z};${fs ? "font-size:" + fs + "px" : ""}">${html}</div>`;
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
const CAR = (img, l, t, w, z = 3, flip = false) => `<img class="el" src="../../kit/img/${img}" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${flip ? "transform:scaleX(-1)" : ""}">`;
const PHONE = (l, t, inner, w = 520, z = 12) => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:22px;box-shadow:0 0 70px rgba(120,180,255,.4)">${inner}</div>`;
const BOT = (body, fs = 30) => `<div style="font-family:Onest;font-weight:700;font-size:24px;color:#8b93a3">ПЕРЕХВАТ · бот</div><div style="background:#1c1f26;border-radius:22px;padding:16px 20px;margin-top:10px;font-family:Onest;color:#fff;font-size:${fs}px;line-height:1.42">${body}</div>`;
// герои: все новые, кроме Лиса за кадром
const GENA = { jacket: "#3fa34d", pants: "#2b2f37", hair: "#6b4a2b", glasses: true, item: "phone" };
const PALYCH = { jacket: "#6d7f8f", pants: "#3b3f46", hair: "#c9ccd1", mustache: true, ushanka: "#8a6d48" };   // тесть
const BORYA = { jacket: "#2b2b2e", pants: "#232c47", cap: "#151515", chain: true, hair: "#3a2d22" };          // дядя, «только Мерседес»
const VOVAN = { jacket: "#1f4fb8", pants: "#151515", hair: "#d9a441", scarf: "#ffd23f" };                     // брат жены, «только Лада»
const SEMEN = { jacket: "#e8e2d0", pants: "#4f5b3a", hair: "#b0b4ba", beard: true, vest: true };             // продавец-голубятник
// кружочек Telegram: голова героя в круге, имя и длительность — говорящий всегда в кадре
const KR = (o, id, l, t, d = 250, name = "", dur = "0:07", ring = "#5ac8fa", z = 14) => {
  const s = d / 230;
  return `<div class="el" style="left:${l}px;top:${t}px;width:${d}px;height:${d}px;z-index:${z};border-radius:50%;overflow:hidden;border:8px solid ${ring};box-shadow:0 0 0 6px #151515,0 14px 0 6px rgba(0,0,0,.35);background:radial-gradient(circle at 50% 35%,#5a6b85,#2b3445)">
    ${el(CHARS.perekup(id, o), d / 2 - 210 * s, d / 2 - 222 * s, 420 * s, 800 * s, 1)}</div>
    <div class="el" style="left:${l + d / 2 - 110}px;top:${t + d - 6}px;width:220px;z-index:${z + 1};text-align:center;font-family:Onest;font-weight:800;font-size:24px;color:#fff;background:#151515cc;border-radius:12px;padding:2px 0">${name} · ▶ ${dur}</div>`;
};
const CHAT = (t, text, l = 40) => `<div class="el" style="left:${l}px;top:${t}px;z-index:16;background:#17212b;border:5px solid #151515;border-radius:18px;padding:8px 18px;font-family:Onest;font-weight:800;font-size:28px;color:#fff;white-space:nowrap;box-shadow:0 8px 0 #151515">${text}</div>`;
const REC = (name, sub) => `<div class="el" style="left:26px;top:726px;width:1028px;height:770px;z-index:13;border:4px solid rgba(255,255,255,.75);border-radius:8px;pointer-events:none"></div>
  <div class="el" style="left:50px;top:746px;z-index:16;font-family:'JetBrains Mono';font-weight:800;font-size:32px;color:#ff3b30">● REC</div>
  <div class="el" style="left:40px;top:1330px;z-index:16;background:#fff;border-left:16px solid #ffd23f;padding:10px 22px;font-family:Unbounded;font-weight:900;font-size:34px;color:#151515;box-shadow:0 8px 0 #151515">${name}<div style="font-family:Onest;font-weight:800;font-size:24px;color:#555">${sub}</div></div>`;
const POLL = (rows, t = 760, foot = "") => `<div class="el" style="left:40px;top:${t}px;width:600px;z-index:16;background:#17212b;border:6px solid #151515;border-radius:24px;padding:20px 24px;font-family:Onest;color:#fff;box-shadow:0 12px 0 #151515">
  <div style="font-weight:800;font-size:24px;color:#8b93a3">СЕМЬЯ · ОПРОС</div><div style="font-weight:900;font-size:34px;margin:6px 0 12px">Беру Ниву?</div>
  ${rows.map(([t, v, c]) => `<div style="position:relative;margin:8px 0;border-radius:12px;background:#24303c;overflow:hidden;font-weight:800;font-size:28px;padding:8px 14px"><div style="position:absolute;left:0;top:0;bottom:0;width:${v}%;background:${c};opacity:.55"></div><span style="position:relative">${t}</span><b style="position:relative;float:right">${v}%</b></div>`).join("")}${foot}</div>`;
const PIGEON = (l, t, s = 1, flip = false) => `<svg class="el" viewBox="-50 -30 100 60" style="left:${l}px;top:${t}px;width:${100 * s}px;z-index:8;${flip ? "transform:scaleX(-1)" : ""}"><ellipse cx="0" cy="0" rx="26" ry="16" fill="#8f98a6" stroke="#151515" stroke-width="4"/><circle cx="22" cy="-12" r="10" fill="#7a8494" stroke="#151515" stroke-width="4"/><path d="M30 -12 l10 3 -10 3" fill="#ffb02e"/><path d="M-26 0 l-16 -8 v16 z" fill="#6f7886" stroke="#151515" stroke-width="3"/></svg>`;
const S = [
 { h: "ОСТАНОВКА · ДОЖДЬ", tc: "1/9 · 0:00–0:11", bg: "ostanovka", y: 700, els: () => ch("perekup", "gn", 30, 880, .8, 6, GENA)
     + CHAT(730, "👨‍👩‍👧 СЕМЬЯ · <span style='color:#ff3b30'>147 новых</span>", 360)
     + KR(PALYCH, "pl", 400, 830, 230, "Палыч", "0:07") + KR(BORYA, "br", 790, 860, 230, "дядя Боря", "0:12", "#ff7a1a") + KR(VOVAN, "vv", 620, 1160, 210, "Вован", "0:04", "#4cd964")
     + bub("Только японца!<br><em>Остальное — металлолом.</em>", 330, 1100, 17, 30),
   vo: "Палыч (кружок): «Гена, бери только японца. Остальное — металлолом». Дядя Боря: «Какой японец?! Только Мерседес! Я двадцать лет на нём!» Вован: «Лада! Запчасти — копейки!» Лис: «Гена третий месяц выбирает первую машину. Точнее — выбирает семейный чат».", who: "Палыч + Боря + Вован + Лис",
   mv: "<b>Отдельная серия, все герои новые.</b> <b>Новый фон — остановка под дождём</b> (козырёк, расписание № 47, фонарь, лужи с огнями). Гена (зелёная куртка, очки) мокнет, телефон разрывается. <b>Приём 1 — кружочки Telegram:</b> родня спорит видеосообщениями, кружки выскакивают по очереди, у говорящего шевелятся губы — говорящий в кадре, пузырь у его кружка. Хук — первая реплика тестя." },
 { h: "ДОКУМЕНТАЛКА · 94-й ДЕНЬ", tc: "2/9 · 0:11–0:20", bg: "lift", y: 700, els: () => ch("perekup", "gn", 330, 840, .9, 6, { ...GENA, item: "", look: "o" })
     + REC("ГЕНА, 32 года", "ищет первую машину · 94-й день") + bub("Нашёл Короллу — пока тесть думал,<br><em>продали.</em> Нашёл Октавию —<br>пока голосовали, <em>продали.</em>", 60, 760, 17, 30),
   vo: "Гена (в камеру): «Нашёл Короллу — пока тесть думал, продали. Нашёл Октавию — пока голосовали, продали». Лис: «Хорошие машины уходят за минуты. А семейный чат думает сутками».", who: "Гена + Лис",
   mv: "<b>Новый фон — кабина лифта</b> (зеркало, кнопки, табло «7▲», наклейки «Ремонт дверей», «Вова + Лена»). <b>Приём 2 — «документалка»:</b> Гена смотрит прямо в камеру, рамка видоискателя с ● REC, титр «ГЕНА, 32 года · 94-й день». Лёгкая тряска «ручной камеры»." },
 { h: "БЕЗ ГОЛОСОВАНИЯ", tc: "3/9 · 0:20–0:28", bg: "lift", y: 700, els: () => ch("perekup", "gn", -10, 880, .8, 6, GENA)
     + PHONE(470, 760, BOT(`<b>⚙️ Фильтр</b><br>🚗 любая машина<br>💰 до 800 000 ₽ · 🏙 мой город<br>🔔 новое объявление → сразу<br><span style="color:#ffd23f">🎁 пробный день — бесплатно</span>`, 28), 540)
     + bub("Всё.<br><em>Без голосования.</em>", 40, 760),
   vo: "Гена: «Всё. Без голосования». Лис: «Гена ставит „Перехват“ — и впервые за три месяца ничего не пишет в чат».", who: "Гена + Лис",
   mv: "Тот же лифт. Гена настраивает фильтр в боте: иномарка до 800 000, свой город, уведомления сразу. На экране — «пробный день — бесплатно» (текст на экране, голос его не читает). Табло лифта едет 7 → 1." },
 { h: "7:40 · УВЕДОМЛЕНИЕ", tc: "4/9 · 0:28–0:36", bg: "lift", y: 700, els: () => ch("perekup", "gn", -10, 880, .8, 6, { ...GENA, look: "o" })
     + PHONE(450, 740, BOT(`<b>Mercedes W124 · 1994 · 690 000 ₽</b><br>📊 рынок ≈ 480 000 ₽ (27 объявл.)<br>👤 продавец: <b style="color:#ff7a1a">Борис</b><br>📞 контакт — из описания закрытого канала`, 27), 580)
     + bub("Дядя<br><em>Боря?!</em>", 40, 760),
   vo: "Гена: «Дядя Боря?!» Лис: «Тот самый дядя Боря. Который советовал только Мерседес. Свой. На двести тысяч дороже рынка».", who: "Гена + Лис",
   mv: "<b>Поворот:</b> утро, лифт. Первое уведомление — Мерседес W124 из закрытого канала (бот достал контакт из описания канала — реальная новая функция). Продавец — дядя Боря. Бот показывает рынок по похожим объявлениям — дороже на 210 тысяч. Зум на имя «Борис»." },
 { h: "СЕМЕЙНАЯ СКИДКА", tc: "5/9 · 0:36–0:42", bg: "lift", y: 700, els: () => ch("perekup", "gn", -10, 880, .8, 6, { ...GENA, look: "angry" })
     + CAR("w124/w124_34.png", 560, 1250, 480, 5) + KR(BORYA, "br", 560, 760, 280, "дядя Боря", "0:09", "#ff7a1a")
     + bub("Генка, ну это…<br><em>семейная скидка будет!</em>", 330, 1080, 17, 32),
   vo: "Дядя Боря (кружок): «Генка, ну это… семейная скидка будет!»", who: "Дядя Боря",
   mv: "Кружок дяди Бори выскакивает сам — он увидел, что Гена смотрел объявление. Рядом фото его Мерседеса. Гена хмурится. Пузырь — у кружка Бори." },
 { h: "+1 С · НИВА", tc: "6/9 · 0:42–0:50", bg: "lift", y: 700, els: () => ch("perekup", "gn", -10, 880, .8, 6, { ...GENA, look: "grin" })
     + PHONE(450, 740, BOT(`<b style="color:#ff7a1a">🔥 −11% к рынку</b><br><b>Lada Niva 4×4 · 2018 · 650 000 ₽</b><br>📍 двор на Садовой · голубятня<br>⏱ 1 с после публикации`, 28), 580)
     + lab("ЛИФТ: ДВЕРИ ОТКРЫВАЮТСЯ", 30, 1330, "#ffd23f", "#151515", 34, -3),
   vo: "Лис: «И тут, через секунду после публикации, — Нива. На восемьдесят тысяч ниже рынка. Двери лифта открываются…»", who: "Лис",
   mv: "Второе уведомление сразу за первым: салатовая Нива 4×4 −11% к рынку (рынок ≈ 730 000), через 1 с после публикации. Двери лифта разъезжаются — Гена выбегает (переход «двери» в следующую сцену)." },
 { h: "ГОЛУБЯТНЯ · СЕМЁНЫЧ", tc: "7/9 · 0:50–0:59", bg: "golubyatnya", y: 700, els: () => CAR("niva/niva_side.svg", 200, 1120, 760, 5)
     + ch("perekup", "sm", 760, 880, .8, 6, SEMEN) + ch("perekup", "gn", -10, 880, .8, 6, GENA) + PIGEON(520, 1140, 1) + PIGEON(700, 1142, .9, true)
     + bub("Ты первый. Уже двенадцать звонят.<br><em>Голубей не пугай — они машину охраняют.</em>", 260, 760, 17, 28)
     + CHAT(1420, "📞 Семёныч: <span style='color:#ff3b30'>12 пропущенных</span>", 330),
   vo: "Семёныч: «Ты первый. Мне уже двенадцать человек звонят. Только голубей не пугай — они машину охраняют». Гена: «Беру»", who: "Семёныч + Гена",
   mv: "<b>Новый фон — старый двор с голубятней</b> (сарайки, бельё, тополь, голуби на крыше). <b>Новый герой — Семёныч</b>, голубятник в тельняшке и с бородой. У него телефон: «12 пропущенных» растёт. Гена успел первым — бот как развязка. Голуби расхаживают по капоту. <b>Машина — салатовая Нива с картинки владельца</b> (нарисована в нашем стиле)." },
 { h: "ОПРОС В ЧАТЕ", tc: "8/9 · 0:59–1:08", bg: "golubyatnya", y: 700, els: () => ch("perekup", "gn", 20, 960, .8, 6, GENA)

     + KR(PALYCH, "pl", 700, 740, 200, "Палыч", "0:02") + KR(BORYA, "br", 820, 1000, 200, "дядя Боря", "0:03", "#ff7a1a") + KR(VOVAN, "vv", 700, 1250, 190, "Вован", "0:02", "#4cd964")
     + bub("Опрос закрыт.<br><em>Я уже за рулём.</em>", 300, 1110, 17, 32),
   vo: "Палыч: «Ниву?! Не японец же!» Боря: «А как же мой Мерседес?» Вован: «Я же говорил — Лада!» Гена: «Опрос закрыт. Я уже за рулём».", who: "Палыч + Боря + Вован + Гена",
