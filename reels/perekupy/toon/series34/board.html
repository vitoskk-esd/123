<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>

<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>

<script>
// «ТОЛЯН: СО СТА ТЫСЯЧ · 8» — «Школьная парковка». Капитал 350 000 (итог части 7). Физрук Ильдар из части 7 позвал Толяна к учителям.
// Приёмы (новые): 1) «линейка» машин учителей с табличками + школьный звонок между сценами; 2) меловая доска — математик пишет рукой, Толян «у доски»;
// 3) классный журнал — Толяну ставят оценки за сделки; 4) расписание уроков = фильтры бота. Поворот: Толян САМ поднимает цену трудовику — и получает
// заказ всей учительской. Крючок: пустое место директора → часть 9.
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4, o, extra = "") => el(CHARS[kind](p, o), l, t, 420 * s, 800 * s, z, extra);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 15, fs) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z};${fs ? "font-size:" + fs + "px" : ""}">${html}</div>`;
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
const CAR = (img, l, t, w, z = 3, flip = false) => `<img class="el" src="../../kit/img/${img}" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${flip ? "transform:scaleX(-1)" : ""}">`;
const PHONE = (l, t, inner, w = 520, z = 12) => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:22px;box-shadow:0 0 70px rgba(120,180,255,.4)">${inner}</div>`;
const BOT = (body, fs = 30) => `<div style="font-family:Onest;font-weight:700;font-size:24px;color:#8b93a3">ПЕРЕХВАТ · бот</div><div style="background:#1c1f26;border-radius:22px;padding:16px 20px;margin-top:10px;font-family:Onest;color:#fff;font-size:${fs}px;line-height:1.42">${body}</div>`;
const CAP = (v, d = "") => `<div class="el" style="right:30px;top:1440px;z-index:20;font-family:'JetBrains Mono';font-weight:800;font-size:38px;color:#fff;background:#151515;border:5px solid #4cd964;border-radius:16px;padding:2px 16px;white-space:nowrap">💰 ${v} ₽${d}</div>`;
const BELL = (l, t) => `<div class="el" style="left:${l}px;top:${t}px;z-index:16;font-size:90px;transform:rotate(-14deg);filter:drop-shadow(0 6px 0 #151515)">🔔</div>`;
// мел на доске: рукописный Caveat, белый с лёгким размытием; перечёркивание — красным мелом
const CHALK = (l, t, html, fs = 64, z = 6) => `<div class="el" style="left:${l}px;top:${t}px;z-index:${z};font-family:Caveat;font-weight:700;font-size:${fs}px;line-height:1.05;color:#f1f4ee;text-shadow:0 0 2px rgba(255,255,255,.6);white-space:nowrap">${html}</div>`;
const STRIKE = `<span style="position:relative;display:inline-block">$1<i style="position:absolute;left:-6%;right:-6%;top:52%;height:7px;background:#ff6b5a;border-radius:4px;transform:rotate(-6deg)"></i></span>`;
// классный журнал: строка «Толян — сделка — оценка» красной ручкой
const JOURNAL = (rows, l = 40, t = 1250) => `<div class="el" style="left:${l}px;top:${t}px;width:520px;z-index:18;background:#fbf7ea;border:6px solid #151515;border-radius:10px;box-shadow:0 12px 0 #151515;transform:rotate(-2deg);font-family:Onest;color:#222">
  <div style="background:#2f6db5;color:#fff;font-family:Unbounded;font-weight:900;font-size:24px;padding:8px 16px">КЛАССНЫЙ ЖУРНАЛ · 8 «Т»</div>
  ${rows.map(([w, g]) => `<div style="display:flex;justify-content:space-between;align-items:center;border-top:3px solid #c9d6e6;padding:4px 16px;font-weight:800;font-size:26px">${w}<b style="font-family:Caveat;font-size:58px;color:#d62d20;line-height:1">${g}</b></div>`).join("")}</div>`;
const SIGN = (l, t, text, c = "#fff") => `<div class="el" style="left:${l}px;top:${t}px;z-index:9;background:${c};border:5px solid #151515;border-radius:10px;padding:4px 12px;font-family:Unbounded;font-weight:900;font-size:22px;color:#151515;box-shadow:0 6px 0 #151515;white-space:nowrap">${text}</div>`;
const ILDAR = { jacket: "#1f4fb8", pants: "#1f4fb8", hair: "#1d1d1f", cap: "#fff" };          // из части 7
const LEV = { jacket: "#7a5a3a", pants: "#4a3a2a", hair: "#aeb4bb", glasses: true, tie: "#2f6db5", mustache: true };   // математик Лев Маркович
const EGOR = { coat: "#2f5d9c", jacket: "#2f5d9c", pants: "#2b2f37", hair: "#c9ccd1", beard: true };        // трудовик Егорыч, синий халат
const DIR = { jacket: "#2b2f37", pants: "#2b2f37", hair: "#3a2d22", tie: "#c0392b" };                       // директор Виктор Андреевич
const S = [
 { h: "ШКОЛЬНАЯ ПАРКОВКА · ЗВОНОК", tc: "1/9 · 0:00–0:09", bg: "shkpark", y: 700, els: () => CAP("350 000")
     + ch("tolyan", "t", 600, 860, .8, 6) + ch("perekup", "il", 120, 870, .8, 6, ILDAR) + BELL(900, 730)
     + bub("Брат, построил всех,<br><em>как на линейке!</em>", 60, 740, 15, 36),
   vo: "Лис: «Триста пятьдесят тысяч. Физрук Ильдар позвал Толяна в школу: учителя меняют машины. Большая перемена — двадцать минут». Звонок. Ильдар: «Брат, построил всех, как на линейке!»", who: "Лис + Ильдар",
   mv: "<b>Часть 8, капитал 350 000 (итог части 7).</b> <b>Новый фон — парковка учителей с другой стороны</b>: кирпичная стена, панно «ЗНАНИЕ — СИЛА», флагшток, сетка-забор, места с табличками. <b>Ильдар — из части 7</b> (отсылка). <b>Приём 1 — школьный звонок:</b> колокольчик дребезжит, звонок — переход между сценами." },
 { h: "ЛИНЕЙКА МАШИН", tc: "2/9 · 0:09–0:15", bg: "shkpark", y: 700, els: () => CAP("350 000").replace("top:1440px", "top:740px")
     + CAR("evo/evo_side.png", 5, 1318, 300, 6) + CAR("corolla/corolla.png", 290, 1330, 300, 6) + CAR("vaz2105/vaz2105_side.png", 560, 1328, 290, 6)
     + ch("perekup", "il", 75, 1062, .5, 4, ILDAR) + ch("perekup", "lv", 355, 1062, .5, 4, LEV) + ch("perekup", "eg", 615, 1062, .5, 4, EGOR)
     + SIGN(20, 1450, "1 «А» · Эволюшн") + SIGN(300, 1450, "2 «Б» · Королла") + SIGN(580, 1450, "3 «В» · «пятёрка»")
     + `<div class="el" style="left:890px;top:1130px;z-index:9;font-family:Unbounded;font-weight:900;font-size:200px;color:#c0392b;-webkit-text-stroke:9px #151515;paint-order:stroke fill">?</div>`,
   vo: "Лис: «Математик — Королла. Трудовик — „пятёрка“. И пустое место директора».", who: "Лис",
   mv: "<b>Приём 2 — «линейка»:</b> машины учителей стоят в ряд, как классы на линейке, над каждой табличка «1 „А“ · Эволюшн», «2 „Б“ · Королла», «3 „В“ · „пятёрка“». Камера едет вдоль ряда и останавливается на пустом месте «ДИРЕКТОР» с большим красным «?» — крючок на часть 9. <b>Новые герои — математик Лев Маркович</b> (очки, усы, галстук) и <b>трудовик Егорыч</b> (синий халат, борода)." },
 { h: "КАБИНЕТ · К ДОСКЕ", tc: "3/9 · 0:15–0:23", bg: "kabinet", y: 300, els: () => ""
     + CHALK(120, 370, "Королла 2012<br>= 1 000 000 ₽", 76) + CHALK(150, 530, "(аксиома)", 58)
     + ch("perekup", "lv", 650, 640, .78, 6, LEV) + ch("tolyan", "t", 80, 660, .78, 6)
     + bub("Анатолий, к доске.<br><em>Моя Королла — миллион.</em><br>Это аксиома.", 560, 520, 15, 30),
   vo: "Лев Маркович: «Анатолий, к доске. Моя Королла стоит миллион. Это аксиома».", who: "Лев Маркович",
   mv: "<b>Новый фон — кабинет математики</b> (меловая доска, портреты учёных, «π ≈ 3,14», глобус, парты). <b>Приём 3 — мел на доске:</b> математик пишет от руки — буквы появляются штрих за штрихом, со скрипом мела. Толян стоит «у доски», как на уроке." },
 { h: "ДОСКА · БОТ · «ПЯТЬ»", tc: "4/9 · 0:23–0:32", bg: "kabinet", y: 300, els: () => ""
     + CHALK(120, 370, "Королла 2012<br>= " + STRIKE.replace("$1", "1 000 000 ₽"), 76) + CHALK(560, 470, "≈ 820 000 ₽<br><span style='font-size:46px'>(31 объявл.)</span>", 70)
     + ch("perekup", "lv", 650, 640, .78, 6, { ...LEV, look: "o" }) + ch("tolyan", "t", 80, 660, .78, 6)
     + PHONE(330, 860, BOT(`<b>Toyota Corolla 2012</b><br>📊 рынок ≈ 820 000 ₽<br>(31 объявл.)`, 24), 330, 14)
     + JOURNAL([["Королла · расчёт", "5"]], 530, 960)
     + bub("Бот говорит — восемьсот двадцать.<br><em>По тридцати одному объявлению.</em>", 30, 600, 15, 28),
   vo: "Толян: «Бот говорит — восемьсот двадцать. По тридцати одному объявлению». Лев Маркович: «…Садитесь. Пять».", who: "Толян + Лев Маркович",
   mv: "Толян показывает телефон: бот «Перехват» считает рынок по похожим объявлениям. Математик сам зачёркивает «1 000 000» красным мелом и пишет «≈ 820 000». <b>Приём 4 — классный журнал:</b> в журнале «8 „Т“» появляется первая оценка Толяну — красная «5». Королла дорогая — Толян её не берёт; позже бот найдёт математику белую Гранту." },
 { h: "МАСТЕРСКАЯ · ЕГОРЫЧ", tc: "5/9 · 0:32–0:42", bg: "masterskaya", y: 600, els: () => CAP("350 000").replace("top:1440px", "top:1340px")
     + CAR("vaz2105/vaz2105_34.png", 380, 1050, 600, 3) + ch("perekup", "eg", 700, 780, .8, 6, EGOR) + ch("tolyan", "t", 20, 800, .8, 6)
     + bub("«Пятёрка». Сам перебирал, каждую гайку.<br><em>Сто двадцать — и забирай.</em>", 260, 640, 15, 30)
     + lab("РЫНОК ≈ 180 000", 40, 1300, "#ffd23f", "#151515", 40, -3),
   vo: "Лис: «А в мастерской Толяна ждал трудовик Егорыч». Егорыч: «„Пятёрка“. Сам перебирал, каждую гайку. Сто двадцать — и забирай». Лис: «Рынок такой „пятёрки“ — сто восемьдесят. Егорыч не знал. Толян — знал».", who: "Лис + Егорыч",
   mv: "<b>Новый фон — школьная мастерская труда</b> (стенд с инструментами, тиски, станок, плакат «Техника безопасности», стружка на полу). «Пятёрка» Егорыча вкатана прямо в мастерскую, капот открыт. Плашка «РЫНОК ≈ 180 000» — Толян знает, что Егорыч продешевил на треть." },
 { h: "ЧЕСТНАЯ ЦЕНА", tc: "6/9 · 0:42–0:51", bg: "masterskaya", y: 600, els: () => CAP("190 000", " <span style='color:#ff3b30'>−160</span>").replace("top:1440px", "top:1340px")
     + CAR("vaz2105/vaz2105_34.png", 380, 1050, 600, 3) + ch("perekup", "eg", 700, 780, .8, 6, { ...EGOR, look: "o" }) + ch("tolyan", "t", 20, 800, .8, 6)
     + bub("Егорыч… ты продешевил.<br><em>Беру за сто шестьдесят.</em>", 30, 640, 15, 32)
     + JOURNAL([["Королла · расчёт", "5"], ["«пятёрка» · честность", "5+"]], 20, 1190),
   vo: "Толян: «Егорыч… ты продешевил. Беру за сто шестьдесят». Егорыч: «Ты чего, парень… сам цену поднял?»", who: "Толян + Егорыч",
   mv: "<b>Поворот:</b> Толян сам поднимает цену — 160 вместо 120 (всё ещё ниже рынка 180). Егорыч ошарашен. Капитал 350 → 190 000 (купил «пятёрку»). В журнале — «5+» за честность." },
 { h: "УЧИТЕЛЬСКАЯ · ЗАЯВКА", tc: "7/9 · 0:51–0:58", bg: "uchitelskaya", y: 700, els: () => CAP("190 000")
     + ch("perekup", "dr", 360, 840, .82, 7, DIR) + ch("perekup", "lv", 680, 880, .7, 5, LEV) + ch("perekup", "il", 830, 880, .7, 5, ILDAR) + ch("perekup", "eg", 160, 880, .7, 5, EGOR)
     + ch("tolyan", "t", -40, 900, .78, 6) + bub("Анатолий, у нас к вам…<br><em>коллективная заявка.</em>", 300, 700, 15, 34),
   vo: "Лис: «Учительская узнала об этом за одну перемену». Директор: «Анатолий, у нас к вам… коллективная заявка».", who: "Лис + Директор",
   mv: "<b>Новый фон — учительская</b> (доска расписания, шкаф с журналами, фикус, стол с чайником и кружками). <b>Новый герой — директор Виктор Андреевич</b> (тёмный костюм, красный галстук). Учителя за его спиной — Лев Маркович, Ильдар, Егорыч." },
 { h: "РАСПИСАНИЕ = ФИЛЬТРЫ", tc: "8/9 · 0:58–1:07", bg: "uchitelskaya", y: 140, els: () => CAP("190 000").replace("top:1440px", "top:880px")
     + `<div class="el" style="left:92px;top:298px;width:520px;z-index:8;background:#fff;padding:4px 8px;font-family:Onest;font-weight:800;font-size:25px;line-height:48px;color:#151515">
        <div>1 урок · Ларгус до 700 — <b>Ильдар</b></div><div>2 урок · Гранта до 800 — <b>Лев М.</b></div><div>3 урок · Нива до 600 — <b>Егорыч</b></div>
        <div>4 урок · Веста до 1 млн — <b>завуч</b></div><div>5 урок · Рио до 900 — <b>химичка</b></div><div>6 урок · Солярис — <b>библиотекарь</b></div></div>`
     + ch("tolyan", "t", 640, 520, .8, 6) + PHONE(40, 650, BOT(`🔔 <b>Lada Largus 2017 · 690 000 ₽</b><br>фильтр «1 урок» · ⏱ 1 с после публикации<br>🔔 <b>Lada Granta 2020 · 780 000 ₽</b><br>фильтр «2 урок» · ⏱ 1 с<br><img src="../../kit/img/granta/granta_34.png" style="width:70%;margin-top:6px;border-radius:10px;background:#e8ecf0">`, 25), 560),
   vo: "Лис: «Шесть учителей — шесть фильтров. Толян вписал их в бота, как в расписание уроков. И бот начал присылать — через секунду после публикации».", who: "Лис",
   mv: "<b>Приём 5 — расписание уроков превращается в фильтры бота:</b> строки на доске расписания одна за другой становятся фильтрами «Перехвата» («1 урок · Ларгус до 700 — Ильдар»…). Бот — инструмент Толяна для клиентов (в PRO фильтров без лимита). Уведомления «⏱ 1 с после публикации» сыплются одно за другим — среди них <b>белая Гранта</b> для математика (машина владельца)." },
