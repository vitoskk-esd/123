<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css"><link rel="stylesheet" href="../cine.css"><link rel="stylesheet" href="masks.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}

</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="fr" style="left:0"><div class="sc" id="A"></div><div class="lb" id="la">A</div></div>
<div class="arrow">→</div>
<div class="fr" style="left:560px"><div class="sc" id="B"></div><div class="lb" id="lbb">B</div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="../chars4.js"></script><script src="../chars5.js"></script>
<script src="bgs.js"></script><script src="../cine.js"></script><script src="props.js"></script><script src="props72.js"></script>
<script>
// «ШИНОМОНТАЖ: ПЕРВЫЙ СНЕГ» (киношный формат, отдельный ролик, с матом — владелец 15.11; в облачках — со звёздочками).
// Первый снег, очередь до горизонта. Настя купила у Жоры «Приору» — «резина новая». Колян: «Новая, бл*дь. Ей лет пятнадцать».
// Четыре разные шины: летняя, зимняя, шипованная и докатка. Протектор — 0 мм. «Подешевле — это пешком». Жора: «Резину не меняем — продаём!» — «Иди на**й, в конец очереди».
// Настя находит Lexus NX через бота: «Оху*ть. Первая нормальная машина за сезон». ОБЛОЖКА (кадр 0): Настя держит телефон с ботом + плашка «ШИНОМОНТАЖ: / ПЕРВЫЙ СНЕГ».
// Приёмы (новые): четыре карточки шин по очереди; протекторомер «0 мм»; снегопад; очередь машин до горизонта и талон №48.
const Z = (p, x, foot, h, o = {}, pose = {}, extra = {}) => ch("perekup", p, x, foot, h, { ...ZHORA, ...o }, pose, extra);
const K = (p, x, foot, h, o = {}, pose = {}, extra = {}) => ch("perekup", p, x, foot, h, { ...KOL, ...o }, pose, extra);
const N = (p, x, foot, h, pose = {}, extra = {}) => NSC(ch("vika", p, x, foot, h, null, pose, extra));
const SM_L = glow(540, 700, 380, "#ffffff", .25);
const BX_L = glow(800, 410, 260, "#e8eef4", .35);
const OC_L = glow(540, 760, 380, "#ffd27a", .25);
const HANDTIRE = (x, y, id = "ht", z = 12) => `<div id="${id}" style="position:absolute;left:${x}px;top:${y}px;z-index:${z}">${TIREPIC("summer", 300)}</div>`;
const S = [
 { h: "ОБЛОЖКА · НАСТЯ С БОТОМ → ПЕРВЫЙ СНЕГ, ОЧЕРЕДЬ", tc: "1/5 · 0:00–0:12",
   A: { def: () => { const H = HOLDPHONE("vika", "np", 540, 2090, 1680, null, LXCARD(), { rim: "#ffffff", side: 1 });
       return { bg: "shinomontazh", farBlur: 8, mid: NSC(H.mid), lights: H.lights + SM_L, over: TITLE("ШИНОМОНТАЖ:", "ПЕРВЫЙ СНЕГ") + SNOW(50) }; }, shot: { x: 540, y: 960, s: 1 } },
   B: { def: () => ({ bg: "ochered", over: SNOW(70, "sn2") + TICKET(80, 1420, 48), lights: OC_L }), shot: { x: 540, y: 1100, s: 1.04 } },
   vo: "Лис: «Первый снег. Шиномонтаж “У Коляна”. Очередь — до горизонта».", who: "Лис",
   mv: "<b>Кадр 0 — обложка с телефоном</b>: <b>новая героиня — Настя</b> (мятный пуховик, рыжие волосы) держит телефон: в боте «Lexus NX · 2019 · 2 690 000 ₽ · рынок ≈ 3 000 000 · 🔥 −10% · ⏱ 1 с»; плашка «ШИНОМОНТАЖ: / ПЕРВЫЙ СНЕГ»; идёт снег. B — <b>новый фон — очередь машин до горизонта</b> (снег, фонари, указатель «ШИНОМОНТАЖ → 200 м»); <b>приём: талон «ВАША ОЧЕРЕДЬ №48»</b>." },
 { h: "«РЕЗИНА НОВАЯ» → «НОВАЯ, БЛ*ДЬ. ЕЙ ЛЕТ ПЯТНАДЦАТЬ»", tc: "2/5 · 0:12–0:24",
   A: { def: () => ({ bg: "shinomontazh", mid: car(PRW, 200, 1620, 760, { z: 5, sheen: .4 }) + K("ka", 160, 1880, 840, {}, { armR: -60 }, { rim: "#ffffff", side: 1, z: 7 }) + N("na", 900, 1880, 820, { armL: 50 }, { rim: "#ffffff", side: -1, z: 7 }), over: SNOW(50, "sn3"), lights: SM_L }), shot: { x: 540, y: 1150, s: 1.04 },
     bubbles: [{ p: "ka", html: "Следующий!<br><em>Что у вас?</em>", fs: 30 }, { p: "na", html: "Купила у Жоры.<br><em>Резина новая.</em>", fs: 30 }], talk: ["na"] },
   B: { def: () => ({ bg: "shinobox", farBlur: 3, mid: K("kb", 420, 1900, 980, {}, { armR: -100 }, { rim: "#e8eef4", side: 1, z: 7 }) + HANDTIRE(560, 1000), lights: BX_L }), shot: { x: 540, y: 1150, s: 1.06 },
     bubbles: [{ p: "kb", html: "Новая, бл*дь.<br><em>Ей лет пятнадцать.</em>", fs: 42 }], talk: ["kb"] },
   vo: "Колян: «Следующий! Так, девушка, что у вас?» Настя: «Купила машину у Жоры. Сказал — резина новая». Колян: «Новая, блядь. Ей лет пятнадцать».", who: "Колян + Настя",
   mv: "A — <b>новый фон — шиномонтаж «У КОЛЯНА»</b> снаружи (бокс, штабеля шин, сугробы); белая «Приора» на штамповках; <b>новый герой — шиномонтажник Колян</b> (синий комбинезон, чёрная шапка, усы). B — <b>новый фон — бокс внутри</b> (стеллаж с шинами, плакат «ЗИМА БЛИЗКО», компрессор, окно со снегом): Колян держит лысую шину." },
 { h: "ЧЕТЫРЕ РАЗНЫЕ ШИНЫ → «ЭТО ВЫСТАВКА»", tc: "3/5 · 0:24–0:38",
   A: { def: () => ({ bg: "shinobox", farBlur: 10, mid: TIRES4(500), lights: "" }), shot: { x: 540, y: 1000, s: 1 } },
   B: { def: () => ({ bg: "shinobox", farBlur: 2, mid: K("kc", 300, 1880, 900, {}, { armL: 30, armR: -120 }, { rim: "#e8eef4", side: 1, z: 7 }) + N("nb", 820, 1880, 840, { armL: 40 }, { rim: "#e8eef4", side: -1, z: 7 }), lights: BX_L }), shot: { x: 540, y: 1150, s: 1.04 },
     bubbles: [{ p: "kc", html: "Ё* твою мать,<br><em>это выставка.</em>", fs: 30 }, { p: "nb", html: "А можно<br><em>подешевле?</em>", fs: 30 }], talk: ["kc"] },
   vo: "Лис: «На машине стояли четыре разные шины». Колян: «Летняя, зимняя, шипованная и… докатка. Ёб твою мать, это не машина, это выставка». Настя: «А можно как-то… подешевле?»", who: "Лис + Колян + Настя",
   mv: "A — <b>приём 1: четыре карточки шин</b> выпрыгивают по очереди под слова: «ЛЕТНЯЯ», «ЗИМНЯЯ», «ШИПЫ», «ДОКАТКА» (жёлтый диск). B — Колян разводит руками, Настя робко." },
 { h: "ПРОТЕКТОР 0 ММ → ЖОРА: «РЕЗИНУ ПРОДАЁМ!»", tc: "4/5 · 0:38–0:50",
   A: { def: () => ({ bg: "shinobox", farBlur: 3, mid: K("kd", 330, 1900, 980, {}, { armR: -100 }, { rim: "#e8eef4", side: 1, z: 7 }) + TREAD(560, 1050), lights: BX_L }), shot: { x: 540, y: 1150, s: 1.06 },
     bubbles: [{ p: "kd", html: "Протектор — ноль.<br><em>Подешевле — это пешком.</em>", fs: 40 }], talk: ["kd"] },
   B: { def: () => ({ bg: "shinomontazh", farBlur: 2, mid: K("ke", 280, 1880, 880, {}, { armR: -150 }, { rim: "#ffffff", side: 1, z: 7 }) + Z("za", 820, 1880, 860, { look: "grin" }, { armL: 60 }, { rim: "#ffffff", side: -1, z: 7 }), over: SNOW(50, "sn4"), lights: SM_L }), shot: { x: 540, y: 1150, s: 1.04 },
     bubbles: [{ p: "za", html: "Резину не меняем —<br><em>продаём!</em>", fs: 28 }, { p: "ke", html: "Иди на**й.<br><em>В конец очереди.</em>", fs: 28 }], talk: ["ke"] },
   vo: "Колян: «Протектор — ноль миллиметров. Подешевле — это пешком». Лис: «Тут на шиномонтаж заехал Жора». Жора: «Колян, привет! Резину не меняем — продаём!» Колян: «Жора, иди нахуй. В конец очереди».", who: "Колян + Лис + Жора",
   mv: "A — <b>приём 2: протекторомер</b> крупно — цифры падают 8 → 3 → <b>0 мм</b>, шкала в красной. B — Жора заезжает со своим «товаром», Колян отправляет его в конец очереди (на талоне — №112)." },
 { h: "БОТ: LEXUS NX → «ПЕРВАЯ НОРМАЛЬНАЯ ЗА СЕЗОН» → ФИНАЛ", tc: "5/5 · 0:50–1:08",
   A: { def: () => { const H = HOLDPHONE("vika", "nf", 540, 2000, 1400, null, LXCARD("lcc2"), { rim: "#ffffff", side: 1 });
       return { bg: "shinomontazh", farBlur: 5, mid: NSC(H.mid), over: SNOW(40, "sn5"), lights: H.lights + SM_L }; }, shot: { x: 540, y: 1000, s: 1.02 },
     bubbles: [{ p: "nf", html: "Лексус, один хозяин, ниже рынка.<br><em>И зимняя резина в комплекте.</em>", fs: 34 }], talk: ["nf"] },
   B: { def: () => ({ bg: "shinomontazh", mid: car(LXN, 260, 1640, 640, { z: 5, sheen: .5 }) + K("kf", 170, 1880, 840, { look: "o" }, { armL: 30 }, { rim: "#ffffff", side: 1, z: 7 }) + N("nc", 920, 1880, 800, {}, { rim: "#ffffff", side: -1, z: 7 }), over: SNOW(40, "sn6"), lights: SM_L }), shot: { x: 540, y: 1150, s: 1.04 },
     bubbles: [{ p: "kf", html: "Оху*ть. Первая нормальная<br><em>машина за сезон.</em>", fs: 34 }], talk: ["kf"] },
   vo: "Лис: «Новую машину Настя нашла через бота “Перехват”». Настя: «Лексус, один хозяин, ниже рынка. И зимняя резина в комплекте». Колян: «Охуеть. Первая нормальная машина за сезон». Лис: «Хочешь ездить, а не стоять в очереди, — ищи машину в боте “Перехват”: хорошие варианты ниже рынка через секунду после публикации». Затем — <b>последний кадр: только карточка бота</b>.", who: "Лис + Настя + Колян",
   mv: "A — Настя с телефоном: Lexus NX в боте. B — белый Lexus у шиномонтажа, Колян в изумлении; дальше — карточка бота." },
];
const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const put = (id, f) => { const el = document.getElementById(id);
  if (f.split) { const [dl, sl, dr, sr] = f.split();
    el.innerHTML = `<div class="cf">${HALF(C.frame(dl, sl), -1)}${HALF(C.frame(dr, sr), 1)}<div style="position:absolute;left:532px;top:0;width:16px;height:1920px;background:#fff;box-shadow:0 0 30px #000;z-index:80"></div>
      ${C.frame({ hud: f.hud }, { x: 540, y: 960, s: 1 }).replace('<div class="cf">', '<div style="position:absolute;inset:0;z-index:90;pointer-events:none">').replace(/<div class="vig"><\/div>/, "")}</div>`; }
  else { const def = f.def(); def.bubbles = f.bubbles || []; el.innerHTML = C.frame(def, f.shot); }
  if (f.sketch) el.querySelector(".cf").style.filter = SKF;
  (f.talk || []).forEach(p => C.mouth(el, p, "talk")); return el; };
const a = put("A", sc.A), b = put("B", sc.B);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
document.fonts.ready.then(() => { C.layout(a); C.layout(b); window.READY = true; });
</script></body></html>
