<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#0b0c10;z-index:5}
.hd b{font-family:Unbounded;font-weight:900;font-size:30px;color:#151515;background:#ffd23f;border:5px solid #151515;border-radius:12px;padding:4px 14px}
.hd span{font-family:Unbounded;font-weight:800;font-size:26px;color:#fff}.hd i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#8b93a3}
.view{position:absolute;left:0;top:96px;width:1080px;height:820px;overflow:hidden;border-bottom:6px solid #ffd23f}
.stage{position:absolute;left:0;width:1080px;height:1920px}
.el{position:absolute}.el svg{width:100%;height:100%;overflow:visible}
.lab{position:absolute;font-family:Unbounded;font-weight:900;border:6px solid #151515;border-radius:18px;padding:6px 18px;box-shadow:0 8px 0 #151515;white-space:nowrap}
.bub{position:absolute;background:#0d0e12;border:5px solid #fff;border-radius:30px;padding:16px 24px;font-family:Unbounded;font-weight:800;font-size:36px;line-height:1.12;color:#fff;box-shadow:0 0 0 6px #0d0e12}
.bub em{font-style:normal;color:#ff3b30}
.txt{position:absolute;left:40px;right:40px;top:940px;color:#fff}
.txt .vo{font-family:Unbounded;font-weight:800;font-size:38px;line-height:1.22}
.txt .vo small{display:block;font-family:"JetBrains Mono";font-size:22px;color:#ffd23f;font-weight:800;margin-bottom:10px;letter-spacing:1px}
.txt .mv{margin-top:20px;font-family:Onest;font-size:25px;line-height:1.35;color:#b9bfca}
.txt .mv b{color:#fff}
.clk{white-space:nowrap;font-family:"JetBrains Mono";font-weight:800;font-size:34px;color:#ff3b30;border:4px solid #ff3b30;border-radius:10px;padding:0 10px;box-shadow:0 0 14px #ff3b3088}
.title{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;line-height:1}
</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="view"><div class="stage" id="stage"></div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="../chars4.js"></script><script src="../chars5.js"></script><script src="bgs.js"></script>
<script>
// ep26 «ПОДБОРЩИК»: Вика нанимает автоподборщика, а он берёт деньги и с неё, и откат с Толяна. В каждом диалоге в кадре оба собеседника.
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4, o) => el(CHARS[kind](p, o), l, t, 420 * s, 800 * s, z);
const STAS = { jacket: "#e67e22", pants: "#3b3f46", cap: "#151515", hair: "#3a2d22", item: "gauge" };
const PK = (p, l, t, s, o, z = 4) => ch("perekup", p, l, t, s, z, o);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 9) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z}">${html}</div>`;
let CLK = ""; const clock = (t) => (CLK = t, "");
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
// Мерседес W124 владельца (kit/img/w124: w124_34 — 3/4 спереди, w124_side — сбоку мордой вправо)
const W124 = (l, t, w = 700, z = 3) => `<img class="el" src="../../kit/img/w124/w124_34.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z}">`;
// Королла (kit/img/corolla) — запасная машина, мордой вправо; низ колёс — t + w*.34
const COR = (l, t, w = 640, z = 3) => `<img class="el" src="../../kit/img/corolla/corolla.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z}">`;
const GAUGE = (v, l, t, c = "#ff3b30") => `<div class="el" style="left:${l}px;top:${t}px;z-index:11;font-family:'JetBrains Mono';font-weight:800;font-size:44px;color:${c};background:#cfe9c4;border:6px solid #151515;outline:5px solid #ffd23f;border-radius:12px;padding:4px 16px">${v}</div>`;
const ENV = (l, t, rot = -8) => `<div class="el" style="left:${l}px;top:${t}px;width:120px;height:76px;z-index:10;transform:rotate(${rot}deg);background:#f4e7c3;border:5px solid #151515;border-radius:6px">
  <div style="position:absolute;left:0;top:0;width:0;height:0;border-left:56px solid transparent;border-right:56px solid transparent;border-top:40px solid #e8d6a8"></div></div>`;
const PHONE = (l, t, w, inner, z = 8) => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${w * 1.9}px;z-index:${z};background:#0d0e12;border:8px solid #151515;outline:4px solid #4a4e58;border-radius:44px;padding:18px;box-sizing:border-box">
  <div style="width:100%;height:100%;background:#e9f1fb;border-radius:28px;overflow:hidden;font-family:Onest;color:#151515;padding:14px;box-sizing:border-box">${inner}</div></div>`;
const BOT = `<div style="font-family:Unbounded;font-weight:900;font-size:19px;color:#1d4fb8">🦊 Перехват · 4 сек назад</div>
  <div style="margin-top:10px;background:#fff;border-radius:16px;padding:12px;border:3px solid #c9d3df"><img src="../../kit/img/w124/w124_34.png" style="width:100%">
  <div style="font-family:Unbounded;font-weight:900;font-size:19px;margin-top:6px">Mercedes W124 · 420 000 ₽</div>
  <div style="font-size:16px;font-weight:800;margin-top:6px;color:#2f7a2f">✅ собственник · история ТО</div></div>`;
const TOW = { towel: "#f4f6f8", shades: true, chain: true, saunaHat: true };             // Толян в бане: очки и цепь — узнаётся
const STAS_SAUNA = { towel: "#2e86de", saunaHat: true, hair: "#3a2d22" };
// синий BMW X6 Вики (kit/img/x6: x6_side — сбоку мордой вправо, x6_34 — 3/4 спереди)
const X6 = (l, t, w = 600, z = 3) => `<img class="el" src="../../kit/img/x6/x6_side.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z}">`;
const BMW = (l, t, w = 600, z = 3) => `<img class="el" src="../../kit/img/bmw/bmw_side.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z}">`;
// маленький Толян в окне соседней кабинки колеса (окно 222,582 156×92 на фоне ferris)
const NEXT = (look = "grin") => `<div class="el" style="left:222px;top:582px;width:156px;height:92px;overflow:hidden;z-index:4;border-radius:14px">
  <div style="position:absolute;left:28px;top:-6px;width:420px;height:800px;transform:scale(.24);transform-origin:0 0">${CHARS.tolyan("tn")}</div></div>`;
// бинокль: что видит Вика — дверь бани, Толян и Стас с конвертом
const BINO = `<div class="el" style="left:90px;top:650px;width:640px;height:330px;z-index:10;overflow:hidden;border-radius:30px">
  <div style="position:absolute;left:-250px;top:-640px;width:1080px;height:1920px;transform:scale(1.2);transform-origin:520px 900px">${BGS.banya.replace('id="bg"', "")}</div>
  <div style="position:absolute;left:150px;top:70px;width:420px;height:800px;transform:scale(.33);transform-origin:0 0">${CHARS.tolyan("tb")}</div>
  <div style="position:absolute;left:360px;top:76px;width:420px;height:800px;transform:scale(.31);transform-origin:0 0">${CHARS.perekup("pb", { jacket: "#e67e22", pants: "#3b3f46", cap: "#151515" })}</div>
  <div style="position:absolute;left:300px;top:200px;width:70px;height:44px;transform:rotate(10deg);background:#f4e7c3;border:4px solid #151515;border-radius:5px"></div>
  <svg viewBox="0 0 640 330" style="position:absolute;inset:0;width:100%;height:100%"><path fill="#05070f" fill-rule="evenodd" d="M0 0H640V330H0Z M332 165a150 150 0 1 0 0 .1Z M608 165a150 150 0 1 0 0 .1Z"/>
    <circle cx="182" cy="165" r="150" fill="none" stroke="#2b2f37" stroke-width="12"/><circle cx="458" cy="165" r="150" fill="none" stroke="#2b2f37" stroke-width="12"/></svg></div>`;
const S = [
 { h: "ПОДБОРЩИК", tc: "1/7 · 0:00–0:14", bg: "ferris", y: 560,
   els: () => NEXT() + PK("p", 560, 880, .78, STAS, 6) + ch("vika", "v", 60, 900, .78, 6)
     + bub("Подбор под ключ — двадцать<br><em>тысяч. Найду машину мечты.</em>", 300, 760) + bub("А почему мы<br><em>на колесе обозрения?</em>", 40, 1210),
   vo: "Стас: «Подбор под ключ — двадцать тысяч. Найду машину мечты». Вика: «А почему мы на колесе обозрения?» Стас: «Чтобы никто не подслушал». Лис: «Подслушивать и не надо было. В соседней кабинке ехал Толян».", who: "Стас + Вика + Лис",
   mv: "<b>Новая локация — кабинка колеса обозрения на закате:</b> город внизу, спицы, соседняя красная кабинка. Подборщик Стас назначает встречу «на высоте». На панчлайне камера перескакивает на соседнюю кабинку — там машет Толян." },
 { h: "МОЙКА 24", tc: "2/7 · 0:14–0:28", bg: "carwash", y: 640,
   els: () => W124(150, 1020, 720, 3) + `<div class="el" style="left:${150 + 720 * .665}px;top:${1020 + 720 * .438 * .3}px;width:${720 * .135}px;height:${720 * .438 * .45}px;z-index:4;background:#e2cfa5;border:4px dashed #ff3b30;border-radius:6px;opacity:.9"></div>`
     + lab("ДРУГОЙ ОТТЕНОК", 520, 1215, "#ff3b30", "#fff", 26, -3) + ch("tolyan", "t", 0, 800, .88, 6) + PK("p", 700, 830, .8, STAS, 6) + GAUGE("1200 мкм", 430, 930)
     + bub("Родная краска!<br><em>Сто двадцать микрон!</em>", 470, 660) + bub("Пену не смывай, брат.<br><em>Так блестит.</em>", 20, 1300),
   vo: "Стас: «Родная краска! Сто двадцать микрон!» Толян: «Пену не смывай, брат. Так блестит». Лис: «Толщиномер показывал тысячу двести».", who: "Стас + Толян + Лис",
   mv: "<b>Новая локация — мойка самообслуживания «Мойка 24»:</b> пена, пистолеты, решётка в полу. Мерседес W124 весь в пене; пена стекает с двери — под ней <b>другой оттенок</b>. Толян брызгает пеной обратно. Толщиномер мигает «1200»." },
 { h: "С ЛЁГКИМ ПАРОМ", tc: "3/7 · 0:28–0:40", bg: "sauna", y: 640,
   els: () => PK("tt", 60, 780, .88, TOW, 6) + PK("p", 600, 790, .88, STAS_SAUNA, 6) + ENV(470, 1150, -12)
     + bub("Тридцать — тебе,<br><em>как договаривались.</em>", 40, 660) + bub("И веник —<br><em>за твой счёт.</em>", 620, 1300),
   vo: "Толян: «Тридцать — тебе, как договаривались». Стас: «И веник — за твой счёт». Лис: «Двадцать тысяч подборщик взял с Вики, тридцать — с Толяна. Работает на обе стороны. Как зарядка тайп-си».", who: "Толян + Стас + Лис",
   mv: "<b>Новая локация — парилка «Бани № 1»:</b> вагонка, каменка, ковш, 110°, пар. Толян в полотенце, банной шапке, <b>очках и цепи</b>; Стас в синем полотенце. Конверт переходит из рук в руки в клубах пара." },
 { h: "СЛЕЖКА", tc: "4/7 · 0:40–0:50", bg: "banya", y: 640,
   els: () => X6(30, 1150, 600, 3) + ch("vika", "v", 680, 860, .85, 6)
     + `<div class="el" style="left:808px;top:1012px;width:110px;height:56px;z-index:7;background:#151515;border-radius:28px;box-shadow:inset 0 0 0 6px #3b3f46"></div>` + BINO
     + bub("Ну здравствуй,<br><em>«честность —<br>моё второе имя».</em>", 60, 990),
   vo: "Вика: «Ну здравствуй, „честность — моё второе имя“».", who: "Вика",
   mv: "<b>Новая локация — ночная улица у «Бани № 1».</b> Вика на своём синем BMW X6, с биноклем. <b>Новый ракурс — вид через бинокль:</b> Толян и Стас выходят из бани, Стас прячет конверт." },
 { h: "ИЗ ЯМЫ", tc: "5/7 · 0:50–1:04", bg: "pit", y: 200,
   els: () => ch("mihalych", "m", 30, 560, .9, 6) + ch("vika", "v", 650, 600, .85, 6)
     + bub("Шпаклёвки — на хрущёвку хватит.<br><em>А днище — как дуршлаг.</em>", 160, 230),
   vo: "Михалыч: «Шпаклёвки — на хрущёвку хватит. А днище — как дуршлаг». Вика: «А подборщик сказал — идеальная». Михалыч: «Стасик? Он и мне подбирал. Я с тех пор из ямы не вылезаю».", who: "Михалыч + Вика",
   mv: "<b>Новый ракурс — из смотровой ямы, снизу вверх:</b> над головой ржавое днище Мерседеса в дырах, лампа-переноска. Михалыч и Вика стоят в яме и смотрят вверх. Оба в кадре." },
 { h: "ВЕРХНЯЯ ТОЧКА", tc: "6/7 · 1:04–1:16", bg: "ferris", y: 560,
   els: () => PK("p", 560, 880, .78, Object.assign({}, STAS, { item: "", look: "o" }), 6) + ch("vika", "v", 60, 900, .78, 6)
     + lab("ВЕРХНЯЯ ТОЧКА · 20 МИН", 560, 600, "#151515", "#ffd23f", 28, 3)
     + bub("Стас, сколько тебе<br><em>Толян заплатил?</em>", 40, 760) + bub("…Это бонус<br><em>за лояльность.</em>", 600, 1220),
   vo: "Вика: «Стас, сколько тебе Толян заплатил?» Стас: «…Это бонус за лояльность». Вика: «Колесо крутится ещё двадцать минут. Рассказывай». Лис: «А машину Вика нашла сама — от собственника, через бота Перехват».", who: "Вика + Стас + Лис",
   mv: "Снова колесо обозрения — но теперь встречу назначила Вика. Кабинка на самом верху, выйти некуда. Соседняя кабинка пустая. Стас вжимается в сиденье." },
 { h: "МОРАЛЬ", tc: "7/7 · 1:16–1:30", bg: "ferris", y: 560,
   els: () => `<div class="el" style="left:110px;top:640px;right:110px;z-index:9;background:#0d0e12;border:6px solid #fff;border-radius:30px;padding:24px 28px;color:#fff;font-family:Unbounded;font-weight:900;font-size:28px;line-height:1.4">ПОДБОРЩИК БЕЗ ОТКАТА:<br><span style="color:#ffd23f">📄 договор и оплата — только от тебя<br>👀 на осмотре будь сам<br>🔧 второй замер — на своём СТО<br>🏆 спроси, что он забраковал раньше</span></div>`
     + FOX(400, 1100, 220),
   vo: "Лис: «Подборщику плати только сам и по договору. На осмотре будь рядом, второй замер делай на своём СТО и спроси, какие машины он забраковал. Свежие объявления от собственников — в боте Перехват. Сохрани — пока тебя не подобрали вместе с машиной».", who: "Лис",
   mv: "<b>Финал:</b> чек-лист на фоне заката из кабинки, лиса с аватарки. ~1:30." },
];

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els(); if (CLK) document.getElementById("h").insertAdjacentHTML("beforebegin", `<span class="clk">${CLK}</span>`);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
const sh = document.getElementById("t-shades"); if (sh) sh.style.display = "";
["t", "v", "p", "m", "tt"].forEach(p => document.getElementById(p) && mouth(p, "talk")); ["tn", "tb"].forEach(p => { const e = document.getElementById(p + "-shades"); if (e) e.style.display = ""; });
window.READY = true;
</script></body></html>
