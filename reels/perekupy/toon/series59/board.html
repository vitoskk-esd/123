const UC_L = glow(540, 520, 360, "#cfe8f5", .3);
const S = [
 { h: "ОБЛОЖКА · ИНСТРУКТОР С БОТОМ → ПЕРВОЕ ЗАНЯТИЕ", tc: "1/6 · 0:00–0:12",
   A: { def: () => { const H = HOLDPHONE("vika", "tp", 540, 2090, 1680, null, ELCARD(), { rim: "#fff6d0", side: 1 });
       return { bg: "avtodrom", farBlur: 8, mid: TPC(H.mid), lights: H.lights + AD_L, over: TITLE("АВТОШКОЛА:", "ТАМАРА ПАВЛОВНА") }; }, shot: { x: 540, y: 960, s: 1 } },

     bubbles: [{ p: "ka", html: "Здравствуйте!<br><em>Я на первое занятие.</em>", fs: 32 }, { p: "ta", html: "Садись, солнышко.<br><em>Зеркала настрой.</em>", fs: 32 }], talk: ["ta"] },
   vo: "Лис: «Автошкола “Зелёный свет”. Инструктор Тамара Павловна: двадцать лет стажа, интеллигентка в третьем поколении». Кирилл: «Здравствуйте! Я на первое занятие». Тамара Павловна: «Садись, солнышко. Пристегнись, зеркала настрой».", who: "Лис + Кирилл + Тамара Павловна",
   mv: "<b>Кадр 0 — обложка с телефоном</b>: <b>новая героиня — инструктор Тамара Павловна</b> (седой пучок, очки на цепочке, сиреневый кардиган) держит телефон: в боте «Hyundai Elantra · 2020 · 1 190 000 ₽ · рынок ≈ 1 400 000 · 🔥 −15% · ⏱ 1 с»; плашка «АВТОШКОЛА: / ТАМАРА ПАВЛОВНА». B — <b>новый фон — автодром</b> (будка «АВТОШКОЛА ЗЕЛЁНЫЙ СВЕТ», эстакада, конусы, учебный светофор); учебная «десятка» со знаком «У»; <b>новый герой — ученик Кирилл</b>." },
 { h: "«КАК НОВАЯ» ОТ ЖОРЫ → РУЛЬ ОТВАЛИЛСЯ", tc: "2/6 · 0:12–0:24",

 { h: "ВТОРАЯ ПЕДАЛЬ → «ТОРМОЗИ, БЛ*ДЬ!»", tc: "3/6 · 0:24–0:36",

 { h: "«СТО ПЯТЬДЕСЯТ В КОПИЛКУ» → К ЖОРЕ", tc: "4/6 · 0:36–0:48",

     bubbles: [{ p: "td", html: "Так. Сто пятьдесят в копилку.<br><em>А теперь — к Жоре.</em>", fs: 36 }], talk: ["td"] },
   B: { def: () => ({ bg: "perekrestok", mid: Z("zb", 760, 1840, 860, { look: "grin" }, { armL: 60 }, { rim: "#ffd27a", side: -1, z: 7 }) + T("te", 270, 1840, 860, { armR: -100 }, { rim: "#ffd27a", side: 1, z: 7 }), lights: PK_L }), shot: { x: 540, y: 1150, s: 1.04 },
     bubbles: [{ p: "zb", html: "Ну как<br><em>машинка?</em>", fs: 30 }, { p: "te", html: "Жорочка, солнце…<br><em>Иди-ка ты на*уй.</em>", fs: 30 }], talk: ["te"] },
   vo: "Тамара Павловна (поправляя очки, спокойно): «Так. Сто пятьдесят в копилку. А теперь — к Жоре». Жора: «Тамара Павловна! Ну как машинка, летает?» Тамара Павловна: «Жорочка, солнце моё. Иди-ка ты нахуй со своей машинкой».", who: "Тамара Павловна + Жора",
   mv: "A — остановились: Тамара Павловна поправляет очки и кладёт три монеты в копилку. B — <b>новый фон — перекрёсток</b> (панельки, светофор, зебра, вывеска «ВЫКУП АВТО · ДОРОГО · ЖОРА»): Жора улыбается; Тамара Павловна посылает его вежливо и с улыбкой." },
 { h: "БОТ: ЭЛАНТРА НИЖЕ РЫНКА → «НИ РАЗУ НЕ РУГНУЛИСЬ!»", tc: "5/6 · 0:48–1:00",
   A: { def: () => { const H = HOLDPHONE("vika", "tf", 540, 2000, 1400, null, ELCARD("ecc2"), { rim: "#fff6d0", side: 1 });
       return { bg: "avtodrom", farBlur: 5, mid: TPC(H.mid), lights: H.lights + AD_L }; }, shot: { x: 540, y: 1000, s: 1.02 },
     bubbles: [{ p: "tf", html: "Элантра, ниже рынка…<br><em>Оху*ть. А так можно было?</em>", fs: 36 }], talk: ["tf"] },
   B: { def: () => ({ bg: "uchebka", farFilter: "hue-rotate(160deg) saturate(.7) brightness(1.15)", mid: T("tg", 300, 2070, 1250, {}, { rim: "#cfe8f5", side: 1, z: 7 }) + KR("kg", 790, 2070, 1230, { look: "grin" }, {}, { rim: "#cfe8f5", side: -1, z: 7 }) + DASH(760, "ds4") + JAR(420, 1190, "jar4", 0, "0 ₽"), lights: UC_L }), shot: { x: 540, y: 1150, s: 1.04 },
     bubbles: [{ p: "kg", html: "Вы сегодня<br><em>ни разу не ругнулись!</em>", fs: 32 }, { p: "tg", html: "Не каркай,<br><em>Кирюша.</em>", fs: 32 }], talk: ["kg"] },
   vo: "Лис: «Новую машину Тамара Павловна нашла сама — через бота “Перехват”». Тамара Павловна: «Элантра, один хозяин, ниже рынка… Охуеть. А что, так можно было?» Кирилл: «Тамара Павловна, вы сегодня ни разу не ругнулись!» Тамара Павловна: «Не каркай, Кирюша. Поехали».", who: "Лис + Тамара Павловна + Кирилл",
   mv: "A — Тамара Павловна с телефоном: карточка Элантры в боте. B — салон новой машины (светлый): копилка пустая, «0 ₽» — в ней паутинка; Кирилл в восторге." },
 { h: "ФИНАЛ: БОТ", tc: "6/6 · 1:00–1:10",
   A: { def: () => ({ bg: "avtodrom", mid: car(ELN, 140, 1600, 800, { z: 5, sheen: .5, flip: true }) + USIGN(600, 1300) + T("th", 170, 1880, 760, { armR: -150 }, { rim: "#fff6d0", side: 1, z: 7 }) + KR("kh", 920, 1880, 740, { look: "grin" }, { armL: -150 }, { rim: "#fff6d0", side: -1, z: 7 }), lights: AD_L }), shot: { x: 540, y: 1180, s: 1.04 } },
   B: { def: () => ({ bg: "avtodrom", over: CTA68, lights: AD_L }), shot: { x: 540, y: 1000, s: .98 } },
   vo: "Лис: «Чтобы ругаться только от восторга, — ищи машину в боте “Перехват”: хорошие варианты ниже рынка приходят через секунду после публикации». (Финальная фраза голосом — про бота; карточку голос не читает.)", who: "Лис",
   mv: "A — белая Элантра со знаком «У» на автодроме, Тамара Павловна и Кирилл довольны. B — <b>последний кадр — только карточка бота</b>." },
];
const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const put = (id, f) => { const el = document.getElementById(id);
  if (f.split) { const [dl, sl, dr, sr] = f.split();
    el.innerHTML = `<div class="cf">${HALF(C.frame(dl, sl), -1)}${HALF(C.frame(dr, sr), 1)}<div style="position:absolute;left:532px;top:0;width:16px;height:1920px;background:#fff;box-shadow:0 0 30px #000;z-index:80"></div>
      ${C.frame({ hud: f.hud }, { x: 540, y: 960, s: 1 }).replace('<div class="cf">', '<div style="position:absolute;inset:0;z-index:90;pointer-events:none">').replace(/<div class="vig"><\/div>/, "")}</div>`; }
  else { const def = f.def(); def.bubbles = f.bubbles || []; el.innerHTML = C.frame(def, f.shot); }
  if (f.sketch) el.querySelector(".cf").style.filter = SKF;
  (f.talk || []).forEach(p => C.mouth(el, p, "talk")); return el; };
const a = put("A", sc.A), b = put("B", sc.B);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
document.fonts.ready.then(() => { C.layout(a); C.layout(b); window.READY = true; });
