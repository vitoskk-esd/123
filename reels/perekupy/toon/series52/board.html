<style>

<script>
// «РЫБАЛКА: КЛЮЁТ ТОЛЬКО У СТАСА» (киношный формат, отдельный ролик). Жора и Стас на зимней рыбалке. Жора: «машину, как рыбу, надо высидеть».
// Подо льдом рыбы плывут мимо мотыля Жоры к светящемуся «телефону-приманке» Стаса; у Стаса «клюёт» — бот присылает Прадо на 300 тыс. ниже рынка,
// продавец — дед Палыч с соседней лунки. Жора мёрзнет (−27), наконец вытаскивает… сапог; Стас уезжает по льду на Прадо. «А на что клюёт-то?» — «На бота».
// ОБЛОЖКА (кадр 0): Жора с удочкой у лунки, за ним его Нива + плашка «РЫБАЛКА: / КЛЮЁТ ТОЛЬКО У СТАСА» (без телефона — владелец 14.11).
// Приёмы (новые): разрез подо льдом; поплавок-уведомление; Жора замерзает (иней, сосульки, термометр); сапог на крючке с брызгами.
const Z = (p, x, foot, h, o = {}, pose = {}, extra = {}) => ch("perekup", p, x, foot, h, { ...ZHORA_W, ...o }, pose, extra);
const ST = (p, x, foot, h, o = {}, pose = {}, extra = {}) => ch("perekup", p, x, foot, h, { ...STAS_W, ...o }, pose, extra);
const PL = (p, x, foot, h, o = {}, pose = {}, extra = {}) => ch("perekup", p, x, foot, h, { ...PALYCH, ...o }, pose, extra);
const OZ_L = glow(820, 420, 320, "#fff6d0", .4);
const RB_L = glow(355, 835, 200, "#ffd27a", .5) + glow(540, 300, 380, "#fff6d0", .25);
// рыбак с удочкой у лунки: удочка в правой руке, леска от кончика в лунку
const FISHER = (mk, p, x, foot, h, o = {}, extra = {}, arm = -30, hole = true) => { const [hx, hy] = HANDPT(x, foot, h, arm), w = 200 * h / 820, tx = hx - w / 2 + 1.9 * w, ty = hy - w / 2 + 1.5 * w;
  return mk(p, x, foot, h, o, { armR: arm }, extra) + INHAND(x, foot, h, arm, w, ROD, (extra.z || 7) + 1) + (hole ? HOLE(tx + 10, foot + 20 * h / 820, 200 * h / 820) + LINE(tx, ty, tx + 10, foot + 24 * h / 820) : ""); };
const S = [
 { h: "ОБЛОЖКА · ОЗЕРО → ТЕОРИЯ ЖОРЫ", tc: "1/6 · 0:00–0:12",
   A: { def: () => ({ bg: "ozero", grade: "day", farBlur: 2, mid: car(NIVA, -40, 1220, 560, { z: 3, sheen: .5 }) + FISHER(Z, "za", 560, 1700, 860, { look: "grin" }, { rim: "#fff6d0", side: 1, z: 7 })
       + ST("sa", 960, 1560, 540, {}, {}, { z: 5 }), lights: OZ_L, over: TITLE("РЫБАЛКА:", "КЛЮЁТ ТОЛЬКО У СТАСА") }), shot: { x: 540, y: 1000, s: 1 } },
   B: { def: () => ({ bg: "ozero", grade: "day", farBlur: 5, mid: FISHER(Z, "zb", 460, 1880, 1000, { look: "grin" }, { rim: "#fff6d0", side: 1, z: 7 }), lights: OZ_L }), shot: { x: 540, y: 1150, s: 1.08 },
     bubbles: [{ p: "zb", html: "Машина — как рыба, студент.<br><em>Её высидеть надо.</em>", fs: 42 }], talk: ["zb"] },
   vo: "Лис: «Жора и Стас поехали на зимнюю рыбалку. У Жоры своя теория». Жора: «Машина — как рыба, студент. Её высидеть надо».", who: "Лис + Жора",
   mv: "<b>Кадр 0 — обложка без телефона</b>: замёрзшее озеро, Жора в ушанке с зимней удочкой у лунки, за ним его <b>салатовая Нива</b>, вдали Стас; плашка «РЫБАЛКА: / КЛЮЁТ ТОЛЬКО У СТАСА» (гаснет к 1,6 с). <b>Новый фон — озеро</b> (ельник, низкое солнце, палатка и рыбаки вдали). B — Жора крупно, назидательно." },
 { h: "ПОДО ЛЬДОМ → ПОПЛАВОК-УВЕДОМЛЕНИЕ", tc: "2/6 · 0:12–0:23",
   A: { def: () => ({ bg: "podlyod", farBlur: 0, mid: UNDER() }), shot: { x: 540, y: 960, s: 1 } },
   B: { def: () => { const H = HOLDPHONE("perekup", "sb", 540, 2090, 1680, STAS_W, PRCARD(), { rim: "#fff6d0", side: 1 });
       return { bg: "ozero", grade: "day", farBlur: 8, mid: H.mid, lights: H.lights + OZ_L, over: BOBBER(860, 250) }; }, shot: { x: 540, y: 960, s: 1 },
     bubbles: [{ at: [300, 700], html: "О, клюёт! Прадо —<br><em>на триста ниже рынка.</em>", fs: 42 }] },
   vo: "Лис: «А подо льдом всё честно: на мотыля сегодня никто не клюёт». Стас: «О, клюёт! Прадо — на триста тысяч ниже рынка».", who: "Лис + Стас",
   mv: "A — <b>приём 1: разрез подо льдом</b> (<b>новый фон</b>: толща льда, две лунки, лучи, водоросли): у лунки Жоры мотыль — рыбы проплывают мимо; у лунки Стаса светится телефон-«приманка» «БОТ 🎣» — рыбы толпятся. B — <b>приём 2: поплавок-уведомление</b>: над Стасом огромный поплавок «1 с» ныряет с кругами на воде (бульк) — в боте «Prado · 2013 · 2 250 000 ₽ · рынок ≈ 2 550 000 · 300 м от вас»." },
 { h: "ЖОРА ЗАМЕРЗАЕТ → ПРОДАВЕЦ НА СОСЕДНЕЙ ЛУНКЕ", tc: "3/6 · 0:23–0:35",
   A: { def: () => ({ bg: "ozero", grade: "day", farBlur: 6, mid: Z("zc", 480, 1900, 1000, { look: "flat" }, {}, { rim: "#d8f0ff", side: 1, z: 7 }) + FROST(480, 1900, 1000), over: THERMO(860, 420, -27), lights: OZ_L }), shot: { x: 540, y: 1150, s: 1.08 },
     bubbles: [{ p: "zc", html: "Терпение, студент…<br><em>Сейчас пойдёт…</em>", fs: 46 }], talk: ["zc"] },
   B: { def: () => ({ bg: "ozero", grade: "day", farBlur: 2, mid: ST("sc", 270, 1880, 900, {}, { phone: 1 }, { rim: "#fff6d0", side: 1, z: 7 }) + FISHER(PL, "pc", 840, 1160, 300, {}, { z: 4 }, -30)
       + `<div style="position:absolute;left:760px;top:760px;z-index:9;font-family:Unbounded;font-weight:900;font-size:40px;color:#c0392b;background:#fff;border:5px solid #151515;border-radius:12px;padding:2px 14px;transform:rotate(-4deg)">300 м</div>`, lights: OZ_L }), shot: { x: 540, y: 1120, s: 1.05 },
     bubbles: [{ p: "sc", html: "Погоди… продавец —<br><em>в трёхстах метрах от нас.</em>", fs: 42 }], talk: ["sc"] },
   vo: "Жора: «Терпение, студент… Сейчас пойдёт…» Стас: «Погоди… продавец — в трёхстах метрах от нас». Лис: «Объявление выложили пять минут назад. С соседней лунки».", who: "Жора + Стас + Лис",
   mv: "A — <b>приём 3: Жора замерзает</b>: на ушанке растёт снежная шапка, на усах сосульки, иней по ватнику, термометр падает до −27° (треск льда). B — Стас с телефоном у уха, вдали у своей лунки — <b>новый герой — дед Палыч</b>, метка «300 м»." },
 { h: "ДЕД ПАЛЫЧ → ПРАДО НА БЕРЕГУ", tc: "4/6 · 0:35–0:47",
   A: { def: () => ({ bg: "ozero", grade: "day", farBlur: 3, mid: FISHER(PL, "pd", 700, 1800, 860, {}, { rim: "#fff6d0", side: -1, z: 7 }, -30) + ST("sd", 230, 1820, 820, {}, { armR: -100 }, { rim: "#fff6d0", side: 1, z: 7 }), lights: OZ_L }), shot: { x: 520, y: 1180, s: 1.06 },
     bubbles: [{ p: "sd", html: "Палыч,<br><em>я по объявлению!</em>", fs: 46 }], talk: ["sd"] },
   B: { def: () => ({ bg: "rybbaza", grade: "day", mid: car(PRADO, 20, 1640, 700, { z: 4, sheen: .5 }) + PL("pe", 860, 1780, 820, {}, { armL: 40 }, { rim: "#ffd27a", side: -1, z: 7 }), lights: RB_L }), shot: { x: 540, y: 1200, s: 1.05 },
     bubbles: [{ p: "pe", html: "Так ты ж<br><em>с соседней лунки!</em>", fs: 48 }], talk: ["pe"] },
   vo: "Стас: «Палыч, я по объявлению!» Палыч: «Так ты ж с соседней лунки! Только выложил — а ты уже тут». Стас: «Беру без торга».", who: "Стас + Палыч",
   mv: "A — Стас подходит к Палычу по льду (хруст снега). B — <b>новый фон — рыбацкая база</b> (домик «РЫБАЛКА · мотыль · чай», дым из трубы, ели, снегопад): белый Прадо, Палыч отдаёт ключи." },
 { h: "«КЛЮЁТ!» → САПОГ", tc: "5/6 · 0:47–0:58",
   A: { def: () => ({ bg: "ozero", grade: "day", farBlur: 3, mid: Z("zf", 460, 1820, 900, { look: "o" }, { armR: -150 }, { rim: "#fff6d0", side: 1, z: 7 }) + INHAND(460, 1820, 900, -150, 240, ROD, 8, -95) + HOLE(700, 1850, 230) + SPLASH(700, 1840), lights: OZ_L }), shot: { x: 540, y: 1180, s: 1.05 },
     bubbles: [{ p: "zf", html: "Клюёт!<br><em>Клюёт!!</em>", fs: 58 }], talk: ["zf"] },
   B: { def: () => ({ bg: "ozero", grade: "day", farBlur: 2, mid: car(PRADO_S, 640, 1150, 360, { z: 2, sheen: .5 }) + Z("zg", 440, 1880, 960, { look: "o" }, { armR: -70 }, { rim: "#fff6d0", side: 1, z: 7 }) + INHAND(440, 1880, 960, -70, 230, BOOT, 9), lights: OZ_L }), shot: { x: 540, y: 1150, s: 1.06 },
     bubbles: [{ p: "zg", html: "…Сапог.", fs: 60 }], talk: ["zg"] },
   vo: "Жора: «Клюёт! Клюёт!!» Жора: «…Сапог». Лис: «А Стас в это время уже ехал на Прадо по льду».", who: "Жора + Лис",
   mv: "A — <b>приём 4: подсечка</b>: Жора дёргает удочку, из лунки фонтан брызг (всплеск). B — Жора держит мокрый <b>сапог</b>, с него капает; за спиной по льду проезжает белый Прадо Стаса." },
 { h: "«НА ЧТО КЛЮЁТ?» → ФИНАЛ: БОТ", tc: "6/6 · 0:58–1:10",
   A: { def: () => ({ bg: "rybbaza", grade: "day", mid: car(PRADO, 380, 1600, 640, { z: 4, sheen: .5 }) + Z("zh", 250, 1820, 860, { look: "o" }, { armR: -70 }, { rim: "#ffd27a", side: 1, z: 7 }) + INHAND(250, 1820, 860, -70, 200, BOOT, 9)
       + ST("sh", 860, 1800, 820, {}, { armL: 30 }, { rim: "#ffd27a", side: -1, z: 7 }), lights: RB_L }), shot: { x: 540, y: 1180, s: 1.05 },
     bubbles: [{ p: "zh", html: "Стас…<br><em>а на что клюёт-то?</em>", fs: 46 }], talk: ["zh"] },
   B: { def: () => ({ bg: "rybbaza", grade: "day", over: CTA61, lights: RB_L }), shot: { x: 540, y: 1000, s: .98 } },
   vo: "Жора: «Стас… а на что клюёт-то?» Стас: «На бота, Жора. На бота». Лис: «С ботом «Перехват» хорошая машина клюёт первой — у тебя: объявление приходит через секунду после публикации». (Финальная фраза голосом — про бота; карточку голос не читает.)", who: "Жора + Стас + Лис",
   mv: "A — у базы: Жора с сапогом, Стас у Прадо; ответ Стаса «На бота, Жора» — следующим облачком. B — <b>последний кадр — только карточка бота</b>." },
];
const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const put = (id, f) => { const el = document.getElementById(id);
  if (f.split) { const [dl, sl, dr, sr] = f.split();
    el.innerHTML = `<div class="cf">${HALF(C.frame(dl, sl), -1)}${HALF(C.frame(dr, sr), 1)}<div style="position:absolute;left:532px;top:0;width:16px;height:1920px;background:#fff;box-shadow:0 0 30px #000;z-index:80"></div>
      ${C.frame({ hud: f.hud }, { x: 540, y: 960, s: 1 }).replace('<div class="cf">', '<div style="position:absolute;inset:0;z-index:90;pointer-events:none">').replace(/<div class="vig"><\/div>/, "")}</div>`; }
  else { const def = f.def(); def.bubbles = f.bubbles || []; el.innerHTML = C.frame(def, f.shot); }
  if (f.sketch) el.querySelector(".cf").style.filter = SKF;
  (f.talk || []).forEach(p => C.mouth(el, p, "talk")); return el; };
const a = put("A", sc.A), b = put("B", sc.B);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
document.fonts.ready.then(() => { C.layout(a); C.layout(b); window.READY = true; });
</script></body></html>
