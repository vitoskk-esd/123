<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#0b0c10;z-index:5}
.hd b{font-family:Unbounded;font-weight:900;font-size:30px;color:#151515;background:#ffd23f;border:5px solid #151515;border-radius:12px;padding:4px 14px}
.hd span{font-family:Unbounded;font-weight:800;font-size:26px;color:#fff}.hd i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#8b93a3}
.view{position:absolute;left:0;top:96px;width:1080px;height:820px;overflow:hidden;border-bottom:6px solid #ffd23f}
.stage{position:absolute;left:0;width:1080px;height:1920px}
.el{position:absolute}.el svg{width:100%;height:100%;overflow:visible}
.lab{position:absolute;font-family:Unbounded;font-weight:900;border:6px solid #151515;border-radius:18px;padding:6px 18px;box-shadow:0 8px 0 #151515;white-space:nowrap}
.bub{position:absolute;background:#0d0e12;border:5px solid #fff;border-radius:30px;padding:16px 24px;font-family:Unbounded;font-weight:800;font-size:36px;line-height:1.12;color:#fff;box-shadow:0 0 0 6px #0d0e12}
.bub em{font-style:normal;color:#ff3b30}
.txt{position:absolute;left:40px;right:40px;top:940px;color:#fff}
.txt .vo{font-family:Unbounded;font-weight:800;font-size:38px;line-height:1.22}
.txt .vo small{display:block;font-family:"JetBrains Mono";font-size:22px;color:#ffd23f;font-weight:800;margin-bottom:10px;letter-spacing:1px}
.txt .mv{margin-top:20px;font-family:Onest;font-size:25px;line-height:1.35;color:#b9bfca}
.txt .mv b{color:#fff}
.clk{white-space:nowrap;font-family:"JetBrains Mono";font-weight:800;font-size:34px;color:#ff3b30;border:4px solid #ff3b30;border-radius:10px;padding:0 10px;box-shadow:0 0 14px #ff3b3088}
.botcard{position:absolute;left:440px;top:660px;width:600px;z-index:9;background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:24px;box-shadow:0 0 80px rgba(120,180,255,.4)}
.botcard .bh{font-family:Onest;font-weight:700;font-size:26px;color:#8b93a3;margin-bottom:12px}
.botcard .bb{background:#1c1f26;border-radius:24px;padding:20px 24px;font-family:Onest;color:#fff;font-size:34px;line-height:1.45}
.cnt{position:absolute;left:40px;top:150px;z-index:20;font-family:"JetBrains Mono";font-weight:800;font-size:40px;color:#fff;background:#151515;border:5px solid #4cd964;border-radius:16px;padding:2px 16px;white-space:nowrap}
.receipt{position:absolute;left:150px;width:780px;background:#fbfaf6;border:6px solid #151515;box-shadow:0 18px 0 rgba(0,0,0,.35);padding:30px 40px;font-family:"JetBrains Mono";font-weight:800;font-size:32px;color:#222;line-height:1.6;transform:rotate(2deg);z-index:6}
.receipt h4{margin:0 0 10px;text-align:center;font-family:Unbounded;font-weight:900;font-size:38px}.receipt .row,.receipt .tot{display:flex;justify-content:space-between}.receipt .tot{border-top:5px dashed #222;margin-top:10px;padding-top:8px;font-size:42px;color:#e53935}
.title{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;line-height:1}
</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="view"><div class="stage" id="stage"></div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="../chars4.js"></script><script src="../chars5.js"></script><script src="bgs.js"></script>
<script>
// ep30 «СХЕМЫ · МАРАФЕТ ЗА НОЧЬ»: как перекуп за одну ночь «готовит» машину к показу — и как Вика утром разоблачает каждый приём.
// Машина — Camry из библиотеки (kit/img/camry). Каждый, кто говорит, — в кадре; Лис — за кадром.
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4, o) => el(CHARS[kind](p, o), l, t, 420 * s, 800 * s, z);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 9) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z}">${html}</div>`;
let CLK = "", CNTV = ""; const clock = (t) => (CLK = t, "");
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
const CAM = (v, l, t, w, z = 3, extra = "") => `<img class="el" src="../../kit/img/camry/${v}.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${extra}">`;
// моторный отсек сверху: dirty — подтёки масла, иначе — «блеск»
const ENGINE = (dirty, l, t, w = 860) => el(`<svg viewBox="0 0 860 620"><rect x="6" y="6" width="848" height="608" rx="40" fill="#1c1d21" stroke="#000" stroke-width="10"/>
  <rect x="230" y="120" width="400" height="300" rx="30" fill="${dirty ? "#5b5148" : "#8e9aa6"}" stroke="#000" stroke-width="8"/>
  ${[0, 1, 2, 3].map(i => `<rect x="${270 + i * 90}" y="150" width="60" height="80" rx="10" fill="${dirty ? "#3f3830" : "#c9d3dc"}" stroke="#000" stroke-width="6"/>`).join("")}
  <rect x="60" y="80" width="140" height="190" rx="14" fill="#151515" stroke="#000" stroke-width="7"/><rect x="80" y="60" width="30" height="24" fill="#c0392b" stroke="#000" stroke-width="5"/><rect x="150" y="60" width="30" height="24" fill="#2b2b2e" stroke="#000" stroke-width="5"/>
  <circle cx="720" cy="190" r="70" fill="${dirty ? "#4a4038" : "#d9e1e8"}" stroke="#000" stroke-width="8"/><rect x="660" y="360" width="130" height="150" rx="16" fill="#2e86de" stroke="#000" stroke-width="7"/>
  <path d="M230 300 h-60 q-30 0 -30 30 v160 M630 300 h40" stroke="#151515" stroke-width="18" fill="none"/>
  ${dirty ? `<path d="M300 420 q10 60 -6 120 q30 10 40 -20 q-10 -50 6 -100 z M520 420 q-10 80 10 140 q24 -6 20 -40 q-16 -40 -8 -100 z" fill="#2a1e14" opacity=".9"/>
    ${[[330, 250, 40], [480, 300, 56], [560, 230, 30], [400, 380, 46]].map(([x, y, r]) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * .6}" fill="#1a120c" opacity=".95"/>`).join("")}`
    : `${[[300, 160], [520, 180], [700, 150], [420, 320]].map(([x, y]) => `<path d="M${x} ${y} l10 -26 l10 26 l26 10 l-26 10 l-10 26 l-10 -26 l-26 -10 z" fill="#fff"/>`).join("")}`}</svg>`, l, t, w, w * 620 / 860, 5);
const DASH = (lampOn, l, t) => el(`<svg viewBox="0 0 900 420"><rect x="6" y="6" width="888" height="408" rx="60" fill="#0d0e12" stroke="#000" stroke-width="10"/>
  <circle cx="250" cy="210" r="150" fill="#16181d" stroke="#ff7a1a" stroke-width="10"/><circle cx="650" cy="210" r="150" fill="#16181d" stroke="#ff7a1a" stroke-width="10"/>
  <path d="M250 210 L180 120 M650 210 L720 140" stroke="#ff3b30" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(410 280)" opacity="${lampOn ? 1 : .15}"><path d="M0 40 h80 v-40 h-12 v-14 h-56 v14 h-12 z" fill="${lampOn ? "#ffb300" : "#333"}" stroke="#000" stroke-width="5"/>
  ${lampOn ? `<circle cx="40" cy="20" r="70" fill="#ffb300" opacity=".25"/>` : ""}</g>
  <text x="450" y="390" text-anchor="middle" font-family="JetBrains Mono" font-weight="800" font-size="30" fill="#8b93a3">CHECK</text></svg>`, l, t, 900, 420, 5);
const SMOKE = (l, t) => [0, 1, 2].map(i => `<div class="el" style="left:${l - i * 60}px;top:${t - i * 50}px;width:${110 + i * 40}px;height:${80 + i * 30}px;z-index:2;border-radius:50%;background:#e8ecf0;border:5px solid #151515;opacity:${.9 - i * .2}"></div>`).join("");
const VIKA = (p, l, t, s) => ch("vika", p, l, t, s, 6);
const S = [
 { h: "МАРАФЕТ ЗА НОЧЬ", tc: "1/8 · 0:00–0:08", bg: "box", y: 700, els: () => clock("⏳ 08:00")
     + CAM("camry", 370, 1200, 640) + ch("tolyan", "t", -20, 860, .9, 6) + bub("Брат, за ночь сделаем<br><em>из неё невесту!</em>", 140, 720),
   vo: "Лис: «Перекуп не ремонтирует машину. Он готовит её к показу. За одну ночь». Толян: «Брат, за ночь сделаем из неё невесту!»", who: "Лис + Толян",
   mv: "<b>Новая локация — гаражный бокс ночью:</b> переноска, канистры, шланг. Камри, Толян в очках. Сверху — таймер «до показа», он тикает весь ролик." },
 { h: "1 · МОЙКА МОТОРА", tc: "2/8 · 0:08–0:18", bg: "box", y: 700, els: () => clock("⏳ 06:12")
     + ENGINE(false, 110, 800) + `<div class="el" style="left:110px;top:800px;width:430px;height:620px;overflow:hidden;z-index:6">${ENGINE(true, 0, 0)}</div>`
     + `<div class="el" style="left:532px;top:780px;width:12px;height:660px;z-index:7;background:#fff;box-shadow:0 0 20px #7cc8ff"></div>`
     + lab("БЫЛО МАСЛО", 60, 1430, "#2a1e14", "#fff", 40, -3) + lab("СТАЛ БЛЕСК ✨", 600, 1430, "#4cd964", "#151515", 40, 3),
   vo: "Лис: «Приём первый — мойка мотора. Течёт масло? Было масло — стал блеск. Свежей течи не видно. Пока».", who: "Лис",
   mv: "Моторный отсек сверху крупно: слева — в подтёках масла, справа после пены — блестит. Шторка «до/после» едет слева направо под шипение мойки." },
 { h: "2 · ПРИСАДКА", tc: "3/8 · 0:18–0:28", bg: "box", y: 700, els: () => clock("⏳ 04:40")
     + CAM("camry", 340, 1200, 700) + ch("tolyan", "t", 40, 860, .9, 6)
     + lab("МАСЛО ПОГУЩЕ", 520, 960, "#ffd23f", "#151515", 40, 3) + lab("ПРИСАДКА «ТИШИНА» 🤫", 300, 1450, "#151515", "#fff", 38, -2),
   vo: "Лис: «Приём второй. Мотор стучит? Масло погуще и присадка. Стук уходит. До первой тысячи километров».", who: "Лис",
   mv: "Толян льёт в мотор бутылку «ТИШИНА». Значок звука «стук-стук» над капотом зачёркивается." },
 { h: "3 · ЛАМПА «ЧЕК»", tc: "4/8 · 0:28–0:38", bg: "interior", y: 700, els: () => clock("⏳ 02:05")
     + DASH(true, 90, 1040) + lab("ОШИБКИ СТЁРТЫ", 80, 920, "#151515", "#fff", 40, -3) + lab("ЛАМПОЧКУ — В КАРМАН", 240, 1420, "#ff3b30", "#fff", 40, 2),
   vo: "Лис: «Приём третий. Горит „чек“? Ошибки стёрли сканером, а лампочку — в карман. Нет лампы — нет проблемы».", who: "Лис",
   mv: "Приборка крупно: горит жёлтый «Check», к нему тянется рука с отвёрткой — лампа гаснет навсегда. Сканер: «ОШИБКИ: 0»." },
 { h: "4 · ПРОГРЕВ", tc: "5/8 · 0:38–0:48", bg: "parkade", y: 700, els: () => clock("⏳ 01:00")
     + CAM("camry_side", 200, 1180, 760) + SMOKE(160, 1250) + lab("ПРОГРЕВ 🔥", 120, 960, "#ff7a1a", "#151515", 50, -3),
   vo: "Лис: «Семь утра. За час до показа — прогрев. Холодный мотор говорит правду. Тёплый — то, что хочет перекуп».", who: "Лис",
   mv: "<b>Новая локация — подземный паркинг ТЦ.</b> Камри тарахтит, из выхлопа дым. Таймер почти на нуле." },
 { h: "08:00 · ПОКАЗ", tc: "6/8 · 0:48–1:00", bg: "parkade", y: 700, els: () => clock("⏳ 00:00")
     + CAM("camry", 300, 1220, 640) + ch("tolyan", "t", -20, 880, .82, 6) + VIKA("v", 560, 860, .84) + ch("seryoga", "s", 800, 900, .74, 5)
     + bub("Капот тёплый.<br><em>Вы её уже грели?</em>", 420, 700) + lab("НА СОЛНЫШКЕ? В ПАРКИНГЕ?", 120, 1400, "#ffd23f", "#151515", 34, -2),
   vo: "Вика: «Капот тёплый. Вы её уже грели?» Толян: «Сестрёнка, она на солнышке стояла!» Лис: «На подземной парковке. В ноябре».", who: "Вика + Толян + Лис",
   mv: "Вика кладёт ладонь на капот. Серёга рядом. Толян врёт про солнышко — камера медленно поднимается к потолку паркинга." },
 { h: "ВИКА ПРОВЕРЯЕТ", tc: "7/8 · 1:00–1:14", bg: "parkade", y: 700, els: () => ch("tolyan", "t", -20, 880, .82, 6) + VIKA("v", 560, 860, .84) + ch("seryoga", "s", 800, 900, .74, 5)
     + CAM("camry", 300, 1220, 640) + bub("Чистый мотор на 200 тысячах —<br><em>это не забота. Это улика.</em>", 300, 700),
   vo: "Вика: «Включаю зажигание — „чек“ не загорается. Лампочку вынули?» Серёга: «Зато мотор какой чистый!» Вика: «Чистый мотор на двухстах тысячах — это не забота. Это улика». Лис: «Серёга не купил. Толян пошёл мыть следующую».", who: "Вика + Серёга + Лис",
   mv: "Вика проверяет: приборка без «чека» (вставка), блестящий мотор. Все трое в кадре. Толян снимает очки и молча уходит." },
 { h: "МОРАЛЬ", tc: "8/8 · 1:14–1:30", bg: "box", y: 600,
   els: () => `<div class="el" style="left:60px;top:660px;right:60px;z-index:9;background:#0d0e12;border:6px solid #fff;border-radius:30px;padding:24px 28px;color:#fff;font-family:Unbounded;font-weight:900;font-size:30px;line-height:1.4">ПЕРЕД ПОКУПКОЙ:<br><span style="color:#ffd23f">🖐 приезжай раньше — капот должен быть холодным<br>💡 при зажигании все лампы должны загореться<br>✨ мытый мотор на старой машине — смотри внимательнее<br>🔌 сканер покажет, стирали ли ошибки</span></div>` + FOX(420, 1250, 220),
   vo: "Лис: «Перед покупкой: приезжай раньше и трогай капот — нужен холодный пуск. При зажигании все лампы на приборке должны загореться. Мытый мотор на старой машине — повод смотреть внимательнее. Сканер покажет, стирали ли ошибки. А свежие объявления раньше перекупов — в боте Перехват. Сохрани — пока тебе не продали невесту после марафета».", who: "Лис",
   mv: "<b>Финал:</b> чек-лист, лиса с аватарки." },
];

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els(); if (CNTV) document.querySelector(".view").insertAdjacentHTML("beforeend", `<div class="cnt" style="top:auto;bottom:20px;left:auto;right:20px">💸 ${CNTV} ₽</div>`); if (CLK) document.getElementById("h").insertAdjacentHTML("beforebegin", `<span class="clk">${CLK}</span>`);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
const sh = document.getElementById("t-shades"); if (sh) sh.style.display = "";
["t", "t2", "v", "s"].forEach(p => document.getElementById(p) && mouth(p, "talk"));
window.READY = true;
</script></body></html>
