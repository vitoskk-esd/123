<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#0b0c10;z-index:5}
.hd b{font-family:Unbounded;font-weight:900;font-size:30px;color:#151515;background:#ffd23f;border:5px solid #151515;border-radius:12px;padding:4px 14px}
.hd span{font-family:Unbounded;font-weight:800;font-size:26px;color:#fff}.hd i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#8b93a3}
.view{position:absolute;left:0;top:96px;width:1080px;height:820px;overflow:hidden;border-bottom:6px solid #ffd23f}
.stage{position:absolute;left:0;width:1080px;height:1920px}
.el{position:absolute}.el svg{width:100%;height:100%;overflow:visible}
.lab{position:absolute;font-family:Unbounded;font-weight:900;border:6px solid #151515;border-radius:18px;padding:6px 18px;box-shadow:0 8px 0 #151515;white-space:nowrap}
.bub{position:absolute;background:#0d0e12;border:5px solid #fff;border-radius:30px;padding:16px 24px;font-family:Unbounded;font-weight:800;font-size:36px;line-height:1.12;color:#fff;box-shadow:0 0 0 6px #0d0e12}
.bub em{font-style:normal;color:#ff3b30}
.txt{position:absolute;left:40px;right:40px;top:940px;color:#fff}
.txt .vo{font-family:Unbounded;font-weight:800;font-size:38px;line-height:1.22}
.txt .vo small{display:block;font-family:"JetBrains Mono";font-size:22px;color:#ffd23f;font-weight:800;margin-bottom:10px;letter-spacing:1px}
.txt .mv{margin-top:20px;font-family:Onest;font-size:25px;line-height:1.35;color:#b9bfca}
.txt .mv b{color:#fff}
.clk{white-space:nowrap;font-family:"JetBrains Mono";font-weight:800;font-size:34px;color:#ff3b30;border:4px solid #ff3b30;border-radius:10px;padding:0 10px;box-shadow:0 0 14px #ff3b3088}
.botcard{position:absolute;left:440px;top:660px;width:600px;z-index:9;background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:24px;box-shadow:0 0 80px rgba(120,180,255,.4)}
.botcard .bh{font-family:Onest;font-weight:700;font-size:26px;color:#8b93a3;margin-bottom:12px}
.botcard .bb{background:#1c1f26;border-radius:24px;padding:20px 24px;font-family:Onest;color:#fff;font-size:34px;line-height:1.45}
.cnt{position:absolute;left:40px;top:150px;z-index:20;font-family:"JetBrains Mono";font-weight:800;font-size:40px;color:#fff;background:#151515;border:5px solid #4cd964;border-radius:16px;padding:2px 16px;white-space:nowrap}
.receipt{position:absolute;left:150px;width:780px;background:#fbfaf6;border:6px solid #151515;box-shadow:0 18px 0 rgba(0,0,0,.35);padding:30px 40px;font-family:"JetBrains Mono";font-weight:800;font-size:32px;color:#222;line-height:1.6;transform:rotate(2deg);z-index:6}
.receipt h4{margin:0 0 10px;text-align:center;font-family:Unbounded;font-weight:900;font-size:38px}.receipt .row,.receipt .tot{display:flex;justify-content:space-between}.receipt .tot{border-top:5px dashed #222;margin-top:10px;padding-top:8px;font-size:42px;color:#e53935}
.title{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;line-height:1}
</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="view"><div class="stage" id="stage"></div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="../chars4.js"></script><script src="../chars5.js"></script><script src="bgs.js"></script>
<script>
// «ТОЛЯН: СО СТА ТЫСЯЧ · 9» — «Машина директора». Капитал 440 000 (итог части 8). Крючок части 8: у школы всегда пустое место директора.
// Оказывается, у директора есть отцовский Мерседес W124 1994 года — 30 лет под чехлом в школьном гараже, перекупы давали «250, ведро».
// Толян честно оценивает по боту (объявления по всей России), устраивает торги по телефону — и последним звонит Жора (соперник из частей 3–6).
// Приёмы (новые): приказ директора с печатью «УТВЕРЖДАЮ»; гараж — капсула времени (чехол слетает, пыль, календарь 1994); торги по телефону
// (табло ставок, три звонка); поворот — покупатель Жора. Бот: фильтр «вся Россия» (веер похожих объявлений) + находит директору Камри за 1 с.
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4, o, extra = "") => el(CHARS[kind](p, o), l, t, 420 * s, 800 * s, z, extra);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 15, fs) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z};${fs ? "font-size:" + fs + "px" : ""}">${html}</div>`;
const CAR = (img, l, t, w, z = 3, extra = "") => `<img class="el" src="../../kit/img/${img}" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${extra}">`;
const PHONE = (l, t, inner, w = 520, z = 12) => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:22px;box-shadow:0 0 70px rgba(120,180,255,.4)">${inner}</div>`;
const BOT = (body, fs = 30) => `<div style="font-family:Onest;font-weight:700;font-size:24px;color:#8b93a3">ПЕРЕХВАТ · бот</div><div style="background:#1c1f26;border-radius:22px;padding:16px 20px;margin-top:10px;font-family:Onest;color:#fff;font-size:${fs}px;line-height:1.42">${body}</div>`;
const CAP = (v, d = "") => `<div class="el" style="right:30px;top:1440px;z-index:20;font-family:'JetBrains Mono';font-weight:800;font-size:38px;color:#fff;background:#151515;border:5px solid #4cd964;border-radius:16px;padding:2px 16px;white-space:nowrap">💰 ${v} ₽${d}</div>`;
const ORDER = (l, t, rows, stampTxt = "УТВЕРЖДАЮ") => `<div class="el" style="left:${l}px;top:${t}px;width:560px;z-index:16;background:#fbfaf3;border:6px solid #151515;box-shadow:0 14px 0 #151515;transform:rotate(-2deg);padding:22px 28px;font-family:Onest;color:#222">
  <div style="text-align:center;font-family:Unbounded;font-weight:900;font-size:30px">ПРИКАЗ № 1</div><div style="text-align:center;font-size:20px;color:#666;margin-bottom:10px">по школе № 12</div>
  ${rows.map(r => `<div style="font-weight:800;font-size:26px;line-height:1.35;margin:6px 0">${r}</div>`).join("")}
  <div style="position:absolute;right:20px;bottom:18px;transform:rotate(-12deg);font-family:Unbounded;font-weight:900;font-size:30px;color:#2f4fb8;border:6px double #2f4fb8;border-radius:50%;padding:22px 16px;opacity:.85">${stampTxt}</div></div>`;
const CARDS = () => [["Mercedes W124 · 1994 · «в идеале»", "1 450 000 ₽", "Москва"], ["Mercedes W124 · 1995 · 90 тыс. км", "1 200 000 ₽", "Казань"], ["Mercedes W124 · 1993 · гаражный", "980 000 ₽", "Самара"]]
  .map(([t, p, c], k) => `<div class="el" style="left:${430 + k * 30}px;top:${850 + k * 140}px;width:560px;z-index:${12 + k};background:#0d0e12;border:7px solid #2a2d34;border-radius:30px;padding:16px 20px;box-shadow:0 0 40px rgba(120,180,255,.35);transform:rotate(${-4 + k * 4}deg);font-family:Onest;color:#fff">
    <div style="font-weight:700;font-size:20px;color:#8b93a3">ПЕРЕХВАТ · вся Россия</div><div style="font-weight:800;font-size:26px;margin-top:6px">${t}</div><div style="font-family:Unbounded;font-weight:900;font-size:34px;color:#ffd23f">${p}</div><div style="font-size:22px;color:#b9bfca">📍 ${c}</div></div>`).join("");
const BIDS = (rows) => `<div class="el" style="left:40px;top:1140px;width:560px;z-index:16;background:#151515;border:8px solid #3a3d46;border-radius:22px;padding:16px 22px;font-family:'JetBrains Mono';font-weight:800;color:#fff;box-shadow:0 12px 0 #000">
  <div style="font-size:26px;color:#8b93a3">ТОРГИ · Mercedes W124</div>${rows.map(([who, v, win]) => `<div style="display:flex;justify-content:space-between;font-size:36px;margin-top:8px;color:${win ? "#4cd964" : "#fff"}">📞 ${who}<b>${v}</b></div>`).join("")}</div>`;
const COVER = (l, t, w, h, off = 0) => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:5;background:linear-gradient(170deg,#b9bfca,#8a929b);border:7px solid #151515;border-radius:60px 80px 20px 20px;transform:translate(${off}px,${-off / 3}px) rotate(${off / 20}deg);opacity:${off ? .9 : 1}"></div>`;
const DUST = (l, t) => [0, 1, 2, 3, 4].map(i => `<div class="el" style="left:${l + i * 110}px;top:${t - (i % 2) * 40}px;width:${120 + i * 10}px;height:${90 + i * 8}px;z-index:7;border-radius:50%;background:radial-gradient(#e8e2d0,rgba(232,226,208,0) 70%);opacity:.8"></div>`).join("");
const ILDAR = { jacket: "#1f4fb8", pants: "#1f4fb8", hair: "#1d1d1f", cap: "#fff" };
const DIR = { jacket: "#2b2f37", pants: "#2b2f37", hair: "#3a2d22", tie: "#c0392b" };
const ZHORA = { jacket: "#1d1d1f", pants: "#2b2f37", cap: "#c0392b", mustache: true, chain: true, hair: "#1d1d1f", item: "phone", look: "grin" };
const S = [
 { h: "СТАДИОН · ПУСТОЕ МЕСТО", tc: "1/9 · 0:00–0:09", bg: "stadion", y: 700, els: () => CAP("440 000") + ch("perekup", "il", 560, 860, .8, 6, ILDAR) + ch("tolyan", "t", 40, 860, .8, 6)
     + bub("Брат, директор пешком ходит.<br><em>Двадцать лет!</em>", 330, 720, 15, 34) + lab("МЕСТО «ДИРЕКТОР» — ПУСТО", 40, 1380, "#c0392b", "#fff", 38, -3),
   vo: "Лис: «Четыреста сорок тысяч. У школы каждое утро пустое место директора». Ильдар: «Брат, директор пешком ходит. Двадцать лет!»", who: "Лис + Ильдар",
   mv: "<b>Часть 9, капитал 440 000 (итог части 8). Крючок части 8 — «а где машина директора?»</b> <b>Новый фон — школьный стадион</b> (беговая дорожка, трибуны, ворота, табло «8 „А“ 3:2»). Ильдар ведёт урок физры, мимо пробегает класс. Отсылка: пустое место «ДИРЕКТОР»." },
 { h: "КАБИНЕТ · ПРИКАЗ", tc: "2/9 · 0:09–0:18", bg: "kabdir", y: 700, els: () => CAP("440 000") + ch("perekup", "dr", 600, 840, .82, 6, DIR) + ch("tolyan", "t", 20, 880, .78, 6)
     + ORDER(40, 1220, ["1. Продать отцовский Мерседес — честно.", "2. Купить машину, на которой не стыдно."])
     + bub("Машина у меня есть. Отцовская.<br><em>Перекупы дали двести пятьдесят — «ведро».</em>", 300, 700, 15, 28),
   vo: "Директор: «Анатолий, машина у меня есть. Отцовская. Перекупы дали двести пятьдесят. Сказали — ведро».", who: "Директор",
   mv: "<b>Новый фон — кабинет директора</b> (флаг, герб школы, грамоты, шкаф с папками, стол с зелёным сукном и дисковым телефоном). Директор Виктор Андреевич — из части 8. <b>Приём 1 — приказ:</b> директор подписывает «ПРИКАЗ № 1» и ставит печать «УТВЕРЖДАЮ» (печать влетает с грохотом)." },
 { h: "ГАРАЖ — КАПСУЛА ВРЕМЕНИ", tc: "3/9 · 0:18–0:28", bg: "garazh", y: 700, els: () => CAR("w124/w124_34.png", 330, 1130, 700, 4) + COVER(300, 1110, 760, 330, 420) + DUST(300, 1100)
     + ch("perekup", "dr", 20, 870, .8, 6, DIR) + lab("1994 · 61 000 КМ · 30 ЛЕТ ПОД ЧЕХЛОМ", 40, 1450, "#ffd23f", "#151515", 34, -2),
   vo: "Лис: «Мерседес сто двадцать четыре. Девяносто четвёртый год. Пробег — шестьдесят одна тысяча. Тридцать лет под чехлом».", who: "Лис",
   mv: "<b>Новый фон — школьный гараж</b> (кирпич, полки с банками, лампа на проводе, отрывной календарь «12 мая 1994»). <b>Приём 2 — капсула времени:</b> директор сдёргивает чехол — облако пыли, под ним сияющий Мерседес W124; камера медленно наезжает." },
 { h: "БОТ · ВСЯ РОССИЯ", tc: "4/9 · 0:28–0:37", bg: "garazh", y: 700, els: () => CAR("w124/w124_34.png", 330, 1130, 700, 4) + CARDS() + ch("tolyan", "t", 20, 870, .8, 6)
     + bub("Виктор Андреевич, это не ведро.<br><em>Это — миллион двести.</em>", 20, 720, 15, 30),
   vo: "Толян: «Виктор Андреевич, это не ведро. Это — миллион двести». Лис: «Бот показал такие же по всей России: от девятисот восьмидесяти до миллиона четырёхсот пятидесяти».", who: "Толян + Лис",
   mv: "Толян ставит в боте фильтр «Mercedes W124 · вся Россия» — веером выпадают три карточки похожих объявлений (Москва 1 450 000, Казань 1 200 000, Самара 980 000). Бот здесь — честная оценка по рынку (функция фильтра по всей России)." },
 { h: "ТОРГИ ПО ТЕЛЕФОНУ", tc: "5/9 · 0:37–0:46", bg: "stadion", y: 700, els: () => CAP("440 000").replace("right:30px", "left:40px").replace("top:1440px", "top:1440px") + BIDS([["Казань", "1 000 000"], ["Сочи", "1 150 000"], ["???", "1 300 000", 1]])
     + ch("tolyan", "t", 600, 860, .8, 6) + bub("Звонок за звонком —<br><em>а я ещё чай не допил.</em>", 380, 720, 15, 32),
   vo: "Лис: «Толян выставил Мерседес. Через час — три звонка и торги». Толян: «Звонок за звонком — а я ещё чай не допил».", who: "Лис + Толян",
   mv: "<b>Приём 3 — торги по телефону:</b> табло ставок, три входящих звонка друг за другом, цифры растут 1 000 000 → 1 150 000 → 1 300 000; последний звонящий — «???». Толян на трибуне стадиона, на заднем плане бегут школьники." },
 { h: "ПОВОРОТ · ЖОРА", tc: "6/9 · 0:46–0:54", bg: "stadion", y: 700, els: () => BIDS([["Казань", "1 000 000"], ["Сочи", "1 150 000"], ["Жора", "1 300 000", 1]])
     + ch("perekup", "zh", 640, 860, .78, 6, ZHORA) + ch("tolyan", "t", 40, 860, .8, 6, { look: "o" })
     + bub("Студент, миллион триста!<br><em>Это ж кабан в идеале!</em>", 380, 720, 15, 32),
   vo: "Жора: «Студент, миллион триста! Это ж кабан в идеале!» Лис: «Жора — тот самый соперник. Впервые купил у Толяна. И даже не торговался».", who: "Жора + Лис",
   mv: "<b>Приём 4 — поворот:</b> последний покупатель — Жора из частей 3–6, соперник Толяна. Отсылка для тех, кто смотрит подряд. Жора приезжает на стадион с наличкой." },
 { h: "КАМРИ ДИРЕКТОРУ", tc: "7/9 · 0:54–1:02", bg: "kabdir", y: 700, els: () => ch("perekup", "dr", 600, 840, .82, 6, { ...DIR, look: "grin" }) + ch("tolyan", "t", 20, 880, .78, 6)
     + PHONE(300, 1160, BOT(`<b style="color:#ff7a1a">🔥 −8% к рынку</b><br><b>Toyota Camry 2014 · 1 090 000 ₽</b><br>📍 твой город · ⏱ 1 с после публикации`, 27), 560)
     + bub("Анатолий… приказом<br><em>объявляю благодарность.</em>", 330, 700, 15, 34),
   vo: "Лис: «А директору бот нашёл Камри — через секунду после публикации». Директор: «Анатолий… приказом объявляю благодарность».", who: "Лис + Директор",
   mv: "Фильтр «Camry до 1 100 000, мой город» — уведомление через 1 с. Вторая печать на приказе — «ОБЪЯВИТЬ БЛАГОДАРНОСТЬ». Бот — находит машину клиенту." },
 { h: "ДИРЕКТОР — НА МАШИНЕ", tc: "8/9 · 1:02–1:08", bg: "stadion", y: 700, els: () => CAR("camry/camry.png", 300, 1100, 720, 3) + ch("perekup", "il", 20, 860, .8, 6, { ...ILDAR, look: "o" })
     + bub("Брат!<br><em>Директор — на машине!</em>", 40, 720, 15, 40),
   vo: "Ильдар: «Брат! Директор — на машине!»", who: "Ильдар",
   mv: "Утро: директор впервые за двадцать лет подъезжает на Камри; школьники на дорожке останавливаются. Ильдар роняет свисток." },
 { h: "ИТОГ + КРЮЧОК", tc: "9/9 · 1:08–1:16", bg: "stadion", y: 700, els: () => CAP("570 000", " <span style='color:#4cd964'>+130</span>").replace("top:1440px", "top:1240px") + CAR("camry/camry.png", 300, 1100, 720, 3) + ch("tolyan", "t", 40, 860, .8, 6)
     + `<div class="el" style="left:60px;right:60px;top:1330px;z-index:18;background:#ffd23f;border:8px solid #151515;border-radius:34px;padding:22px 30px;box-shadow:0 14px 0 #151515;font-family:Unbounded;font-weight:900;color:#151515;text-align:center"><div style="font-size:40px;line-height:1.15">Бот <span style="color:#c0392b">«Перехват»</span> — ссылка в шапке</div><div style="margin-top:10px;font-size:26px;font-family:Onest;font-weight:800">фильтр по всей России · свежие объявления за ~1 с</div></div>`,
   vo: "Лис: «Комиссия — десять процентов, сто тридцать тысяч. Капитал — пятьсот семьдесят. В десятой части — Жора просит о помощи. Подпишись, чтобы не пропустить».", who: "Лис",
   mv: "Счётчик капитала 440 → 570 000. Крючок на часть 10 + финальная карточка (голос её не читает)." },
];
const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els();
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
["t", "il", "dr", "zh"].forEach(p => document.getElementById(p) && mouth(p, "talk"));
window.READY = true;
</script></body></html>
