<script>

const L = (p, x, foot, h, o = {}, pose = {}, extra = {}) => LEHA(ch("perekup", p, x, foot, h, { ...LEHA_O, ...o }, pose, extra));

 { h: "ОБЛОЖКА → ПЕРВЫЙ ПОКУПАТЕЛЬ ПОД ДОЖДЁМ", tc: "1/5 · 0:00–0:14",

 { h: "СДЕЛКА: +25 000, НО 1/10 → «МАШИН СТАЛО МЕНЬШЕ»", tc: "3/5 · 0:30–0:44",

   B: { def: () => ({ bg: "ploshchadkadozhd", over: TWOCARDS() }), shot: { x: 540, y: 960, s: 1 } },
   vo: "Толян: «Лёха, бот прислал две: Гранта и десятка, обе ниже рынка». Лёха: «Нашёл две? Бери обе. Деньги мои, прибыль пополам».", who: "Толян + Лёха",
   mv: "A — <b>приём: разделённый экран</b> (видеосвязь): слева Толян под дождём, справа Лёха в «Роллс-Ройсе» — <b>новый фон — салон Rolls-Royce</b> со «звёздным небом» на потолке, кремовая кожа, за окном башни Сити. B — <b>телефон крупно: две карточки бота подряд</b> — «Lada Granta 2017 · 330 000 при рынке 400 000» и «ВАЗ-2110 2006 · капот другого цвета · 110 000 при рынке 150 000»." },
 { h: "ДВЕ МАШИНЫ ЗАЕЗЖАЮТ: 3/10 → ЖОРА В БИНОКЛЬ", tc: "5/5 · 0:58–1:12",

     bubbles: [{ p: "za", html: "Студент вырос. Ну-ну.<br><em>Завтра у него будет сюрприз.</em>", fs: 36 }], talk: ["za"] },

   mv: "A — Гранта и «десятка» с капотом другого цвета на площадке, счётчик 🚗 3/10. B — <b>приём: вид в бинокль</b> — Жора подглядывает с той стороны дороги (он в кружке, площадка — в двух кругах бинокля). Крючок на 19-ю — голосом Жоры; последний кадр — только бот." },

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const put = (id, f) => { const el = document.getElementById(id);
  if (f.split) { const [dl, sl, dr, sr] = f.split();
    el.innerHTML = `<div class="cf">${HALF(C.frame(dl, sl), -1)}${HALF(C.frame(dr, sr), 1)}<div style="position:absolute;left:532px;top:0;width:16px;height:1920px;background:#fff;box-shadow:0 0 30px #000;z-index:80"></div>
      ${C.frame({ hud: f.hud }, { x: 540, y: 960, s: 1 }).replace('<div class="cf">', '<div style="position:absolute;inset:0;z-index:90;pointer-events:none">').replace(/<div class="vig"><\/div>/, "")}</div>`; }
  else { const def = f.def(); def.bubbles = f.bubbles || []; el.innerHTML = C.frame(def, f.shot); }
  if (f.sketch) el.querySelector(".cf").style.filter = SKF;
  (f.talk || []).forEach(p => C.mouth(el, p, "talk")); if (f.after) f.after(el); return el; };
const a = put("A", sc.A), b = put("B", sc.B);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
document.fonts.ready.then(() => { C.layout(a); C.layout(b); window.READY = true; });
