<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#0b0c10;z-index:5}
.hd b{font-family:Unbounded;font-weight:900;font-size:30px;color:#151515;background:#ffd23f;border:5px solid #151515;border-radius:12px;padding:4px 14px}
.hd span{font-family:Unbounded;font-weight:800;font-size:26px;color:#fff}.hd i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#8b93a3}
.view{position:absolute;left:0;top:96px;width:1080px;height:820px;overflow:hidden;border-bottom:6px solid #ffd23f}
.stage{position:absolute;left:0;width:1080px;height:1920px}
.el{position:absolute}.el svg{width:100%;height:100%;overflow:visible}
.lab{position:absolute;font-family:Unbounded;font-weight:900;border:6px solid #151515;border-radius:18px;padding:6px 18px;box-shadow:0 8px 0 #151515;white-space:nowrap}
.bub{position:absolute;background:#0d0e12;border:5px solid #fff;border-radius:30px;padding:16px 24px;font-family:Unbounded;font-weight:800;font-size:36px;line-height:1.12;color:#fff;box-shadow:0 0 0 6px #0d0e12}
.bub em{font-style:normal;color:#ff3b30}
.txt{position:absolute;left:40px;right:40px;top:940px;color:#fff}
.txt .vo{font-family:Unbounded;font-weight:800;font-size:38px;line-height:1.22}
.txt .vo small{display:block;font-family:"JetBrains Mono";font-size:22px;color:#ffd23f;font-weight:800;margin-bottom:10px;letter-spacing:1px}
.txt .mv{margin-top:20px;font-family:Onest;font-size:25px;line-height:1.35;color:#b9bfca}
.txt .mv b{color:#fff}
.clk{white-space:nowrap;font-family:"JetBrains Mono";font-weight:800;font-size:34px;color:#ff3b30;border:4px solid #ff3b30;border-radius:10px;padding:0 10px;box-shadow:0 0 14px #ff3b3088}
.botcard{position:absolute;left:440px;top:660px;width:600px;z-index:9;background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:24px;box-shadow:0 0 80px rgba(120,180,255,.4)}
.botcard .bh{font-family:Onest;font-weight:700;font-size:26px;color:#8b93a3;margin-bottom:12px}
.botcard .bb{background:#1c1f26;border-radius:24px;padding:20px 24px;font-family:Onest;color:#fff;font-size:34px;line-height:1.45}
.cnt{position:absolute;left:40px;top:150px;z-index:20;font-family:"JetBrains Mono";font-weight:800;font-size:40px;color:#fff;background:#151515;border:5px solid #4cd964;border-radius:16px;padding:2px 16px;white-space:nowrap}
.receipt{position:absolute;left:150px;width:780px;background:#fbfaf6;border:6px solid #151515;box-shadow:0 18px 0 rgba(0,0,0,.35);padding:30px 40px;font-family:"JetBrains Mono";font-weight:800;font-size:32px;color:#222;line-height:1.6;transform:rotate(2deg);z-index:6}
.receipt h4{margin:0 0 10px;text-align:center;font-family:Unbounded;font-weight:900;font-size:38px}.receipt .row,.receipt .tot{display:flex;justify-content:space-between}.receipt .tot{border-top:5px dashed #222;margin-top:10px;padding-top:8px;font-size:42px;color:#e53935}
.title{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;line-height:1}
</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="view"><div class="stage" id="stage"></div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="../chars4.js"></script><script src="../chars5.js"></script><script src="bgs.js"></script>
<script>
// ep32 «ТРИ ПРОДАВЦА» — разнообразие (владелец 07.11): без уведомления в хуке, без плашки в середине, без «угадай цену». Вика смотрит три Mark II
// на набережной (фон впервые): перекуп, мошенник, хозяин. Бот — её инструмент: карточка «Перехвата» показывает, по рынку ли цена.
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4, o) => el(CHARS[kind](p, o), l, t, 420 * s, 800 * s, z);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 9) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z}">${html}</div>`;
let CLK = "", CNTV = ""; const clock = (t) => (CLK = t, "");
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
const PAINT = { white: "none", black: "grayscale(.5) brightness(.42) contrast(1.3)", cherry: "sepia(1) saturate(4) hue-rotate(-40deg) brightness(.78)" };
const MK = (p, l, t, w, z = 3) => `<img class="el" src="../../kit/img/cls/cls_34${p === "white" ? "" : "_" + p}.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z}">`;   // перекраска по пикселям (kit/img/cls/recolor.py), диски родные
const TAG = (txt, n, l, t, bg) => `<div class="el" style="left:${l}px;top:${t}px;z-index:9;font-family:Unbounded;font-weight:900;font-size:32px;white-space:nowrap;background:${bg};color:#151515;border:6px solid #151515;border-radius:16px;padding:4px 14px;box-shadow:0 8px 0 #151515"><span style="font-size:24px;opacity:.7">№${n}</span> ${txt}</div>`;
const ARK = { coat: "#c69c6d", jacket: "#c69c6d", glasses: true, mustache: true, hair: "#2b1d14", tie: "#8e1b1b", item: "phone" };
const KOS = { jacket: "#4a6b8a", pants: "#2b2f37", glasses: true, hair: "#6b4a2a", item: "bag" };
const PAUSE = `<div class="el" style="left:390px;top:1060px;width:300px;height:300px;z-index:10;border-radius:50%;background:rgba(13,14,18,.82);border:8px solid #fff;display:flex;align-items:center;justify-content:center;font-size:150px;color:#fff">⏸</div>`;
const MARKET = (l, t) => `<div class="botcard" style="left:${l}px;top:${t}px;width:640px"><div class="bh">ПЕРЕХВАТ · бот · карточка объявления</div><div class="bb"><b>Mercedes CLS 2008 · 1 190 000 ₽</b><br><b style="color:#4cd964">✅ по рынку</b> · похожие сейчас: <b>1,15–1,25 млн</b><br>📍 твой город</div></div>`;
const VIKA = (p, l, t, s) => ch("vika", p, l, t, s, 6);
const CARDS = (l, t) => `<div class="el" style="left:${l}px;top:${t}px;width:560px;z-index:9;background:#0d0e12;border:8px solid #2a2d34;border-radius:40px;padding:18px;box-shadow:0 0 60px rgba(120,180,255,.35)">
  <div style="font-family:Onest;font-weight:700;font-size:24px;color:#8b93a3;margin-bottom:10px">ПЕРЕХВАТ · бот · 3 новых</div>
  ${[["1 450 000", "#ff7a1a", "▲ +20% к рынку"], ["890 000", "#ffd23f", "▼ −25% к рынку"], ["1 190 000", "#4cd964", "✅ по рынку"]].map(([p, c, d]) => `<div style="background:#1c1f26;border-radius:18px;padding:10px 16px;margin-top:8px;font-family:Onest;color:#fff;font-size:28px"><b>Mercedes CLS · ${p}</b><br><b style="color:${c}">${d}</b></div>`).join("")}</div>`;
// пол-экрана: собеседник в своей локации (как звонок в ep27)
const HALF = (bg, l, inner) => `<div class="el" style="left:${l}px;top:700px;width:540px;height:820px;overflow:hidden;z-index:5;border-left:${l ? "8px solid #151515" : "0"}"><div style="position:absolute;left:${l ? -400 : -100}px;top:-700px;width:1080px;height:1920px">${BGS[bg].replace('id="bg"', "")}</div>${inner}</div>`;
const SOCHI = `<div class="el" style="left:560px;top:1080px;width:440px;z-index:9;background:#fff;border:8px solid #151515;padding:12px 12px 18px;transform:rotate(4deg);box-shadow:0 12px 0 #151515">
  <div style="height:200px;background:linear-gradient(#7cc8ff,#bfe6ff);position:relative;overflow:hidden"><div style="position:absolute;left:20px;bottom:30px;font-size:90px">🌴</div><div style="position:absolute;right:16px;bottom:24px;font-size:80px">🌴</div>
  <img src="../../kit/img/cls/cls_34.png" style="position:absolute;left:70px;bottom:6px;width:300px"></div><div style="font-family:Unbounded;font-weight:900;font-size:24px;text-align:center;margin-top:8px">📷 Сочи · 2019</div></div>`;
const S = [
 { h: "ТРИ CLS ЗА ВЕЧЕР", tc: "1/6 · 0:00–0:06", bg: "interior", y: 700, els: () => CARDS(260, 760),
   vo: "Лис: «Три одинаковых CLS. Разница — полмиллиона. Вика решила посмотреть все три за один вечер».", who: "Лис",
   mv: "<b>Салон машины Вики, ночная дорога.</b> На держателе телефон — три карточки «Перехвата»: +20% к рынку, −25%, по рынку. Бот здесь — реквизит, не уведомление." },
 { h: "№1 · НОЧНОЙ РЫНОК · ТОЛЯН", tc: "2/6 · 0:06–0:17", bg: "night", y: 700, els: () => MK("black", 280, 1230, 660) + ch("tolyan", "t", -20, 860, .84, 6) + VIKA("v", 800, 880, .74)
     + bub("Это…<br><em>освещение!</em>", 60, 740) + `<div class="el" style="left:250px;top:1000px;width:620px;height:260px;z-index:7;background:radial-gradient(ellipse at 0% 50%, rgba(255,245,190,.95), rgba(255,245,190,0) 70%);transform:rotate(-8deg)"></div><div class="el" style="left:250px;top:1080px;font-size:70px;z-index:8">🔦</div>`
     + lab("КРАСИЛИ 2 РАЗА", 520, 1440, "#151515", "#fff", 38, 3),
   vo: "Толян: «Сестрёнка, не бит, не крашен!» Вика: «А крыло другого оттенка». Толян (светит ей фонарём в глаза): «Это… освещение!» Лис: «Красили два раза».", who: "Толян + Вика + Лис",
   mv: "<b>Ночной авторынок.</b> Толян светит Вике фонарём прямо в лицо, чтобы она не разглядела крыло. Быстрые реплики, ~11 с." },
 { h: "№2 · НАБЕРЕЖНАЯ · АРКАДИЙ", tc: "3/6 · 0:17–0:28", bg: "embank", y: 700, els: () => HALF("embank", 0, VIKA("v2", 90, 180, .7).replace('left:90px;top:180px', 'left:90px;top:180px'))
     + HALF("flat", 540, ch("perekup", "a", 80, 160, .78, 6, ARK)) + bub("Она… на другом<br><em>берегу.</em>", 560, 740) + SOCHI,
   vo: "Аркадий (по телефону): «Скиньте предоплату — придержу». Вика: «Я на месте. Где машина?» Аркадий: «Она… на другом берегу». Лис: «Фото — из Сочи. Пятилетней давности».", who: "Аркадий + Вика + Лис",
   mv: "<b>Пол-экрана — Вика на пустой набережной, пол-экрана — Аркадий у себя в квартире</b> (оба говорящих в кадре). Вылетает «фото объявления»: тот же CLS под пальмами, «Сочи · 2019»." },
 { h: "№3 · ГАРАЖИ · КОСТЯ", tc: "4/6 · 0:28–0:40", bg: "garages", y: 700, els: () => MK("cherry", 300, 1240, 640) + ch("perekup", "k", -10, 870, .84, 6, KOS) + VIKA("v3", 800, 880, .74)
     + Array.from({ length: 7 }, (_, i) => `<div class="el" style="left:${160 + i * 90}px;top:${760 + (i % 3) * 70}px;font-size:60px;z-index:8;transform:rotate(${(i * 37) % 50 - 25}deg)">🧾</div>`).join("")
     + MARKET(400, 1010).replace('class="botcard"', 'class="botcard" style0') + lab("😴 ПОДОЗРИТЕЛЬНО СКУЧНО", 140, 1450, "#ffd23f", "#151515", 34, -2),
   vo: "Костя: «ПТС на меня. Чеки за все ТО». Лис: «Скучно. Подозрительно скучно. Так выглядит хозяин». Вика (смотрит карточку в «Перехвате»): «По рынку. Беру».", who: "Костя + Лис + Вика",
   mv: "<b>Гаражи ночью.</b> Костя открывает папку — чеки разлетаются по всему кадру, Вика зевает. Потом карточка «Перехвата» в её руке: «по рынку» — «Беру»." },
 { h: "ПОВОРОТ · ТОЛЯН И АРКАДИЙ", tc: "5/6 · 0:40–0:50", bg: "night", y: 700, els: () => HALF("night", 0, ch("tolyan", "t2", 60, 160, .76, 6)) + HALF("flat", 540, ch("perekup", "a2", 80, 160, .78, 6, ARK))
     + bub("Брат, CLS за 890.<br><em>Скинь предоплату.</em>", 560, 740) + lab("СКИДЫВАЮ! 💸", 60, 1440, "#ff3b30", "#fff", 44, -3),
   vo: "Аркадий (звонит Толяну): «Брат, CLS за восемьсот девяносто. Скинь предоплату». Толян: «Скидываю! Никому не отдавай!» Лис: «Перекуп нашёл машину мечты. На другом берегу».", who: "Аркадий + Толян + Лис",
   mv: "<b>Финальный поворот:</b> мошенник разводит перекупа. Пол-экрана — Толян на ночном рынке, пол-экрана — Аркадий. Смешной панч вместо морали." },
 { h: "ФИНАЛ", tc: "6/6 · 0:50–0:56", bg: "embank", y: 600,
   els: () => `<div class="el" style="left:60px;top:640px;right:60px;z-index:9;background:#0d0e12;border:6px solid #fff;border-radius:30px;padding:20px 26px;color:#fff;font-family:Unbounded;font-weight:900;font-size:28px;line-height:1.4"><span style="color:#ff7a1a">выше рынка — перекуп</span> · <span style="color:#ffd23f">сильно ниже — развод</span> · <span style="color:#4cd964">по рынку + документы — смотри</span></div>`
     + `<div class="el" style="left:60px;right:60px;top:960px;z-index:12;background:#ffd23f;border:8px solid #151515;border-radius:34px;padding:22px 30px;box-shadow:0 14px 0 #151515;font-family:Unbounded;font-weight:900;color:#151515;text-align:center"><div style="font-size:40px;line-height:1.15">Бот <span style="color:#c0392b">«Перехват»</span> — ссылка в шапке</div><div style="margin-top:10px;font-size:26px;font-family:Onest;font-weight:800">в каждой карточке — насколько ниже или выше рынка</div></div>` + FOX(440, 1240, 200),
   vo: "Лис: «Выше рынка — перекуп. Сильно ниже — развод. По рынку и документы на продавца — смотри. Сохрани — пока тебе не продали машину с другого берега».", who: "Лис",
   mv: "Одна строка правил + короткая финальная карточка. Весь ролик ~55 с вместо 1:22." },
];

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els(); if (CNTV) document.querySelector(".view").insertAdjacentHTML("beforeend", `<div class="cnt" style="top:auto;bottom:20px;left:auto;right:20px">💸 ${CNTV} ₽</div>`); if (CLK) document.getElementById("h").insertAdjacentHTML("beforebegin", `<span class="clk">${CLK}</span>`);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
const sh = document.getElementById("t-shades"); if (sh) sh.style.display = "";
["t", "t2", "a", "a2", "k", "v"].forEach(p => document.getElementById(p) && mouth(p, "talk"));
window.READY = true;
</script></body></html>
