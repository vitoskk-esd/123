<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#0b0c10;z-index:5}
.hd b{font-family:Unbounded;font-weight:900;font-size:30px;color:#151515;background:#ffd23f;border:5px solid #151515;border-radius:12px;padding:4px 14px}
.hd span{font-family:Unbounded;font-weight:800;font-size:26px;color:#fff}.hd i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#8b93a3}
.view{position:absolute;left:0;top:96px;width:1080px;height:820px;overflow:hidden;border-bottom:6px solid #ffd23f}
.stage{position:absolute;left:0;width:1080px;height:1920px}
.el{position:absolute}.el svg{width:100%;height:100%;overflow:visible}
.lab{position:absolute;font-family:Unbounded;font-weight:900;border:6px solid #151515;border-radius:18px;padding:6px 18px;box-shadow:0 8px 0 #151515;white-space:nowrap}
.bub{position:absolute;background:#0d0e12;border:5px solid #fff;border-radius:30px;padding:16px 24px;font-family:Unbounded;font-weight:800;font-size:36px;line-height:1.12;color:#fff;box-shadow:0 0 0 6px #0d0e12}
.bub em{font-style:normal;color:#ff3b30}
.txt{position:absolute;left:40px;right:40px;top:940px;color:#fff}
.txt .vo{font-family:Unbounded;font-weight:800;font-size:38px;line-height:1.22}
.txt .vo small{display:block;font-family:"JetBrains Mono";font-size:22px;color:#ffd23f;font-weight:800;margin-bottom:10px;letter-spacing:1px}
.txt .mv{margin-top:20px;font-family:Onest;font-size:25px;line-height:1.35;color:#b9bfca}
.txt .mv b{color:#fff}
.clk{white-space:nowrap;font-family:"JetBrains Mono";font-weight:800;font-size:34px;color:#ff3b30;border:4px solid #ff3b30;border-radius:10px;padding:0 10px;box-shadow:0 0 14px #ff3b3088}
.title{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;line-height:1}
</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="view"><div class="stage" id="stage"></div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="bgs.js"></script>
<script>
// Приора сбоку — по рисунку владельца (kit/img/priora/priora_*.png): black — пацанская с наклейкой, white, yellow — такси, patch
const IMG = (v, l, t, w = 900, z = 3, extra = "") => `<img class="el" src="../../kit/img/priora/priora_${v}.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${extra}">`;
const P = (k, o) => "";
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4) => el(CHARS[kind](p), l, t, 420 * s, 800 * s, z);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 9) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z}">${html}</div>`;
// ВАЗ-2114 владельца (kit/img/vaz2114/vaz2114_white.png, вырезан из его картинки)
const CAR = (l, t, w = 820, z = 3, extra = "") => `<img class="el" src="../../kit/img/vaz2114/vaz2114_white.png" style="left:${l}px;top:${t + w * .04}px;width:${w}px;z-index:${z};${extra}">`;
let CLK = ""; const clock = (t) => (CLK = t, "");
const odo = (v, l, t, c = "#ffd23f") => `<div class="el" style="left:${l}px;top:${t}px;z-index:9;font-family:'JetBrains Mono';font-weight:800;font-size:54px;color:${c};background:#111;border:6px solid #151515;outline:4px solid #555;border-radius:12px;padding:6px 20px">ОДО ${v}</div>`;
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
// машина-«утопленник» (синий седан из библиотеки), вода поверх, крупные планы: коврик, фара, разъём
const SEDAN = (id, l, t, w = 820, z = 4, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${w * .4}px;z-index:${z};${extra}">${CHARS.car(id, 1, "#2e86de", "#3a4a5e")}</div>`;
const WATER = (top, z = 5) => `<div class="el" style="left:0;top:${top}px;width:1080px;height:${1920 - top}px;z-index:${z};background:linear-gradient(#6b7d5aee,#3d4a33);border-top:8px solid #cfe3c4"></div>`;
const FLOOR = () => `<div class="el" style="left:60px;top:780px;width:960px;height:700px;z-index:5;background:#3a3f48;border:8px solid #151515;border-radius:30px;overflow:hidden">
  <div style="position:absolute;left:120px;top:160px;width:620px;height:420px;background:radial-gradient(ellipse at 40% 50%,#b89b6a,#7d6a46 60%,#4a3f2c);border-radius:40px"></div>
  ${[[260, 300], [380, 360], [500, 280], [330, 430], [560, 410]].map(([x, y]) => `<div style="position:absolute;left:${x}px;top:${y}px;width:14px;height:10px;border-radius:50%;background:#e8d9b5"></div>`).join("")}
  <div style="position:absolute;left:470px;top:330px;font-size:80px">🐚</div>
  <div style="position:absolute;left:-40px;top:-60px;width:620px;height:400px;background:repeating-linear-gradient(90deg,#1a1b1f 0 22px,#26282e 22px 30px);border:8px solid #0b0b0b;border-radius:30px;transform:rotate(-24deg);transform-origin:0 0;box-shadow:0 30px 30px rgba(0,0,0,.5)"></div></div>`;
const LAMP = () => `<div class="el" style="left:80px;top:800px;width:520px;height:300px;z-index:5;background:linear-gradient(#e9f2fb 0 52%,#9db7c9 52%);border:10px solid #151515;border-radius:60px 140px 40px 40px;overflow:hidden">
  <div style="position:absolute;left:0;right:0;top:52%;border-top:6px dashed #5d7a8f"></div><div style="position:absolute;left:150px;top:60px;width:160px;height:120px;border-radius:50%;background:#ffe9a8;border:6px solid #151515"></div></div>
  <div class="el" style="left:640px;top:880px;width:340px;height:200px;z-index:5;background:#1c1c20;border:8px solid #151515;border-radius:20px">
  ${[0, 1, 2, 3].map(i => `<div style="position:absolute;left:${30 + i * 75}px;top:50px;width:50px;height:90px;border-radius:8px;background:#3aa76d;box-shadow:inset 0 0 0 6px #6fdc9a"></div>`).join("")}</div>`;
const LISTING = (l, t) => `<div class="el" style="left:${l}px;top:${t}px;width:620px;z-index:9;background:#0d0e12;border:10px solid #2a2d34;border-radius:56px;padding:26px;box-shadow:0 0 60px rgba(120,180,255,.35)">
  <div style="background:#fff;border-radius:34px;padding:24px;font-family:Onest;color:#151515">
  <div style="height:200px;background:#2e86de;border-radius:20px;margin-bottom:16px;position:relative;overflow:hidden">${CHARS.car("lst", 1, "#2e86de", "#3a4a5e").replace('<svg', '<svg style="width:100%;height:100%"')}</div>
  <div style="font-family:Unbounded;font-weight:900;font-size:36px">Solaris 2017 · 690 000 ₽</div>
  <div style="font-size:30px;margin-top:10px;line-height:1.4">✅ Не бита, не крашена!<br>✅ Один владелец<br>🔥 Срочно!</div></div></div>`;
const S = [
 { h: "УТОПЛЕННИК", tc: "1/8 · 0:00–0:08", bg: "flood", y: 700,
   els: () => SEDAN("c1", 130, 1060, 820) + WATER(1240) + `<div class="el" style="left:700px;top:1150px;font-size:90px;z-index:9">🫧</div>`
     + `<div class="title" style="top:760px;z-index:9"><span class="lab" style="position:static;display:inline-block;background:#2e86de;color:#fff;font-size:96px;transform:rotate(-3deg)">УТОПЛЕННИК</span></div>`,
   vo: "Летом эта машина плавала. Осенью её продают как «не битую, не крашеную». Формально — правда.", who: "Лис",
   mv: "<b>Новая локация — затопленный тоннель под мостом в ливень:</b> седан стоит в мутной воде по окна, пузыри, мимо плывёт мусор. Камера медленно опускается к воде." },
 { h: "СУШИЛКА", tc: "2/8 · 0:08–0:18", bg: "dryroom", y: 700,
   els: () => SEDAN("c2", 140, 1140, 760) + ch("tolyan", "t", 640, 880, .9, 6) + bub("Два фена, десять ёлочек —<br><em>и как новая!</em>", 60, 730)
     + `<div class="el" style="left:560px;top:1130px;font-size:90px;z-index:9">💨</div>`,
   vo: "Толян: «Два фена, десять ёлочек — и как новая!» Лис: «Запах болота пропал. Почти».", who: "Толян + Лис",
   mv: "<b>Новая локация — гараж-«сушилка»:</b> вентиляторы крутятся, Толян с феном, на полке десять «ёлочек», из-под машины капает в тазики. На «почти» — из двери вытекает струйка воды." },
 { h: "ОБЪЯВЛЕНИЕ", tc: "3/8 · 0:18–0:26", bg: "dryroom", y: 700,
   els: () => `<div style="position:absolute;inset:0;backdrop-filter:blur(10px);background:rgba(0,0,0,.4);z-index:4"></div>` + LISTING(230, 760),
   vo: "Ни слова неправды. Не бита, не крашена. Про плавание просто не спрашивали.", who: "Лис",
   mv: "<b>Ракурс — экран телефона:</b> объявление крупно, галочки «не бита», «не крашена» загораются по очереди. В конце внизу всплывает пустая строка «плавала: —» и мигает." },
 { h: "ПАРКОВКА", tc: "4/8 · 0:26–0:36", bg: "parking", y: 700,
   els: () => SEDAN("c3", 220, 1150, 700) + ch("vika", "v", -30, 900, .9, 6) + ch("tolyan", "t", 680, 900, .9, 6)
     + bub("Сестрёнка, машина — огонь!<br><em>Сухая, как пустыня!</em>", 300, 730),
   vo: "Толян: «Сестрёнка, машина — огонь! Сухая, как пустыня!»", who: "Толян",
   mv: "<b>Новая локация — парковка у супермаркета, день.</b> Вика (из 15–17 серий, уже опытная) обходит машину, молча открывает водительскую дверь и наклоняется к полу." },
 { h: "ПОД КОВРИКОМ", tc: "5/8 · 0:36–0:50", bg: "parking", y: 700,
   els: () => FLOOR() + bub("Толян, почему под ковриком<br><em>песок и ракушка?</em>", 60, 720) + bub("С пляжа!<br><em>Хозяин на море ездил!</em>", 520, 1330),
   vo: "Вика: «Толян, а почему под ковриком песок и ракушка?» Толян: «С пляжа! Хозяин на море ездил!» Лис: «На море. Внутри машины».", who: "Вика + Толян + Лис",
   mv: "<b>Вид сверху на пол салона:</b> рука Вики отгибает коврик — под ним песок, ил и ракушка. Пауза. Звук прибоя на «внутри машины»." },
 { h: "ФАРА И РАЗЪЁМЫ", tc: "6/8 · 0:50–1:00", bg: "parking", y: 700,
   els: () => `<div style="position:absolute;inset:0;backdrop-filter:blur(8px);background:rgba(0,0,0,.35);z-index:4"></div>` + LAMP()
     + lab("ПОЛОСА ВОДЫ В ФАРЕ", 90, 740, "#2e86de", "#fff", 40, -3) + lab("ЗЕЛЁНЫЕ РАЗЪЁМЫ", 540, 1120, "#3aa76d", "#151515", 36, 3),
   vo: "Полоса воды в фаре. Зелёные разъёмы. Ржавые салазки сидений. Вода нашла электрику раньше покупателя.", who: "Лис",
   mv: "<b>Макро-планы, жёсткие склейки по словам:</b> фара с мутной полосой внутри → окисленные зелёные разъёмы → ржавые салазки под сиденьем. Каждый план — с щелчком «вспышки фото»." },
 { h: "ПЕРВЫЙ ЛИВЕНЬ", tc: "7/8 · 1:00–1:12", bg: "flood", y: 700,
   els: () => SEDAN("c4", 60, 1080, 760) + WATER(1290) + ch("tolyan", "t", 700, 920, .8, 3) + bub("Брат…<br><em>она опять плывёт!</em>", 60, 720),
   vo: "Лис: «Вика ушла. А на первом же ливне машина вспомнила, кем была». Толян: «Брат… она опять плывёт!»", who: "Лис + Толян",
   mv: "<b>Возврат в тоннель — петля:</b> ливень, Толян едет сам и глохнет в той же луже, окна запотевают изнутри, «ёлочки» всплывают. Толян высовывается из окна." },
 { h: "МОРАЛЬ", tc: "8/8 · 1:12–1:25", bg: "parking", y: 700,
   els: () => `<div class="el" style="left:60px;top:740px;right:60px;z-index:9;background:#0d0e12;border:6px solid #fff;border-radius:30px;padding:26px 30px;color:#fff;font-family:Unbounded;font-weight:900;font-size:33px;line-height:1.4">ПРИЗНАКИ УТОПЛЕННИКА:<br><span style="color:#ffd23f">🏖 песок и ил под ковриками и в нише запаски<br>🔩 ржавчина на салазках и болтах внизу<br>💡 полоса воды в фарах, зелёные разъёмы<br>📄 история по VIN — выплаты страховой</span></div>`
     + FOX(400, 1260, 240),
   vo: "Признаки утопленника: песок и ил под ковриками и в нише запаски, ржавчина на салазках сидений, полоса воды в фарах, зелёные разъёмы. Историю проверь по VIN. А свежие объявления раньше перекупов — в боте Перехват. Сохрани — пока тебе не продали подводную лодку.", who: "Лис",
   mv: "<b>Финал:</b> чек-лист из четырёх пунктов, затем лиса с биноклем (аватарка бота) и подпись про бота. ~1:25, 8 сцен, <b>3 новые локации</b>, новые ракурсы: экран объявления, вид сверху на пол, макро фары и разъёмов." },
];

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els(); if (CLK) document.getElementById("h").insertAdjacentHTML("beforebegin", `<span class="clk">${CLK}</span>`);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>«${sc.vo}»`;
document.getElementById("mv").innerHTML = sc.mv;
["a","b","c","d","e","f","g","h","i"].forEach(p => { const e = document.getElementById(p); });
const sh = document.getElementById("t-shades"); if (sh) sh.style.display = ""; const sh2 = document.getElementById("t2-shades"); if (sh2) sh2.style.display = "";
mouth && document.getElementById("t") && mouth("t", "grin"); document.getElementById("g") && mouth("g", "talk"); document.getElementById("e") && mouth("e", "grin"); document.getElementById("v") && mouth("v", "talk");
window.READY = true;
</script></body></html>
