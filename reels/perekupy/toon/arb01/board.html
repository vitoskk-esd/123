 { h: "ОБЛОЖКА · СТАС С КАНАЛОМ → ГУРУ У «ГЕЛИКА»", tc: "1/6 · 0:00–0:12",
   A: { def: () => { const H = HOLDPHONE("perekup", "sa", 540, 2090, 1680, STAS, TGPOST(), { rim: "#cfd8ff", side: 1 });
       return { bg: "arbkomnata", farBlur: 8, mid: H.mid, lights: H.lights + KM_L, over: TITLE("ИНФОЦЫГАН:", "КУРС ЗА 150 000") }; }, shot: { x: 540, y: 960, s: 1 } },

 { h: "«СЕКРЕТ! СНАЧАЛА ОПЛАТА» → «ГЕЛИК — В АРЕНДЕ НА ЧАС»", tc: "2/6 · 0:12–0:24",

 { h: "«ЗАПУСКАЮ НА ВСЕХ!» → РЕКЛАМА УШЛА БАБЕ ГАЛЕ", tc: "4/6 · 0:38–0:50",

     bubbles: [{ p: "sg", html: "Всё понял!<br><em>Запускаю рекламу. На всех!</em>", fs: 32 }], talk: ["sg"] },
   B: { def: () => { const H = HOLDPHONE("perekup", "bh", 540, 2050, 1500, GALYA, `<div style="font-family:Onest;color:#fff"><div style="font-family:'JetBrains Mono';font-weight:800;font-size:24px;color:#8b93a3">РЕКЛАМА</div><div style="background:#1c1f26;border-radius:22px;padding:18px;margin-top:10px;font-weight:800;font-size:32px">💳 Оформи карту банка</div></div>`, { rim: "#fff6d0", side: 1 });
       return { bg: "babkadvor", farBlur: 4, mid: H.mid + PLATOK(540, 2050, 1500, 9), lights: H.lights, over: `<div style="position:absolute;left:70px;right:70px;top:120px;z-index:60;transform:rotate(-2deg);background:#0d0e12;border:8px solid #151515;border-radius:30px;padding:22px">${ADSTATS("−3 000 ₽", "0", 1)}</div>` }; }, shot: { x: 540, y: 1000, s: 1.02 },
     bubbles: [{ p: "bh", html: "Внучек, а пирожки<br><em>тут где заказывают?</em>", fs: 34 }], talk: ["bh"] },
   vo: "Стас: «Всё понял! Запускаю рекламу. На всех!» Баба Галя: «Внучек, а пирожки тут где заказывают?» Арбузов: «Реклама ушла бабушкам. Три тысячи — минус, заявок — ноль».", who: "Стас + Баба Галя + Арбузов",
   mv: "A — Стас жмёт красную «ЗАПУСТИТЬ» на ноутбуке. B — <b>новый фон — деревенский двор</b> (изба, подсолнухи, куры); <b>новая героиня — баба Галя</b> держит телефон с рекламой карты; поверх — рекламный кабинет: «ВСЕ · 18–99 лет · вся Россия», <b>потрачено −3 000 ₽ · заявок 0</b> (красным)." },

       return { bg: "arbkomnata", farBlur: 6, mid: H.mid, lights: H.lights + KM_L }; }, shot: { x: 540, y: 1000, s: 1.02 },

   B: { def: () => ({ bg: "gelikarenda", mid: RENT(230, 1740, "АРЕНДА ЗАКОНЧИЛАСЬ", "rt2", 20) + G_("gj", 300, 1880, 860, { look: "o" }, { armL: -30 }, { rim: "#ff8af0", side: 1, z: 7 }) + S_("sj", 800, 1880, 840, {}, { armL: 60 }, { rim: "#ff8af0", side: -1, z: 7 }), lights: GR_L }), shot: { x: 540, y: 1150, s: 1.04 },
     bubbles: [{ p: "gj", html: "Стас!<br><em>А ты где научился?</em>", fs: 34 }, { p: "sj", html: "Бесплатный урок<br><em>в Телеграме.</em>", fs: 34 }], talk: ["gj"] },
   vo: "Стас: «Ладно… гляну тот бесплатный урок». Арбузов: «В уроке — какой оффер выбрать и кому показывать рекламу». Стас: «Есть первая заявка! И ещё одна!» Аркадий: «Стас! А ты где научился?» Стас: «Бесплатный урок в Телеграме».", who: "Стас + Арбузов + Аркадий",
   mv: "A — телефон Стаса: урок в канале, под ним всплывают уведомления <b>«Новая заявка · карта оформлена · +1 200 ₽»</b> (цифры — пример). B — <b>твист</b>: «Гелика» нет, на асфальте табличка «АРЕНДА ЗАКОНЧИЛАСЬ», Аркадий пешком, в белом костюме под неоном." },
 { h: "«…А ССЫЛКУ СКИНЕШЬ?» → ФИНАЛ: БЕСПЛАТНЫЙ УРОК", tc: "6/6 · 1:02–1:12",
   A: { def: () => ({ bg: "gelikarenda", mid: G_("gk", 540, 1900, 1000, { look: "o" }, { armR: -150 }, { rim: "#ff8af0", side: 1, z: 7 }), lights: GR_L }), shot: { x: 540, y: 1150, s: 1.06 },
     bubbles: [{ p: "gk", html: "…А ссылку<br><em>скинешь?</em>", fs: 40 }], talk: ["gk"] },
   B: { def: () => ({ bg: "arbkomnata", over: CTAA, lights: KM_L }), shot: { x: 540, y: 1000, s: .98 } },
   vo: "Аркадий: «…А ссылку скинешь?» Арбузов: «Бесплатный урок по арбитражу трафика на банки — в моём Телеграм-канале. Ссылка в шапке». (Финальная фраза голосом — про канал; карточку голос не читает.)", who: "Аркадий + Арбузов",
   mv: "A — Аркадий крупно, растерянный, тянет руку с телефоном. B — <b>последний кадр — только карточка</b>: Арбузов + «Бесплатный урок по арбитражу на банки · Телеграм-канал · ссылка в шапке»." },
];
const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const put = (id, f) => { const el = document.getElementById(id);
  if (f.split) { const [dl, sl, dr, sr] = f.split();
    el.innerHTML = `<div class="cf">${HALF(C.frame(dl, sl), -1)}${HALF(C.frame(dr, sr), 1)}<div style="position:absolute;left:532px;top:0;width:16px;height:1920px;background:#fff;box-shadow:0 0 30px #000;z-index:80"></div>
      ${C.frame({ hud: f.hud }, { x: 540, y: 960, s: 1 }).replace('<div class="cf">', '<div style="position:absolute;inset:0;z-index:90;pointer-events:none">').replace(/<div class="vig"><\/div>/, "")}</div>`; }
  else { const def = f.def(); def.bubbles = f.bubbles || []; el.innerHTML = C.frame(def, f.shot); }
  if (f.sketch) el.querySelector(".cf").style.filter = SKF;
  (f.talk || []).forEach(p => C.mouth(el, p, "talk")); return el; };
const a = put("A", sc.A), b = put("B", sc.B);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
document.fonts.ready.then(() => { C.layout(a); C.layout(b); window.READY = true; });
