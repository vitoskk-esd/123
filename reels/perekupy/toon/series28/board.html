<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#0b0c10;z-index:5}
.hd b{font-family:Unbounded;font-weight:900;font-size:30px;color:#151515;background:#ffd23f;border:5px solid #151515;border-radius:12px;padding:4px 14px}
.hd span{font-family:Unbounded;font-weight:800;font-size:26px;color:#fff}.hd i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#8b93a3}

.stage{position:absolute;left:0;width:1080px;height:1920px}
.el{position:absolute}.el svg{width:100%;height:100%;overflow:visible}
.lab{position:absolute;font-family:Unbounded;font-weight:900;border:6px solid #151515;border-radius:18px;padding:6px 18px;box-shadow:0 8px 0 #151515;white-space:nowrap}
.bub{position:absolute;background:#0d0e12;border:5px solid #fff;border-radius:30px;padding:16px 24px;font-family:Unbounded;font-weight:800;font-size:36px;line-height:1.12;color:#fff;box-shadow:0 0 0 6px #0d0e12}

.txt{position:absolute;left:40px;right:40px;top:940px;color:#fff}

.txt .mv b{color:#fff}
.clk{white-space:nowrap;font-family:"JetBrains Mono";font-weight:800;font-size:34px;color:#ff3b30;border:4px solid #ff3b30;border-radius:10px;padding:0 10px;box-shadow:0 0 14px #ff3b3088}
.botcard{position:absolute;left:440px;top:660px;width:600px;z-index:9;background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:24px;box-shadow:0 0 80px rgba(120,180,255,.4)}
.botcard .bh{font-family:Onest;font-weight:700;font-size:26px;color:#8b93a3;margin-bottom:12px}
.botcard .bb{background:#1c1f26;border-radius:24px;padding:20px 24px;font-family:Onest;color:#fff;font-size:34px;line-height:1.45}
.cnt{position:absolute;left:40px;top:150px;z-index:20;font-family:"JetBrains Mono";font-weight:800;font-size:40px;color:#fff;background:#151515;border:5px solid #4cd964;border-radius:16px;padding:2px 16px;white-space:nowrap}
.receipt{position:absolute;left:150px;width:780px;background:#fbfaf6;border:6px solid #151515;box-shadow:0 18px 0 rgba(0,0,0,.35);padding:30px 40px;font-family:"JetBrains Mono";font-weight:800;font-size:32px;color:#222;line-height:1.6;transform:rotate(2deg);z-index:6}
.receipt h4{margin:0 0 10px;text-align:center;font-family:Unbounded;font-weight:900;font-size:38px}.receipt .row,.receipt .tot{display:flex;justify-content:space-between}.receipt .tot{border-top:5px dashed #222;margin-top:10px;padding-top:8px;font-size:42px;color:#e53935}
.title{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;line-height:1}
</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="view"><div class="stage" id="stage"></div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="../chars4.js"></script><script src="../chars5.js"></script><script src="bgs.js"></script>
<script>
// МИНИ-СЕРИАЛ «ТОЛЯН: СО СТА ТЫСЯЧ», часть 5 «Бот против бота», v2 (владелец 09.11: «однообразно — нужны уникальные события»). Новые приёмы: разделённый экран, карта гонки,
// стоп-кадр, комедийное препятствие (банкомат и Валерьич в халате), двойной твист (бот Жоры присылает ему машину Толяна — «беру не глядя»).
// Фоны новые: pekarnya, spalnya, prospekt, chastnik, bankomat, kampus. Новые герои: Рустам, Валерьич.
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4, o, extra = "") => el(CHARS[kind](p, o), l, t, 420 * s, 800 * s, z, extra);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 9) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z}">${html}</div>`;
let CLK = "", CNTV = ""; const clock = (t) => (CLK = t, ""); const CAP = v => (CNTV = v, "");
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
const CAR = (img, l, t, w, z = 3, flip = false) => `<img class="el" src="../../kit/img/${img}" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${flip ? "transform:scaleX(-1)" : ""}">`;
const PHONE = (l, t, inner, w = 520) => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:22px;box-shadow:0 0 70px rgba(120,180,255,.4)">${inner}</div>`;
const BOT = (body) => `<div style="font-family:Onest;font-weight:700;font-size:24px;color:#8b93a3">ПЕРЕХВАТ · бот</div><div style="background:#1c1f26;border-radius:22px;padding:16px 20px;margin-top:10px;font-family:Onest;color:#fff;font-size:30px;line-height:1.45">${body}</div>`;
const SCORE = (a, b) => `<div class="el" style="left:40px;top:${700 + 24}px;z-index:20;font-family:'JetBrains Mono';font-weight:800;font-size:38px;color:#fff;background:#151515;border:5px solid #ff2da6;border-radius:16px;padding:2px 16px;white-space:nowrap">ЖОРА ${a} : ${b} ТОЛЯН</div>`;
const CASH = (l, t, n = 5) => Array.from({ length: n }, (_, i) => `<div class="el" style="left:${l + i * 26}px;top:${t - i * 10}px;width:150px;height:76px;z-index:8;background:#8fd17a;border:5px solid #151515;border-radius:8px;transform:rotate(${-10 + i * 5}deg)"></div>`).join("");
const ZHORA = { jacket: "#1d1d1f", pants: "#2b2f37", cap: "#c0392b", mustache: true, chain: true, hair: "#1d1d1f", item: "phone", look: "grin" };
const RUSTAM = { jacket: "#4f6b3a", pants: "#3b3f46", beard: true, hair: "#1d1d1f" };
const VALERICH = { coat: "#f2a0c0", pants: "#f2a0c0", hair: "#8a8a8a", mustache: true, look: "o" };
const SPLIT = (bg, inner) => `<div class="el" style="left:540px;top:0;width:540px;height:1920px;overflow:hidden;z-index:5"><div style="position:absolute;left:-270px;top:0;width:1080px;height:1920px">${BGS[bg]}</div>${inner}</div><div class="el" style="left:532px;top:0;width:16px;height:1920px;background:#fff;z-index:12;box-shadow:0 0 0 5px #151515"></div>`;
const BLANKET = (l, t, w) => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:260px;z-index:8;background:#e0b25a radial-gradient(circle,#5a3a1a 0 9px,transparent 10px) 0 0/46px 40px;border:7px solid #151515;border-radius:26px 26px 0 0"></div>`;
const PING = (l, t, text) => `<div class="el" style="left:${l}px;top:${t}px;z-index:14;background:#0d0e12;border:5px solid #2a2d34;border-radius:22px;padding:10px 16px;font-family:Onest;font-weight:800;font-size:24px;color:#fff;box-shadow:0 0 30px rgba(120,180,255,.5);white-space:nowrap">${text}</div>`;
const MAP = (l, t, w, tolyan = "3 км", zhora = "9 км · пробка") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;z-index:14;background:#0d0e12;border:6px solid #fff;border-radius:28px;padding:12px;box-shadow:0 12px 0 #151515">
  <svg viewBox="0 0 600 380" style="width:100%;height:auto;display:block;border-radius:18px;background:#e9efe6">
   <path d="M0 250 q150 -60 300 0 t300 -20 v40 q-150 40 -300 -10 t-300 20 z" fill="#9fc8e8"/>
   <g stroke="#fff" stroke-width="14">${[60, 150, 330, 470].map(x => `<path d="M${x} 0 V380"/>`).join("")}${[80, 170, 320].map(y => `<path d="M0 ${y} H600"/>`).join("")}</g>
   <path d="M150 80 H330 V170" stroke="#ffd23f" stroke-width="10" stroke-dasharray="18 12" fill="none"/><path d="M560 350 L470 320 V170 H330" stroke="#ff3b30" stroke-width="10" stroke-dasharray="18 12" fill="none"/>
   <circle cx="330" cy="170" r="22" fill="#4cd964" stroke="#151515" stroke-width="5"/><text x="330" y="180" text-anchor="middle" font-size="24">🚗</text>
   <circle cx="150" cy="80" r="20" fill="#ffd23f" stroke="#151515" stroke-width="5"/><text x="150" y="88" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="20">Т</text>
   <circle cx="560" cy="350" r="20" fill="#ff3b30" stroke="#151515" stroke-width="5"/><text x="560" y="358" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="20" fill="#fff">Ж</text>
   <rect x="440" y="250" width="70" height="26" rx="6" fill="#ff3b30"/><text x="475" y="269" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="15" fill="#fff">ПРОБКА</text>
  </svg>
  <div style="display:flex;justify-content:space-between;margin-top:8px;font-family:'JetBrains Mono';font-weight:800;font-size:24px"><span style="color:#ffd23f">Т · ${tolyan}</span><span style="color:#ff3b30">Ж · ${zhora}</span></div></div>`;
const FREEZE = (label) => `<div class="el" style="left:0;top:0;width:1080px;height:1920px;z-index:10;backdrop-filter:grayscale(1) contrast(1.15);background:rgba(20,20,20,.12)"></div>
  <div class="el" style="left:40px;top:1180px;z-index:16;font-family:Unbounded;font-weight:900;font-size:64px;color:#fff;-webkit-text-stroke:10px #151515;paint-order:stroke fill;transform:rotate(-4deg)">СТОП-КАДР</div>${label}`;
const ALBUM = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">${[0, 1, 2, 3].map(k => `<div style="height:90px;border-radius:10px;background:${["#7fb2a0", "#9fc3b8", "#6f9f8f", "#8fbfae"][k]};position:relative">${k === 2 ? '<div style="position:absolute;left:30%;top:20%;width:46px;height:46px;border:6px solid #ff3b30;border-radius:50%"></div>' : ""}</div>`).join("")}</div>`;
const MARKS = (l, t) => [[0, 0], [150, 6]].map(([dx, dy]) => `<div class="el" style="left:${l + dx}px;top:${t + dy}px;width:110px;height:60px;z-index:4;border:5px dashed #ff7a1a;background:rgba(255,255,255,.7);border-radius:6px"></div>`).join("");
const S = [
 { h: "ТОЛЯН: СО СТА ТЫСЯЧ · 5", tc: "1/7 · 0:00–0:08", bg: "pekarnya", y: 700, els: () => CAP("148 000") + clock("07:02")
     + ch("tolyan", "t", 90, 900, .72, 6) + PING(20, 1250, "📲 Corolla · 145 000 ₽")
     + SPLIT("spalnya", ch("perekup", "zh", 150, 860, .72, 6, { ...ZHORA, look: "o" }) + BLANKET(40, 1240, 500) + PING(40, 1250, "📲 Corolla · 145 000 ₽"))
     + bub("Моя!", 150, 760, 15) + bub("Моя!", 720, 740, 15) + lab("ЧАСТЬ 5 · БОТ ПРОТИВ БОТА", 40, 1360, "#ff2da6", "#fff", 34, -3, 15),
   vo: "Лис: «Семь ноль две. Бот прислал Короллу за сто сорок пять — двоим сразу». Жора: «Моя!» Толян: «Моя!»", who: "Лис + Жора + Толян",
   mv: "<b>Приём 1 — разделённый экран.</b> Слева пекарня (Толян у витрины), справа <b>новый фон — спальня Жоры</b> (леопардовый плед, будильник 7:02, постер «Мерседеса»). У обоих одновременно всплывает одно уведомление, оба вскакивают с криком «Моя!»." },
 { h: "КАРТА ГОНКИ", tc: "2/7 · 0:08–0:17", bg: "prospekt", y: 700, els: () => CAP("148 000") + CAR("w124/w124_34.png", 420, 1200, 560) + ch("perekup", "zh", 640, 860, .8, 6, { ...ZHORA, look: "angry" })
     + MAP(30, 790, 560) + bub("Пропустите,<br><em>я перекуп!</em>", 600, 700),
   vo: "Лис: «Толяну — три километра. Жоре — девять: у него фильтр „вся область“». Жора: «Пропустите, я перекуп!»", who: "Лис + Жора",
   mv: "<b>Приём 2 — карта гонки:</b> две точки «Т» и «Ж» едут к машине, у Жоры красная плашка «ПРОБКА». <b>Новый фон — проспект в пробке</b>, Жора сигналит у «Мерседеса»." },
 { h: "СТОП-КАДР", tc: "3/7 · 0:17–0:27", bg: "chastnik", y: 700, els: () => CAP("148 000") + CAR("corolla/corolla.png", 260, 1180, 700)
     + ch("perekup", "ru", 620, 860, .8, 6, RUSTAM) + ch("tolyan", "t", -20, 900, .76, 6, { look: "o" }) + bub("Только наличкой.<br><em>Переводы не признаю.</em>", 440, 700, 18)
     + FREEZE(lab("ЭТО ТОЛЯН. НАЛИЧКИ — 0 ₽", 40, 1330, "#ffd23f", "#151515", 36, -3, 17)),
   vo: "Рустам: «Только наличкой. Переводы не признаю». Лис: «Стоп-кадр. Это Толян. Он только что понял, что налички у него — ноль».", who: "Рустам + Лис",
   mv: "<b>Новый фон — частный сектор</b>, <b>новый герой — Рустам</b> (переезжает, коробки). <b>Приём 3 — стоп-кадр:</b> картинка замирает и обесцвечивается, надпись «СТОП-КАДР», Лис комментирует провал." },
 { h: "БАНКОМАТ · ВАЛЕРЬИЧ", tc: "4/7 · 0:27–0:36", bg: "bankomat", y: 700, els: () => CAP("148 000") + ch("perekup", "vl", 560, 860, .8, 6, VALERICH) + [0, 1, 2, 3].map(i => `<div class="el" style="left:${790 + i * 8}px;top:${1210 - i * 10}px;width:110px;height:70px;z-index:8;background:#fff;border:4px solid #151515;border-radius:4px;transform:rotate(${-8 + i * 6}deg)"></div>`).join("") + ch("tolyan", "t", -20, 900, .76, 6)
     + bub("Подождёшь.<br><em>У меня сорок квитанций.</em>", 420, 700) + lab("ЖОРА: 2 КМ", 60, 1330, "#ff3b30", "#fff", 44, -3),
   vo: "Валерьич: «Подождёшь. У меня сорок квитанций». Толян: «Отец, у меня машина уезжает!»", who: "Валерьич + Толян",
   mv: "<b>Приём 4 — комедийное препятствие.</b> <b>Новый фон — банкомат у отделения</b> (на экране «ОПЛАТА ЖКХ…»). <b>Новый герой — Валерьич</b> в розовом халате и с пачкой квитанций. Внизу тикает «ЖОРА: 2 КМ»." },
 { h: "ПО РУКАМ · ЖОРА ОПОЗДАЛ", tc: "5/7 · 0:36–0:48", bg: "chastnik", y: 700, els: () => CAP("13 000 + 🚗") + CAR("w124/w124_34.png", 600, 1200, 480, 2)
     + ch("perekup", "ru", 330, 880, .74, 5, RUSTAM) + ch("perekup", "zh", 700, 860, .78, 6, { ...ZHORA, look: "angry" }) + ch("tolyan", "t", -20, 900, .76, 6) + CASH(200, 1440, 4)
     + bub("Опять ты?!", 700, 720) + lab("−10 000 ЗА СКОЛ", 40, 1330, "#ff7a1a", "#151515", 40, -3),
   vo: "Лис: «Скол на лобовом Толян увидел ещё в пекарне — по всем фото из закрытого канала. Сто тридцать пять — по рукам». Жора: «Опять ты?!»", who: "Лис + Жора",
   mv: "Тот же двор: Толян запыхавшись отдаёт наличку, Рустам жмёт руку. Отсылка к кнопке «📸 Все фото» (скол на фото → торг). Подлетает «Мерседес» Жоры." },
 { h: "ТВИСТ: БОТ ЖОРЫ", tc: "6/7 · 0:48–0:56", bg: "spalnya", y: 700, els: () => CAP("13 000 + 🚗") + clock("07:02")
     + ch("perekup", "zh", 560, 860, .8, 6, ZHORA) + BLANKET(420, 1240, 660)
     + PHONE(30, 760, BOT(`<b style="color:#ff7a1a">🔥 −10% к рынку</b><br><b>Toyota Corolla 2003 · 200 000 ₽</b><br>⏱ 1 с после публикации`, 28), 500)
     + bub("О! Беру<br><em>не глядя!</em>", 600, 700) + lab("«НЕ ГЛЯДЯ» — ЗНАКОМО?", 40, 1360, "#ff2da6", "#fff", 36, -3, 15),
   vo: "Лис: «Через неделю Толян выставил Короллу за двести. И бот Жоры прислал её Жоре». Жора: «О! Беру не глядя!»", who: "Лис + Жора",
   mv: "<b>Приём 5 — твист.</b> Снова спальня Жоры, снова 7:02: бот присылает ему ту самую Короллу — уже от Толяна. «Беру не глядя» — отсылка к ошибке Толяна из части 2." },
 { h: "КАМПУС · ПРОДАВЕЦ — ТОЛЯН", tc: "7/7 · 0:56–1:10", bg: "kampus", y: 700, els: () => CAP("213 000") + CAR("corolla/corolla.png", 260, 1190, 700)
     + ch("perekup", "zh", 640, 860, .8, 6, { ...ZHORA, look: "o" }) + ch("tolyan", "t", -20, 900, .76, 6)
     + bub("Студент?!", 660, 720) + bub("Глядеть надо,<br><em>брат.</em>", 40, 740)
     + `<div class="el" style="left:60px;right:60px;top:1250px;z-index:12;background:#ffd23f;border:8px solid #151515;border-radius:34px;padding:22px 30px;box-shadow:0 14px 0 #151515;font-family:Unbounded;font-weight:900;color:#151515;text-align:center"><div style="font-size:24px;color:#c0392b;margin-bottom:8px">ЧАСТЬ 6: ПЕРВАЯ МАШИНА ЗА ПОЛМИЛЛИОНА</div><div style="font-size:40px;line-height:1.15">Бот <span style="color:#c0392b">«Перехват»</span> — ссылка в шапке</div><div style="margin-top:10px;font-size:26px;font-family:Onest;font-weight:800">свой город · бюджет · ниже рынка · ~1 с</div></div>` + FOX(440, 1090, 160),
   vo: "Жора: «Студент?!» Толян: «Глядеть надо, брат». Лис: «Жора купил. Молча. Капитал Толяна — двести тринадцать тысяч. В шестой части — первая машина за полмиллиона. Подпишись, чтобы не пропустить».", who: "Жора + Толян + Лис",
   mv: "<b>Новый фон — кампус</b> (место встречи). Жора приезжает за «не глядя» и видит, что продавец — Толян. Капитал 213 000 — вдвое больше старта. Крючок + финальная карточка." },
];

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els(); if (CNTV) document.querySelector(".view").insertAdjacentHTML("beforeend", `<div class="cnt" style="top:auto;bottom:20px;left:auto;right:20px">💸 ${CNTV} ₽</div>`); if (CLK) document.getElementById("h").insertAdjacentHTML("beforebegin", `<span class="clk">${CLK}</span>`);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
const sh = document.getElementById("t-shades"); if (sh) sh.style.display = "";
["t", "zh", "ru", "vl"].forEach(p => document.getElementById(p) && mouth(p, "talk"));
window.READY = true;
</script></body></html>
