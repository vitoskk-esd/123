<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#0b0c10;z-index:5}
.hd b{font-family:Unbounded;font-weight:900;font-size:30px;color:#151515;background:#ffd23f;border:5px solid #151515;border-radius:12px;padding:4px 14px}
.hd span{font-family:Unbounded;font-weight:800;font-size:26px;color:#fff}.hd i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#8b93a3}
.view{position:absolute;left:0;top:96px;width:1080px;height:820px;overflow:hidden;border-bottom:6px solid #ffd23f}
.stage{position:absolute;left:0;width:1080px;height:1920px}
.el{position:absolute}.el svg{width:100%;height:100%;overflow:visible}
.lab{position:absolute;font-family:Unbounded;font-weight:900;border:6px solid #151515;border-radius:18px;padding:6px 18px;box-shadow:0 8px 0 #151515;white-space:nowrap}
.bub{position:absolute;background:#0d0e12;border:5px solid #fff;border-radius:30px;padding:16px 24px;font-family:Unbounded;font-weight:800;font-size:36px;line-height:1.12;color:#fff;box-shadow:0 0 0 6px #0d0e12}
.bub em{font-style:normal;color:#ff3b30}
.txt{position:absolute;left:40px;right:40px;top:940px;color:#fff}
.txt .vo{font-family:Unbounded;font-weight:800;font-size:38px;line-height:1.22}
.txt .vo small{display:block;font-family:"JetBrains Mono";font-size:22px;color:#ffd23f;font-weight:800;margin-bottom:10px;letter-spacing:1px}
.txt .mv{margin-top:20px;font-family:Onest;font-size:25px;line-height:1.35;color:#b9bfca}
.txt .mv b{color:#fff}
.clk{white-space:nowrap;font-family:"JetBrains Mono";font-weight:800;font-size:34px;color:#ff3b30;border:4px solid #ff3b30;border-radius:10px;padding:0 10px;box-shadow:0 0 14px #ff3b3088}
.botcard{position:absolute;left:440px;top:660px;width:600px;z-index:9;background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:24px;box-shadow:0 0 80px rgba(120,180,255,.4)}
.botcard .bh{font-family:Onest;font-weight:700;font-size:26px;color:#8b93a3;margin-bottom:12px}
.botcard .bb{background:#1c1f26;border-radius:24px;padding:20px 24px;font-family:Onest;color:#fff;font-size:34px;line-height:1.45}
.cnt{position:absolute;left:40px;top:150px;z-index:20;font-family:"JetBrains Mono";font-weight:800;font-size:40px;color:#fff;background:#151515;border:5px solid #4cd964;border-radius:16px;padding:2px 16px;white-space:nowrap}
.receipt{position:absolute;left:150px;width:780px;background:#fbfaf6;border:6px solid #151515;box-shadow:0 18px 0 rgba(0,0,0,.35);padding:30px 40px;font-family:"JetBrains Mono";font-weight:800;font-size:32px;color:#222;line-height:1.6;transform:rotate(2deg);z-index:6}
.receipt h4{margin:0 0 10px;text-align:center;font-family:Unbounded;font-weight:900;font-size:38px}.receipt .row,.receipt .tot{display:flex;justify-content:space-between}.receipt .tot{border-top:5px dashed #222;margin-top:10px;padding-top:8px;font-size:42px;color:#e53935}
.title{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;line-height:1}
</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="view"><div class="stage" id="stage"></div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="../chars4.js"></script><script src="../chars5.js"></script><script src="bgs.js"></script>
<script>
// МИНИ-СЕРИАЛ «ТОЛЯН: СО СТА ТЫСЯЧ», часть 5 «Бот против бота». Все фоны новые (pekarnya, prospekt, chastnik, kampus), второстепенные герои новые
// (продавец Рустам, покупатель Лёха); Жора — сквозной соперник, теперь тоже с ботом. Выигрывает точный фильтр + «📸 Все фото» из закрытого канала.
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4, o, extra = "") => el(CHARS[kind](p, o), l, t, 420 * s, 800 * s, z, extra);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 9) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z}">${html}</div>`;
let CLK = "", CNTV = ""; const clock = (t) => (CLK = t, ""); const CAP = v => (CNTV = v, "");
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
const CAR = (img, l, t, w, z = 3, flip = false) => `<img class="el" src="../../kit/img/${img}" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${flip ? "transform:scaleX(-1)" : ""}">`;
const PHONE = (l, t, inner, w = 520) => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:22px;box-shadow:0 0 70px rgba(120,180,255,.4)">${inner}</div>`;
const BOT = (body) => `<div style="font-family:Onest;font-weight:700;font-size:24px;color:#8b93a3">ПЕРЕХВАТ · бот</div><div style="background:#1c1f26;border-radius:22px;padding:16px 20px;margin-top:10px;font-family:Onest;color:#fff;font-size:30px;line-height:1.45">${body}</div>`;
const SCORE = (a, b) => `<div class="el" style="left:40px;top:${700 + 24}px;z-index:20;font-family:'JetBrains Mono';font-weight:800;font-size:38px;color:#fff;background:#151515;border:5px solid #ff2da6;border-radius:16px;padding:2px 16px;white-space:nowrap">ЖОРА ${a} : ${b} ТОЛЯН</div>`;
const CASH = (l, t, n = 5) => Array.from({ length: n }, (_, i) => `<div class="el" style="left:${l + i * 26}px;top:${t - i * 10}px;width:150px;height:76px;z-index:8;background:#8fd17a;border:5px solid #151515;border-radius:8px;transform:rotate(${-10 + i * 5}deg)"></div>`).join("");
const ZHORA = { jacket: "#1d1d1f", pants: "#2b2f37", cap: "#c0392b", mustache: true, chain: true, hair: "#1d1d1f", item: "phone", look: "grin" };
const RUSTAM = { jacket: "#4f6b3a", pants: "#3b3f46", beard: true, hair: "#1d1d1f" };
const LYOHA = { jacket: "#6a3d9a", pants: "#2b2f37", glasses: true, hair: "#c9a06b", item: "phone" };
const ALBUM = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">${[0, 1, 2, 3].map(k => `<div style="height:90px;border-radius:10px;background:${["#7fb2a0", "#9fc3b8", "#6f9f8f", "#8fbfae"][k]};position:relative">${k === 2 ? '<div style="position:absolute;left:30%;top:20%;width:46px;height:46px;border:6px solid #ff3b30;border-radius:50%"></div>' : ""}</div>`).join("")}</div>`;
const MARKS = (l, t) => [[0, 0], [150, 6]].map(([dx, dy]) => `<div class="el" style="left:${l + dx}px;top:${t + dy}px;width:110px;height:60px;z-index:4;border:5px dashed #ff7a1a;background:rgba(255,255,255,.7);border-radius:6px"></div>`).join("");
const S = [
 { h: "ТОЛЯН: СО СТА ТЫСЯЧ · 5", tc: "1/7 · 0:00–0:09", bg: "pekarnya", y: 700, els: () => CAP("148 000") + clock("07:02") + ch("tolyan", "t", 600, 880, .8, 6)
     + PHONE(30, 740, BOT(`<b style="color:#ff7a1a">🔥 −30% к рынку</b><br><b>Toyota Corolla 2003 · 145 000 ₽</b><br>⏱ 1 с · 🔒 закрытый канал`), 560)
     + lab("ЧАСТЬ 5 · БОТ ПРОТИВ БОТА", 40, 1330, "#ff2da6", "#fff", 36, -3),
   vo: "Лис: «Сто сорок восемь тысяч. Семь ноль две. Уведомление пришло двоим сразу — Толяну и Жоре».", who: "Лис",
   mv: "<b>Новый фон — пекарня утром</b> (витрина с булками, меловое меню, рассвет в окне). Толян у витрины, на телефоне — карточка бота: Королла −30%, закрытый канал. Капитал — 148 000 (итог части 4)." },
 { h: "ПРОСПЕКТ · ПРОБКА", tc: "2/7 · 0:09–0:21", bg: "prospekt", y: 700, els: () => CAP("148 000") + CAR("w124/w124_34.png", 380, 1180, 600) + ch("perekup", "zh", 40, 860, .8, 6, ZHORA)
     + bub("Алло! Я первый звонил —<br><em>еду!</em>", 60, 700) + lab("200 УВЕДОМЛЕНИЙ В ДЕНЬ", 300, 1330, "#ffd23f", "#151515", 38, 3),
   vo: "Жора: «Алло! Я первый звонил — еду!» Лис: «Бот у них одинаковый. А фильтры — нет. У Жоры „всё подряд по области“: двести уведомлений в день — и он стоит в пробке на другом конце города».", who: "Жора + Лис",
   mv: "<b>Новый фон — проспект в пробке</b> (ряд машин, красный светофор, щит «ШИНЫ −20%»). Жора у своего «Мерседеса» в пробке кричит в телефон." },
 { h: "ПЕКАРНЯ · ВСЕ ФОТО", tc: "3/7 · 0:21–0:33", bg: "pekarnya", y: 700, els: () => CAP("148 000") + clock("07:03") + ch("tolyan", "t", 600, 880, .8, 6)
     + PHONE(30, 720, BOT(`🔎 мой город · до 150 000 · ниже рынка<br><b>📸 Все фото</b> — 4 шт.`, 26) + ALBUM, 540)
     + bub("Скол на лобовом.<br><em>Будет торг.</em>", 600, 720),
   vo: "Лис: «У Толяна фильтр узкий: свой город, до ста пятидесяти, ниже рынка. Канал закрытый — но все фото пришли прямо в бот». Толян: «Скол на лобовом. Будет торг».", who: "Лис + Толян",
   mv: "Та же пекарня: на телефоне фильтр Толяна и альбом из закрытого канала (кнопка «📸 Все фото»), на третьем фото обведён скол лобового." },
 { h: "ЧАСТНЫЙ СЕКТОР · УЛ. САДОВАЯ", tc: "4/7 · 0:33–0:44", bg: "chastnik", y: 700, els: () => CAP("13 000 + 🚗") + CAR("corolla/corolla.png", 260, 1180, 700)
     + ch("perekup", "ru", 620, 860, .8, 6, RUSTAM) + ch("tolyan", "t", -20, 900, .76, 6) + CASH(420, 1440, 4)
     + bub("Первый обещал через час…<br><em>Ладно, по рукам!</em>", 400, 700),
   vo: "Толян: «Сто тридцать пять — и деньги прямо сейчас». Рустам: «Первый обещал через час… Ладно, по рукам!»", who: "Толян + Рустам",
   mv: "<b>Новый фон — частный сектор</b> (деревянный дом с наличниками, зелёные ворота, будка, коробки «ПЕРЕЕЗД»). <b>Новый герой — Рустам</b> (зелёная куртка, борода), переезжает. Мятная Королла." },
 { h: "ЖОРА ПРИЕХАЛ", tc: "5/7 · 0:44–0:53", bg: "chastnik", y: 700, els: () => CAP("13 000 + 🚗") + CAR("w124/w124_34.png", 520, 1180, 560)
     + ch("perekup", "zh", 640, 860, .8, 6, { ...ZHORA, look: "angry" }) + ch("tolyan", "t", -20, 900, .76, 6)
     + bub("Опять ты?!", 640, 720) + lab("ТОЧНЫЙ ФИЛЬТР > СОРОК ЧАТОВ", 40, 1330, "#4cd964", "#151515", 34, -3),
   vo: "Жора: «Опять ты?!» Лис: «Бот присылает обоим за секунду. Выигрывает тот, у кого фильтр точнее — и деньги с собой».", who: "Жора + Лис",
   mv: "Тот же двор: «Мерседес» Жоры подлетает, Толян уже с ключами. Мораль плашкой." },
 { h: "КАМПУС · ПРОДАЖА", tc: "6/7 · 0:53–1:05", bg: "kampus", y: 700, els: () => CAP("213 000") + CAR("corolla/corolla.png", 260, 1190, 700)
     + ch("perekup", "ly", 620, 860, .8, 6, LYOHA) + ch("tolyan", "t", -20, 900, .76, 6)
     + bub("Наконец-то<br><em>не на автобусе!</em>", 560, 700) + lab("+65 000 ₽", 60, 1330, "#4cd964", "#151515", 46, -3),
   vo: "Лис: «Через неделю Королла ушла программисту Лёхе за двести». Лёха: «Наконец-то не на автобусе!» Лис: «Капитал — двести тринадцать тысяч. Вдвое больше, чем в начале».", who: "Лис + Лёха",
   mv: "<b>Новый фон — кампус университета</b> (корпус с колоннами, часы, лестница, осенние деревья). <b>Новый герой — программист Лёха</b> (фиолетовое худи, очки). Капитал 213 000 — вдвое больше старта." },
 { h: "КРЮЧОК + ФИНАЛ", tc: "7/7 · 1:05–1:14", bg: "kampus", y: 700, els: () => ""
     + ch("perekup", "zh", 640, 860, .8, 6, ZHORA) + ch("tolyan", "t", -20, 900, .76, 6) + bub("Студент… а научи<br><em>фильтр настраивать?</em>", 440, 700)
     + `<div class="el" style="left:60px;right:60px;top:1250px;z-index:12;background:#ffd23f;border:8px solid #151515;border-radius:34px;padding:22px 30px;box-shadow:0 14px 0 #151515;font-family:Unbounded;font-weight:900;color:#151515;text-align:center"><div style="font-size:24px;color:#c0392b;margin-bottom:8px">ЧАСТЬ 6: ПЕРВАЯ МАШИНА ЗА ПОЛМИЛЛИОНА</div><div style="font-size:40px;line-height:1.15">Бот <span style="color:#c0392b">«Перехват»</span> — ссылка в шапке</div><div style="margin-top:10px;font-size:26px;font-family:Onest;font-weight:800">свой город · бюджет · ниже рынка · ~1 с</div></div>` + FOX(440, 1090, 160),
   vo: "Жора: «Студент… а научи фильтр настраивать?» Толян: «Первый урок — бесплатно, брат». Лис: «В шестой части — первая машина за полмиллиона. Подпишись, чтобы не пропустить».", who: "Жора + Толян + Лис",
   mv: "Тот же кампус: Жора сам приходит учиться. Крючок на часть 6 + финальная карточка." },
];

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els(); if (CNTV) document.querySelector(".view").insertAdjacentHTML("beforeend", `<div class="cnt" style="top:auto;bottom:20px;left:auto;right:20px">💸 ${CNTV} ₽</div>`); if (CLK) document.getElementById("h").insertAdjacentHTML("beforebegin", `<span class="clk">${CLK}</span>`);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
const sh = document.getElementById("t-shades"); if (sh) sh.style.display = "";
["t", "zh", "ru", "ly"].forEach(p => document.getElementById(p) && mouth(p, "talk"));
window.READY = true;
</script></body></html>
