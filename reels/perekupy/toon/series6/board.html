<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#0b0c10;z-index:5}
.hd b{font-family:Unbounded;font-weight:900;font-size:30px;color:#151515;background:#ffd23f;border:5px solid #151515;border-radius:12px;padding:4px 14px}
.hd span{font-family:Unbounded;font-weight:800;font-size:26px;color:#fff}.hd i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#8b93a3}
.view{position:absolute;left:0;top:96px;width:1080px;height:820px;overflow:hidden;border-bottom:6px solid #ffd23f}
.stage{position:absolute;left:0;width:1080px;height:1920px}
.el{position:absolute}.el svg{width:100%;height:100%;overflow:visible}
.lab{position:absolute;font-family:Unbounded;font-weight:900;border:6px solid #151515;border-radius:18px;padding:6px 18px;box-shadow:0 8px 0 #151515;white-space:nowrap}
.bub{position:absolute;background:#0d0e12;border:5px solid #fff;border-radius:30px;padding:16px 24px;font-family:Unbounded;font-weight:800;font-size:36px;line-height:1.12;color:#fff;box-shadow:0 0 0 6px #0d0e12}
.bub em{font-style:normal;color:#ff3b30}
.txt{position:absolute;left:40px;right:40px;top:940px;color:#fff}
.txt .vo{font-family:Unbounded;font-weight:800;font-size:38px;line-height:1.22}
.txt .vo small{display:block;font-family:"JetBrains Mono";font-size:22px;color:#ffd23f;font-weight:800;margin-bottom:10px;letter-spacing:1px}
.txt .mv{margin-top:20px;font-family:Onest;font-size:25px;line-height:1.35;color:#b9bfca}
.txt .mv b{color:#fff}
.clk{font-family:"JetBrains Mono";font-weight:800;font-size:34px;color:#ff3b30;border:4px solid #ff3b30;border-radius:10px;padding:0 10px;box-shadow:0 0 14px #ff3b3088}
.title{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;line-height:1}
</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="view"><div class="stage" id="stage"></div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="bgs.js"></script>
<script>
// Приора сбоку — по рисунку владельца (kit/img/priora/priora_*.png): black — пацанская с наклейкой, white, yellow — такси, patch
const IMG = (v, l, t, w = 900, z = 3, extra = "") => `<img class="el" src="../../kit/img/priora/priora_${v}.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${extra}">`;
const P = (k, o) => "";
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4) => el(CHARS[kind](p), l, t, 420 * s, 800 * s, z);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 9) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z}">${html}</div>`;
// ВАЗ-2114 владельца (kit/img/vaz2114/vaz2114_white.png, вырезан из его картинки)
const CAR = (l, t, w = 820, z = 3, extra = "") => `<img class="el" src="../../kit/img/vaz2114/vaz2114_white.png" style="left:${l}px;top:${t + w * .04}px;width:${w}px;z-index:${z};${extra}">`;
let CLK = ""; const clock = (t) => (CLK = t, "");
const odo = (v, l, t, c = "#ffd23f") => `<div class="el" style="left:${l}px;top:${t}px;z-index:9;font-family:'JetBrains Mono';font-weight:800;font-size:54px;color:${c};background:#111;border:6px solid #151515;outline:4px solid #555;border-radius:12px;padding:6px 20px">ОДО ${v}</div>`;
const S = [
 { h: "ОДИН ДЕНЬ ПЕРЕКУПА", tc: "1/9 · 0:00–0:06", bg: "night", y: 700,
   els: () => clock("05:30") + ch("tolyan", "t", 300, 880, .95) + `<div class="el" style="left:560px;top:1120px;z-index:8;font-size:90px">🔦</div>`
     + `<div class="title" style="top:780px;z-index:9;left:-260px"><span class="lab" style="position:static;display:inline-block;background:#ffd23f;color:#151515;font-size:60px;transform:rotate(-3deg)">ОДИН ДЕНЬ</span><br><span class="lab" style="position:static;display:inline-block;margin-top:18px;background:#ff3b30;font-size:80px;transform:rotate(2deg)">ПЕРЕКУПА</span></div>`,
   vo: "Перекуп встаёт раньше солнца. Потому что днём видно сколы.", who: "Лис",
   mv: "<b>Хук:</b> темнота, будильник 05:30 орёт, Толян в очках резко открывает глаза. Фонарик включается — луч бьёт в камеру. Титр влетает ударом. Часы в углу будут идти весь ролик — это «счётчик дня»." },
 { h: "ГАРАЖИ", tc: "2/9 · 0:06–0:20", bg: "garages", y: 700,
   els: () => clock("06:40") + CAR(300, 1130, 760) + ch("galya", "g", -20, 860, .95) + ch("tolyan", "t", 700, 870, .9)
     + bub("Дед на ней только<br>на дачу ездил.", 40, 730) + bub("А дед где?", 640, 840) ,
   vo: "Галя: «Сынок, дед на ней только на дачу ездил». Толян: «А дед сейчас где?» Галя: «На даче. Под яблоней». Лис: «Сто восемьдесят тысяч. Яблоня — в подарок».", who: "Галя + Толян + Лис",
   mv: "<b>Движение:</b> ворота гаража ползут вверх, пыль, из темноты выкатывается белая «четырка». Галя ласково гладит капот. На «под яблоней» — пауза, Толян медленно снимает очки. Плашка <b>«180 000 ₽ + ЯБЛОНЯ»</b>." },
 { h: "СТО", tc: "3/9 · 0:20–0:32", bg: "sto", y: 700,
   els: () => clock("09:00") + CAR(260, 1150, 760) + ch("mihalych", "m", 680, 860, .95) + ch("tolyan", "t", -40, 870, .9)
     + odo("200 000 → 90 000", 150, 860) + bub("Скрутить могу.<br>А совесть у тебя<br><em>уже в ноль.</em>", 380, 960),
   vo: "Толян: «Михалыч, скрути до девяноста». Михалыч: «Скрутить могу. А совесть у тебя уже в ноль». Лис: «Двести тысяч превратились в девяносто. Машина помолодела. Дед — нет».", who: "Толян + Михалыч + Лис",
   mv: "<b>Движение:</b> крупно приборка, цифры одометра <b>крутятся назад</b> с треском, Михалыч устало качает головой. Свайп на следующую сцену." },
 { h: "МОЙКА", tc: "4/9 · 0:32–0:42", bg: "mall", y: 700,
   els: () => clock("11:00") + CAR(130, 1100, 820) + `<div class="el" style="left:180px;top:960px;z-index:8;font-size:100px">🫧🫧🫧</div><div class="el" style="left:720px;top:1000px;z-index:8;font-size:110px">✨</div>`
     + lab("ЗАПАХ НОВОЙ МАШИНЫ · 99 ₽", 60, 760, "#4cd964", "#151515", 38, -3) + lab("КОВРИКИ = ШТОРКИ", 420, 860, "#ff3b30", "#fff", 40, 3),
   vo: "Мойка, чернение резины и запах новой машины из баллончика. А коврики — чтобы не видно было, что под ними.", who: "Лис",
   mv: "<b>Движение:</b> пена накрывает машину целиком, смывается — машина блестит, звёздочки. Баллончик «пшик» крупно. Коврик шлёпается на пол и прикрывает ржавую дыру." },
 { h: "АВТОРЫНОК", tc: "5/9 · 0:42–0:56", bg: "market", y: 700,
   els: () => clock("13:00") + CAR(250, 1140, 780) + ch("tolyan", "t", -30, 870, .9) + ch("seryoga", "s", 700, 870, .9)
     + bub("Брат, дед ездил<br>только на дачу!", 20, 730) + lab("ПИ-И-И-ИП · 480 мкм", 520, 870, "#ff3b30", "#fff", 36, 4),
   vo: "Толян: «Брат, дед ездил только на дачу!» Лис: «Про яблоню Толян промолчал». Серёга: «Толщиномер пищит. Тут краска на краске». Лис: «Серёга уже покупал одну хозяйку. Больше не покупает».", who: "Толян + Лис + Серёга",
   mv: "<b>Движение:</b> Серёга из 14-й серии — теперь с толщиномером. Прибор пищит всё громче, цифры растут, Толян потеет. Серёга молча уходит из кадра." },
 { h: "ТРАССА", tc: "6/9 · 0:56–1:06", bg: "highway", y: 700,
   els: () => clock("15:30") + CAR(130, 1120, 820) + `<div class="el" style="left:330px;top:780px;z-index:9;width:420px;height:300px;background:#0d0e12;border:6px solid #fff;border-radius:40px 40px 20px 20px;display:flex;align-items:center;justify-content:center"><div style="font-size:120px;filter:drop-shadow(0 0 20px #ffb300)">⚠️</div><div style="position:absolute;width:300px;height:70px;background:#1e2a8a;transform:rotate(-12deg);border:4px solid #151515"></div></div>`
     + lab("ЧЕК ВЫЛЕЧЕН", 600, 1050, "#4cd964", "#151515", 40, -4),
   vo: "По дороге загорелся «чек». Толян вылечил его изолентой. Медицина у перекупов простая.", who: "Лис",
   mv: "<b>Движение:</b> дождь, машина несётся, вдруг крупно приборка — лампа «чек» мигает с писком. Рука Толяна шлёпает синюю изоленту. Писк обрывается. Машина едет дальше, из-под капота тонкий дымок." },
 { h: "САЛОН", tc: "7/9 · 1:06–1:20", bg: "dealer", y: 700,
   els: () => clock("17:00") + CAR(260, 1150, 760) + ch("edik", "e", 680, 860, .95) + ch("tolyan", "t", -30, 870, .9)
     + bub("Рынок падает.<br><em>Сто двадцать</em> — из уважения.", 300, 730) + bub("Брат, я сам такой!", 20, 930),
   vo: "Эдик: «Машина сложная, рынок падает. Сто двадцать — и то из уважения». Толян: «Брат, ты чё, я сам такой!» Эдик: «Поэтому и сто двадцать». Лис: «Перекупа перекупили. Минус шестьдесят».", who: "Эдик + Толян + Лис",
   mv: "<b>Движение:</b> Эдик обходит машину с планшетом, на каждый шаг цена падает: 180 → 150 → 120. Толян бледнеет. Штамп <b>«−60 000»</b> бьёт по экрану." },
 { h: "ГОРОД", tc: "8/9 · 1:20–1:30", bg: "city", y: 700,
   els: () => clock("21:00") + ch("tolyan", "t", -20, 880, .9) + `<div class="el" style="left:400px;top:760px;z-index:9;width:600px;background:#fff;border:6px solid #151515;border-radius:28px;padding:24px;font-family:Onest;color:#151515;box-shadow:0 10px 0 #151515"><div style="height:150px;background:#c9ced6;border-radius:16px;margin-bottom:14px"></div><div style="font-family:Unbounded;font-weight:900;font-size:36px">ВАЗ-2114 · 390 000 ₽</div><div style="font-size:28px;margin-top:8px">Один владелец. Дед.<br>Ездил только на дачу.</div><div style="font-size:22px;color:#8b93a3;margin-top:8px">Салон «Эдик Моторс» · сегодня</div></div>`,
   vo: "Вечером четырка появилась на сайте. Триста девяносто. Один владелец. Дед. Ездил только на дачу. Дед до сих пор на даче.", who: "Лис",
   mv: "<b>Движение:</b> телефон в руке Толяна крупно, свет экрана на лице. Объявление прокручивается, на «390 000» — зум. Пауза. «Дед до сих пор на даче» — в тишине, ветер." },
 { h: "МОРАЛЬ", tc: "9/9 · 1:30–1:40", bg: "night", y: 700,
   els: () => clock("05:30") + `<div class="el" style="left:60px;top:740px;right:60px;z-index:9;background:#0d0e12;border:6px solid #fff;border-radius:30px;padding:26px 30px;color:#fff;font-family:Unbounded;font-weight:900;font-size:40px;line-height:1.35">ПРОБЕГ — ПО ИСТОРИИ,<br>А НЕ ПО ПРИБОРКЕ<br><span style="color:#ffd23f">📄 автотека · 📏 толщиномер · 🔎 диагностика</span></div>`
     + ch("tolyan", "t2", 640, 1000, .7),
   vo: "Пробег проверяй по истории, а не по приборке. Свежие объявления раньше перекупов — в боте «Перехват». Сохрани, пока тебе не продали машину деда с дачи.", who: "Лис",
   mv: "<b>Финал-петля:</b> снова 05:30, будильник, Толян встаёт — новый день, новый дед. Чек-лист влетает по пунктам, в конце маскот-лис и подпись про бота. Длина ролика — <b>~1:35</b>, 9 сцен, 8 разных фонов, 5 персонажей." },
];

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els(); if (CLK) document.getElementById("h").insertAdjacentHTML("beforebegin", `<span class="clk">${CLK}</span>`);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>«${sc.vo}»`;
document.getElementById("mv").innerHTML = sc.mv;
["a","b","c","d","e","f","g","h","i"].forEach(p => { const e = document.getElementById(p); });
const sh = document.getElementById("t-shades"); if (sh) sh.style.display = ""; const sh2 = document.getElementById("t2-shades"); if (sh2) sh2.style.display = "";
mouth && document.getElementById("t") && mouth("t", "grin"); document.getElementById("g") && mouth("g", "talk"); document.getElementById("e") && mouth("e", "grin");
window.READY = true;
</script></body></html>
