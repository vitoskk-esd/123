<script>
// «ТОЛЯН · 20: ПОДСТАВА» (ep81) — сезон «Свой автосалон», без мата. Жора «по-другому»: подсылает племянника Вадика с Камри-приманкой

// Гаражи на Заводской: «Деньги сразу, документы потом» — «Документы сейчас — деньги потом». Звонит «ДЯДЯ ЖОРА» — подстава раскрыта.

const T = (p, x, foot, h, pose = {}, extra = {}) => ch("tolyan", p, x, foot, h, {}, pose, extra);
const RI = (p, x, foot, h, pose = {}, extra = {}) => RIM(ch("vika", p, x, foot, h, null, pose, extra));
const V = (p, x, foot, h, o = {}, pose = {}, extra = {}) => ch("perekup", p, x, foot, h, { ...VADIK, ...o }, pose, extra);
const Z = (p, x, foot, h, o = {}, pose = {}, extra = {}) => ch("perekup", p, x, foot, h, { ...ZHORA, ...o }, pose, extra);

 { h: "ОБЛОЖКА → УТРО: КАМРИ ЗА 790 ТЫСЯЧ", tc: "1/5 · 0:00–0:13",

   mv: "A — <b>кадр 0</b>: Толян с телефоном — в боте «Toyota Camry · 2018 · 790 000 ₽ · рынок ≈ 1 950 000», <b>строки с процентом нет</b> + плашка «ТОЛЯН · 20: ПОДСТАВА». B — <b>новый фон — кухня Толяна утром</b> (рассвет над панельками, плакат с вишнёвым Марком II, холодильник с магнитами, кружка с паром); счётчик 💰 45 000 · 🚗 5/10. <i>(Правда о боте: если цена ниже рынка больше чем на 55%, процент он не ставит — слишком похоже на развод.)</i>" },

     bubbles: [{ p: "la", html: "Слишком дёшево —<br><em>значит, мышеловка.</em>", fs: 36 }], talk: ["la"] },

   vo: "Лёха: «Слишком дёшево — значит, мышеловка. Езжай, но денег с собой не бери».", who: "Лёха",
   mv: "A — разделённый экран: Толян на кухне | Лёха в «Роллс-Ройсе». B — <b>приём: вставка-мышеловка</b> на весь экран — вместо сыра ключ от «Тойоты» с ценником «790 000», надпись от руки «сыр для перекупа»; <b>дуга захлопывается</b> на слове «мышеловка» (тряска)." },
 { h: "ГАРАЖИ НА ЗАВОДСКОЙ: «ДЕНЬГИ СРАЗУ, ДОКУМЕНТЫ ПОТОМ»", tc: "3/5 · 0:25–0:39",

     bubbles: [{ p: "va", html: "Деньги сразу, документы потом.<br><em>Ещё трое едут!</em>", fs: 36 }], talk: ["va"] },
   B: { def: () => ({ bg: "garazhizavodskaya", mid: T("td", 280, 1910, 880, { armL: 60, armR: 60 }, { rim: "#ffe7a0", side: 1, z: 8 }) + V("vb", 820, 1910, 840, { look: "o" }, {}, { rim: "#ffe7a0", side: -1, z: 8 }) + DUP(905, 1390, "dup2"), lights: GL }), shot: { x: 540, y: 1150, s: 1.02 },
     bubbles: [{ p: "td", html: "Документы сейчас —<br><em>деньги потом.</em>", fs: 40 }], talk: ["td"] },

 { h: "ЗВОНОК «ДЯДЯ ЖОРА» → ПОДСТАВА РАСКРЫТА", tc: "4/5 · 0:39–0:51",
   A: { def: () => ({ bg: "garazhizavodskaya", over: CALL(Z("zav", 150, 420, 380, { look: "grin" }, {}, { z: 2 })) }), shot: { x: 540, y: 960, s: 1 } },
   B: { def: () => ({ bg: "garazhizavodskaya", mid: T("te", 210, 1910, 880, {}, { rim: "#ffe7a0", side: 1, z: 8 }) + V("vc", 740, 1910, 840, { item: "phone", look: "o" }, { armR: -150 }, { rim: "#ffe7a0", side: -1, z: 8 }), lights: GL }), shot: { x: 540, y: 1150, s: 1.02 },
     bubbles: [{ p: "vc", html: "Дядя Жора,<br><em>он не ведётся!</em>", fs: 40 }, { p: "te", html: "Передай<br>дяде привет.", fs: 36 }], talk: ["vc"] },
   vo: "Лис: «И тут у продавца зазвонил телефон». Вадик: «Дядя Жора, он не ведётся!» Толян: «Передай дяде привет».", who: "Лис + Вадик + Толян",
   mv: "A — <b>приём: входящий звонок на весь экран</b> — «ДЯДЯ ЖОРА · мобильный · «ЖОРА МОТОРС»», аватар Жоры в кругу, зелёная кнопка пульсирует. B — Вадик проговорился в трубку, Толян спокойно уходит." },
 { h: "ВЕЧЕР: ДВЕ НАСТОЯЩИЕ — 7/10 → РИММА: «У ВАС НЕДЕЛЯ»", tc: "5/5 · 0:51–1:08",
   A: { def: () => ({ bg: "ploshchadkavecher", mid: SIGN77(240, 600) + car(V15, -70, 1640, 640, { z: 5, sheen: .4 }) + car(ELA, 470, 1720, 620, { z: 6, sheen: .4 }), over: CNT77("45 000", 7), lights: VL }), shot: { x: 540, y: 1150, s: 1.02 } },
   B: { def: () => ({ bg: "ofisrimmy", mid: RI("ra", 560, 1900, 900, { armL: -40 }, { rim: "#fff", side: -1, z: 7 }), lights: OL }), shot: { x: 540, y: 1100, s: 1.03 },
     bubbles: [{ p: "ra", html: "Жора предложил мне двойную аренду.<br><em>У вас неделя.</em>", fs: 36 }], talk: ["ra"] },
   vo: "Лис: «А вечером бот принёс две настоящие: “пятнашку” и Элантру — обе ниже рынка. Семь из десяти». Римма: «Жора предложил мне двойную аренду. У вас неделя». Лис: «Чтобы ловить настоящие машины ниже рынка, а не приманки, — бот “Перехват”, ссылка в шапке». <i>(финальная карточка бота)</i>", who: "Лис + Римма + Лис",
   mv: "A — площадка вечером: ВАЗ-2115 и Hyundai Elantra, <b>счётчик 🚗 5 → 7/10</b> (в ролике перед этим — телефон с двумя карточками «−19%» и «−15%»). B — <b>новый фон — кабинет Риммы</b> (календарь «НЕДЕЛЯ 6», фикус, калькулятор, фото площадки в рамке); крючок на 21-ю. Последний кадр — только бот." },
];
const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const put = (id, f) => { const el = document.getElementById(id);
  if (f.split) { const [dl, sl, dr, sr] = f.split();
    el.innerHTML = `<div class="cf">${HALF(C.frame(dl, sl), -1)}${HALF(C.frame(dr, sr), 1)}<div style="position:absolute;left:532px;top:0;width:16px;height:1920px;background:#fff;box-shadow:0 0 30px #000;z-index:80"></div>
      ${C.frame({ hud: f.hud }, { x: 540, y: 960, s: 1 }).replace('<div class="cf">', '<div style="position:absolute;inset:0;z-index:90;pointer-events:none">').replace(/<div class="vig"><\/div>/, "")}</div>`; }
  else { const def = f.def(); def.bubbles = f.bubbles || []; el.innerHTML = C.frame(def, f.shot); }
  if (f.sketch) el.querySelector(".cf").style.filter = SKF;
  (f.talk || []).forEach(p => C.mouth(el, p, "talk")); if (f.after) f.after(el); return el; };
const a = put("A", sc.A), b = put("B", sc.B);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
document.fonts.ready.then(() => { C.layout(a); C.layout(b); window.READY = true; });
</script></body></html>
