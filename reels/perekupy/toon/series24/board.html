<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#0b0c10;z-index:5}
.hd b{font-family:Unbounded;font-weight:900;font-size:30px;color:#151515;background:#ffd23f;border:5px solid #151515;border-radius:12px;padding:4px 14px}
.hd span{font-family:Unbounded;font-weight:800;font-size:26px;color:#fff}.hd i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#8b93a3}
.view{position:absolute;left:0;top:96px;width:1080px;height:820px;overflow:hidden;border-bottom:6px solid #ffd23f}
.stage{position:absolute;left:0;width:1080px;height:1920px}
.el{position:absolute}.el svg{width:100%;height:100%;overflow:visible}
.lab{position:absolute;font-family:Unbounded;font-weight:900;border:6px solid #151515;border-radius:18px;padding:6px 18px;box-shadow:0 8px 0 #151515;white-space:nowrap}
.bub{position:absolute;background:#0d0e12;border:5px solid #fff;border-radius:30px;padding:16px 24px;font-family:Unbounded;font-weight:800;font-size:36px;line-height:1.12;color:#fff;box-shadow:0 0 0 6px #0d0e12}
.bub em{font-style:normal;color:#ff3b30}
.txt{position:absolute;left:40px;right:40px;top:940px;color:#fff}
.txt .vo{font-family:Unbounded;font-weight:800;font-size:38px;line-height:1.22}
.txt .vo small{display:block;font-family:"JetBrains Mono";font-size:22px;color:#ffd23f;font-weight:800;margin-bottom:10px;letter-spacing:1px}
.txt .mv{margin-top:20px;font-family:Onest;font-size:25px;line-height:1.35;color:#b9bfca}
.txt .mv b{color:#fff}
.clk{white-space:nowrap;font-family:"JetBrains Mono";font-weight:800;font-size:34px;color:#ff3b30;border:4px solid #ff3b30;border-radius:10px;padding:0 10px;box-shadow:0 0 14px #ff3b3088}
.botcard{position:absolute;left:440px;top:660px;width:600px;z-index:9;background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:24px;box-shadow:0 0 80px rgba(120,180,255,.4)}
.botcard .bh{font-family:Onest;font-weight:700;font-size:26px;color:#8b93a3;margin-bottom:12px}
.botcard .bb{background:#1c1f26;border-radius:24px;padding:20px 24px;font-family:Onest;color:#fff;font-size:34px;line-height:1.45}
.cnt{position:absolute;left:40px;top:150px;z-index:20;font-family:"JetBrains Mono";font-weight:800;font-size:40px;color:#fff;background:#151515;border:5px solid #4cd964;border-radius:16px;padding:2px 16px;white-space:nowrap}
.receipt{position:absolute;left:150px;width:780px;background:#fbfaf6;border:6px solid #151515;box-shadow:0 18px 0 rgba(0,0,0,.35);padding:30px 40px;font-family:"JetBrains Mono";font-weight:800;font-size:32px;color:#222;line-height:1.6;transform:rotate(2deg);z-index:6}
.receipt h4{margin:0 0 10px;text-align:center;font-family:Unbounded;font-weight:900;font-size:38px}.receipt .row,.receipt .tot{display:flex;justify-content:space-between}.receipt .tot{border-top:5px dashed #222;margin-top:10px;padding-top:8px;font-size:42px;color:#e53935}
.title{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;line-height:1}
</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="view"><div class="stage" id="stage"></div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="../chars4.js"></script><script src="../chars5.js"></script><script src="bgs.js"></script>
<script>
// МИНИ-СЕРИАЛ «ТОЛЯН: СО СТА ТЫСЯЧ» (владелец 07.11) — часть 1 из 5 «Сто тысяч». Толян начинает со 100 000 ₽ и перепродаёт машины, находя их через бота.
// Сквозной приём сериала — счётчик капитала в углу; в конце каждой части — крючок на следующую. Слов «заработок/лёгкие деньги» избегаем (правило 1b).
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4, o) => el(CHARS[kind](p, o), l, t, 420 * s, 800 * s, z);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 9) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z}">${html}</div>`;
let CLK = "", CNTV = ""; const clock = (t) => (CLK = t, ""); const CAP = v => (CNTV = v, "");
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
const V09 = (l, t, w, z = 3, extra = "") => `<img class="el" src="../../kit/img/vaz2105/vaz2105_34.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${extra}">`;
const VALERA = { jacket: "#3f6e5a", pants: "#2b2f37", cap: "#5b4636", mustache: true, hair: "#bdbdbd" };
const GOSHA = { jacket: "#2e86de", pants: "#2e86de", cap: "#151515", chain: true, item: "phone" };
const EXPERT = { jacket: "#6b8e23", pants: "#3b3f46", glasses: true, hair: "#3a2d22", scarf: "#ffd23f", item: "gauge" };
const DIMA = { jacket: "#ffd23f", pants: "#2b2f37", cap: "#ffd23f", hair: "#2b1d14", item: "bag" };
const DED = { jacket: "#6b5a3a", pants: "#3b3f46", hair: "#d9d9d9", mustache: true, glasses: true };
const CASH = (l, t, n = 5) => Array.from({ length: n }, (_, i) => `<div class="el" style="left:${l + i * 26}px;top:${t - i * 10}px;width:150px;height:76px;z-index:8;background:#8fd17a;border:5px solid #151515;border-radius:8px;transform:rotate(${-10 + i * 5}deg)"></div>`).join("");
const PHONE = (l, t, inner) => `<div class="el" style="left:${l}px;top:${t}px;width:600px;z-index:9;background:#0d0e12;border:8px solid #2a2d34;border-radius:44px;padding:22px;box-shadow:0 0 70px rgba(120,180,255,.4)">${inner}</div>`;
const AD = (l, t) => `<div class="el" style="left:${l}px;top:${t}px;width:560px;z-index:9;background:#fff;border:8px solid #151515;border-radius:30px;padding:18px 22px;font-family:Onest;color:#151515;box-shadow:0 12px 0 #151515">
  <div style="height:170px;border-radius:18px;background:linear-gradient(#f6b26b,#fde3c3);position:relative;overflow:hidden"><img src="../../kit/img/vaz2105/vaz2105_34.png" style="position:absolute;left:60px;bottom:4px;width:380px"></div>
  <div style="font-family:Unbounded;font-weight:900;font-size:30px;margin-top:10px">ВАЗ-2105 · 120 000 ₽</div><div style="font-size:24px;font-weight:800;color:#2f7a3a">без скрутки · аккумулятор новый</div></div>`;
const S = [
 { h: "КАК ТОЛЯН СТАЛ ПЕРЕКУПОМ · 1", tc: "1/8 · 0:00–0:07", bg: "coffee", y: 700, els: () => CAP("100 000") + ch("tolyan", "t", -10, 880, .86, 6) + CASH(560, 1250)
     + `<div class="el" style="left:500px;top:760px;width:500px;height:270px;z-index:8;background:#fff;border:7px solid #151515;border-radius:50%;box-shadow:0 10px 0 #151515"></div>
        <img class="el" src="../../kit/img/gelik/gelik_34.png" style="left:610px;top:780px;width:260px;z-index:9"><div class="el" style="left:600px;top:960px;z-index:9;font-family:Unbounded;font-weight:900;font-size:32px;color:#151515;white-space:nowrap">1 000 000 ₽ 🤑</div>`
     + bub("Всё, брат. Сто тысяч есть —<br><em>становлюсь перекупом!</em>", 40, 700),
   vo: "Толян: «Всё, брат. Сто тысяч есть — становлюсь перекупом!» Лис: «Как Толян со ста тысячами решил стать перекупом. Честно. С ботом Перехват».", who: "Толян + Лис",
   mv: "<b>Новый фон — кофейня.</b> Толян за столиком с капучино, рядом его сто тысяч, над головой мечта — Гелик и миллион. Счётчик капитала в углу." },
 { h: "03:00 · НОЧНОЙ ЛАРЁК", tc: "2/8 · 0:07–0:15", bg: "kiosk", y: 700, els: () => clock("03:00") + CAP("100 000") + ch("tolyan", "t", -20, 880, .84, 6)
     + PHONE(400, 760, `<div style="font-family:Onest;font-weight:700;font-size:24px;color:#8b93a3">ПЕРЕХВАТ · фильтр</div><div style="font-family:Onest;color:#fff;font-size:28px;line-height:1.5;margin:6px 0 14px">💰 до 100 000 ₽ · 📍 твой город</div>
       <div style="background:#1c1f26;border-radius:22px;padding:16px 20px;font-family:Onest;color:#fff;font-size:30px;line-height:1.45"><b style="color:#ff7a1a">🔥 −25% к рынку · хозяин</b><br><b>ВАЗ-2105 · 85 000 ₽</b><br>⏱ 1 с после публикации</div>`)
     + bub("Брат,<br><em>беру!</em>", 60, 720),
   vo: "Лис: «Фильтр — до ста тысяч, свой город. Три ночи — пятёрка за восемьдесят пять, на четверть ниже рынка. От хозяина». Толян: «Брат, беру!»", who: "Лис + Толян",
   mv: "<b>Новый фон — ночной ларёк «24 часа»</b>: фонарь, мотыльки. Толян с хот-догом, на телефоне фильтр и карточка «Перехвата»." },
 { h: "ГАРАЖ ДЯДИ ВАЛЕРЫ", tc: "3/8 · 0:15–0:23", bg: "shed", y: 700, els: () => CAP("15 000 + 🚗") + V09(300, 1200, 680) + ch("perekup", "d", -10, 860, .86, 6, VALERA) + ch("tolyan", "t", 800, 880, .76, 6)
     + bub("Сынок, только аккумулятор сел.<br><em>А так — зверь.</em>", 60, 720) + lab("−85 000 ₽", 330, 1080, "#ff3b30", "#fff", 46, 3),
   vo: "Дядя Валера: «Сынок, только аккумулятор сел. А так — зверь». Лис: «Восемьдесят пять тысяч — и у Толяна первая машина».", who: "Валера + Лис",
   mv: "<b>Новый фон — гараж изнутри</b>: банки с огурцами, плакат «Жигули», лампочка. <b>Новый герой — дядя Валера</b> (кепка, усы, рабочая куртка)." },
 { h: "У ПОДЪЕЗДА · ОБЪЯВЛЕНИЕ", tc: "4/8 · 0:23–0:32", bg: "podezd", y: 700, els: () => CAP("8 000 + 🚗") + V09(330, 1210, 660) + ch("tolyan", "t", -20, 880, .8, 6) + AD(470, 740)
     + lab("АККУМУЛЯТОР И ШАМПУНЬ −7 000", 40, 1350, "#151515", "#fff", 32, -3),
   vo: "Лис: «Аккумулятор и шампунь — семь тысяч. Мойка из ведра. Фото на закате. Объявление: сто двадцать, без скрутки».", who: "Лис",
   mv: "<b>Новый фон — двор у подъезда.</b> Толян моет пятёрку из ведра, фоткает её — и рядом всплывает его объявление «120 000 · без скрутки»." },
 { h: "ЗВОНОК · ГОША", tc: "5/8 · 0:32–0:42", bg: "podezd", y: 700, els: () => CAP("8 000 + 🚗") + `<div class="el" style="left:540px;top:700px;width:540px;height:820px;z-index:5;border-left:8px solid #151515;overflow:hidden"><div style="position:absolute;left:-540px;top:-700px;width:1080px;height:1920px">${BGS.kiosk.replace('id="bg"', "")}</div>${ch("perekup", "g", 110, 180, .76, 6, GOSHA)}</div>`
     + ch("tolyan", "t", 40, 880, .8, 6) + bub("Последняя цена? Шестьдесят —<br><em>и забираю сегодня.</em>", 440, 720) + lab("«ТЫ КТО?» — «ПЕРЕКУП»", 60, 1350, "#ff3b30", "#fff", 36, -3),
   vo: "Гоша: «Последняя цена? Шестьдесят — и забираю сегодня». Толян: «Брат, ты кто вообще?» Гоша: «Перекуп». Лис: «Толян впервые оказался по ту сторону».", who: "Гоша + Толян + Лис",
   mv: "Пол-экрана — Толян у подъезда, пол-экрана — <b>новый герой Гоша-перекуп</b> (синий спортивный костюм, цепь) звонит со своей точки. Оба в кадре." },
 { h: "ВОКЗАЛ · «ЭКСПЕРТ»", tc: "6/8 · 0:42–0:53", bg: "vokzal", y: 700, els: () => CAP("8 000 + 🚗") + V09(280, 1220, 660) + ch("perekup", "e", 790, 880, .76, 6, EXPERT) + ch("tolyan", "t", -20, 880, .8, 6)
     + bub("Хорошая машина.<br><em>Но я думал, она синяя.</em>", 470, 720) + lab("40 МИНУТ ОСМОТРА", 60, 1360, "#ffd23f", "#151515", 36, -2),
   vo: "Эксперт: «Толщиномер, эндоскоп, магнит… Хорошая машина. Но я думал, она синяя». Лис: «Сорок минут осмотра. Уехал на автобусе».", who: "Эксперт + Лис",
   mv: "<b>Новый фон — площадь у вокзала.</b> <b>Новый герой — «эксперт»</b> (очки, шарф, толщиномер) облазил всю машину и ушёл. Толян смотрит ему вслед." },
 { h: "ВОКЗАЛ · ДИМА", tc: "7/8 · 0:53–1:03", bg: "vokzal", y: 700, els: () => CAP("128 000") + V09(280, 1220, 660) + ch("tolyan", "t", -20, 880, .8, 6) + ch("perekup", "m", 800, 880, .76, 6, DIMA)
     + bub("Сколько?", 700, 760) + CASH(420, 1380, 4) + lab("+28 000 ₽", 60, 1360, "#4cd964", "#151515", 44, -3),
   vo: "Дима: «Сколько?» Толян: «Сто двадцать. Всё честно». Дима: «Беру». Лис: «Плюс двадцать восемь тысяч за неделю. Без скрутки. Толян сам в шоке».", who: "Дима + Толян + Лис",
   mv: "<b>Новый герой — курьер Дима</b> (жёлтая куртка, сумка). Короткая сделка, счётчик взлетает до 128 000." },
 { h: "КРЮЧОК + ФИНАЛ", tc: "8/8 · 1:03–1:10", bg: "kiosk", y: 600, els: () => CAP("128 000")
     + `<div class="el" style="left:60px;right:60px;top:660px;z-index:9;background:#0d0e12;border:6px solid #fff;border-radius:30px;padding:22px 26px;color:#fff;font-family:Unbounded;font-weight:900;font-size:34px;line-height:1.3;text-align:center">ЧАСТЬ 2:<br><span style="color:#ff3b30">Приора и первая ошибка</span></div>`
     + `<div class="el" style="left:60px;right:60px;top:960px;z-index:12;background:#ffd23f;border:8px solid #151515;border-radius:34px;padding:22px 30px;box-shadow:0 14px 0 #151515;font-family:Unbounded;font-weight:900;color:#151515;text-align:center"><div style="font-size:40px;line-height:1.15">Бот <span style="color:#c0392b">«Перехват»</span> — ссылка в шапке</div><div style="margin-top:10px;font-size:26px;font-family:Onest;font-weight:800">фильтр по бюджету и городу · ниже рынка — видно сразу</div></div>` + FOX(440, 1240, 200),
   vo: "Лис: «Дальше — Приора и первая ошибка Толяна. Подпишись, чтобы не пропустить».", who: "Лис",
   mv: "Крючок на часть 2 + одна финальная карточка." },
];

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els(); if (CNTV) document.querySelector(".view").insertAdjacentHTML("beforeend", `<div class="cnt" style="top:auto;bottom:20px;left:auto;right:20px">💸 ${CNTV} ₽</div>`); if (CLK) document.getElementById("h").insertAdjacentHTML("beforebegin", `<span class="clk">${CLK}</span>`);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
const sh = document.getElementById("t-shades"); if (sh) sh.style.display = "";
["t", "d", "g", "e", "m"].forEach(p => document.getElementById(p) && mouth(p, "talk"));
window.READY = true;
</script></body></html>
