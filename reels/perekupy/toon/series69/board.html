<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css"><link rel="stylesheet" href="../cine.css"><link rel="stylesheet" href="masks.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}

<div class="fr" style="left:0"><div class="sc" id="A"></div><div class="lb" id="la">A</div></div>

<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="../chars4.js"></script><script src="../chars5.js"></script>
<script src="bgs.js"></script><script src="../cine.js"></script><script src="props.js"></script><script src="props78.js"></script>
<script>
// «ТОЛЯН · 17: УЧЁБА В МОСКВЕ» (ep78) — сезон «Свой автосалон», без мата. Толян едет в Москву учиться бизнесу у Лёхи
// (лысый, в татуировках, кожанка, Rolls-Royce Cullinan — владелец 16.11), Москва-Сити. Экзамен ботом за 40 с → Лёха берёт в долю → 2/10.
// Поворот: на стене фото «2009 · Лёха и Жорик» — Жора тоже его ученик.
const T = (p, x, foot, h, pose = {}, extra = {}) => ch("tolyan", p, x, foot, h, {}, pose, extra);
const L = (p, x, foot, h, o = {}, pose = {}, extra = {}) => LEHA(ch("perekup", p, x, foot, h, { ...LEHA_O, ...o }, pose, extra));
const Z = (p, x, foot, h, o = {}, pose = {}, extra = {}) => ch("perekup", p, x, foot, h, { ...ZHORA, ...o }, pose, extra);
const ML = glow(540, 300, 480, "#ffffff", .22), OL = glow(540, 500, 560, "#ffffff", .2), NL = glow(540, 1200, 600, "#ffb84a", .2);
const S = [
 { h: "ОБЛОЖКА → КАРТА: ПЛОЩАДКА ТОЛЯНА → МОСКВА", tc: "1/5 · 0:00–0:12",
   A: { def: () => { const H = HOLDPHONE("tolyan", "ta", 540, 2090, 1680, {}, SOLCARD(), { rim: "#ffffff", side: 1 });
       return { bg: "moskvasiti", farBlur: 8, mid: H.mid, lights: H.lights + ML, over: TITLE("ТОЛЯН · 17:", "УЧЁБА В МОСКВЕ") }; }, shot: { x: 540, y: 960, s: 1 } },
   B: { def: () => ({ bg: "moskvasiti", over: ROUTE() + CNT77("20 000", 1) + PIPS(T("tb", 160, 640, 640, {}, { z: 2 }), "tb", "pp1", "#ffd23f", 700, 1580) }), shot: { x: 540, y: 960, s: 1 },
     bubbles: [{ p: "tb", html: "Поеду учиться, брат.<br><em>К лучшим.</em>", fs: 44 }], talk: ["tb"] },
   vo: "Лис: «Одна машина из десяти, на счету двадцать тысяч. Толян понял: салону нужен не гараж, а голова». Толян: «Поеду учиться, брат. К лучшим». Лис: «Москва. Сити. Самый серьёзный перекуп страны — Лёха».", who: "Лис + Толян",
   mv: "A — <b>кадр 0</b>: Толян с телефоном — в боте «Hyundai Solaris · 2017 · 690 000 ₽ · рынок ≈ 820 000 · −16%» + плашка «ТОЛЯН · 17: УЧЁБА В МОСКВЕ». B — <b>приём: карта поездки</b> — красная линия рисуется от «ПЛОЩАДКИ ТОЛЯНА» до «МОСКВЫ», по ней едет машинка; счётчик сезона 💰 20 000 · 🚗 1/10." },
 { h: "МОСКВА-СИТИ → ЛЁХА НА «РОЛЛС-РОЙСЕ»", tc: "2/5 · 0:12–0:24",
   A: { def: () => ({ bg: "moskvasiti", mid: T("tc", 300, 1900, 760, { armR: -150 }, { rim: "#fff", side: 1, z: 7 }), lights: ML }), shot: { x: 540, y: 1000, s: 1 },
     bubbles: [{ p: "tc", html: "Вот это да…", fs: 50 }], talk: ["tc"] },
   B: { def: () => ({ bg: "moskvasiti", farBlur: 3, mid: car(CULL, 300, 1700, 760, { z: 5, sheen: .6 }) + L("la", 190, 1900, 900, {}, { armR: -60 }, { rim: "#fff", side: 1, z: 8 }), lights: ML }), shot: { x: 540, y: 1150, s: 1.02 },
     bubbles: [{ p: "la", html: "Ты Толян? Пошли.<br><em>У меня на всё — пятнадцать минут.</em>", fs: 36 }], talk: ["la"] },
   vo: "<i>(Толян с сумкой на набережной смотрит на башни)</i> Лис: «Москва. Сити. Самый серьёзный перекуп страны — Лёха». <i>(Подъезжает чёрный Rolls-Royce Cullinan, выходит Лёха)</i> Лёха: «Ты Толян? Пошли. У меня на всё — пятнадцать минут».", who: "Лис + Лёха",
   mv: "A — <b>новый фон — Москва-Сити с набережной</b> (башни: «Федерация» со шпилем, золотой «Меркурий», «ОКО», закрученная «Эволюция», «Город столиц»; река, теплоход, фонари); камера поднимается снизу вверх по башням. B — <b>Rolls-Royce Cullinan</b> (вырезан из твоего листа) и <b>новый герой — Лёха</b>: лысый, татуировки на шее, виске и руках, чёрная кожанка, цепь, голос спокойный и тяжёлый." },
 { h: "60-Й ЭТАЖ: ДОСКА «СТОИТ = СКЛАД, КРУТИТСЯ = САЛОН»", tc: "3/5 · 0:24–0:40",
   A: { def: () => ({ bg: "ofis60", mid: BOARD78() + L("lb", 330, 1900, 880, {}, { armR: -100 }, { rim: "#fff", side: 1, z: 7 }), lights: OL }), shot: { x: 540, y: 1100, s: 1.02 },
     bubbles: [{ p: "lb", html: "Стоят — это склад.<br><em>Крутятся — это салон.</em>", fs: 42 }], talk: ["lb"], after: el => ["#wb1", "#wb2", "#wb3"].forEach(s => el.querySelector(s).style.clipPath = "none") },
   B: { def: () => ({ bg: "ofis60", farBlur: 2, mid: T("td", 250, 1920, 860, {}, { rim: "#fff", side: 1, z: 7 }) + L("lc", 820, 1920, 880, {}, { armL: -60 }, { rim: "#fff", side: -1, z: 7 }), lights: OL }), shot: { x: 540, y: 1120, s: 1.02 },
     bubbles: [{ p: "lc", html: "Чужими деньгами. Найди машину ниже рынка,<br><em>пока я пью кофе. Время пошло.</em>", fs: 32 }], talk: ["lc"] },
   vo: "Лис: «Шестидесятый этаж. Первый урок — на стеклянной доске». Лёха: «Десять машин, которые стоят, — это склад. Десять машин, которые крутятся, — это салон». Толян: «И как их крутить, если денег нет?» Лёха: «Чужими деньгами. Найди машину ниже рынка, пока я пью кофе. Время пошло».", who: "Лис + Лёха + Толян",
   mv: "A — <b>новый фон — офис Лёхи на 60-м этаже</b> (панорамное окно прямо на башни Сити, стеклянная доска, кофемашина); <b>приём: маркер пишет на стеклянной доске</b> строка за строкой. B — Толян и Лёха у окна." },
 { h: "ЭКЗАМЕН: БОТ ЗА 40 СЕКУНД → ЛЁХА БЕРЁТ В ДОЛЮ · 2/10", tc: "4/5 · 0:40–0:54",
   A: { def: () => ({ bg: "ofis60", over: EXAM() + PIPS(T("te", 160, 640, 640, {}, { z: 2 }), "te", "pp2", "#ffd23f", 60, 1580) }), shot: { x: 540, y: 960, s: 1 },
     after: el => { el.querySelector("#sw").textContent = "00:40"; } },
   B: { def: () => ({ bg: "ofis60", farBlur: 2, mid: L("ld", 560, 1980, 1000, { look: "o" }, { armR: -40 }, { rim: "#fff", side: 1, z: 7 }), over: CNT77("20 000", 2), lights: OL }), shot: { x: 540, y: 1080, s: 1.04 },
     bubbles: [{ p: "ld", html: "Сорок секунд? Беру в долю:<br><em>мои деньги, твоя площадка, прибыль пополам.</em>", fs: 32 }], talk: ["ld"] },
   vo: "Лис: «Толян открыл бота. Сорок секунд — Солярис семнадцатого года: шестьсот девяносто при рынке восемьсот двадцать». Лёха: «Сорок секунд? Мои менеджеры полдня ищут. Беру в долю: мои деньги, твоя площадка, прибыль пополам». Лис: «Вторая машина на площадке — и снова без своих денег».", who: "Лис + Лёха",
   mv: "A — <b>приём: экзамен на время</b> — крупно телефон с ботом и секундомер, бежит до 00:40 и замирает, когда приходит карточка Соляриса; Толян в кружке. B — Лёха удивлён (впервые); счётчик 🚗 1 → 2/10. <b>Бот — развязка урока</b>: то, на что у менеджеров уходит полдня, бот делает за секунды." },
 { h: "ФОТО НА СТЕНЕ: «2009 · ЛЁХА И ЖОРИК» → СИТИ НОЧЬЮ", tc: "5/5 · 0:54–1:10",
   A: { def: () => ({ bg: "ofis60", over: PHOTO(L("lp", 230, 760, 600, { jacket: "#3a3f46", hair: "#3a2d22", chain: false }, {}, { z: 2 }) + Z("zp", 500, 760, 560, { mustache: false, hair: "#2b1a14" }, { armL: -100 }, { z: 2 })) + PIPS(T("tf", 160, 640, 640, {}, { z: 2 }), "tf", "pp3", "#ffd23f", 700, 1580) }), shot: { x: 540, y: 960, s: 1 },
     bubbles: [{ p: "tf", html: "Лёха, а это кто<br><em>на фото?</em>", fs: 42 }], talk: ["tf"] },
   B: { def: () => ({ bg: "sitinoch", mid: car(CULS, 300, 1660, 700, { z: 5, sheen: .6 }) + L("le", 190, 1900, 860, {}, { armR: -40 }, { rim: "#ffb84a", side: 1, z: 8 }) + T("tg", 900, 1900, 820, {}, { rim: "#ffb84a", side: -1, z: 8 }), lights: NL }), shot: { x: 540, y: 1150, s: 1.02 },
     bubbles: [{ p: "le", html: "Жора? Мой первый ученик.<br><em>Говорил ему: не жадничай.</em>", fs: 38 }], talk: ["le"] },
   vo: "Толян: «Лёха, а это кто на фото?» Лёха: «Жора? Мой первый ученик. Говорил ему: не жадничай». Лис: «Учитель у Толяна и Жоры оказался один. А чтобы находить машины ниже рынка за секунды — бот “Перехват”, ссылка в шапке». <i>(финальная карточка бота)</i>", who: "Толян + Лёха + Лис",
   mv: "A — <b>приём-поворот: фото на стене крупно</b> — сепия «2009 · Лёха и Жорик»: молодой Жора без усов, с чёлкой, рядом Лёха — ещё с волосами. B — <b>новый фон — Москва-Сити ночью</b> с крыши парковки (огни окон, красные огни на шпилях): Лёха у Cullinan сбоку, Толян. Крючок — голосом Лиса; последний кадр — только бот." },
];
const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const put = (id, f) => { const el = document.getElementById(id);
  if (f.split) { const [dl, sl, dr, sr] = f.split();
    el.innerHTML = `<div class="cf">${HALF(C.frame(dl, sl), -1)}${HALF(C.frame(dr, sr), 1)}<div style="position:absolute;left:532px;top:0;width:16px;height:1920px;background:#fff;box-shadow:0 0 30px #000;z-index:80"></div>
      ${C.frame({ hud: f.hud }, { x: 540, y: 960, s: 1 }).replace('<div class="cf">', '<div style="position:absolute;inset:0;z-index:90;pointer-events:none">').replace(/<div class="vig"><\/div>/, "")}</div>`; }
  else { const def = f.def(); def.bubbles = f.bubbles || []; el.innerHTML = C.frame(def, f.shot); }
  if (f.sketch) el.querySelector(".cf").style.filter = SKF;
  (f.talk || []).forEach(p => C.mouth(el, p, "talk")); if (f.after) f.after(el); return el; };
const a = put("A", sc.A), b = put("B", sc.B);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>${sc.vo}`;
document.getElementById("mv").innerHTML = sc.mv;
document.fonts.ready.then(() => { C.layout(a); C.layout(b); window.READY = true; });
</script></body></html>
