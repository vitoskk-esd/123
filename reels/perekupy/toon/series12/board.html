<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/base.css">
<style>
html,body{margin:0;background:#0b0c10;width:1080px;height:1350px;overflow:hidden}
.hd{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#0b0c10;z-index:5}
.hd b{font-family:Unbounded;font-weight:900;font-size:30px;color:#151515;background:#ffd23f;border:5px solid #151515;border-radius:12px;padding:4px 14px}
.hd span{font-family:Unbounded;font-weight:800;font-size:26px;color:#fff}.hd i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono";font-weight:800;font-size:26px;color:#8b93a3}
.view{position:absolute;left:0;top:96px;width:1080px;height:820px;overflow:hidden;border-bottom:6px solid #ffd23f}
.stage{position:absolute;left:0;width:1080px;height:1920px}
.el{position:absolute}.el svg{width:100%;height:100%;overflow:visible}
.lab{position:absolute;font-family:Unbounded;font-weight:900;border:6px solid #151515;border-radius:18px;padding:6px 18px;box-shadow:0 8px 0 #151515;white-space:nowrap}
.bub{position:absolute;background:#0d0e12;border:5px solid #fff;border-radius:30px;padding:16px 24px;font-family:Unbounded;font-weight:800;font-size:36px;line-height:1.12;color:#fff;box-shadow:0 0 0 6px #0d0e12}
.bub em{font-style:normal;color:#ff3b30}
.txt{position:absolute;left:40px;right:40px;top:940px;color:#fff}
.txt .vo{font-family:Unbounded;font-weight:800;font-size:38px;line-height:1.22}
.txt .vo small{display:block;font-family:"JetBrains Mono";font-size:22px;color:#ffd23f;font-weight:800;margin-bottom:10px;letter-spacing:1px}
.txt .mv{margin-top:20px;font-family:Onest;font-size:25px;line-height:1.35;color:#b9bfca}
.txt .mv b{color:#fff}
.clk{white-space:nowrap;font-family:"JetBrains Mono";font-weight:800;font-size:34px;color:#ff3b30;border:4px solid #ff3b30;border-radius:10px;padding:0 10px;box-shadow:0 0 14px #ff3b3088}
.title{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;line-height:1}
</style></head><body>
<div class="hd"><b>ПЕРЕКУПЫ</b><span id="h"></span><i id="tc"></i></div>
<div class="view"><div class="stage" id="stage"></div></div>
<div class="txt"><div class="vo" id="vo"></div><div class="mv" id="mv"></div></div>
<script src="../chars.js"></script><script src="../chars2.js"></script><script src="../chars3.js"></script><script src="bgs.js"></script>
<script>
// Приора сбоку — по рисунку владельца (kit/img/priora/priora_*.png): black — пацанская с наклейкой, white, yellow — такси, patch
const IMG = (v, l, t, w = 900, z = 3, extra = "") => `<img class="el" src="../../kit/img/priora/priora_${v}.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${extra}">`;
const P = (k, o) => "";
const el = (html, l, t, w, h, z = 3, extra = "") => `<div class="el" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;z-index:${z};${extra}">${html}</div>`;
const ch = (kind, p, l, t, s = 1, z = 4) => el(CHARS[kind](p), l, t, 420 * s, 800 * s, z);
const lab = (text, l, t, bg, fg = "#fff", fs = 46, rot = -3, z = 9) => `<div class="lab" style="left:${l}px;top:${t}px;background:${bg};color:${fg};font-size:${fs}px;transform:rotate(${rot}deg);z-index:${z}">${text}</div>`;
const bub = (html, l, t, z = 9) => `<div class="bub" style="left:${l}px;top:${t}px;z-index:${z}">${html}</div>`;
// ВАЗ-2114 владельца (kit/img/vaz2114/vaz2114_white.png, вырезан из его картинки)
const CAR = (l, t, w = 820, z = 3, extra = "") => `<img class="el" src="../../kit/img/vaz2114/vaz2114_white.png" style="left:${l}px;top:${t + w * .04}px;width:${w}px;z-index:${z};${extra}">`;
let CLK = ""; const clock = (t) => (CLK = t, "");
const odo = (v, l, t, c = "#ffd23f") => `<div class="el" style="left:${l}px;top:${t}px;z-index:9;font-family:'JetBrains Mono';font-weight:800;font-size:54px;color:${c};background:#111;border:6px solid #151515;outline:4px solid #555;border-radius:12px;padding:6px 20px">ОДО ${v}</div>`;
const FOX = (l, t, w) => `<img class="el" src="../../brand/fox_cut.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:9;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))">`;
// Марк из 18-й серии (рисунок владельца); экран реестра залогов
const MARK = (l, t, w, z = 4, extra = "") => `<img class="el" src="../../kit/img/markii/markii.png" style="left:${l}px;top:${t}px;width:${w}px;z-index:${z};${extra}">`;
const REESTR = (l, t, found) => `<div class="el" style="left:${l}px;top:${t}px;width:620px;z-index:9;background:#0d0e12;border:10px solid #2a2d34;border-radius:56px;padding:26px;box-shadow:0 0 60px rgba(120,180,255,.35)">
  <div style="background:#fff;border-radius:34px;padding:26px;font-family:Onest;color:#151515">
  <div style="font-family:Unbounded;font-weight:900;font-size:30px">Реестр уведомлений о залоге</div>
  <div style="margin:16px 0;padding:14px 18px;border:4px solid #c9d3df;border-radius:14px;font-family:'JetBrains Mono';font-weight:800;font-size:28px">VIN: JZX100-0012345</div>
  ${found ? `<div style="background:#ff3b30;color:#fff;border-radius:16px;padding:16px 20px;font-family:Unbounded;font-weight:900;font-size:30px">Найдено: 1 уведомление<br><span style="font-size:24px">Залогодержатель: банк «Надёжный»</span></div>`
          : `<div style="background:#4cd964;border-radius:16px;padding:16px 20px;font-family:Unbounded;font-weight:900;font-size:30px">Сведений не найдено</div>`}
  <div style="margin-top:14px;font-size:24px;color:#6b7280">⏱ 1 минута · бесплатно</div></div></div>`;
const S = [
 { h: "ЗАЛОГ", tc: "1/8 · 0:00–0:08", bg: "impound", y: 700,
   els: () => MARK(160, 1150, 760) + ch("seryoga", "s", 640, 900, .85, 6)
     + `<div class="title" style="top:900px;z-index:9"><span class="lab" style="position:static;display:inline-block;background:#ff3b30;color:#fff;font-size:110px;transform:rotate(-3deg)">ЗАЛОГ</span></div>`,
   vo: "Серёга купил Марк Второй за полцены. Через три месяца за машиной пришли. Не воры. Банк.", who: "Лис",
   mv: "<b>Новая локация — штрафстоянка ночью:</b> сетка, колючка, прожектор. Белый Марк из 18-й серии стоит за забором, Серёга смотрит на него сквозь сетку. Луч прожектора проходит по машине." },
 { h: "ПРОДАЖА", tc: "2/8 · 0:08–0:20", bg: "market", y: 700,
   els: () => MARK(250, 1140, 640) + ch("tolyan", "t", -30, 900, .9, 6) + ch("seryoga", "s", 700, 900, .9, 6)
     + bub("Брат, ПТС оригинал!<br><em>Один хозяин!</em>", 40, 730) + lab("ПТС ОРИГИНАЛ ✓", 300, 1080, "#4cd964", "#151515", 40, 3),
   vo: "Толян: «Брат, ПТС оригинал! Один хозяин!» Лис: «ПТС оригинал. Хозяин — тоже. Банк во Владивостоке».", who: "Толян + Лис",
   mv: "<b>Авторынок, день.</b> Толян продаёт тот самый Марк, который гнал 9000 км. Серёга (с толщиномером из 15-й) проверил краску — чисто, пробег — честный. Залог не проверил." },
 { h: "СЧАСТЬЕ", tc: "3/8 · 0:20–0:28", bg: "city", y: 700,
   els: () => MARK(120, 1140, 820) + lab("ТРИ МЕСЯЦА СЧАСТЬЯ", 140, 760, "#ffd23f", "#151515", 50, -3),
   vo: "Три месяца Серёга был счастлив. Марк ездил, не ломался, не плавал. Идеальная машина. Почти своя.", who: "Лис",
   mv: "<b>Ночной город:</b> Марк едет, огни проносятся, Серёга за рулём качает головой под музыку. На «почти своя» — музыка обрывается." },
 { h: "ДВЕРЬ", tc: "4/8 · 0:28–0:40", bg: "stairs", y: 700,
   els: () => ch("seryoga", "s", 620, 900, .9, 6) + bub("Сергей Сергеевич? Машина<br>в залоге у банка.<br><em>Ключи, пожалуйста.</em>", 40, 720)
     + `<div class="el" style="left:300px;top:1000px;font-size:110px;z-index:9">👊</div>`,
   vo: "Пристав: «Сергей Сергеевич? Машина в залоге у банка. Ключи, пожалуйста». Серёга: «Я же её купил!» Пристав: «Купили. Вместе с залогом».", who: "Пристав + Серёга",
   mv: "<b>Новая локация — подъезд, утро:</b> стук в дверь «кв. 47», Серёга в тапках смотрит в глазок (ракурс через глазок — рыбий глаз), открывает. Пристава видно только по руке с бумагой." },
 { h: "БАНК", tc: "5/8 · 0:40–0:52", bg: "bank", y: 700,
   els: () => ch("seryoga", "s", -30, 900, .9, 6) + bub("Залог переходит вместе<br>с машиной. <em>Ничего личного.</em>", 360, 720),
   vo: "Менеджер: «Залог переходит вместе с машиной. Ничего личного». Лис: «Залог — как кот. Переезжает вместе с вещами».", who: "Менеджер + Лис",
   mv: "<b>Новая локация — офис банка:</b> табло очереди, окошки, плакат «Автокредит 0%*». Менеджер за стеклом, звёздочка на плакате медленно увеличивается на весь экран." },
 { h: "РЕЕСТР", tc: "6/8 · 0:52–1:02", bg: "bank", y: 700,
   els: () => `<div style="position:absolute;inset:0;backdrop-filter:blur(10px);background:rgba(0,0,0,.45);z-index:4"></div>` + REESTR(230, 760, true),
   vo: "Проверка в реестре залогов заняла бы минуту. Бесплатно. Серёга проверил потом. Тоже минуту.", who: "Лис",
   mv: "<b>Ракурс — экран телефона:</b> сайт реестра залогов, вводится VIN, крутится загрузка — и красная плашка «Найдено: 1 уведомление. Залогодержатель: банк „Надёжный“»." },
 { h: "ПЕТЛЯ", tc: "7/8 · 1:02–1:14", bg: "market", y: 700,
   els: () => REESTR(560, 1000, true).replace("width:620px", "width:420px;transform:scale(.75);transform-origin:0 0") + ch("tolyan", "t", -30, 900, .9, 6) + ch("seryoga", "s", 700, 900, .9, 6)
     + bub("Брат, залогов нет!<br><em>…Ну один. Маленький.</em>", 40, 730),
   vo: "Лис: «Через месяц Толян продавал следующую». Толян: «Брат, залогов нет!» Серёга молча показывает телефон. Толян: «…Ну один. Маленький».", who: "Лис + Толян",
   mv: "<b>Петля — тот же авторынок:</b> Толян снова продаёт, Серёга теперь первым делом достаёт телефон с реестром. Толян потеет, сдувается." },
 { h: "МОРАЛЬ", tc: "8/8 · 1:14–1:26", bg: "bank", y: 700,
   els: () => `<div class="el" style="left:60px;top:740px;right:60px;z-index:9;background:#0d0e12;border:6px solid #fff;border-radius:30px;padding:26px 30px;color:#fff;font-family:Unbounded;font-weight:900;font-size:34px;line-height:1.4">ДО ПОКУПКИ:<br><span style="color:#ffd23f">🏦 реестр залогов нотариальной палаты — по VIN<br>🚓 ограничения и розыск — на сайте ГИБДД<br>📄 ПТС оригинал — ещё не значит «без залога»</span></div>`
     + FOX(400, 1240, 260),
   vo: "До покупки проверь машину в реестре залогов нотариальной палаты — по VIN, бесплатно. Ограничения и розыск — на сайте ГИБДД. Оригинал ПТС ещё не значит, что залога нет. А свежие объявления раньше перекупов — в боте Перехват. Сохрани — пока тебе не продали машину вместе с банком.", who: "Лис",
   mv: "<b>Финал:</b> чек-лист, затем лиса с биноклем (аватарка бота) и подпись про бота. ~1:26, 8 сцен, <b>3 новые локации</b>, новые ракурсы: через глазок, экран реестра. Хронология: Марк из 18-й серии, Серёга с толщиномером." },
];

const n = +new URLSearchParams(location.search).get("n") || 1, sc = S[n - 1];
document.getElementById("h").textContent = sc.h; document.getElementById("tc").textContent = sc.tc;
const st = document.getElementById("stage"); st.style.top = -sc.y + "px"; st.innerHTML = BGS[sc.bg] + sc.els(); if (CLK) document.getElementById("h").insertAdjacentHTML("beforebegin", `<span class="clk">${CLK}</span>`);
document.getElementById("vo").innerHTML = `<small>🎙 ${sc.who.toUpperCase()}</small>«${sc.vo}»`;
document.getElementById("mv").innerHTML = sc.mv;
["a","b","c","d","e","f","g","h","i"].forEach(p => { const e = document.getElementById(p); });
const sh = document.getElementById("t-shades"); if (sh) sh.style.display = ""; const sh2 = document.getElementById("t2-shades"); if (sh2) sh2.style.display = "";
mouth && document.getElementById("t") && mouth("t", "grin"); document.getElementById("g") && mouth("g", "talk"); document.getElementById("e") && mouth("e", "grin"); document.getElementById("v") && mouth("v", "talk");
window.READY = true;
</script></body></html>
