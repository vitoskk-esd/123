<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body { background: var(--ink); color: var(--white); position: relative; }
  /* Безопасная зона VK: сверху 85px — меню, по бокам ~140px могут обрезаться. */
  .bg-grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 64px 64px; }
  .content { position: absolute; left: 200px; top: 120px; width: 1060px; }
  .wordmark { font-size: 30px; color: var(--white); }
  .wordmark .mark { width: 54px; height: 40px; font-size: 14px; }
  .wordmark .mark .pct { font-size: 28px; }
  h1 { font-size: 88px; line-height: 1.02; margin-top: 34px; }
  h1 em { font-style: normal; color: var(--mint); }
  p.sub { font-size: 30px; line-height: 1.38; color: var(--muted-on-ink); margin-top: 24px; max-width: 980px; }
  .row { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; margin-top: 34px; }
  .pill { background: var(--mint); color: var(--ink); font-size: 28px; padding: 18px 30px; }
  .note { font-size: 22px; color: var(--muted-on-ink); }
  /* Декор справа: стопка карт. Не несёт смысла, поэтому может обрезаться. */
  .stack { position: absolute; left: 1330px; top: 190px; width: 460px; height: 420px; }
  .c { position: absolute; width: 400px; height: 252px; border-radius: 26px; }
  .c1 { left: 40px; top: 150px; background: var(--ink-2); transform: rotate(-14deg); border: 2px solid rgba(255,255,255,.08); }
  .c2 { left: 30px; top: 70px; background: #1E5A55; transform: rotate(-6deg); }
  .c3 { left: 20px; top: 0; background: var(--mint); transform: rotate(4deg); box-shadow: 0 30px 60px rgba(0,0,0,.35); }
  .chip { position: absolute; left: 36px; top: 74px; width: 64px; height: 48px; border-radius: 10px; background: var(--sun); }
  .c3 .big { position: absolute; right: 34px; bottom: 18px; font-family: "Unbounded"; font-weight: 800; font-size: 120px; color: var(--ink); line-height: 1; }
  .c3 .slash { position: absolute; right: 22px; bottom: 74px; width: 150px; height: 14px; border-radius: 99px; background: var(--sun); transform: rotate(-32deg); box-shadow: 0 0 0 5px var(--mint); }
</style></head><body>
  <div class="bg-grid"></div>
  <div class="content">
    <div class="wordmark"><span class="mark"><span class="card"></span><span class="pct">%</span><span class="strike"></span></span>Без переплат</div>
    <h1 class="display">Кредитка<br><em>без переплат</em></h1>
    <p class="sub">Честно разбираем условия банковских карт: как не платить проценты, как снять наличные без комиссии и что проверить до оформления.</p>
    <div class="row">
      <span class="pill">Напишите «КАРТА» в сообщения — ответим 24/7</span>
      <span class="note">Независимый проект, не банк · 18+</span>
    </div>
  </div>
  <div class="stack"><div class="c c1"></div><div class="c c2"></div>
    <div class="c c3"><div class="chip"></div><div class="big">%</div><div class="slash"></div></div></div>
</body></html>
