<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body { background: var(--paper); color: var(--ink); position: relative; }
  .blob { position: absolute; right: -120px; top: -160px; width: 900px; height: 900px; border-radius: 50%; background: var(--mint-soft); }
  .content { position: absolute; left: 200px; top: 125px; width: 960px; }
  .wordmark { font-size: 30px; }
  .wordmark .mark { width: 54px; height: 40px; }
  .wordmark .mark .pct { font-size: 28px; }
  h1 { font-size: 72px; line-height: 1.08; margin-top: 34px; }
  h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--sun) 62%); }
  p.sub { font-size: 29px; line-height: 1.4; color: var(--muted-on-paper); margin-top: 24px; max-width: 900px; }
  .pill { background: var(--ink); color: var(--white); font-size: 27px; padding: 18px 30px; margin-top: 30px; }
  .pill b { color: var(--mint); }
  .checks { position: absolute; left: 1200px; top: 190px; width: 540px; display: grid; gap: 22px; }
  .check { display: flex; align-items: center; gap: 22px; background: var(--white); border-radius: 22px; padding: 26px 30px;
           font-size: 29px; font-weight: 700; box-shadow: 0 10px 30px rgba(14,42,43,.08); }
  .tick { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--mint); display: grid; place-items: center; }
  .tick::after { content: ""; width: 18px; height: 10px; border-left: 5px solid var(--ink); border-bottom: 5px solid var(--ink); transform: rotate(-45deg) translate(2px,-2px); }
  .foot { position: absolute; left: 200px; bottom: 40px; font-size: 21px; color: var(--muted-on-paper); }
</style></head><body>
  <div class="blob"></div>
  <div class="content">
    <div class="wordmark"><span class="mark"><span class="card"></span><span class="pct">%</span><span class="strike"></span></span>Без переплат</div>
    <h1 class="display">Кредитная&nbsp;карта<br><em>без&nbsp;переплат</em></h1>
    <p class="sub">Как пользоваться кредиткой и не платить проценты — простым языком, с цифрами и честными минусами.</p>
    <span class="pill"><span>Вопрос? Напишите <b>«КАРТА»</b> в сообщения</span></span>
  </div>
  <div class="checks">
    <div class="check"><span class="tick"></span>ПСК и условия на виду</div>
    <div class="check"><span class="tick"></span>Минусы называем честно</div>
    <div class="check"><span class="tick"></span>Бот отвечает 24/7</div>
  </div>
  <div class="foot">Независимый проект, не банк · Ссылки партнёрские · 18+</div>
</body></html>
