# Справочник для разбора объявлений: марки и модели, города и регионы РФ, слова-маркеры.
# Правь здесь и жми /reload в боте — перезапуск не нужен.
#
# Как пишутся названия: всё в нижнем регистре, ё можно писать как е. Окончания бот понимает сам:
# «приора» найдёт и «приору», «москва» — и «москве». Короткие слова (до 4 букв) ищутся только целиком.
