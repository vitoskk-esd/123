# Слова-маркеры. kind: good — повод звонить первым, bad — проблема машины.
# Фильтр «без битых» исключает объявления с маркером damaged и т.п. (см. exclude в words.py).
markers:
  - {id: urgent,   kind: good,  label: срочно,          words: [срочно, срочная продажа, срочный выкуп, нужны деньги, срочняк]}
  - {id: haggle,   kind: good,  label: торг,            words: [торг, уместный торг, торгуемся, хороший торг, торг у капота]}
  - {id: moving,   kind: good,  label: переезд,         words: [переезд, в связи с переездом, уезжаю]}
  - {id: owner1,   kind: good,  label: 1 владелец,      words: [1 владелец, один владелец, 1 хозяин, один хозяин, первый владелец]}
  - {id: cheap,    kind: good,  label: ниже рынка,      words: [ниже рынка, дешевле рынка, под перепродажу, под перекуп]}
  - {id: damaged,  kind: bad,   label: битая,           words: [битая, битый, бита, после дтп, дтп, авария, под восстановление, тотал, удар]}
  - {id: parts,    kind: bad,   label: на запчасти,     words: [на запчасти, в разбор, на разбор, донор]}
  - {id: notrun,   kind: bad,   label: не на ходу,      words: [не на ходу, не заводится, стуканул, клин двигателя, капремонт, на эвакуаторе]}
  - {id: invest,   kind: bad,   label: требует вложений, words: [требует вложений, требует ремонта, нужен ремонт, вложения]}
  - {id: dupdoc,   kind: bad,   label: дубликат ПТС,    words: [дубликат птс, дубликат, без птс, без документов, птс утерян]}
  - {id: credit,   kind: bad,   label: кредит/залог,    words: [кредитная, в кредите, залог, в залоге, обременение, арест, запрет на регистрацию]}
  - {id: taxi,     kind: bad,   label: такси,           words: [такси, из такси, каршеринг, лицензия такси, желтая]}
